<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 700; }
    .def { font-size: 14px; font-weight: 600; }
    .yes { font-size: 16px; font-weight: 700; fill: #059669; }
    .no { font-size: 16px; font-weight: 700; fill: #dc2626; }
    .node { font-size: 12px; }
    .q { font-size: 13px; font-weight: 700; fill: #f59e0b; }
    .arrow { font-size: 11.5px; font-weight: 600; fill: #f59e0b; }
    .bad { font-size: 12px; font-weight: 700; fill: #dc2626; }
    .cap { font-size: 11.5px; }
  </style>
  <defs>
    <marker id="amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="310" y="26" class="title" text-anchor="middle">Russell's paradox: the answer that flips forever</text>

  <!-- definition -->
  <rect x="70" y="42" width="480" height="42" rx="9" fill="rgba(8,145,178,0.08)" stroke="#0891b2" stroke-width="1.4"/>
  <text x="310" y="61" class="def" text-anchor="middle" fill="#0891b2">R = { x : x is NOT a member of x }</text>
  <text x="310" y="77" class="node" text-anchor="middle">the set of every set that does not contain itself</text>

  <text x="310" y="106" class="q" text-anchor="middle">Is R a member of R?</text>

  <!-- node A: YES -->
  <rect x="80" y="178" width="176" height="60" rx="12" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.8"/>
  <text x="168" y="205" class="yes" text-anchor="middle">YES</text>
  <text x="168" y="224" class="node" text-anchor="middle">R is a member of R</text>

  <!-- node B: NO -->
  <rect x="364" y="178" width="176" height="60" rx="12" fill="rgba(220,38,38,0.08)" stroke="#dc2626" stroke-width="1.8"/>
  <text x="452" y="205" class="no" text-anchor="middle">NO</text>
  <text x="452" y="224" class="node" text-anchor="middle">R is not a member of R</text>

  <!-- top arc A -> B -->
  <path d="M 256 188 C 300 146, 320 146, 364 188" fill="none" stroke="#f59e0b" stroke-width="1.9" marker-end="url(#amb)"/>
  <text x="310" y="132" class="arrow" text-anchor="middle">if R contains itself, it breaks its own rule</text>
  <text x="310" y="147" class="arrow" text-anchor="middle">-&gt; so R is NOT in R</text>

  <!-- bottom arc B -> A -->
  <path d="M 364 228 C 320 270, 300 270, 256 228" fill="none" stroke="#f59e0b" stroke-width="1.9" marker-end="url(#amb)"/>
  <text x="310" y="283" class="arrow" text-anchor="middle">if R omits itself, it fits its own rule exactly</text>
  <text x="310" y="298" class="arrow" text-anchor="middle">-&gt; so R IS in R</text>

  <!-- center verdict -->
  <text x="310" y="205" class="bad" text-anchor="middle">no stable</text>
  <text x="310" y="219" class="bad" text-anchor="middle">answer</text>

  <!-- caption -->
  <line x1="70" y1="322" x2="550" y2="322" stroke="#888" stroke-width="0.6" opacity="0.25"/>
  <text x="310" y="342" class="cap" text-anchor="middle">Every step used only Frege's "any property defines a set." That one rule had to go.</text>
</svg>
