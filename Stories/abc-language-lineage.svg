<svg width="100%" viewBox="0 0 780 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- ghost A -->
  <rect x="30" y="20" width="110" height="64" rx="8" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="85" y="48" text-anchor="middle" fill="#888" font-size="17">A?</text>
  <text x="85" y="70" text-anchor="middle" fill="#888" font-size="10.5">never existed</text>

  <!-- CPL -->
  <rect x="190" y="20" width="400" height="64" rx="8" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="40" text-anchor="middle" fill="#888" font-size="14.5">CPL · 1963</text>
  <text x="390" y="57" text-anchor="middle" fill="#888" font-size="11">Cambridge + London — Strachey's committee</text>
  <text x="390" y="73" text-anchor="middle" fill="#888" font-size="11">too big to build: no compiler ever finished</text>

  <!-- arrow 1 -->
  <line x1="390" y1="84" x2="390" y2="122" stroke="#888" stroke-width="1.5"/>
  <polygon points="390,132 385,120 395,120" fill="#888"/>
  <text x="404" y="112" fill="#888" font-size="11">cut to what one man could compile</text>

  <!-- BCPL -->
  <rect x="190" y="132" width="400" height="64" rx="8" fill="rgba(8,145,178,0.12)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="390" y="152" text-anchor="middle" fill="#888" font-size="14.5">BCPL · 1967</text>
  <text x="390" y="169" text-anchor="middle" fill="#888" font-size="11">Martin Richards, MIT — Basic CPL</text>
  <text x="390" y="185" text-anchor="middle" fill="#888" font-size="11">one data type (the word) · invented the // comment</text>

  <!-- arrow 2 -->
  <line x1="390" y1="196" x2="390" y2="234" stroke="#888" stroke-width="1.5"/>
  <polygon points="390,244 385,232 395,232" fill="#888"/>
  <text x="404" y="224" fill="#888" font-size="11">squeezed into 8K bytes, filtered through one brain</text>

  <!-- B -->
  <rect x="190" y="244" width="400" height="64" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="390" y="264" text-anchor="middle" fill="#888" font-size="14.5">B · 1969</text>
  <text x="390" y="281" text-anchor="middle" fill="#888" font-size="11">Ken Thompson, Bell Labs — the PDP-7's 8K words</text>
  <text x="390" y="297" text-anchor="middle" fill="#888" font-size="11">interpreted (too slow for a kernel) · gave us = and ++</text>

  <!-- arrow 3 -->
  <line x1="390" y1="308" x2="390" y2="346" stroke="#888" stroke-width="1.5"/>
  <polygon points="390,356 385,344 395,344" fill="#888"/>
  <text x="404" y="336" fill="#888" font-size="11">bytes force types — via NB, "new B" (1971)</text>

  <!-- C -->
  <rect x="190" y="356" width="400" height="64" rx="8" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.5"/>
  <text x="390" y="376" text-anchor="middle" fill="#888" font-size="14.5">C · 1972</text>
  <text x="390" y="393" text-anchor="middle" fill="#888" font-size="11">Dennis Ritchie, Bell Labs — the PDP-11's bytes</text>
  <text x="390" y="409" text-anchor="middle" fill="#888" font-size="11">types: char, int, struct · compiled to real instructions</text>

  <!-- fork -->
  <line x1="390" y1="420" x2="390" y2="448" stroke="#888" stroke-width="1.5"/>
  <text x="390" y="466" text-anchor="middle" fill="#888" font-size="11.5">named C "leaving open the question" — the alphabet (next: D)? or the letters of BCPL (next: P)?</text>
  <line x1="390" y1="474" x2="135" y2="500" stroke="#888" stroke-width="1.2"/>
  <line x1="390" y1="474" x2="390" y2="500" stroke="#888" stroke-width="1.2"/>
  <line x1="390" y1="474" x2="645" y2="500" stroke="#888" stroke-width="1.2"/>

  <!-- C++ -->
  <rect x="35" y="500" width="200" height="72" rx="8" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="135" y="522" text-anchor="middle" fill="#888" font-size="13.5">C++ · 1983</text>
  <text x="135" y="540" text-anchor="middle" fill="#888" font-size="10.5">no new letter:</text>
  <text x="135" y="555" text-anchor="middle" fill="#888" font-size="10.5">C, incremented</text>

  <!-- D -->
  <rect x="290" y="500" width="200" height="72" rx="8" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="522" text-anchor="middle" fill="#888" font-size="13.5">D · 2001</text>
  <text x="390" y="540" text-anchor="middle" fill="#888" font-size="10.5">the alphabet door,</text>
  <text x="390" y="555" text-anchor="middle" fill="#888" font-size="10.5">finally taken</text>

  <!-- Go -->
  <rect x="545" y="500" width="200" height="72" rx="8" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="645" y="522" text-anchor="middle" fill="#888" font-size="13.5">Go · 2009</text>
  <text x="645" y="540" text-anchor="middle" fill="#888" font-size="10.5">Thompson ends</text>
  <text x="645" y="555" text-anchor="middle" fill="#888" font-size="10.5">the letter game</text>

  <text x="390" y="600" text-anchor="middle" fill="#888" font-size="10.5">P — the successor the BCPL reading promised — was never claimed by anyone in the family</text>
</svg>
