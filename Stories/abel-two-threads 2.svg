<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" width="100%">
  <!-- ===== faint column guides ===== -->
  <g stroke="#888" stroke-width="1" opacity="0.13">
    <line x1="90"  y1="150" x2="90"  y2="250"/>
    <line x1="210" y1="150" x2="210" y2="250"/>
    <line x1="340" y1="150" x2="340" y2="250"/>
    <line x1="480" y1="150" x2="480" y2="250"/>
    <line x1="600" y1="150" x2="600" y2="250"/>
    <line x1="715" y1="150" x2="715" y2="250"/>
    <line x1="850" y1="150" x2="850" y2="250"/>
  </g>

  <!-- ===== spines ===== -->
  <!-- mathematics spine: solid to the death, then DASHED (the work survives) -->
  <line x1="45" y1="150" x2="715" y2="150" stroke="#0891b2" stroke-width="2.5" opacity="0.55"/>
  <line x1="715" y1="150" x2="892" y2="150" stroke="#0891b2" stroke-width="2.5" opacity="0.55" stroke-dasharray="5 5"/>
  <!-- life spine: ends at the death -->
  <line x1="45" y1="250" x2="715" y2="250" stroke="#f59e0b" stroke-width="2.5" opacity="0.55"/>

  <!-- thread titles -->
  <text x="45" y="132" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">MATHEMATICS</text>
  <text x="45" y="278" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">LIFE &amp; HEALTH</text>

  <!-- ===== death convergence marker (both threads end here); gap leaves the year label readable ===== -->
  <line x1="715" y1="150" x2="715" y2="194" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="715" y1="214" x2="715" y2="250" stroke="#dc2626" stroke-width="2.5"/>

  <!-- ===== MATHEMATICS events (dots on top spine, labels above) ===== -->
  <!-- 1824 quintic -->
  <line x1="340" y1="150" x2="340" y2="122" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
  <circle cx="340" cy="150" r="5" fill="#0891b2"/>
  <text x="340" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Quintic: no formula</text>
  <text x="340" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">(6-page pamphlet)</text>
  <!-- 1826 Crelle -->
  <line x1="480" y1="150" x2="480" y2="122" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
  <circle cx="480" cy="150" r="5" fill="#0891b2"/>
  <text x="480" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Crelle's Journal:</text>
  <text x="480" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">elliptic functions</text>
  <!-- 1826 Paris memoir -->
  <line x1="600" y1="150" x2="600" y2="122" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
  <circle cx="600" cy="150" r="5" fill="#0891b2"/>
  <text x="600" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Paris memoir —</text>
  <text x="600" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Cauchy loses it</text>
  <!-- death (teal dot at end of solid spine) -->
  <circle cx="715" cy="150" r="5" fill="#0891b2"/>
  <!-- vindication (green dot on the surviving dashed spine); label right-anchored so it never clips -->
  <circle cx="850" cy="150" r="6" fill="#059669"/>
  <text x="928" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="end">"abelian" — lowercase,</text>
  <text x="928" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="end">the honest eponym</text>

  <!-- ===== LIFE events (dots on bottom spine, labels below) ===== -->
  <!-- 1802 born -->
  <line x1="90" y1="250" x2="90" y2="278" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <circle cx="90" cy="250" r="5" fill="#f59e0b"/>
  <text x="90" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Born — pastor's son,</text>
  <text x="90" y="314" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">poor Norway</text>
  <!-- 1820 father dies -->
  <line x1="210" y1="250" x2="210" y2="278" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
  <circle cx="210" cy="250" r="5" fill="#dc2626"/>
  <text x="210" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Father dies;</text>
  <text x="210" y="314" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">family destitute</text>
  <!-- 1826 TB -->
  <line x1="600" y1="250" x2="600" y2="278" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
  <circle cx="600" cy="250" r="5" fill="#dc2626"/>
  <text x="600" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Tuberculosis —</text>
  <text x="600" y="314" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">cold Paris</text>
  <!-- 1829 death -->
  <line x1="715" y1="250" x2="715" y2="278" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
  <circle cx="715" cy="250" r="6" fill="#dc2626"/>
  <text x="715" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle" font-weight="bold">Dead at 26 —</text>
  <text x="715" y="314" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle" font-weight="bold">Froland</text>

  <!-- ===== the letter, two days late (green good-news dot past the red death line; own lower row so it clears the death label) ===== -->
  <line x1="715" y1="250" x2="838" y2="250" stroke="#059669" stroke-width="1.5" opacity="0.6" stroke-dasharray="4 4"/>
  <circle cx="838" cy="250" r="5" fill="#059669"/>
  <line x1="838" y1="250" x2="838" y2="330" stroke="#059669" stroke-width="1" opacity="0.4"/>
  <text x="838" y="346" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Berlin chair, secured —</text>
  <text x="838" y="360" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">letter 2 days too late</text>

  <!-- ===== year numbers (mid band) ===== -->
  <g font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle" opacity="0.85">
    <text x="90"  y="204">1802</text>
    <text x="210" y="204">1820</text>
    <text x="340" y="204">1824</text>
    <text x="480" y="204">1826</text>
    <text x="600" y="204">1826</text>
    <text x="715" y="204">1829</text>
    <text x="850" y="204">1841 &#183; 2003</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-family="sans-serif" font-size="11" fill="#888">
    <circle cx="60"  cy="400" r="4" fill="#0891b2"/><text x="70"  y="404">mathematics</text>
    <circle cx="180" cy="400" r="4" fill="#f59e0b"/><text x="190" y="404">life &amp; health</text>
    <circle cx="300" cy="400" r="4" fill="#dc2626"/><text x="310" y="404">catastrophe</text>
    <circle cx="430" cy="400" r="4" fill="#059669"/><text x="440" y="404">honored at last (too late)</text>
  </g>
</svg>
