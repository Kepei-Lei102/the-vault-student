<?xml version="1.0" encoding="UTF-8"?>
<!-- stack: SMIL -->
<!-- Two-panel hammer-and-feather drop: Earth (with air) vs Moon (no air). -->
<!-- 10-second loop. Earth: hammer lands ~t=2s, feather drifts to surface ~t=6s. -->
<!-- Moon: both land together at ~t=3s. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 600; }
    .label { font-size: 13px; }
    .timing { font-size: 11px; opacity: 0.75; }
    .quote { font-size: 12px; font-style: italic; opacity: 0.8; }
  </style>

  <!-- ============================ EARTH PANEL (left) ============================ -->
  <g>
    <!-- panel background (pale sky) -->
    <rect x="20" y="20" width="340" height="380"
          fill="rgba(125, 211, 252, 0.18)" stroke="#888" stroke-width="1"/>
    <text x="190" y="44" text-anchor="middle" class="title">Earth — with air</text>

    <!-- ground -->
    <rect x="20" y="338" width="340" height="62" fill="rgba(180, 140, 90, 0.18)"/>
    <line x1="20" y1="338" x2="360" y2="338" stroke="#888" stroke-width="1.5"/>

    <!-- atmospheric hint: a few wavy "air" marks -->
    <g opacity="0.35">
      <path d="M 50 200 q 8 -4 16 0 q 8 4 16 0" fill="none" stroke="#888" stroke-width="0.8"/>
      <path d="M 280 240 q 8 -4 16 0 q 8 4 16 0" fill="none" stroke="#888" stroke-width="0.8"/>
      <path d="M 130 290 q 8 -4 16 0 q 8 4 16 0" fill="none" stroke="#888" stroke-width="0.8"/>
      <text x="320" y="208" class="timing" text-anchor="end">air everywhere</text>
    </g>

    <!-- astronaut silhouette top-centre, holding two objects -->
    <g>
      <!-- helmet -->
      <circle cx="190" cy="78" r="14"
              fill="rgba(136,136,136,0.25)" stroke="#888" stroke-width="1.5"/>
      <!-- body -->
      <rect x="178" y="92" width="24" height="40"
            fill="rgba(136,136,136,0.25)" stroke="#888" stroke-width="1.5" rx="3"/>
      <!-- left arm (out to hammer) -->
      <line x1="178" y1="100" x2="158" y2="120" stroke="#888" stroke-width="1.8"/>
      <!-- right arm (out to feather) -->
      <line x1="202" y1="100" x2="222" y2="120" stroke="#888" stroke-width="1.8"/>
    </g>

    <!-- HAMMER (Earth) — falls fast. starts at (158, 130), lands at (158, 330). -->
    <!-- Hammer drawn as: handle (vertical thin rect) + head (small fat rect) -->
    <g>
      <rect x="156" y="128" width="4" height="16" fill="#888"/>
      <rect x="150" y="124" width="16" height="8" fill="#666"/>
      <animateTransform attributeName="transform" type="translate"
                       values="0 0; 0 0; 0 50; 0 200; 0 200; 0 200; 0 0"
                       keyTimes="0; 0.12; 0.16; 0.22; 0.86; 0.94; 1"
                       dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- FEATHER (Earth) — drifts slowly. starts at (222, 130), lands at (222, 330). -->
    <g>
      <!-- feather shape: tear-drop curve -->
      <path d="M 222 130 q 6 8 0 18 q -6 -8 0 -18 z"
            fill="rgba(255, 235, 120, 0.55)" stroke="#888" stroke-width="0.8"/>
      <!-- mid-rib -->
      <line x1="222" y1="130" x2="222" y2="148" stroke="#888" stroke-width="0.6" opacity="0.6"/>
      <animateTransform attributeName="transform" type="translate"
                       values="0 0; 0 0; 0 60; 0 130; 0 200; 0 200; 0 0"
                       keyTimes="0; 0.12; 0.30; 0.50; 0.70; 0.94; 1"
                       dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- timing labels appearing when objects land -->
    <text x="158" y="358" text-anchor="middle" class="timing" fill="#dc2626" opacity="0">
      hammer: lands fast
      <animate attributeName="opacity"
               values="0; 0; 1; 1; 0"
               keyTimes="0; 0.22; 0.28; 0.94; 1"
               dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="222" y="358" text-anchor="middle" class="timing" fill="#f59e0b" opacity="0">
      feather: drifts down
      <animate attributeName="opacity"
               values="0; 0; 1; 1; 0"
               keyTimes="0; 0.70; 0.76; 0.94; 1"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- bottom caption -->
    <text x="190" y="394" text-anchor="middle" class="label">
      air resistance makes the feather lose
    </text>
  </g>

  <!-- ============================ MOON PANEL (right) ============================ -->
  <g>
    <!-- panel background (dark sky) -->
    <rect x="400" y="20" width="340" height="380"
          fill="rgba(30, 41, 80, 0.35)" stroke="#888" stroke-width="1"/>
    <text x="570" y="44" text-anchor="middle" class="title" fill="#888">Moon — no air</text>

    <!-- stars in the lunar sky -->
    <g opacity="0.7">
      <circle cx="440" cy="80" r="0.8" fill="#fff"/>
      <circle cx="520" cy="110" r="0.6" fill="#fff"/>
      <circle cx="600" cy="70" r="0.9" fill="#fff"/>
      <circle cx="680" cy="120" r="0.7" fill="#fff"/>
      <circle cx="710" cy="190" r="0.5" fill="#fff"/>
      <circle cx="430" cy="200" r="0.6" fill="#fff"/>
      <circle cx="660" cy="220" r="0.7" fill="#fff"/>
      <circle cx="490" cy="260" r="0.5" fill="#fff"/>
    </g>

    <!-- lunar surface — grey regolith with subtle texture -->
    <rect x="400" y="338" width="340" height="62" fill="rgba(170, 170, 170, 0.30)"/>
    <line x1="400" y1="338" x2="740" y2="338" stroke="#888" stroke-width="1.5"/>
    <!-- a few craters/specks -->
    <g opacity="0.5">
      <ellipse cx="450" cy="360" rx="8" ry="2" fill="#888"/>
      <ellipse cx="600" cy="372" rx="6" ry="1.5" fill="#888"/>
      <ellipse cx="690" cy="356" rx="10" ry="2.5" fill="#888"/>
    </g>

    <!-- "no air" hint -->
    <text x="700" y="208" class="timing" text-anchor="end" opacity="0.7">no air, no resistance</text>

    <!-- astronaut silhouette top-centre — bigger helmet to suggest pressure suit -->
    <g>
      <!-- helmet -->
      <circle cx="570" cy="78" r="16"
              fill="rgba(240,240,240,0.30)" stroke="#888" stroke-width="1.5"/>
      <!-- visor reflection hint -->
      <path d="M 562 74 q 8 -4 16 0" fill="none" stroke="#888" stroke-width="0.6" opacity="0.5"/>
      <!-- body — bulkier suit -->
      <rect x="554" y="94" width="32" height="42"
            fill="rgba(240,240,240,0.28)" stroke="#888" stroke-width="1.5" rx="4"/>
      <!-- left arm -->
      <line x1="554" y1="102" x2="538" y2="120" stroke="#888" stroke-width="1.8"/>
      <!-- right arm -->
      <line x1="586" y1="102" x2="602" y2="120" stroke="#888" stroke-width="1.8"/>
    </g>

    <!-- HAMMER (Moon) — same shape, starts at (538, 130) -->
    <g>
      <rect x="536" y="128" width="4" height="16" fill="#888"/>
      <rect x="530" y="124" width="16" height="8" fill="#666"/>
      <!-- Falls under g_moon: slower than Earth-hammer, parallel to feather.
           Two-segment piecewise-linear approximating s = 1/2 g t^2 — first half of distance
           in second 60% of fall time. -->
      <animateTransform attributeName="transform" type="translate"
                       values="0 0; 0 0; 0 60; 0 200; 0 200; 0 0"
                       keyTimes="0; 0.12; 0.28; 0.42; 0.92; 1"
                       dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- FEATHER (Moon) — IDENTICAL trajectory to the moon-hammer -->
    <g>
      <path d="M 602 130 q 6 8 0 18 q -6 -8 0 -18 z"
            fill="rgba(255, 235, 120, 0.55)" stroke="#888" stroke-width="0.8"/>
      <line x1="602" y1="130" x2="602" y2="148" stroke="#888" stroke-width="0.6" opacity="0.6"/>
      <animateTransform attributeName="transform" type="translate"
                       values="0 0; 0 0; 0 60; 0 200; 0 200; 0 0"
                       keyTimes="0; 0.12; 0.28; 0.42; 0.92; 1"
                       dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- arrival caption -->
    <text x="570" y="358" text-anchor="middle" class="timing" fill="#059669" opacity="0">
      both land together
      <animate attributeName="opacity"
               values="0; 0; 1; 1; 0"
               keyTimes="0; 0.42; 0.48; 0.92; 1"
               dur="10s" repeatCount="indefinite"/>
    </text>

    <!-- bottom caption -->
    <text x="570" y="394" text-anchor="middle" class="label">
      no air, so mass cancels — Galileo's idealisation, made real
    </text>
  </g>

  <!-- ============================ shared caption ============================ -->
  <text x="380" y="424" text-anchor="middle" class="quote">
    "How about that! Mr Galileo was correct in his findings."  — D. Scott, 2 Aug 1971
  </text>
</svg>
