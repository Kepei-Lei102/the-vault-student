<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" width="100%">
  <!-- ===== faint column guides ===== -->
  <g stroke="#888" stroke-width="1" opacity="0.13">
    <line x1="50"  y1="150" x2="50"  y2="250"/>
    <line x1="185" y1="150" x2="185" y2="250"/>
    <line x1="315" y1="150" x2="315" y2="250"/>
    <line x1="425" y1="150" x2="425" y2="250"/>
    <line x1="535" y1="150" x2="535" y2="250"/>
    <line x1="645" y1="150" x2="645" y2="250"/>
    <line x1="752" y1="150" x2="752" y2="250"/>
  </g>

  <!-- ===== spines ===== -->
  <!-- mathematics spine: solid to the duel, then DASHED (the work survives) -->
  <line x1="40" y1="150" x2="645" y2="150" stroke="#0891b2" stroke-width="2.5" opacity="0.55"/>
  <line x1="645" y1="150" x2="760" y2="150" stroke="#0891b2" stroke-width="2.5" opacity="0.55" stroke-dasharray="5 5"/>
  <!-- life spine: ends at the duel -->
  <line x1="40" y1="250" x2="645" y2="250" stroke="#f59e0b" stroke-width="2.5" opacity="0.55"/>

  <!-- thread titles -->
  <text x="40" y="132" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">MATHEMATICS</text>
  <text x="40" y="278" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" letter-spacing="1">THE LIFE</text>

  <!-- ===== duel convergence marker (both threads end here); gap leaves the year label readable ===== -->
  <line x1="645" y1="150" x2="645" y2="194" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="645" y1="214" x2="645" y2="250" stroke="#dc2626" stroke-width="2.5"/>

  <!-- ===== MATHEMATICS events (dots on top spine, labels above) ===== -->
  <!-- 1827 -->
  <line x1="185" y1="150" x2="185" y2="122" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
  <circle cx="185" cy="150" r="5" fill="#0891b2"/>
  <text x="185" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Reads Legendre</text>
  <text x="185" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">"like a novel"</text>
  <!-- 1829 -->
  <line x1="315" y1="150" x2="315" y2="122" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
  <circle cx="315" cy="150" r="5" fill="#0891b2"/>
  <text x="315" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">First memoir</text>
  <text x="315" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">to Cauchy</text>
  <!-- 1830 -->
  <line x1="425" y1="150" x2="425" y2="122" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
  <circle cx="425" cy="150" r="5" fill="#0891b2"/>
  <text x="425" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Prize memoir —</text>
  <text x="425" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">lost with Fourier</text>
  <!-- 1831 -->
  <line x1="535" y1="150" x2="535" y2="122" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
  <circle cx="535" cy="150" r="5" fill="#0891b2"/>
  <text x="535" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Poisson:</text>
  <text x="535" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">"incomprehensible"</text>
  <!-- 1832 last-night testament -->
  <line x1="645" y1="150" x2="645" y2="122" stroke="#0891b2" stroke-width="1" opacity="0.5"/>
  <circle cx="645" cy="150" r="5" fill="#0891b2"/>
  <text x="645" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Last-night</text>
  <text x="645" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">testament</text>
  <!-- 1846 vindication (green dot on the surviving dashed spine) -->
  <circle cx="752" cy="150" r="6" fill="#059669"/>
  <text x="752" y="100" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Liouville</text>
  <text x="752" y="114" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">publishes</text>

  <!-- ===== LIFE events (dots on bottom spine, labels below) ===== -->
  <!-- 1811 born -->
  <line x1="50" y1="250" x2="50" y2="278" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <circle cx="50" cy="250" r="5" fill="#f59e0b"/>
  <text x="50" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Born</text>
  <!-- 1829 father dies + fails -->
  <line x1="315" y1="250" x2="315" y2="278" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
  <circle cx="315" cy="250" r="5" fill="#dc2626"/>
  <text x="315" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Father's suicide;</text>
  <text x="315" y="314" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">2 exam failures</text>
  <!-- 1830 revolution + expelled -->
  <line x1="425" y1="250" x2="425" y2="278" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <circle cx="425" cy="250" r="5" fill="#f59e0b"/>
  <text x="425" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">July Revolution;</text>
  <text x="425" y="314" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">expelled</text>
  <!-- 1831 prison -->
  <line x1="535" y1="250" x2="535" y2="278" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
  <circle cx="535" cy="250" r="5" fill="#f59e0b"/>
  <text x="535" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Prison,</text>
  <text x="535" y="314" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">Sainte-Pelagie</text>
  <!-- 1832 duel -->
  <line x1="645" y1="250" x2="645" y2="278" stroke="#dc2626" stroke-width="1" opacity="0.5"/>
  <circle cx="645" cy="250" r="6" fill="#dc2626"/>
  <text x="645" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle" font-weight="bold">The duel —</text>
  <text x="645" y="314" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle" font-weight="bold">dead at 20</text>

  <!-- ===== year numbers (mid band) ===== -->
  <g font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle" opacity="0.85">
    <text x="50"  y="204">1811</text>
    <text x="185" y="204">1827</text>
    <text x="315" y="204">1829</text>
    <text x="425" y="204">1830</text>
    <text x="535" y="204">1831</text>
    <text x="645" y="204">1832</text>
    <text x="752" y="204">1846</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-family="sans-serif" font-size="11" fill="#888">
    <circle cx="60"  cy="352" r="4" fill="#0891b2"/><text x="70"  y="356">mathematics</text>
    <circle cx="180" cy="352" r="4" fill="#f59e0b"/><text x="190" y="356">life &amp; politics</text>
    <circle cx="315" cy="352" r="4" fill="#dc2626"/><text x="325" y="356">catastrophe</text>
    <circle cx="440" cy="352" r="4" fill="#059669"/><text x="450" y="356">vindication (11 years too late)</text>
  </g>
</svg>
