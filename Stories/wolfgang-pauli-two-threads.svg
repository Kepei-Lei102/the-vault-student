<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 600; }
    .yr { font-size: 11px; font-weight: 600; }
    .ev { font-size: 10.5px; }
    .cap { font-size: 11px; }
    .small { font-size: 10px; }
  </style>

  <text x="380" y="26" class="title" text-anchor="middle">Wolfgang Pauli — two threads of one life</text>

  <!-- legend -->
  <line x1="172" y1="44" x2="197" y2="44" stroke="#2563eb" stroke-width="3"/>
  <text x="202" y="48" class="cap" text-anchor="start" fill="#2563eb">the rationalist — rigor</text>
  <line x1="412" y1="44" x2="437" y2="44" stroke="#7c3aed" stroke-width="3"/>
  <text x="442" y="48" class="cap" text-anchor="start" fill="#7c3aed">the shadow — the numinous</text>

  <!-- top (rigor) track -->
  <line x1="60" y1="160" x2="610" y2="160" stroke="#2563eb" stroke-width="2"/>
  <!-- bottom (shadow) track -->
  <line x1="60" y1="250" x2="610" y2="250" stroke="#7c3aed" stroke-width="2"/>

  <!-- top events: x / year / phrase -->
  <g>
    <line x1="90" y1="151" x2="90" y2="160" stroke="#2563eb" stroke-width="1"/>
    <circle cx="90" cy="160" r="4.5" fill="rgba(37,99,235,0.25)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="90" y="132" class="yr" text-anchor="middle">1921</text>
    <text x="90" y="146" class="ev" text-anchor="middle">relativity at 21</text>

    <line x1="220" y1="151" x2="220" y2="160" stroke="#2563eb" stroke-width="1"/>
    <circle cx="220" cy="160" r="4.5" fill="rgba(37,99,235,0.25)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="220" y="132" class="yr" text-anchor="middle">1925</text>
    <text x="220" y="146" class="ev" text-anchor="middle">exclusion principle</text>

    <line x1="350" y1="151" x2="350" y2="160" stroke="#2563eb" stroke-width="1"/>
    <circle cx="350" cy="160" r="4.5" fill="rgba(37,99,235,0.25)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="350" y="132" class="yr" text-anchor="middle">1930</text>
    <text x="350" y="146" class="ev" text-anchor="middle">the neutrino</text>

    <line x1="480" y1="151" x2="480" y2="160" stroke="#2563eb" stroke-width="1"/>
    <circle cx="480" cy="160" r="4.5" fill="rgba(37,99,235,0.25)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="480" y="132" class="yr" text-anchor="middle">1945</text>
    <text x="480" y="146" class="ev" text-anchor="middle">Nobel Prize</text>

    <line x1="610" y1="151" x2="610" y2="160" stroke="#2563eb" stroke-width="1"/>
    <circle cx="610" cy="160" r="4.5" fill="rgba(37,99,235,0.25)" stroke="#2563eb" stroke-width="1.5"/>
    <text x="610" y="132" class="yr" text-anchor="middle">1956</text>
    <text x="610" y="146" class="ev" text-anchor="middle">detected</text>
  </g>

  <!-- bottom events -->
  <g>
    <line x1="90" y1="250" x2="90" y2="259" stroke="#7c3aed" stroke-width="1"/>
    <circle cx="90" cy="250" r="4.5" fill="rgba(124,58,237,0.25)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="90" y="274" class="yr" text-anchor="middle">1927</text>
    <text x="90" y="288" class="ev" text-anchor="middle">mother's death</text>

    <line x1="220" y1="250" x2="220" y2="259" stroke="#7c3aed" stroke-width="1"/>
    <circle cx="220" cy="250" r="4.5" fill="rgba(124,58,237,0.25)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="220" y="274" class="yr" text-anchor="middle">1930</text>
    <text x="220" y="288" class="ev" text-anchor="middle">divorce</text>

    <line x1="350" y1="250" x2="350" y2="259" stroke="#7c3aed" stroke-width="1"/>
    <circle cx="350" cy="250" r="4.5" fill="rgba(124,58,237,0.25)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="350" y="274" class="yr" text-anchor="middle">1932</text>
    <text x="350" y="288" class="ev" text-anchor="middle">Jung &amp; dreams</text>

    <line x1="480" y1="250" x2="480" y2="259" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="480" cy="250" r="4.5" fill="rgba(245,158,11,0.3)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="480" y="274" class="yr" text-anchor="middle" fill="#f59e0b">1934–</text>
    <text x="480" y="288" class="ev" text-anchor="middle" fill="#f59e0b">the 137 obsession</text>

    <line x1="610" y1="250" x2="610" y2="259" stroke="#7c3aed" stroke-width="1"/>
    <circle cx="610" cy="250" r="4.5" fill="rgba(124,58,237,0.25)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="610" y="274" class="yr" text-anchor="middle">1952</text>
    <text x="610" y="288" class="ev" text-anchor="middle">Jung book</text>
  </g>

  <!-- convergence to Room 137 -->
  <line x1="610" y1="160" x2="650" y2="198" stroke="#888" stroke-width="1.3"/>
  <line x1="610" y1="250" x2="650" y2="212" stroke="#888" stroke-width="1.3"/>
  <rect x="650" y="185" width="96" height="40" rx="8" fill="rgba(245,158,11,0.16)" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="698" y="203" class="yr" text-anchor="middle" fill="#f59e0b">Room 137</text>
  <text x="698" y="217" class="small" text-anchor="middle" fill="#f59e0b">1958 — died here</text>
  <text x="698" y="244" class="small" text-anchor="middle">both threads end</text>
</svg>
