<svg viewBox="0 0 520 820" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- =================== TOP: the headstone =================== -->
  <!-- base slab -->
  <rect x="92" y="346" width="336" height="20" rx="5"
        fill="rgba(136,136,136,0.18)" stroke="#888" stroke-width="1"/>
  <!-- stone -->
  <path d="M 110 352 L 110 150 Q 110 50 260 50 Q 410 50 410 150 L 410 352 Z"
        fill="rgba(136,136,136,0.10)" stroke="#888" stroke-width="1.5"/>

  <!-- engraving -->
  <text x="260" y="118" text-anchor="middle" font-size="16" letter-spacing="2.5"
        fill="#888">LUDWIG BOLTZMANN</text>
  <text x="260" y="144" text-anchor="middle" font-size="14" letter-spacing="1.5"
        fill="#888">1844 — 1906</text>
  <line x1="178" y1="166" x2="342" y2="166" stroke="#888" stroke-width="0.8"/>

  <text x="260" y="250" text-anchor="middle" font-size="40" font-weight="600"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        fill="#777">S = k log W</text>

  <text x="260" y="296" text-anchor="middle" font-size="13" font-style="italic"
        fill="#888">— entropy is just counting —</text>
  <line x1="228" y1="318" x2="292" y2="318" stroke="#888" stroke-width="0.8"/>

  <!-- =================== BOTTOM: anatomy of the formula =================== -->
  <text x="260" y="412" text-anchor="middle" font-size="15" font-weight="600" fill="#888">
    The equation he made immortal — and never wrote</text>

  <!-- the equation, token by token (each its own element to colour safely) -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="44" font-weight="600">
    <text x="156" y="492" text-anchor="middle" fill="#7c3aed">S</text>
    <text x="198" y="492" text-anchor="middle" fill="#888">=</text>
    <text x="238" y="492" text-anchor="middle" fill="#f59e0b">k</text>
    <text x="300" y="492" text-anchor="middle" fill="#2563eb">log</text>
    <text x="374" y="492" text-anchor="middle" fill="#059669">W</text>
  </g>

  <!-- legend: one row per symbol -->
  <!-- S -->
  <text x="118" y="556" font-family="Georgia, serif" font-style="italic" font-size="22" font-weight="600" fill="#7c3aed">S</text>
  <text x="164" y="556" font-size="14.5" fill="#888">entropy 熵 — how spread-out the state is</text>

  <!-- k -->
  <text x="118" y="600" font-family="Georgia, serif" font-style="italic" font-size="22" font-weight="600" fill="#f59e0b">k</text>
  <text x="164" y="598" font-size="14.5" fill="#888">Boltzmann's constant ≈ 1.38 × 10<tspan dy="-6" font-size="10">−23</tspan><tspan dy="6"> J/K</tspan></text>
  <text x="164" y="616" font-size="12.5" fill="#888">— Planck wrote it, and named it for him</text>

  <!-- log -->
  <text x="112" y="662" font-family="Georgia, serif" font-style="italic" font-size="22" font-weight="600" fill="#2563eb">log</text>
  <text x="164" y="662" font-size="14.5" fill="#888">turns × of ways  into  + of entropies</text>

  <!-- W -->
  <text x="118" y="708" font-family="Georgia, serif" font-style="italic" font-size="22" font-weight="600" fill="#059669">W</text>
  <text x="164" y="706" font-size="14.5" fill="#888">number of microstates —</text>
  <text x="164" y="724" font-size="12.5" fill="#888">the arrangements that look the same outside</text>

  <!-- footer: the Shannon bridge -->
  <line x1="92" y1="756" x2="428" y2="756" stroke="#888" stroke-width="0.6" stroke-dasharray="3 4"/>
  <text x="260" y="784" text-anchor="middle" font-size="12.5" fill="#888">Same object as Shannon's  H = −Σ p log p</text>
  <text x="260" y="804" text-anchor="middle" font-size="12.5" font-style="italic" fill="#888">→ see Information Theory</text>
</svg>
