<svg width="100%" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">The tomb marker: a sphere in the cylinder that just holds it</text>
  <!-- cylinder -->
  <ellipse cx="230" cy="80" rx="90" ry="24" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="140" y1="80" x2="140" y2="260" stroke="#2563eb" stroke-width="1.5"/>
  <line x1="320" y1="80" x2="320" y2="260" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M140 260 A90 24 0 0 0 320 260" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M140 260 A90 24 0 0 1 320 260" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- sphere -->
  <circle cx="230" cy="170" r="90" fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="1.8"/>
  <ellipse cx="230" cy="170" rx="90" ry="24" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="230" y1="170" x2="320" y2="170" stroke="#888" stroke-width="1"/>
  <text x="272" y="163" text-anchor="middle" font-size="11" fill="#888">r</text>
  <line x1="345" y1="80" x2="345" y2="260" stroke="#888" stroke-width="1"/>
  <text x="358" y="174" font-size="11" fill="#888">2r</text>
  <!-- the ratios -->
  <g font-size="12.5" fill="#888">
    <text x="420" y="90" font-weight="bold">Volumes</text>
    <text x="420" y="112">cylinder: π r² × 2r = 2π r³</text>
    <text x="420" y="134">sphere:  (4/3) π r³</text>
    <text x="420" y="156" fill="#059669" font-weight="bold">sphere : cylinder = 2 : 3</text>
    <text x="420" y="196" font-weight="bold">Surfaces</text>
    <text x="420" y="218">cylinder incl. its two ends: 2π r × 2r + 2π r² = 6π r²</text>
    <text x="420" y="240">sphere:  4π r²</text>
    <text x="420" y="262" fill="#059669" font-weight="bold">sphere : cylinder = 2 : 3 again</text>
  </g>
  <text x="380" y="300" text-anchor="middle" font-size="11" fill="#888">On the Sphere and Cylinder, c. 240 BC: the result he asked to have carved on his grave, and the carving Cicero used to find it</text>
  <text x="380" y="318" text-anchor="middle" font-size="10.5" fill="#888">the volume needs calculus or his Method; the 2 : 3 is exact either way</text>
</svg>
