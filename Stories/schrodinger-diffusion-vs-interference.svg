<!-- Two-panel comparison: heat equation (diffusion, no oscillation) vs Schrödinger equation (interference fringes).
     Each panel shows initial state |u(x,0)| or |ψ(x,0)|² (light grey) overlaid with the evolved state (colored).
     Pedagogical point: the i in i∂t ψ = -½∂x²ψ is what produces interference; without it, you get the heat equation. -->
