  <text x="317" y="338" text-anchor="middle" class="caption">The cycloid wins.  The longest of the three paths takes the shortest time.</text>
  <text x="317" y="358" text-anchor="middle" class="caption" font-style="italic" opacity="0.7">βραχιστος + χρόνος = "shortest time".  Bernoulli 1696, solved 1697 — the calculus of variations is born.</text>
