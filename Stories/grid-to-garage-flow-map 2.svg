<svg width="100%" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">
  <!-- lanes -->
  <rect x="60" y="55" width="800" height="90" rx="10" fill="rgba(37,99,235,0.10)"/>
  <rect x="60" y="285" width="800" height="90" rx="10" fill="rgba(8,145,178,0.10)"/>
  <text x="70" y="45" fill="#888" font-size="15" font-weight="bold">THE GRID — racing</text>
  <text x="70" y="398" fill="#888" font-size="15" font-weight="bold">THE GARAGE — the road</text>

  <!-- time axis (center gap) -->
  <line x1="60" y1="215" x2="860" y2="215" stroke="#888" stroke-width="1" opacity="0.35"/>
  <text x="88"  y="220" fill="#888" font-size="12" text-anchor="middle">1950</text>
  <text x="278" y="220" fill="#888" font-size="12" text-anchor="middle">1970</text>
  <text x="468" y="220" fill="#888" font-size="12" text-anchor="middle">1990</text>
  <text x="658" y="220" fill="#888" font-size="12" text-anchor="middle">2010</text>
  <text x="830" y="220" fill="#888" font-size="12" text-anchor="middle">2026</text>

  <defs>
    <marker id="down" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,12 L14,6 z" fill="#2563eb"/>
    </marker>
    <marker id="up" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,12 L14,6 z" fill="#059669"/>
    </marker>
    <marker id="upbig" markerWidth="26" markerHeight="22" refX="22" refY="11" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,22 L26,11 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- downward flow: grid -> garage -->
  <line x1="118" y1="150" x2="118" y2="276" stroke="#2563eb" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="118" y="80"  fill="#2563eb" font-size="12" text-anchor="middle">disc brakes*</text>
  <text x="118" y="95"  fill="#2563eb" font-size="11" text-anchor="middle">1953</text>

  <line x1="175" y1="150" x2="175" y2="276" stroke="#2563eb" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="175" y="115" fill="#2563eb" font-size="12" text-anchor="middle">mid-engine</text>
  <text x="175" y="130" fill="#2563eb" font-size="11" text-anchor="middle">1959</text>

  <line x1="232" y1="150" x2="232" y2="276" stroke="#2563eb" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="232" y="80"  fill="#2563eb" font-size="12" text-anchor="middle">monocoque*</text>
  <text x="232" y="95"  fill="#2563eb" font-size="11" text-anchor="middle">1962</text>

  <line x1="308" y1="150" x2="308" y2="276" stroke="#2563eb" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="308" y="115" fill="#2563eb" font-size="12" text-anchor="middle">wings, ground effect</text>
  <text x="308" y="130" fill="#2563eb" font-size="11" text-anchor="middle">1966–78</text>

  <line x1="390" y1="150" x2="390" y2="276" stroke="#2563eb" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="390" y="80"  fill="#2563eb" font-size="12" text-anchor="middle">turbo · carbon</text>
  <text x="390" y="95"  fill="#2563eb" font-size="11" text-anchor="middle">1977–81</text>

  <line x1="470" y1="150" x2="470" y2="276" stroke="#2563eb" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="470" y="115" fill="#2563eb" font-size="12" text-anchor="middle">paddle shift</text>
  <text x="470" y="130" fill="#2563eb" font-size="11" text-anchor="middle">1989</text>

  <line x1="540" y1="150" x2="540" y2="276" stroke="#2563eb" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="540" y="80"  fill="#2563eb" font-size="12" text-anchor="middle">active suspension</text>
  <text x="540" y="95"  fill="#2563eb" font-size="11" text-anchor="middle">1992 · ban '94 · road gets CDC</text>

  <line x1="695" y1="150" x2="695" y2="276" stroke="#2563eb" stroke-width="2.5" marker-end="url(#down)"/>
  <text x="695" y="115" fill="#2563eb" font-size="12" text-anchor="middle">hybrid ceiling: 50% efficiency</text>
  <text x="695" y="130" fill="#2563eb" font-size="11" text-anchor="middle">2014</text>

  <!-- upward countercurrent: garage -> grid -->
  <line x1="145" y1="285" x2="145" y2="159" stroke="#059669" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#up)"/>
  <text x="150" y="330" fill="#059669" font-size="12" text-anchor="middle">unibody* · crumple zone · belts</text>
  <text x="150" y="345" fill="#059669" font-size="11" text-anchor="middle">1922–59</text>

  <line x1="425" y1="285" x2="425" y2="159" stroke="#059669" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="425" y="330" fill="#059669" font-size="12" text-anchor="middle">ABS</text>
  <text x="425" y="345" fill="#059669" font-size="11" text-anchor="middle">1978 (F1 bans it)</text>

  <line x1="595" y1="285" x2="595" y2="159" stroke="#059669" stroke-width="2.5" marker-end="url(#up)"/>
  <text x="595" y="330" fill="#059669" font-size="12" text-anchor="middle">Prius hybrid</text>
  <text x="595" y="345" fill="#059669" font-size="11" text-anchor="middle">1997</text>

  <!-- the reversal -->
  <line x1="775" y1="285" x2="775" y2="165" stroke="#f59e0b" stroke-width="7" marker-end="url(#upbig)"/>
  <text x="765" y="158" fill="#f59e0b" font-size="12.5" font-weight="bold" text-anchor="middle">the current reverses</text>
  <text x="775" y="318" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="middle">laptop cells power the EV</text>
  <text x="775" y="334" fill="#f59e0b" font-size="12" text-anchor="middle">Roadster 2008</text>
  <text x="775" y="349" fill="#f59e0b" font-size="12" text-anchor="middle">Formula E 2014</text>
  <text x="775" y="364" fill="#f59e0b" font-size="12" text-anchor="middle">F1 goes 50/50 in 2026</text>

  <!-- footnote -->
  <text x="70" y="422" fill="#888" font-size="11.5">* honest edges: disc brakes were Le Mans (not F1); load-bearing bodies reached the road first (Lancia 1922, Citroën 1934) — both sides borrowed from aircraft.</text>
</svg>
