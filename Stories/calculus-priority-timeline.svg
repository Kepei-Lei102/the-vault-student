<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .title { font-size: 16px; font-weight: 600; }
    .label { font-size: 12px; }
    .small { font-size: 11px; }
    .tiny { font-size: 10px; }
    .person { font-size: 13px; font-weight: 600; }
    .note { font-size: 11px; opacity: 0.75; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="450" y="20" class="title" text-anchor="middle">The Calculus Priority Dispute — 1642 to 1830s</text>

  <!-- ============================================ -->
  <!-- NEWTON: lifeline 1642–1727                   -->
  <!-- Year scale: x = 40 + (year - 1640) * 4       -->
  <!-- Newton bar: y=85-99                          -->
  <!-- ============================================ -->

  <text x="45" y="92" class="person" fill="#2563eb">Newton</text>
  <text x="45" y="105" class="tiny" fill="#2563eb" opacity="0.7">1642–1727</text>

  <!-- Lifeline bar: 1642 (x=48) to 1727 (x=388), but draw from x=98 so name has room -->
  <rect x="98" y="85" width="290" height="14" rx="3"
        fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Newton events labelled ABOVE the bar — common label baseline at y=68, subtitles at y=56 -->

  <!-- 1665 Woolsthorpe: x=140 -->
  <circle cx="140" cy="92" r="3" fill="#2563eb"/>
  <line x1="140" y1="85" x2="140" y2="73" stroke="#2563eb" stroke-width="1"/>
  <text x="140" y="68" class="small" text-anchor="middle" fill="#2563eb">1665</text>
  <text x="140" y="56" class="tiny" text-anchor="middle" fill="#2563eb" opacity="0.85">Woolsthorpe</text>
  <text x="140" y="44" class="tiny" text-anchor="middle" fill="#2563eb" opacity="0.6">annus mirabilis</text>

  <!-- 1687 Principia: x=228 -->
  <circle cx="228" cy="92" r="3" fill="#2563eb"/>
  <line x1="228" y1="85" x2="228" y2="73" stroke="#2563eb" stroke-width="1"/>
  <text x="228" y="68" class="small" text-anchor="middle" fill="#2563eb">1687</text>
  <text x="228" y="56" class="tiny" text-anchor="middle" fill="#2563eb" opacity="0.85">Principia</text>

  <!-- 1704 publishes calculus: x=296 — the BIG Newton publication moment -->
  <circle cx="296" cy="92" r="4" fill="#2563eb"/>
  <line x1="296" y1="85" x2="296" y2="73" stroke="#2563eb" stroke-width="1.5"/>
  <text x="296" y="68" class="small" text-anchor="middle" fill="#2563eb" font-weight="600">1704 ★</text>
  <text x="296" y="56" class="tiny" text-anchor="middle" fill="#2563eb">publishes</text>
  <text x="296" y="44" class="tiny" text-anchor="middle" fill="#2563eb" opacity="0.6">38 yrs late</text>

  <!-- 1727 death (off-bar) -->
  <text x="395" y="91" class="small" fill="#2563eb">† 1727</text>
  <text x="395" y="103" class="tiny" fill="#2563eb" opacity="0.7">Westminster</text>

  <!-- ============================================ -->
  <!-- 1712 ROYAL SOCIETY VERDICT — between bars   -->
  <!-- The dramatic centerpiece, drawn between the -->
  <!-- two lifelines because it links them.        -->
  <!-- ============================================ -->

  <!-- Tick from Newton's bar down to verdict marker -->
  <line x1="328" y1="99" x2="328" y2="130" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="328" cy="135" r="5" fill="#dc2626"/>
  <text x="338" y="139" class="small" fill="#dc2626" font-weight="600">1712 ⚖ verdict</text>
  <text x="338" y="151" class="tiny" fill="#dc2626" opacity="0.85">RS report (Newton wrote it)</text>
  <!-- Tick from Leibniz's bar up to verdict marker -->
  <line x1="328" y1="140" x2="328" y2="170" stroke="#dc2626" stroke-width="1.5"/>

  <!-- ============================================ -->
  <!-- LEIBNIZ: lifeline 1646–1716                  -->
  <!-- Leibniz bar: y=170-184                       -->
  <!-- ============================================ -->

  <text x="45" y="178" class="person" fill="#7c3aed">Leibniz</text>
  <text x="45" y="190" class="tiny" fill="#7c3aed" opacity="0.7">1646–1716</text>

  <!-- Lifeline bar: 1646 (x=64) to 1716 (x=344), draw from x=110 -->
  <rect x="110" y="170" width="234" height="14" rx="3"
        fill="rgba(124, 58, 237, 0.15)" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Leibniz events labelled BELOW the bar — common label baseline at y=200, subtitles at y=212 -->

  <!-- 1675 ∫ symbol: x=180 — minimal label so it doesn't bleed into 1684's labels at x=216 -->
  <circle cx="180" cy="177" r="3" fill="#7c3aed"/>
  <line x1="180" y1="184" x2="180" y2="195" stroke="#7c3aed" stroke-width="1"/>
  <text x="180" y="206" class="small" text-anchor="middle" fill="#7c3aed">1675 ∫</text>

  <!-- 1684 Nova Methodus: x=216 — the BIG Leibniz publication moment -->
  <circle cx="216" cy="177" r="4" fill="#7c3aed"/>
  <line x1="216" y1="184" x2="216" y2="195" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="216" y="206" class="small" text-anchor="middle" fill="#7c3aed" font-weight="600">1684 ★</text>
  <text x="216" y="218" class="tiny" text-anchor="middle" fill="#7c3aed">publishes</text>
  <text x="216" y="230" class="tiny" text-anchor="middle" fill="#7c3aed" opacity="0.6">Nova Methodus</text>

  <!-- 1716 death (off-bar) -->
  <text x="350" y="178" class="small" fill="#7c3aed">† 1716</text>
  <text x="350" y="190" class="tiny" fill="#7c3aed" opacity="0.7">Hanover, alone</text>

  <!-- ============================================ -->
  <!-- AFTERMATH: 1727 — 1830s                      -->
  <!-- Britain bar: y=255-269                       -->
  <!-- ============================================ -->

  <text x="45" y="262" class="person" fill="#059669">Britain</text>

  <!-- Wilderness strip 1727 (x=388) to 1812 (x=728) -->
  <rect x="388" y="255" width="340" height="14" rx="3"
        fill="rgba(136, 136, 136, 0.10)" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="558" y="248" class="note" text-anchor="middle">a century behind the Continent (dot-notation loyalty)</text>

  <!-- 1812 Analytical Society: x=728 -->
  <circle cx="728" cy="262" r="5" fill="#059669"/>
  <line x1="728" y1="255" x2="728" y2="245" stroke="#059669" stroke-width="2"/>
  <text x="728" y="240" class="small" text-anchor="middle" fill="#059669" font-weight="600">1812 ★</text>
  <text x="728" y="229" class="tiny" text-anchor="middle" fill="#059669">Analytical Society</text>
  <text x="728" y="219" class="tiny" text-anchor="middle" fill="#059669" opacity="0.7">Babbage, Herschel, Peacock</text>

  <!-- Recovery strip -->
  <rect x="728" y="255" width="72" height="14" rx="3"
        fill="rgba(5, 150, 105, 0.22)" stroke="#059669" stroke-width="1.5"/>
  <text x="800" y="264" class="small" text-anchor="end" fill="#059669" font-weight="600">→ 1830s</text>
  <text x="764" y="282" class="tiny" text-anchor="middle" fill="#059669" font-style="italic">recovery</text>

  <!-- ============================================ -->
  <!-- YEAR AXIS                                    -->
  <!-- ============================================ -->

  <line x1="40" y1="298" x2="810" y2="298" stroke="#888" stroke-width="1"/>
  <line x1="80" y1="298" x2="80" y2="304" stroke="#888" stroke-width="1"/>
  <text x="80" y="310" class="tiny" text-anchor="middle">1650</text>
  <line x1="280" y1="298" x2="280" y2="304" stroke="#888" stroke-width="1"/>
  <text x="280" y="310" class="tiny" text-anchor="middle">1700</text>
  <line x1="480" y1="298" x2="480" y2="304" stroke="#888" stroke-width="1"/>
  <text x="480" y="310" class="tiny" text-anchor="middle">1750</text>
  <line x1="680" y1="298" x2="680" y2="304" stroke="#888" stroke-width="1"/>
  <text x="680" y="310" class="tiny" text-anchor="middle">1800</text>

</svg>
