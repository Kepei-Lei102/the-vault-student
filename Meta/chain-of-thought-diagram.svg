<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13px; }
    .small { font-size: 11px; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 13px; }
    .signal { font-size: 11px; font-weight: 600; }
  </style>

  <!-- Row 1: Pólya's Four Phases (cycle) -->
  <text x="360" y="24" text-anchor="middle" class="title">Pólya's Four Phases</text>

  <!-- Phase boxes -->
  <!-- Understand -->
  <rect x="40" y="45" width="130" height="50" rx="8" fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="105" y="66" text-anchor="middle" class="label" fill="#2563eb">① Understand</text>
  <text x="105" y="82" text-anchor="middle" class="small">What am I given?</text>

  <!-- Plan -->
  <rect x="220" y="45" width="130" height="50" rx="8" fill="rgba(124, 58, 237, 0.15)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="285" y="66" text-anchor="middle" class="label" fill="#7c3aed">② Plan</text>
  <text x="285" y="82" text-anchor="middle" class="small">Which strategy?</text>

  <!-- Execute -->
  <rect x="400" y="45" width="130" height="50" rx="8" fill="rgba(5, 150, 105, 0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="465" y="66" text-anchor="middle" class="label" fill="#059669">③ Execute</text>
  <text x="465" y="82" text-anchor="middle" class="small">Build the chain</text>

  <!-- Look Back -->
  <rect x="580" y="45" width="110" height="50" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="635" y="66" text-anchor="middle" class="label" fill="#f59e0b">④ Look Back</text>
  <text x="635" y="82" text-anchor="middle" class="small">Does it check?</text>

  <!-- Arrows between phases -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#888"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/>
    </marker>
  </defs>
  <line x1="170" y1="70" x2="216" y2="70" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="70" x2="396" y2="70" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="530" y1="70" x2="576" y2="70" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Look Back return arrow (curved) -->
  <path d="M 635 95 C 635 120, 105 120, 105 95" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arr-amber)"/>
  <text x="370" y="118" text-anchor="middle" class="small" fill="#f59e0b">stuck? revise your plan</text>

  <!-- Divider -->
  <line x1="40" y1="145" x2="680" y2="145" stroke="#888" stroke-opacity="0.2" stroke-dasharray="6,4"/>

  <!-- Row 2: "Show That" chain structure -->
  <text x="360" y="170" text-anchor="middle" class="title">"Show That" Chain</text>

  <!-- Given box -->
  <rect x="30" y="190" width="110" height="55" rx="8" fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="85" y="212" text-anchor="middle" class="label" fill="#2563eb">Given</text>
  <text x="85" y="228" text-anchor="middle" class="small">已知</text>

  <!-- Step 1 -->
  <rect x="185" y="190" width="90" height="55" rx="8" fill="rgba(128, 128, 128, 0.1)" stroke="#888" stroke-width="1"/>
  <text x="230" y="212" text-anchor="middle" class="label">Step 1</text>
  <text x="230" y="228" text-anchor="middle" class="small" fill="#059669">M mark</text>

  <!-- Step 2 -->
  <rect x="320" y="190" width="90" height="55" rx="8" fill="rgba(128, 128, 128, 0.1)" stroke="#888" stroke-width="1"/>
  <text x="365" y="212" text-anchor="middle" class="label">Step 2</text>
  <text x="365" y="228" text-anchor="middle" class="small" fill="#059669">M mark</text>

  <!-- dots -->
  <text x="440" y="220" text-anchor="middle" class="label">···</text>

  <!-- Result box -->
  <rect x="475" y="190" width="120" height="55" rx="8" fill="rgba(5, 150, 105, 0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="535" y="212" text-anchor="middle" class="label" fill="#059669">Result ✓</text>
  <text x="535" y="228" text-anchor="middle" class="small">如题所求</text>

  <!-- Arrows -->
  <line x1="140" y1="217" x2="181" y2="217" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="275" y1="217" x2="316" y2="217" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="410" y1="217" x2="425" y2="217" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="452" y1="217" x2="471" y2="217" stroke="#888" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Signal words below arrows -->
  <text x="160" y="252" text-anchor="middle" class="signal" fill="#7c3aed">since...</text>
  <text x="297" y="252" text-anchor="middle" class="signal" fill="#7c3aed">therefore...</text>
  <text x="460" y="252" text-anchor="middle" class="signal" fill="#7c3aed">hence...</text>

  <!-- Red X: wrong approach -->
  <rect x="475" y="275" width="210" height="45" rx="6" fill="rgba(220, 38, 38, 0.1)" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="580" y="293" text-anchor="middle" class="small" fill="#dc2626">✗  Don't use the result to prove itself</text>
  <text x="580" y="308" text-anchor="middle" class="small" fill="#dc2626">(that's circular reasoning 循环论证)</text>

  <!-- Mark scheme note -->
  <text x="85" y="295" text-anchor="middle" class="small">Each visible step</text>
  <text x="85" y="310" text-anchor="middle" class="small">= a mark earned</text>
</svg>
