<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 486" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .rung  { font-size: 14px; }
    .form  { font-size: 14px; font-weight: 600; }
    .note  { font-size: 11.5px; opacity: 0.8; }
    .small { font-size: 12px; }
  </style>

  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- rails: solid through the climbable rungs, dashed toward the Form -->
  <line x1="150" y1="430" x2="150" y2="160" stroke="#888" stroke-width="2"/>
  <line x1="215" y1="430" x2="215" y2="160" stroke="#888" stroke-width="2"/>
  <line x1="150" y1="160" x2="150" y2="86" stroke="#888" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <line x1="215" y1="160" x2="215" y2="86" stroke="#888" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
  <text x="182" y="74" class="note" text-anchor="middle">. . .</text>

  <!-- climbable rungs -->
  <line x1="150" y1="410" x2="215" y2="410" stroke="#2563eb" stroke-width="3"/>
  <text x="228" y="415" class="rung" fill="#2563eb">a single beautiful thing</text>

  <line x1="150" y1="350" x2="215" y2="350" stroke="#2563eb" stroke-width="3"/>
  <text x="228" y="355" class="rung" fill="#2563eb">all beautiful bodies</text>

  <line x1="150" y1="290" x2="215" y2="290" stroke="#7c3aed" stroke-width="3"/>
  <text x="228" y="295" class="rung" fill="#7c3aed">beautiful souls</text>

  <line x1="150" y1="230" x2="215" y2="230" stroke="#7c3aed" stroke-width="3"/>
  <text x="228" y="235" class="rung" fill="#7c3aed">beautiful laws &amp; practices</text>

  <line x1="150" y1="170" x2="215" y2="170" stroke="#0891b2" stroke-width="3"/>
  <text x="228" y="175" class="rung" fill="#0891b2">beautiful knowledge</text>

  <!-- the Form: not a standable rung -->
  <line x1="150" y1="110" x2="215" y2="110" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="228" y="106" class="form" fill="#f59e0b">Beauty itself -- the Form</text>
  <text x="228" y="123" class="note">no rung you can stand on</text>

  <!-- ascent arrow -->
  <line x1="108" y1="420" x2="108" y2="120" stroke="#888" stroke-width="1.8" marker-end="url(#up)"/>
  <text x="98" y="276" class="note" text-anchor="end">the</text>
  <text x="98" y="290" class="note" text-anchor="end">ascent</text>

  <!-- base annotation -->
  <text x="300" y="472" class="small" text-anchor="middle">Eros = Poros (plenty) + Penia (lack): the lack is the engine -- and the climb has no last step.</text>
</svg>
