<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .label { font-size: 14px; }
    .small { font-size: 12px; opacity: 0.75; }
    .scrawl { font-size: 13px; opacity: 0.7; font-style: italic; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- The slope: line from upper-left to lower-right -->
  <line x1="60" y1="60" x2="460" y2="290" stroke="#888" stroke-width="2"/>

  <!-- Ground line (a short stub past the slope's foot) -->
  <line x1="460" y1="290" x2="540" y2="290" stroke="#888" stroke-width="2"/>

  <!-- Barrier — a vertical line at the foot of the slope -->
  <line x1="460" y1="290" x2="460" y2="225" stroke="#888" stroke-width="3"/>

  <!-- Hatch marks on the barrier (the universal "this is a wall" doodle) -->
  <line x1="460" y1="240" x2="470" y2="232" stroke="#888" stroke-width="1"/>
  <line x1="460" y1="252" x2="470" y2="244" stroke="#888" stroke-width="1"/>
  <line x1="460" y1="264" x2="470" y2="256" stroke="#888" stroke-width="1"/>
  <line x1="460" y1="276" x2="470" y2="268" stroke="#888" stroke-width="1"/>

  <!-- Hatch marks on the ground (the "this is the floor" doodle) -->
  <line x1="475" y1="290" x2="468" y2="300" stroke="#888" stroke-width="1"/>
  <line x1="495" y1="290" x2="488" y2="300" stroke="#888" stroke-width="1"/>
  <line x1="515" y1="290" x2="508" y2="300" stroke="#888" stroke-width="1"/>
  <line x1="535" y1="290" x2="528" y2="300" stroke="#888" stroke-width="1"/>

  <!-- Angle marker (30°) at the foot of the slope -->
  <path d="M 440,290 A 20,20 0 0,0 442,278" fill="none" stroke="#888" stroke-width="1"/>
  <text x="425" y="285" class="small" text-anchor="end">30°</text>

  <!-- Particle A — higher up the slope, casually placed -->
  <circle cx="180" cy="129" r="13"
          fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="134" class="math label" text-anchor="middle" fill="#2563eb">A</text>

  <!-- Particle B — lower down the slope, between A and the barrier -->
  <circle cx="330" cy="215" r="13"
          fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="220" class="math label" text-anchor="middle" fill="#2563eb">B</text>

  <!-- Direction-of-motion arrows on each particle, parallel to slope -->
  <line x1="195" y1="138" x2="220" y2="153" stroke="#888"
        stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="345" y1="225" x2="370" y2="240" stroke="#888"
        stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- The "smooth" label, placed casually in the open space above the slope -->
  <text x="105" y="95" class="scrawl">smooth</text>

  <!-- A small "barrier" label with a leader line — student noted it once -->
  <line x1="510" y1="245" x2="475" y2="255" stroke="#888"
        stroke-width="1" opacity="0.5"/>
  <text x="515" y="248" class="scrawl">barrier</text>

  <!-- The collision-marker scrawl: a tiny 'X' between A and B with a question
       mark — the student knows something happens there but didn't draw both
       events out, just the geometry once -->
  <text x="265" y="178" class="scrawl" fill="#dc2626">collide ×</text>

  <!-- The angle-arc dashed continuation showing slope angle (subtle) -->
  <line x1="60" y1="60" x2="60" y2="290" stroke="#888"
        stroke-width="0.8" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="60" y1="290" x2="460" y2="290" stroke="#888"
        stroke-width="0.8" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Caption strip at the bottom — the student labelled their stages once
       in the margin, no need to redraw the geometry per stage -->
  <text x="280" y="335" class="scrawl" text-anchor="middle">
    momentum &#8594; SUVAT &#8594; barrier &#8594; SUVAT &#8594; momentum
  </text>
</svg>
