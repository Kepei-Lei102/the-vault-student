<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .label { font-size: 14px; }
    .small { font-size: 12px; opacity: 0.75; }
    .scrawl { font-size: 13px; opacity: 0.65; font-style: italic; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Upward applied force arrow (the most important thing student would draw) -->
  <line x1="240" y1="80" x2="240" y2="20"
        stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="252" y="50" class="label" fill="#dc2626">10 N</text>

  <!-- Particle A — slightly lopsided rectangle, like a quick exam sketch -->
  <rect x="208" y="82" width="64" height="44"
        fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="110" class="math label" text-anchor="middle" fill="#2563eb">A</text>

  <!-- Mass scrawl beside A -->
  <text x="288" y="108" class="small">0.5 kg</text>

  <!-- The light inextensible string — a single straight line, no T label
       (student didn't bother — the diagram is for geometry, not algebra) -->
  <line x1="240" y1="126" x2="240" y2="220" stroke="#888" stroke-width="1.5"/>

  <!-- Particle B — same lopsided sketch -->
  <rect x="208" y="220" width="64" height="44"
        fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="248" class="math label" text-anchor="middle" fill="#2563eb">B</text>

  <text x="288" y="246" class="small">0.3 kg</text>

  <!-- Direction-of-motion arrow off to the side — the student's
       "this is the +ve direction" mark, casually placed -->
  <line x1="160" y1="200" x2="160" y2="140"
        stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="148" y="175" class="scrawl" text-anchor="end">+a</text>

  <!-- A faint, half-erased weight arrow at B (student started drawing
       the FBD, then realised the equation handles it, didn't finish) -->
  <line x1="240" y1="280" x2="240" y2="320"
        stroke="#888" stroke-width="1.2" stroke-dasharray="4,3"
        opacity="0.5" marker-end="url(#arrow)"/>
  <text x="252" y="308" class="small" opacity="0.6">w</text>

  <!-- The "find" annotation at the bottom — exactly what a student
       would scrawl after re-reading the question -->
  <text x="240" y="358" class="scrawl" text-anchor="middle">find a, T</text>
</svg>
