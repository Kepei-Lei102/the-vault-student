<svg width="100%" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">The verification ladder: cheapest check first</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#888">each rung costs more than the one below and catches what the one below could not</text>

  <!-- rungs, bottom = cheapest -->
  <g font-size="12" fill="#888">
    <rect x="60" y="360" width="630" height="34" rx="6" fill="rgba(5,150,105,0.18)" stroke="#059669" stroke-width="1.2"/>
    <text x="80" y="382" font-weight="bold">1  Units and dimensions</text>
    <text x="330" y="382">both sides the same kind of thing? seconds are not metres</text>

    <rect x="80" y="316" width="610" height="34" rx="6" fill="rgba(5,150,105,0.14)" stroke="#059669" stroke-width="1.2"/>
    <text x="100" y="338" font-weight="bold">2  Sign and size</text>
    <text x="330" y="338">right direction, right order of magnitude (a Fermi estimate)</text>

    <rect x="100" y="272" width="590" height="34" rx="6" fill="rgba(37,99,235,0.14)" stroke="#2563eb" stroke-width="1.2"/>
    <text x="120" y="294" font-weight="bold">3  Limits and special cases</text>
    <text x="330" y="294">set a parameter to 0, 1 or infinity: is it the known case?</text>

    <rect x="120" y="228" width="570" height="34" rx="6" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.2"/>
    <text x="140" y="250" font-weight="bold">4  Symmetry and counting</text>
    <text x="330" y="250">swap the labels, count the constraints: are they respected?</text>

    <rect x="140" y="184" width="550" height="34" rx="6" fill="rgba(124,58,237,0.14)" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="160" y="206" font-weight="bold">5  Substitute back</text>
    <text x="330" y="206">put the answer back into the question: a root must fit</text>

    <rect x="160" y="140" width="530" height="34" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="180" y="162" font-weight="bold">6  Independent route</text>
    <text x="330" y="162">a second method sharing no steps with the first</text>

    <rect x="180" y="96" width="510" height="34" rx="6" fill="rgba(245,158,11,0.16)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="200" y="118" font-weight="bold">7  Simulate</text>
    <text x="330" y="118">brute-force the situation and compare</text>

    <rect x="200" y="52" width="490" height="34" rx="6" fill="rgba(220,38,38,0.14)" stroke="#dc2626" stroke-width="1.2"/>
    <text x="220" y="74" font-weight="bold">8  Redo it</text>
    <text x="330" y="74">the last resort: costs as much as producing</text>
  </g>

  <text x="30" y="380" font-size="10" fill="#888" text-anchor="middle" transform="rotate(-90 30 380)"></text>
  <text x="742" y="230" font-size="10.5" fill="#888" text-anchor="middle" transform="rotate(90 742 230)">cost rises</text>
  <line x1="730" y1="350" x2="730" y2="100" stroke="#888" stroke-width="1"/>
  <polygon points="730,92 725,102 735,102" fill="#888"/>
  <text x="380" y="412" text-anchor="middle" font-size="11" fill="#888">most wrong answers die on rungs 1 to 3, for the price of a glance</text>
</svg>
