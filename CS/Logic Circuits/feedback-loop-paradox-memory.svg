<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 14px; font-weight: 700; }
    .bad { font-size: 13px; font-weight: 700; fill: #dc2626; }
    .good { font-size: 13px; font-weight: 700; fill: #059669; }
    .eq { font-size: 11px; }
    .g { font-size: 10px; font-weight: 600; fill: #7c3aed; }
  </style>

  <!-- ============ LEFT: one inverter, paradox ============ -->
  <text x="170" y="26" class="title" text-anchor="middle">One inverter in a loop</text>

  <!-- NOT gate -->
  <path d="M 130 86 L 130 114 L 158 100 Z" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.6"/>
  <circle cx="163" cy="100" r="4" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="118" y="132" class="g" text-anchor="start">NOT</text>

  <!-- feedback loop: output right, down, left, up, into input -->
  <line x1="167" y1="100" x2="240" y2="100" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="240" y1="100" x2="240" y2="168" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="240" y1="168" x2="88"  y2="168" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="88"  y1="168" x2="88"  y2="100" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="88"  y1="100" x2="130" y2="100" stroke="#9ca3af" stroke-width="1.4"/>
  <!-- direction arrow on the bottom return wire -->
  <path d="M 170 163 L 158 168 L 170 173 Z" fill="#9ca3af"/>

  <!-- oscillation squiggle at the output -->
  <polyline points="196,78 204,78 204,68 212,68 212,78 220,78 220,68 228,68"
            fill="none" stroke="#dc2626" stroke-width="1.6"/>

  <text x="170" y="200" class="bad" text-anchor="middle">Q = NOT Q -- no value works</text>
  <text x="170" y="219" class="eq" text-anchor="middle">the liar's sentence in silicon: it oscillates</text>
  <text x="170" y="236" class="eq" text-anchor="middle">(odd loops = ring oscillators, used as on-chip clocks)</text>

  <!-- divider -->
  <line x1="340" y1="30" x2="340" y2="230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- ============ RIGHT: two inverters, memory ============ -->
  <text x="510" y="26" class="title" text-anchor="middle">Two inverters in a loop</text>

  <!-- top NOT gate, pointing right -->
  <path d="M 460 66 L 460 94 L 488 80 Z" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.6"/>
  <circle cx="493" cy="80" r="4" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
  <!-- bottom NOT gate, pointing left -->
  <path d="M 560 146 L 560 174 L 532 160 Z" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.6"/>
  <circle cx="527" cy="160" r="4" fill="none" stroke="#7c3aed" stroke-width="1.6"/>

  <!-- loop wires: top output -> right node -> down -> bottom input; bottom output -> left node -> up -> top input -->
  <line x1="497" y1="80" x2="596" y2="80" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="596" y1="80" x2="596" y2="160" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="596" y1="160" x2="560" y2="160" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="523" y1="160" x2="424" y2="160" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="424" y1="160" x2="424" y2="80" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="424" y1="80" x2="460" y2="80" stroke="#9ca3af" stroke-width="1.4"/>

  <!-- state nodes: right = Q, left = Q-bar -->
  <circle cx="596" cy="120" r="4" fill="#059669"/>
  <text x="608" y="125" class="good" text-anchor="start">Q</text>
  <circle cx="424" cy="120" r="4" fill="#9ca3af"/>
  <text x="398" y="125" class="eq" text-anchor="start" font-weight="700">Q</text>
  <line x1="397" y1="112" x2="407" y2="112" stroke="#888" stroke-width="1.3"/>

  <text x="510" y="200" class="good" text-anchor="middle">Q = NOT (NOT Q) -- true for 0 and for 1</text>
  <text x="510" y="219" class="eq" text-anchor="middle">two stable states, each holding the other up: a memory</text>
  <text x="510" y="236" class="eq" text-anchor="middle">(this loop is the heart of the SRAM cell)</text>
</svg>
