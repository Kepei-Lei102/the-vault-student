<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 700; }
    .axis { font-size: 13px; font-weight: 700; fill: #0891b2; }
    .hdr { font-size: 12.5px; font-weight: 600; fill: #0891b2; }
    .one { font-size: 17px; font-weight: 700; fill: #059669; }
    .zero { font-size: 16px; fill: #888; opacity: 0.55; }
    .res { font-size: 15px; font-weight: 700; }
    .note { font-size: 11.5px; }
    .lbc { font-size: 13px; font-weight: 700; fill: #2563eb; }
    .lac { font-size: 13px; font-weight: 700; fill: #7c3aed; }
    .lab { font-size: 13px; font-weight: 700; fill: #f59e0b; }
  </style>

  <text x="310" y="28" class="title" text-anchor="middle">Minimising the majority function by eye</text>

  <!-- axis super-labels -->
  <text x="280" y="86" class="axis" text-anchor="middle">BC</text>
  <text x="112" y="122" class="axis" text-anchor="middle">A</text>
  <text x="175" y="100" class="hdr" text-anchor="middle">00</text>
  <text x="245" y="100" class="hdr" text-anchor="middle">01</text>
  <text x="315" y="100" class="hdr" text-anchor="middle">11</text>
  <text x="385" y="100" class="hdr" text-anchor="middle">10</text>
  <text x="126" y="141" class="hdr" text-anchor="middle">0</text>
  <text x="126" y="201" class="hdr" text-anchor="middle">1</text>

  <!-- grid -->
  <rect x="140" y="106" width="280" height="120" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="210" y1="106" x2="210" y2="226" stroke="#9ca3af" stroke-width="1"/>
  <line x1="280" y1="106" x2="280" y2="226" stroke="#9ca3af" stroke-width="1"/>
  <line x1="350" y1="106" x2="350" y2="226" stroke="#9ca3af" stroke-width="1"/>
  <line x1="140" y1="166" x2="420" y2="166" stroke="#9ca3af" stroke-width="1"/>

  <!-- values: 1s at m3(A0,BC11), m5(A1,BC01), m6(A1,BC10), m7(A1,BC11) -->
  <text x="175" y="142" class="zero" text-anchor="middle">0</text>
  <text x="245" y="142" class="zero" text-anchor="middle">0</text>
  <text x="315" y="142" class="one"  text-anchor="middle">1</text>
  <text x="385" y="142" class="zero" text-anchor="middle">0</text>
  <text x="175" y="202" class="zero" text-anchor="middle">0</text>
  <text x="245" y="202" class="one"  text-anchor="middle">1</text>
  <text x="315" y="202" class="one"  text-anchor="middle">1</text>
  <text x="385" y="202" class="one"  text-anchor="middle">1</text>

  <!-- loop BC: vertical pair in column 11 (both rows) -->
  <rect x="286" y="112" width="58" height="108" rx="26" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="315" y="248" class="lbc" text-anchor="middle">BC</text>

  <!-- loop AC: row A=1, cols 01 & 11 -->
  <rect x="214" y="176" width="132" height="34" rx="17" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="196" y="186" class="lac" text-anchor="end">AC</text>

  <!-- loop AB: row A=1, cols 11 & 10 -->
  <rect x="284" y="186" width="132" height="34" rx="17" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="434" y="220" class="lab" text-anchor="start">AB</text>

  <!-- result line, tokens coloured to match loops -->
  <text x="150" y="286" class="res" text-anchor="start" fill="#888">majority(A, B, C)  =</text>
  <text x="330" y="286" class="lab" text-anchor="middle">AB</text>
  <text x="356" y="286" class="res" text-anchor="middle" fill="#888">+</text>
  <text x="382" y="286" class="lac" text-anchor="middle">AC</text>
  <text x="408" y="286" class="res" text-anchor="middle" fill="#888">+</text>
  <text x="434" y="286" class="lbc" text-anchor="middle">BC</text>

  <text x="310" y="316" class="note" text-anchor="middle">each pair of adjacent 1s deletes the one variable that changes across it -- three pairs, all sharing the centre cell 111</text>
</svg>
