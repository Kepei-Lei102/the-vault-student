<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 700; }
    .sub { font-size: 12px; }
    .axis { font-size: 13px; font-weight: 700; fill: #0891b2; }
    .hdr { font-size: 12.5px; font-weight: 600; fill: #0891b2; }
    .mt { font-size: 14px; font-weight: 600; }
    .code { font-size: 10.5px; }
    .note { font-size: 11.5px; }
    .callout { font-size: 12px; font-weight: 600; fill: #7c3aed; }
    .wrap { font-size: 11.5px; font-weight: 600; fill: #f59e0b; }
  </style>
  <defs>
    <marker id="amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="340" y="28" class="title" text-anchor="middle">Anatomy of a 3-variable Karnaugh map</text>
  <text x="340" y="49" class="sub" text-anchor="middle">a truth table redrawn so any two neighbours differ in exactly one input</text>

  <!-- axis super-labels -->
  <text x="280" y="90" class="axis" text-anchor="middle">BC</text>
  <text x="112" y="126" class="axis" text-anchor="middle">A</text>

  <!-- column headers (Gray-code order) -->
  <text x="175" y="104" class="hdr" text-anchor="middle">00</text>
  <text x="245" y="104" class="hdr" text-anchor="middle">01</text>
  <text x="315" y="104" class="hdr" text-anchor="middle">11</text>
  <text x="385" y="104" class="hdr" text-anchor="middle">10</text>

  <!-- row headers -->
  <text x="126" y="145" class="hdr" text-anchor="middle">0</text>
  <text x="126" y="205" class="hdr" text-anchor="middle">1</text>

  <!-- grid -->
  <rect x="140" y="110" width="280" height="120" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="210" y1="110" x2="210" y2="230" stroke="#9ca3af" stroke-width="1"/>
  <line x1="280" y1="110" x2="280" y2="230" stroke="#9ca3af" stroke-width="1"/>
  <line x1="350" y1="110" x2="350" y2="230" stroke="#9ca3af" stroke-width="1"/>
  <line x1="140" y1="170" x2="420" y2="170" stroke="#9ca3af" stroke-width="1"/>

  <!-- cells: minterm + 3-bit code -->
  <text x="175" y="145" class="mt" text-anchor="middle">m0</text><text x="175" y="160" class="code" text-anchor="middle">000</text>
  <text x="245" y="145" class="mt" text-anchor="middle">m1</text><text x="245" y="160" class="code" text-anchor="middle">001</text>
  <text x="315" y="145" class="mt" text-anchor="middle">m3</text><text x="315" y="160" class="code" text-anchor="middle">011</text>
  <text x="385" y="145" class="mt" text-anchor="middle">m2</text><text x="385" y="160" class="code" text-anchor="middle">010</text>
  <text x="175" y="205" class="mt" text-anchor="middle">m4</text><text x="175" y="220" class="code" text-anchor="middle">100</text>
  <text x="245" y="205" class="mt" text-anchor="middle">m5</text><text x="245" y="220" class="code" text-anchor="middle">101</text>
  <text x="315" y="205" class="mt" text-anchor="middle">m7</text><text x="315" y="220" class="code" text-anchor="middle">111</text>
  <text x="385" y="205" class="mt" text-anchor="middle">m6</text><text x="385" y="220" class="code" text-anchor="middle">110</text>

  <!-- adjacency callout on column 11 (m3 over m7): differ only in A -->
  <rect x="284" y="115" width="62" height="110" rx="14" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="346" y1="150" x2="440" y2="150" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="446" y="140" class="callout" text-anchor="start">011 and 111 differ</text>
  <text x="446" y="156" class="callout" text-anchor="start">only in A -&gt; loop them,</text>
  <text x="446" y="172" class="callout" text-anchor="start">A drops, leaving BC</text>

  <!-- gray-code note -->
  <text x="280" y="256" class="note" text-anchor="middle">columns run 00 -&gt; 01 -&gt; 11 -&gt; 10 (Gray code): one bit flips per step</text>

  <!-- wrap-around: left edge (col 00) and right edge (col 10) are adjacent -->
  <path d="M 175 288 Q 280 322 385 288" fill="none" stroke="#f59e0b" stroke-width="1.8"
        stroke-dasharray="5,4" marker-end="url(#amb)" marker-start="url(#amb)"/>
  <text x="280" y="316" class="wrap" text-anchor="middle">the edges wrap:</text>
  <text x="280" y="344" class="wrap" text-anchor="middle">columns 00 and 10 differ by one bit too, so they are neighbours</text>
  <text x="175" y="284" class="note" text-anchor="middle">00</text>
  <text x="385" y="284" class="note" text-anchor="middle">10</text>

  <text x="340" y="384" class="note" text-anchor="middle">the map is a cylinder (a torus, once both axes wrap) -- adjacency, not the flat layout, is what counts</text>
</svg>
