<?xml version="1.0" encoding="UTF-8"?>
<!-- stack: SMIL -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 17px; font-weight: 700; }
    .leg   { font-size: 11px; }
    .mode  { font-size: 22px; font-weight: 800; }
    .cap   { font-size: 13px; }
    .io    { font-size: 15px; font-weight: 700; }
    .num   { font-size: 15px; font-weight: 800; }
  </style>

  <text x="360" y="28" class="title" text-anchor="middle">The four moods of an SR flip-flop</text>
  <text x="360" y="48" class="leg" text-anchor="middle">green = logic 1  ·  grey = logic 0  ·  amber = undecided</text>

  <!-- ===================== MODE LABEL (above the chip) ===================== -->
  <text x="360" y="92" class="mode" text-anchor="middle" fill="#059669" opacity="1">SET
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.25;1" values="1;0;0"/></text>
  <text x="360" y="92" class="mode" text-anchor="middle" fill="#0891b2" opacity="0">HOLD
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.25;0.5;1" values="0;1;0;0"/></text>
  <text x="360" y="92" class="mode" text-anchor="middle" fill="#9ca3af" opacity="0">RESET
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.5;0.75;1" values="0;1;0;0"/></text>
  <text x="360" y="92" class="mode" text-anchor="middle" fill="#dc2626" opacity="0">FORBIDDEN
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.75;1" values="0;1;1"/></text>

  <!-- ===================== INPUT LEDs ===================== -->
  <!-- S -->
  <text x="138" y="190" class="io" text-anchor="end" fill="#2563eb">S</text>
  <rect x="150" y="175" width="20" height="20" rx="4" fill="#059669" stroke="#888" stroke-width="1">
    <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.25;0.75;0.82;1" values="#059669;#9ca3af;#059669;#9ca3af;#9ca3af"/>
  </rect>
  <line x1="170" y1="185" x2="280" y2="185" stroke="#9ca3af" stroke-width="1.6"/>
  <!-- R -->
  <text x="138" y="240" class="io" text-anchor="end" fill="#2563eb">R</text>
  <rect x="150" y="225" width="20" height="20" rx="4" fill="#9ca3af" stroke="#888" stroke-width="1">
    <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.5;0.82;1" values="#9ca3af;#059669;#9ca3af;#9ca3af"/>
  </rect>
  <line x1="170" y1="235" x2="280" y2="235" stroke="#9ca3af" stroke-width="1.6"/>

  <!-- ===================== OUTPUT wires + LEDs ===================== -->
  <line x1="440" y1="185" x2="518" y2="185" stroke="#9ca3af" stroke-width="1.6"/>
  <line x1="440" y1="235" x2="518" y2="235" stroke="#9ca3af" stroke-width="1.6"/>

  <!-- Q LED -->
  <circle cx="540" cy="185" r="22" fill="#059669" stroke="#888" stroke-width="1">
    <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.5;0.82;0.855;0.89;0.925;0.96;1"
             values="#059669;#9ca3af;#9ca3af;#059669;#9ca3af;#059669;#f59e0b;#f59e0b"/>
  </circle>
  <text x="585" y="190" class="io" text-anchor="start">Q</text>

  <!-- Q-bar LED -->
  <circle cx="540" cy="235" r="22" fill="#9ca3af" stroke="#888" stroke-width="1">
    <animate attributeName="fill" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.5;0.75;0.82;0.855;0.89;0.925;0.96;1"
             values="#9ca3af;#059669;#9ca3af;#059669;#9ca3af;#059669;#9ca3af;#f59e0b;#f59e0b"/>
  </circle>
  <text x="585" y="240" class="io" text-anchor="start">Q</text>
  <line x1="584" y1="228" x2="597" y2="228" stroke="#888" stroke-width="1.4"/>

  <!-- ===================== THE CHIP (shakes when panicking) ===================== -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="16s" repeatCount="indefinite"
      keyTimes="0;0.75;0.78;0.81;0.84;0.87;0.90;0.93;0.96;1"
      values="0 0;0 0;3 -2;-3 2;2 3;-2 -3;3 1;-3 -1;0 0;0 0"/>

    <rect x="280" y="150" width="160" height="120" rx="14"
          fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="292" y="167" style="fill:#7c3aed" font-size="11px" font-weight="700">SR</text>

    <!-- normal eyes -->
    <g opacity="1">
      <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
               keyTimes="0;0.75;1" values="1;0;0"/>
      <circle cx="343" cy="200" r="9" fill="none" stroke="#888" stroke-width="1.8"/>
      <circle cx="377" cy="200" r="9" fill="none" stroke="#888" stroke-width="1.8"/>
      <circle cx="343" cy="201" r="3" fill="#888"/>
      <circle cx="377" cy="201" r="3" fill="#888"/>
    </g>
    <!-- panic X eyes -->
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
               keyTimes="0;0.75;1" values="0;1;1"/>
      <line x1="336" y1="193" x2="350" y2="207" stroke="#dc2626" stroke-width="2.4"/>
      <line x1="350" y1="193" x2="336" y2="207" stroke="#dc2626" stroke-width="2.4"/>
      <line x1="370" y1="193" x2="384" y2="207" stroke="#dc2626" stroke-width="2.4"/>
      <line x1="384" y1="193" x2="370" y2="207" stroke="#dc2626" stroke-width="2.4"/>
    </g>

    <!-- mouths -->
    <path d="M342 236 Q360 250 378 236" fill="none" stroke="#888" stroke-width="2" opacity="1">
      <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
               keyTimes="0;0.5;1" values="1;0;0"/></path>
    <line x1="344" y1="242" x2="376" y2="242" stroke="#888" stroke-width="2" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
               keyTimes="0;0.5;0.75;1" values="0;1;0;0"/></line>
    <path d="M338 242 q6 -8 11 0 q6 8 11 0 q6 -8 11 0" fill="none" stroke="#dc2626" stroke-width="2.2" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
               keyTimes="0;0.75;1" values="0;1;1"/></path>
  </g>

  <!-- panic "?!" -->
  <text x="470" y="140" class="mode" fill="#dc2626" text-anchor="middle" opacity="0">?!
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.75;0.8;0.85;0.9;0.95;1" values="0;1;0;1;0;1;0"/></text>
  <text x="250" y="140" class="mode" fill="#dc2626" text-anchor="middle" opacity="0">!?
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.75;0.8;0.85;0.9;0.95;1" values="0;0;1;0;1;0;0"/></text>

  <!-- ===================== CAPTIONS ===================== -->
  <text x="360" y="368" class="cap" text-anchor="middle" fill="#059669" opacity="1">SET (S=1, R=0): Q is forced to 1.
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.25;1" values="1;0;0"/></text>
  <text x="360" y="368" class="cap" text-anchor="middle" fill="#0891b2" opacity="0">HOLD (S=0, R=0): inputs off, yet Q stays 1 -- the loop remembers.
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.25;0.5;1" values="0;1;0;0"/></text>
  <text x="360" y="368" class="cap" text-anchor="middle" fill="#9ca3af" opacity="0">RESET (S=0, R=1): Q is forced to 0.
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.5;0.75;1" values="0;1;0;0"/></text>
  <text x="360" y="368" class="cap" text-anchor="middle" fill="#dc2626" opacity="0">S=R=1: Q and NOT-Q both go 0 (impossible!) -- release, and a race decides at random.
    <animate attributeName="opacity" calcMode="discrete" dur="16s" repeatCount="indefinite"
             keyTimes="0;0.75;1" values="0;1;1"/></text>
</svg>
