<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 282" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 15px; font-weight: 700; }
    .fa { font-size: 15px; font-weight: 700; fill: #7c3aed; }
    .bit { font-size: 10px; fill: #7c3aed; }
    .in { font-size: 11px; font-weight: 600; fill: #2563eb; }
    .carry { font-size: 12px; font-weight: 700; fill: #f59e0b; }
    .zero { font-size: 12px; font-weight: 700; fill: #9ca3af; }
    .sum { font-size: 13px; font-weight: 700; fill: #059669; }
    .cap { font-size: 11px; }
  </style>
  <defs>
    <marker id="lt" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="ltg" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="350" y="24" class="title" text-anchor="middle">4-bit ripple-carry adder: 7 + 1 = 8, and the carry sweeps left</text>

  <!-- four FA boxes: FA3 (MSB, left) ... FA0 (LSB, right) -->
  <!-- FA3 -->
  <text x="120" y="86" class="in" text-anchor="middle">A=0  B=0</text>
  <line x1="105" y1="90" x2="105" y2="100" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="135" y1="90" x2="135" y2="100" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="70" y="100" width="100" height="70" rx="9" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="120" y="132" class="fa" text-anchor="middle">FA</text>
  <text x="120" y="150" class="bit" text-anchor="middle">bit 3</text>
  <line x1="120" y1="170" x2="120" y2="196" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="120" y="214" class="sum" text-anchor="middle">1</text>

  <!-- FA2 -->
  <text x="260" y="86" class="in" text-anchor="middle">A=1  B=0</text>
  <line x1="245" y1="90" x2="245" y2="100" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="275" y1="90" x2="275" y2="100" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="210" y="100" width="100" height="70" rx="9" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="260" y="132" class="fa" text-anchor="middle">FA</text>
  <text x="260" y="150" class="bit" text-anchor="middle">bit 2</text>
  <line x1="260" y1="170" x2="260" y2="196" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="260" y="214" class="sum" text-anchor="middle">0</text>

  <!-- FA1 -->
  <text x="400" y="86" class="in" text-anchor="middle">A=1  B=0</text>
  <line x1="385" y1="90" x2="385" y2="100" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="415" y1="90" x2="415" y2="100" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="350" y="100" width="100" height="70" rx="9" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="400" y="132" class="fa" text-anchor="middle">FA</text>
  <text x="400" y="150" class="bit" text-anchor="middle">bit 1</text>
  <line x1="400" y1="170" x2="400" y2="196" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="400" y="214" class="sum" text-anchor="middle">0</text>

  <!-- FA0 -->
  <text x="540" y="86" class="in" text-anchor="middle">A=1  B=1</text>
  <line x1="525" y1="90" x2="525" y2="100" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="555" y1="90" x2="555" y2="100" stroke="#9ca3af" stroke-width="1.2"/>
  <rect x="490" y="100" width="100" height="70" rx="9" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="540" y="132" class="fa" text-anchor="middle">FA</text>
  <text x="540" y="150" class="bit" text-anchor="middle">bit 0</text>
  <line x1="540" y1="170" x2="540" y2="196" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="540" y="214" class="sum" text-anchor="middle">0</text>

  <!-- carry chain (flows right -> left) -->
  <line x1="625" y1="135" x2="590" y2="135" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ltg)"/>
  <text x="628" y="139" class="zero" text-anchor="start">Cin=0</text>

  <line x1="490" y1="135" x2="450" y2="135" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#lt)"/>
  <text x="470" y="126" class="carry" text-anchor="middle">1</text>

  <line x1="350" y1="135" x2="310" y2="135" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#lt)"/>
  <text x="330" y="126" class="carry" text-anchor="middle">1</text>

  <line x1="210" y1="135" x2="170" y2="135" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#lt)"/>
  <text x="190" y="126" class="carry" text-anchor="middle">1</text>

  <line x1="70" y1="135" x2="34" y2="135" stroke="#9ca3af" stroke-width="1.4" marker-end="url(#ltg)"/>
  <text x="30" y="139" class="zero" text-anchor="end">0</text>

  <text x="350" y="250" class="cap" text-anchor="middle">a single carry, born at bit 0 (1+1), ripples left through every stage -- the worst-case delay of a ripple adder</text>
  <text x="350" y="270" class="cap" text-anchor="middle">A = 0111  +  B = 0001  =  Sum 1000   (7 + 1 = 8); read the green sum bits left to right</text>
</svg>
