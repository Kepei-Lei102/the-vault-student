   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(72.307266 77.507859)">SENSOR</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(44.863594 89.315437)">measures a physical</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(35.485313 101.915437)">quantity, sends digitised</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(50.672813 114.515437)">data continuously</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(249.0075 77.507859)">MICROPROCESSOR</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(242.352422 89.315437)">compares the reading</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(247.139297 102.328172)">with a stored value;</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(274.459922 115.387312)">decides</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(457.169766 77.507859)">ACTUATOR</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(441.121641 90.187312)">turns the decision</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(432.016172 101.915437)">into a physical action:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(435.410156 114.928172)">motor, valve, heater</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(264.282891 214.847859)">THE WORLD</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(188.778516 226.655437)">water level · distance · temperature · position</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563eb" x="188.55" y="84.25234" transform="rotate(-0 188.55 84.25234)">digitised data</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7c3aed" x="389.43" y="84.25234" transform="rotate(-0 389.43 84.25234)">signal</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #059669" x="459.18" y="172.95634" transform="rotate(-0 459.18 172.95634)">changes it</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #f59e0b" x="107.64" y="172.95634" transform="rotate(-0 107.64 172.95634)">is measured again</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="291.78" y="23.832" transform="rotate(-0 291.78 23.832)">An automated system: sensor, microprocessor and actuator in collaboration, and no human in the ring</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="291.78" y="154.116" transform="rotate(-0 291.78 154.116)">the ring runs again and again until the system is switched off</text>
   </g>
  </g>
