   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(25.95457 89.72907)">what the person</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(51.60457 101.731023)">FEELS</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(142.326445 89.72907)">what the body</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(159.370977 101.731023)">SHOWS</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(249.724102 89.72907)">what the sensor</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(265.399883 101.731023)">RECORDS</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(362.324102 89.72907)">what the model</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(382.688164 101.731023)">LABELS</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(476.372539 89.72907)">what someone</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(490.999883 101.731023)">DECIDES</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(79.078203 185.325906)">people mask, fake</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(71.182813 198.150906)">and suppress; culture</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(75.218086 210.975906)">and context change</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(96.3875 223.800906)">the display</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(195.331719 185.325906)">lighting, camera</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(188.273516 198.150906)">angle, microphone,</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(199.045625 210.975906)">a moving wrist</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(304.630937 186.246219)">trained on whose</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(303.053789 198.150906)">faces? labelled by</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(302.889023 211.41157)">whom, with which</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(300.620156 223.800906)">theory of emotion?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(415.387812 185.325906)">a probability read</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(406.729453 198.58657)">as a fact; rare events</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(413.316367 211.896219)">make most alarms</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(446.059453 224.721219)">false</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="289.959258" y="29.376" transform="rotate(-0 289.959258 29.376)">Every arrow is an inference, and every inference loses something</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="289.959258" y="287.172" transform="rotate(-0 289.959258 287.172)">The machine only ever has the third box. Everything to its left is a guess; everything to its right is a choice.</text>
   </g>
  </g>
