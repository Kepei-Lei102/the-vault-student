   <g id="text_1">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(33.786938 70.596189)">R.U.R. — Čapek's play</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(16.064688 79.718267)">coins 'robot' (robota: drudgery)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #f59e0b" x="75.627313" y="90.775385" transform="rotate(-0 75.627313 90.775385)">1920</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(141.877433 70.596189)">Stanford Arm: six joints,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(132.726558 79.718267)">electric, computer-controlled</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563eb" x="187.593214" y="90.775385" transform="rotate(-0 187.593214 90.775385)">1969</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(257.214053 70.596189)">da Vinci surgical robot</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(232.011741 79.718267)">approved: the surgeon at a console</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #059669" x="299.559116" y="90.775385" transform="rotate(-0 299.559116 90.775385)">2000</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(355.13658 70.596189)">Fukushima: the robots sent in</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(361.671986 79.718267)">fail on stairs and radiation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #dc2626" x="411.525017" y="90.775385" transform="rotate(-0 411.525017 90.775385)">2011</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(482.193232 70.596189)">Zipline drones deliver</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(476.1542 79.718267)">blood to Rwandan clinics</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #059669" x="523.490919" y="90.775385" transform="rotate(-0 523.490919 90.775385)">2016</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(580.811633 70.596189)">cobots and warehouse fleets</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(592.665852 79.718267)">number in the millions</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0891b2" x="635.456821" y="90.775385" transform="rotate(-0 635.456821 90.775385)">2023</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(22.866688 201.350933)">Unimate at General Motors:</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(7.2 210.473011)">the first industrial robot, die-casting</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563eb" x="75.627313" y="190.085409" transform="rotate(-0 75.627313 190.085409)">1961</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(166.943502 201.350933)">Sojourner drives on Mars,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(163.604846 210.473011)">commands ten minutes old</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7c3aed" x="215.58469" y="190.085409" transform="rotate(-0 215.58469 190.085409)">1997</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(303.550942 201.350933)">Roomba: bounce and spiral</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(310.214598 210.473011)">in a million living rooms</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #059669" x="355.542067" y="190.085409" transform="rotate(-0 355.542067 190.085409)">2002</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(443.715537 201.350933)">Amazon buys Kiva: shelves</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(452.685912 210.473011)">that walk to the picker</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563eb" x="495.499444" y="190.085409" transform="rotate(-0 495.499444 190.085409)">2012</text>
   </g>
   <g id="text_21">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(574.544008 201.350933)">737 MAX grounded: one sensor,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(573.376696 210.473011)">an automated system, 346 dead</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #dc2626" x="635.456821" y="190.085409" transform="rotate(-0 635.456821 190.085409)">2019</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="355.542067" y="14.798437" transform="rotate(-0 355.542067 14.798437)">A century of machines that sense, decide and act — the triumphs, and the two failures not to skip</text>
   </g>
  </g>
 </g>
