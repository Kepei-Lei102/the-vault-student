   <g id="text_1">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(111.985156 214.679852)">PROGRAMMABLE</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(39.173594 227.143406)">instructions it follows, and that can be changed</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #059669" x="21.15" y="220.209891" transform="rotate(-0 21.15 220.209891)">yes</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(88.205469 145.379852)">ELECTRICAL COMPONENTS</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(66.080117 157.843406)">sensors · microprocessor · actuators</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #059669" x="21.15" y="150.909891" transform="rotate(-0 21.15 150.909891)">yes</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(90.674727 76.079852)">MECHANICAL STRUCTURE</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(37.033125 88.543406)">a framework: arm, chassis, wheels, rotors, joints</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #059669" x="21.15" y="81.609891" transform="rotate(-0 21.15 81.609891)">yes</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(92.169063 28.74468)">a robot: all three layers,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(44.019844 40.747414)">whether it steers itself or a person steers it</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(390.985156 214.679852)">PROGRAMMABLE</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(368.784844 227.143406)">voice commands, updates</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #059669" x="556.83" y="220.209891" transform="rotate(-0 556.83 220.209891)">yes</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(367.205469 145.379852)">ELECTRICAL COMPONENTS</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(320.768281 157.843406)">microphone · microprocessor · but no actuator</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #dc2626" x="556.83" y="150.910242" transform="rotate(-0 556.83 150.910242)">half</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(369.674727 76.079852)">MECHANICAL STRUCTURE</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(331.342227 88.543406)">a case is not a framework; nothing moves</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #dc2626" x="556.83" y="81.609891" transform="rotate(-0 556.83 81.609891)">no</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(349.022188 28.74468)">a smart speaker: programmable,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(307.101094 40.747414)">but no framework and no actuator, so not a robot</text>
   </g>
   <g id="text_15">
    <text style="font-style: italic; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="294.57" y="264.996" transform="rotate(-0 294.57 264.996)">movement is the tell: a robot can act on the physical world; a speaker can only talk to you</text>
   </g>
  </g>
 </g>
