<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13.5px; }
    .sub   { font-size: 12px; }
    .note  { font-size: 11.5px; opacity: 0.8; }
    .gl    { stroke-width: 1.4; fill: none; }
  </style>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="320" y="26" class="title" text-anchor="middle">The Chinese Room</text>

  <!-- the room -->
  <rect x="232" y="74" width="372" height="244" rx="12" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.6"/>
  <text x="592" y="94" class="note" text-anchor="end">the room</text>

  <!-- outside speaker -->
  <circle cx="66" cy="150" r="16" fill="none" stroke="#0891b2" stroke-width="2"/>
  <path d="M 42 188 q 24 -24 48 0" fill="none" stroke="#0891b2" stroke-width="2"/>
  <text x="66" y="216" class="label" text-anchor="middle" fill="#0891b2">Chinese</text>
  <text x="66" y="233" class="label" text-anchor="middle" fill="#0891b2">speaker</text>
  <text x="66" y="262" class="note" text-anchor="middle">sees fluent</text>
  <text x="66" y="277" class="note" text-anchor="middle">Chinese, infers</text>
  <text x="66" y="292" class="note" text-anchor="middle">a mind inside</text>

  <!-- question channel (in, pointing right into the room) -->
  <line x1="104" y1="116" x2="300" y2="116" stroke="#888" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="150" y="104" class="note">question in</text>
  <rect x="128" y="108" width="17" height="17" rx="3" class="gl" stroke="#2563eb"/>
  <path d="M132 113 h9 M132 117 h9 M136 110 v13" class="gl" stroke="#2563eb"/>
  <rect x="152" y="108" width="17" height="17" rx="3" class="gl" stroke="#2563eb"/>
  <path d="M156 116 h9 M160 110 v11 M156 110 l9 9" class="gl" stroke="#2563eb"/>
  <rect x="176" y="108" width="17" height="17" rx="3" class="gl" stroke="#2563eb"/>
  <path d="M180 112 h9 M180 117 h9 M184 117 v4" class="gl" stroke="#2563eb"/>

  <!-- person inside (Searle) -->
  <circle cx="312" cy="158" r="14" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 290 194 q 22 -22 44 0" fill="none" stroke="#dc2626" stroke-width="2"/>
  <text x="312" y="222" class="label" text-anchor="middle" fill="#dc2626">the person</text>
  <text x="312" y="240" class="note" text-anchor="middle">understands</text>
  <text x="312" y="255" class="note" text-anchor="middle">no Chinese</text>

  <!-- look-up arrow to the rule-book -->
  <line x1="346" y1="168" x2="436" y2="168" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ar)"/>
  <text x="391" y="160" class="note" text-anchor="middle">look up</text>

  <!-- rule-book -->
  <rect x="440" y="120" width="132" height="104" rx="6" fill="rgba(124,58,237,0.14)" stroke="#7c3aed" stroke-width="2"/>
  <line x1="454" y1="126" x2="454" y2="218" stroke="#7c3aed" stroke-width="1.4" opacity="0.55"/>
  <text x="506" y="150" class="label" text-anchor="middle" fill="#7c3aed">rule-book</text>
  <text x="506" y="170" class="note" text-anchor="middle">(in English)</text>
  <text x="506" y="190" class="note" text-anchor="middle">match shape,</text>
  <text x="506" y="205" class="note" text-anchor="middle">write shape</text>

  <!-- answer channel (out, pointing left to the speaker) -->
  <line x1="300" y1="288" x2="104" y2="288" stroke="#888" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="170" y="308" class="note" text-anchor="middle">answer out</text>
  <rect x="176" y="280" width="17" height="17" rx="3" class="gl" stroke="#059669"/>
  <path d="M180 284 h9 M184 284 v13 M180 297 h9" class="gl" stroke="#059669"/>
  <rect x="152" y="280" width="17" height="17" rx="3" class="gl" stroke="#059669"/>
  <path d="M156 288 h9 M160 282 v13 M163 285 l-7 7" class="gl" stroke="#059669"/>
  <rect x="128" y="280" width="17" height="17" rx="3" class="gl" stroke="#059669"/>
  <path d="M132 285 h9 M132 292 h9 M136 282 v13" class="gl" stroke="#059669"/>

  <!-- caption -->
  <text x="320" y="350" class="sub" text-anchor="middle">From outside: perfect Chinese.   Inside: shapes shuffled by rule, never understood.</text>
  <text x="320" y="370" class="note" text-anchor="middle">syntax goes in, syntax comes out -- semantics appears nowhere</text>
</svg>
