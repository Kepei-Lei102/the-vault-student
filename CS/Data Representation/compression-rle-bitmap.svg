<svg width="100%" viewBox="0 0 900 370" xmlns="http://www.w3.org/2000/svg">
  <!-- Panel A: the worked 16-pixel row -->
  <text x="60" y="30" fill="#888" font-size="15" font-weight="bold">A. The worked row — 16 pixels</text>

  <!-- pixel squares: 6W 2B 4W 2B 2W -->
  <g stroke="#888" stroke-width="1.5">
    <rect x="60"  y="45" width="34" height="34" fill="none"/>
    <rect x="94"  y="45" width="34" height="34" fill="none"/>
    <rect x="128" y="45" width="34" height="34" fill="none"/>
    <rect x="162" y="45" width="34" height="34" fill="none"/>
    <rect x="196" y="45" width="34" height="34" fill="none"/>
    <rect x="230" y="45" width="34" height="34" fill="none"/>
    <rect x="264" y="45" width="34" height="34" fill="rgba(37,99,235,0.85)"/>
    <rect x="298" y="45" width="34" height="34" fill="rgba(37,99,235,0.85)"/>
    <rect x="332" y="45" width="34" height="34" fill="none"/>
    <rect x="366" y="45" width="34" height="34" fill="none"/>
    <rect x="400" y="45" width="34" height="34" fill="none"/>
    <rect x="434" y="45" width="34" height="34" fill="none"/>
    <rect x="468" y="45" width="34" height="34" fill="rgba(37,99,235,0.85)"/>
    <rect x="502" y="45" width="34" height="34" fill="rgba(37,99,235,0.85)"/>
    <rect x="536" y="45" width="34" height="34" fill="none"/>
    <rect x="570" y="45" width="34" height="34" fill="none"/>
  </g>

  <!-- run braces -->
  <g stroke="#f59e0b" stroke-width="1.5" fill="none">
    <path d="M62 88 v8 h198 v-8"/>
    <path d="M266 88 v8 h64 v-8"/>
    <path d="M334 88 v8 h132 v-8"/>
    <path d="M470 88 v8 h64 v-8"/>
    <path d="M538 88 v8 h64 v-8"/>
  </g>
  <text x="161" y="114" fill="#f59e0b" font-size="14" text-anchor="middle">6 W</text>
  <text x="298" y="114" fill="#f59e0b" font-size="14" text-anchor="middle">2 B</text>
  <text x="400" y="114" fill="#f59e0b" font-size="14" text-anchor="middle">4 W</text>
  <text x="502" y="114" fill="#f59e0b" font-size="14" text-anchor="middle">2 B</text>
  <text x="570" y="114" fill="#f59e0b" font-size="14" text-anchor="middle">2 W</text>

  <text x="60" y="150" fill="#888" font-size="14.5">raw: 16 pixels × 1 bit = <tspan font-weight="bold">16 bits</tspan></text>
  <text x="60" y="175" fill="#888" font-size="14.5">RLE: (6,W)(2,B)(4,W)(2,B)(2,W) = 5 pairs × (4-bit count + 1-bit colour) = <tspan font-weight="bold">25 bits</tspan></text>
  <text x="640" y="175" fill="#dc2626" font-size="14.5" font-weight="bold">bigger!</text>
  <text x="60" y="196" fill="#dc2626" font-size="13">on tiny data the bookkeeping outweighs the savings — RLE can inflate</text>

  <!-- Panel B: the screenshot row -->
  <text x="60" y="245" fill="#888" font-size="15" font-weight="bold">B. RLE's natural prey — one long run</text>
  <rect x="60" y="260" width="780" height="30" fill="none" stroke="#888" stroke-width="1.5"/>
  <text x="450" y="280" fill="#888" font-size="13.5" text-anchor="middle">… a screenshot row: 1920 white pixels …</text>

  <text x="60" y="320" fill="#888" font-size="14.5">raw: <tspan font-weight="bold">1920 bits</tspan></text>
  <text x="230" y="320" fill="#059669" font-size="14.5">RLE: (1920, W) — one pair: <tspan font-weight="bold">12 bits</tspan></text>
  <text x="640" y="320" fill="#059669" font-size="14.5" font-weight="bold">160× smaller</text>
  <text x="60" y="344" fill="#059669" font-size="13">long runs — cartoons, diagrams, screenshots, faxes — are where RLE earns its keep</text>
</svg>
