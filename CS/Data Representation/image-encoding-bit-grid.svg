<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" width="100%">
  <title>Eight bytes drawn as an 8x8 one-bit bitmap: the binary rows on the left are the file, the rendered heart on the right is the picture - the numbers are the picture.</title>
  <text x="390" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">One bit per pixel &#8212; the numbers are the picture</text>
