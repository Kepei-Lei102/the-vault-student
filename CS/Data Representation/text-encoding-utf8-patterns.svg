<svg viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" width="100%">
  <title>Encoding the character ni (U+4F60) in UTF-8: the 16-bit code point is poured into the three-byte pattern 1110xxxx 10xxxxxx 10xxxxxx, giving bytes E4 BD A0. Prefix bits announce the length; payload bits carry the code point.</title>

  <text x="440" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">Encoding &#20320; (U+4F60) &#8212; pour the code point into the 3-byte pattern</text>

  <!-- code point bits -->
  <text x="440" y="60" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">U+4F60 in binary &#8212; sixteen bits of payload:</text>
  <g font-family="monospace" font-size="17" font-weight="bold" fill="#0891b2" text-anchor="middle">
    <text x="290" y="90">0100</text>
    <text x="390" y="90">1111</text><text x="450" y="90">01</text>
    <text x="540" y="90">10</text><text x="600" y="90">0000</text>
  </g>
  <g font-family="sans-serif" font-size="9.5" fill="#888" text-anchor="middle" opacity="0.85">
    <text x="290" y="106">4 bits, into byte 1</text>
    <text x="420" y="106">6 bits, into byte 2</text>
    <text x="570" y="106">6 bits, into byte 3</text>
  </g>

  <!-- three byte frames -->
  <!-- byte 1: 1110 0100 -->
  <rect x="80"  y="140" width="220" height="46" rx="5" fill="none" stroke="#888" stroke-width="1.4"/>
  <rect x="80"  y="140" width="104" height="46" rx="5" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="132" y="169" font-family="monospace" font-size="17" font-weight="bold" fill="#888" text-anchor="middle">1110</text>
  <text x="242" y="169" font-family="monospace" font-size="17" font-weight="bold" fill="#0891b2" text-anchor="middle">0100</text>

  <!-- byte 2: 10 111101 -->
  <rect x="330" y="140" width="220" height="46" rx="5" fill="none" stroke="#888" stroke-width="1.4"/>
  <rect x="330" y="140" width="56"  height="46" rx="5" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="358" y="169" font-family="monospace" font-size="17" font-weight="bold" fill="#888" text-anchor="middle">10</text>
  <text x="468" y="169" font-family="monospace" font-size="17" font-weight="bold" fill="#0891b2" text-anchor="middle">111101</text>

  <!-- byte 3: 10 100000 -->
  <rect x="580" y="140" width="220" height="46" rx="5" fill="none" stroke="#888" stroke-width="1.4"/>
  <rect x="580" y="140" width="56"  height="46" rx="5" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="608" y="169" font-family="monospace" font-size="17" font-weight="bold" fill="#888" text-anchor="middle">10</text>
  <text x="718" y="169" font-family="monospace" font-size="17" font-weight="bold" fill="#0891b2" text-anchor="middle">100000</text>

  <!-- hex under each byte -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#888" text-anchor="middle">
    <text x="190" y="216">= E4</text>
    <text x="440" y="216">= BD</text>
    <text x="690" y="216">= A0</text>
  </g>

  <!-- legend -->
  <rect x="180" y="248" width="13" height="13" rx="2" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="199" y="259" font-family="sans-serif" font-size="11" fill="#888">prefix bits &#8212; announce &#8220;3-byte character&#8221; / &#8220;continuation&#8221;</text>
  <rect x="530" y="248" width="13" height="13" rx="2" fill="#0891b2" fill-opacity="0.14" stroke="#0891b2" stroke-width="1.4"/>
  <text x="549" y="259" font-family="sans-serif" font-size="11" fill="#888">payload bits &#8212; the code point itself</text>

  <text x="440" y="296" font-family="sans-serif" font-size="13" font-weight="bold" fill="#888" text-anchor="middle">&#20320; = E4 BD A0 &#8212; and any decoder landing mid-file knows a &#8220;10&#8221; byte is never a start</text>
</svg>
