<text x="320" y="288" text-anchor="middle" class="verdict" fill="#dc2626">carry IN (1) ≠ carry OUT (0)  →  OVERFLOW</text>
<text x="320" y="306" text-anchor="middle" class="note">result reads −128; the true answer +128 needs a 9th bit the byte hasn’t got</text>
<text x="320" y="324" text-anchor="middle" class="foot" fill="#059669">compare 64 + 1: carry in = carry out = 0  →  no overflow</text>
