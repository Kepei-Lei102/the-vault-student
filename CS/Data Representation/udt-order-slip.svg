<svg width="100%" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg">
  <!-- the slip -->
  <rect x="60" y="30" width="300" height="340" rx="10" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.5"/>
  <text x="210" y="62" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">BUBBLE TEA — ORDER SLIP</text>
  <line x1="84" y1="76" x2="336" y2="76" stroke="#888" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- pickup number -->
  <rect x="84" y="92" width="252" height="40" rx="6" fill="rgba(220,38,38,0.10)" stroke="#dc2626" stroke-width="1.3"/>
  <text x="98" y="117" font-size="14" fill="#888">pickup number:</text>
  <text x="300" y="117" text-anchor="end" font-size="15" fill="#888" font-weight="bold">No. 47</text>

  <!-- drink field -->
  <text x="98" y="164" font-size="14" fill="#888">drink:</text>
  <text x="322" y="164" text-anchor="end" font-size="14" fill="#888">jasmine milk tea</text>

  <!-- size field -->
  <text x="98" y="194" font-size="14" fill="#888">size:</text>
  <text x="322" y="194" text-anchor="end" font-size="14" fill="#888">large</text>

  <!-- sweetness -->
  <rect x="84" y="212" width="252" height="40" rx="6" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-width="1.3"/>
  <text x="98" y="237" font-size="14" fill="#888">sweetness:</text>
  <text x="322" y="237" text-anchor="end" font-size="13" fill="#888">50%  (of 30·50·70·100)</text>

  <!-- toppings -->
  <rect x="84" y="264" width="252" height="60" rx="6" fill="rgba(245,158,11,0.10)" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="98" y="288" font-size="14" fill="#888">toppings:</text>
  <text x="322" y="288" text-anchor="end" font-size="13.5" fill="#888">pearls [x]  coconut [x]</text>
  <text x="322" y="310" text-anchor="end" font-size="13.5" fill="#888">pudding [ ]  aloe [ ]</text>

  <text x="210" y="352" text-anchor="middle" font-size="12" fill="#888">…one slip, one identifier, many fields…</text>

  <!-- annotations, right side -->
  <text x="420" y="55" font-size="14.5" fill="#888" font-weight="bold">The whole slip is a RECORD</text>
  <text x="420" y="75" font-size="12.5" fill="#888">different types grouped under one identifier —</text>
  <text x="420" y="92" font-size="12.5" fill="#888">the composite type you design per problem</text>
  <line x1="366" y1="66" x2="360" y2="66" stroke="#888" stroke-width="1.2"/>

  <text x="420" y="128" font-size="14.5" fill="#888" font-weight="bold">The pickup number is a POINTER</text>
  <text x="420" y="148" font-size="12.5" fill="#888">not the drink — a reference that says where</text>
  <text x="420" y="165" font-size="12.5" fill="#888">the real thing is; hand it over, get the order</text>
  <line x1="340" y1="112" x2="412" y2="123" stroke="#dc2626" stroke-width="1.2"/>

  <text x="420" y="232" font-size="14.5" fill="#888" font-weight="bold">Sweetness is ENUMERATED</text>
  <text x="420" y="252" font-size="12.5" fill="#888">a fixed, ordered menu of named values —</text>
  <text x="420" y="269" font-size="12.5" fill="#888">exactly one box ticked, nothing off-menu</text>
  <line x1="340" y1="232" x2="412" y2="228" stroke="#059669" stroke-width="1.2"/>

  <text x="420" y="308" font-size="14.5" fill="#888" font-weight="bold">Toppings are a SET</text>
  <text x="420" y="328" font-size="12.5" fill="#888">tick any subset — no duplicates possible,</text>
  <text x="420" y="345" font-size="12.5" fill="#888">and pearls-then-coconut = coconut-then-pearls</text>
  <line x1="340" y1="294" x2="412" y2="304" stroke="#f59e0b" stroke-width="1.2"/>
</svg>
