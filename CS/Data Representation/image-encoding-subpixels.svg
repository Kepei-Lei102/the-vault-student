<svg viewBox="0 0 880 310" xmlns="http://www.w3.org/2000/svg" width="100%">
  <title>A white pixel magnified into its three physical subpixel strips (red, green, blue), and how subpixel text rendering lets a letter edge land on a third of a pixel instead of a whole pixel.</title>
  <text x="440" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">A pixel is three lamps &#8212; and text rendering spends them in thirds</text>
  <text x="122" y="60" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">one &#8220;white&#8221; pixel</text>
  <rect x="90" y="72" width="64" height="64" fill="#888" fill-opacity="0.08" stroke="#888" stroke-width="1.4"/>
  <line x1="154" y1="72" x2="238" y2="52" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="154" y1="136" x2="238" y2="208" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <rect x="240" y="52" width="42" height="156" fill="#dc2626" fill-opacity="0.8"/>
  <rect x="288" y="52" width="42" height="156" fill="#059669" fill-opacity="0.8"/>
  <rect x="336" y="52" width="42" height="156" fill="#2563eb" fill-opacity="0.8"/>
  <text x="261" y="228" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" text-anchor="middle">R</text>
  <text x="309" y="228" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" text-anchor="middle">G</text>
  <text x="357" y="228" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" text-anchor="middle">B</text>
  <text x="200" y="262" font-family="sans-serif" font-size="11.5" fill="#888">all three lit = white, from far enough away</text>
  <text x="200" y="280" font-family="sans-serif" font-size="11" fill="#888" opacity="0.85">(a water droplet on a screen is a lens &#8212; try it)</text>
  <text x="656" y="66" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" text-anchor="middle">where can a letter&#8217;s edge land?</text>
  <text x="548" y="103" font-family="sans-serif" font-size="11" fill="#888" text-anchor="end">whole pixels:</text>
  <rect x="560" y="82" width="16" height="36" fill="#dc2626" fill-opacity="0.8"/>
  <rect x="576" y="82" width="16" height="36" fill="#059669" fill-opacity="0.8"/>
  <rect x="592" y="82" width="16" height="36" fill="#2563eb" fill-opacity="0.8"/>
  <rect x="608" y="82" width="16" height="36" fill="#dc2626" fill-opacity="0.8"/>
  <rect x="624" y="82" width="16" height="36" fill="#059669" fill-opacity="0.8"/>
  <rect x="640" y="82" width="16" height="36" fill="#2563eb" fill-opacity="0.8"/>
  <rect x="656" y="82" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <rect x="672" y="82" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <rect x="688" y="82" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <rect x="704" y="82" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <rect x="720" y="82" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <rect x="736" y="82" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <line x1="560" y1="79" x2="560" y2="121" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="608" y1="79" x2="608" y2="121" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="656" y1="79" x2="656" y2="121" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="704" y1="79" x2="704" y2="121" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="752" y1="79" x2="752" y2="121" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="656" y1="72" x2="656" y2="128" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="664" y="136" font-family="sans-serif" font-size="10.5" fill="#f59e0b">edge at 2</text>
  <text x="548" y="193" font-family="sans-serif" font-size="11" fill="#888" text-anchor="end">subpixel rendering:</text>
  <rect x="560" y="172" width="16" height="36" fill="#dc2626" fill-opacity="0.8"/>
  <rect x="576" y="172" width="16" height="36" fill="#059669" fill-opacity="0.8"/>
  <rect x="592" y="172" width="16" height="36" fill="#2563eb" fill-opacity="0.8"/>
  <rect x="608" y="172" width="16" height="36" fill="#dc2626" fill-opacity="0.8"/>
  <rect x="624" y="172" width="16" height="36" fill="#059669" fill-opacity="0.8"/>
  <rect x="640" y="172" width="16" height="36" fill="#2563eb" fill-opacity="0.8"/>
  <rect x="656" y="172" width="16" height="36" fill="#dc2626" fill-opacity="0.8"/>
  <rect x="672" y="172" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <rect x="688" y="172" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <rect x="704" y="172" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <rect x="720" y="172" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <rect x="736" y="172" width="16" height="36" fill="#888" fill-opacity="0.07" stroke="#888" stroke-opacity="0.25" stroke-width="0.6"/>
  <line x1="560" y1="169" x2="560" y2="211" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="608" y1="169" x2="608" y2="211" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="656" y1="169" x2="656" y2="211" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="704" y1="169" x2="704" y2="211" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="752" y1="169" x2="752" y2="211" stroke="#888" stroke-opacity="0.5" stroke-width="1"/>
  <line x1="672" y1="162" x2="672" y2="218" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="680" y="226" font-family="sans-serif" font-size="10.5" fill="#f59e0b">edge at 2 + 1/3 &#8212; 3&#215; finer</text>
  <text x="440" y="300" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">the image&#8217;s atom is the pixel; the screen&#8217;s atoms are the strips &#8212; renderers that know the panel&#8217;s layout borrow the thirds</text>
</svg>
