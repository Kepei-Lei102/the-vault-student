<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" width="100%">
  <title>The same circle stored two ways: as a bitmap (a grid of pixel samples with a stair-stepped edge that only stretches when zoomed) and as a vector (a one-line recipe that re-renders perfectly at any size).</title>
  <text x="215" y="34" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">BITMAP &#8212; stores the pixels</text>
  <text x="645" y="34" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">VECTOR &#8212; stores the recipe</text>
  <rect x="119" y="56" width="192" height="192" fill="none" stroke="#888" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="167" y="72" width="96" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <rect x="151" y="88" width="128" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <rect x="135" y="104" width="160" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <rect x="135" y="120" width="160" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <rect x="135" y="136" width="160" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <rect x="135" y="152" width="160" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <rect x="135" y="168" width="160" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <rect x="135" y="184" width="160" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <rect x="151" y="200" width="128" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <rect x="167" y="216" width="96" height="16" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-opacity="0.7" stroke-width="0.8"/>
  <line x1="430" y1="50" x2="430" y2="310" stroke="#888" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="645" cy="152" r="96" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <text x="645" y="282" font-family="monospace" font-size="13" fill="#888" text-anchor="middle">&#60;circle cx="60" cy="60" r="45" fill="none"/&#62;</text>
  <text x="215" y="282" font-family="sans-serif" font-size="11.5" fill="#888" text-anchor="middle">zoomed: the squares just get bigger</text>
  <text x="215" y="306" font-family="sans-serif" font-size="11.5" fill="#888" text-anchor="middle" opacity="0.85">1080 &#215; 1080 at 24-bit &#8776; 3.3 MB &#8212; edges still stepped</text>
  <text x="645" y="306" font-family="sans-serif" font-size="11.5" fill="#888" text-anchor="middle" opacity="0.85">as a recipe: ~50 bytes &#8212; perfect at every zoom</text>
  <text x="430" y="345" font-family="sans-serif" font-size="12" font-weight="bold" fill="#888" text-anchor="middle">a photograph has no recipe &#8212; a logo is nothing but recipe</text>
</svg>
