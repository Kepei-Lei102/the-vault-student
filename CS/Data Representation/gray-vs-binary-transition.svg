<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 700; }
    .pan   { font-size: 14px; font-weight: 700; }
    .bit   { font-size: 18px; font-weight: 800; }
    .lab   { font-size: 13px; font-weight: 700; }
    .bad   { font-size: 12px; font-weight: 700; fill: #dc2626; }
    .good  { font-size: 12px; font-weight: 700; fill: #059669; }
  </style>

  <text x="350" y="30" class="title" text-anchor="middle">The dangerous step: counting 3 -&gt; 4</text>

  <!-- divider -->
  <line x1="350" y1="55" x2="350" y2="315" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- ================= BINARY (left) ================= -->
  <text x="175" y="78" class="pan" text-anchor="middle">Binary</text>
  <text x="60" y="120" class="lab" text-anchor="middle">3</text>
  <text x="60" y="212" class="lab" text-anchor="middle">4</text>

  <!-- 3 = 011 -->
  <rect x="92"  y="96" width="40" height="40" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="112" y="123" class="bit" text-anchor="middle">0</text>
  <rect x="140" y="96" width="40" height="40" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="160" y="123" class="bit" text-anchor="middle">1</text>
  <rect x="188" y="96" width="40" height="40" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="208" y="123" class="bit" text-anchor="middle">1</text>

  <!-- 4 = 100 (all boxes changed -> red) -->
  <rect x="92"  y="188" width="40" height="40" rx="6" fill="rgba(220,38,38,0.12)" stroke="#dc2626" stroke-width="1.8"/>
  <text x="112" y="215" class="bit" text-anchor="middle">1</text>
  <rect x="140" y="188" width="40" height="40" rx="6" fill="rgba(220,38,38,0.12)" stroke="#dc2626" stroke-width="1.8"/>
  <text x="160" y="215" class="bit" text-anchor="middle">0</text>
  <rect x="188" y="188" width="40" height="40" rx="6" fill="rgba(220,38,38,0.12)" stroke="#dc2626" stroke-width="1.8"/>
  <text x="208" y="215" class="bit" text-anchor="middle">0</text>

  <!-- three red flip arrows -->
  <path d="M112 140 L112 184 M108 178 L112 184 L116 178" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <path d="M160 140 L160 184 M156 178 L160 184 L164 178" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <path d="M208 140 L208 184 M204 178 L208 184 L212 178" fill="none" stroke="#dc2626" stroke-width="1.8"/>

  <text x="160" y="262" class="bad" text-anchor="middle">all 3 bits flip at once</text>
  <text x="160" y="282" class="bad" text-anchor="middle">a mid-read can show any of 0..7</text>

  <!-- ================= GRAY (right) ================= -->
  <text x="525" y="78" class="pan" text-anchor="middle">Gray</text>
  <text x="410" y="120" class="lab" text-anchor="middle">3</text>
  <text x="410" y="212" class="lab" text-anchor="middle">4</text>

  <!-- 3 = 010 -->
  <rect x="442" y="96" width="40" height="40" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="462" y="123" class="bit" text-anchor="middle">0</text>
  <rect x="490" y="96" width="40" height="40" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="510" y="123" class="bit" text-anchor="middle">1</text>
  <rect x="538" y="96" width="40" height="40" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="558" y="123" class="bit" text-anchor="middle">0</text>

  <!-- 4 = 110 (only leftmost changed -> green; others grey/stable) -->
  <rect x="442" y="188" width="40" height="40" rx="6" fill="rgba(5,150,105,0.14)" stroke="#059669" stroke-width="1.8"/>
  <text x="462" y="215" class="bit" text-anchor="middle">1</text>
  <rect x="490" y="188" width="40" height="40" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="510" y="215" class="bit" text-anchor="middle">1</text>
  <rect x="538" y="188" width="40" height="40" rx="6" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="558" y="215" class="bit" text-anchor="middle">0</text>

  <!-- one green flip arrow + two grey stable arrows -->
  <path d="M462 140 L462 184 M458 178 L462 184 L466 178" fill="none" stroke="#059669" stroke-width="2"/>
  <line x1="510" y1="140" x2="510" y2="184" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="558" y1="140" x2="558" y2="184" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="3 3"/>

  <text x="510" y="262" class="good" text-anchor="middle">only 1 bit flips</text>
  <text x="510" y="282" class="good" text-anchor="middle">a mid-read is only ever 3 or 4</text>
</svg>
