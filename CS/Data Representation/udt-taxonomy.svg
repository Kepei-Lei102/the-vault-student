<svg width="100%" viewBox="0 0 760 375" xmlns="http://www.w3.org/2000/svg">
  <!-- root -->
  <rect x="290" y="16" width="180" height="40" rx="8" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="380" y="41" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">Data types</text>

  <!-- level 1 -->
  <rect x="80" y="96" width="200" height="40" rx="8" fill="rgba(8,145,178,0.12)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="180" y="121" text-anchor="middle" font-size="14" fill="#888">built-in (the six)</text>

  <rect x="440" y="96" width="240" height="40" rx="8" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="560" y="121" text-anchor="middle" font-size="14" fill="#888">user-defined</text>

  <line x1="380" y1="56" x2="180" y2="96" stroke="#888" stroke-width="1.2"/>
  <line x1="380" y1="56" x2="560" y2="96" stroke="#888" stroke-width="1.2"/>

  <!-- built-in list -->
  <text x="180" y="160" text-anchor="middle" font-size="12" fill="#888">INTEGER · REAL · CHAR</text>
  <text x="180" y="178" text-anchor="middle" font-size="12" fill="#888">STRING · BOOLEAN · DATE</text>

  <!-- level 2 -->
  <rect x="330" y="196" width="190" height="56" rx="8" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.5"/>
  <text x="425" y="218" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">non-composite</text>
  <text x="425" y="238" text-anchor="middle" font-size="11.5" fill="#888">defined without referencing</text>

  <rect x="560" y="196" width="190" height="56" rx="8" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="655" y="218" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">composite</text>
  <text x="655" y="238" text-anchor="middle" font-size="11.5" fill="#888">built out of other types</text>

  <line x1="560" y1="136" x2="425" y2="196" stroke="#888" stroke-width="1.2"/>
  <line x1="560" y1="136" x2="655" y2="196" stroke="#888" stroke-width="1.2"/>

  <!-- leaves -->
  <rect x="306" y="284" width="110" height="34" rx="6" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-width="1.2"/>
  <text x="361" y="306" text-anchor="middle" font-size="13" fill="#888">enumerated</text>

  <rect x="432" y="284" width="90" height="34" rx="6" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-width="1.2"/>
  <text x="477" y="306" text-anchor="middle" font-size="13" fill="#888">pointer</text>

  <rect x="548" y="284" width="60" height="34" rx="6" fill="rgba(245,158,11,0.10)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="578" y="306" text-anchor="middle" font-size="13" fill="#888">set</text>

  <rect x="620" y="284" width="72" height="34" rx="6" fill="rgba(245,158,11,0.10)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="656" y="306" text-anchor="middle" font-size="13" fill="#888">record</text>

  <rect x="704" y="284" width="52" height="34" rx="6" fill="rgba(245,158,11,0.10)" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="730" y="306" text-anchor="middle" font-size="13" fill="#888">class</text>

  <line x1="425" y1="252" x2="361" y2="284" stroke="#888" stroke-width="1"/>
  <line x1="425" y1="252" x2="477" y2="284" stroke="#888" stroke-width="1"/>
  <line x1="655" y1="252" x2="578" y2="284" stroke="#888" stroke-width="1"/>
  <line x1="655" y1="252" x2="656" y2="284" stroke="#888" stroke-width="1"/>
  <line x1="655" y1="252" x2="730" y2="284" stroke="#888" stroke-width="1"/>

  <text x="560" y="342" text-anchor="middle" font-size="11.5" fill="#888">(the ADTs — stack, queue, linked list, dictionary,</text>
  <text x="560" y="358" text-anchor="middle" font-size="11.5" fill="#888">binary tree — count as composite types too)</text>
</svg>
