<svg width="100%" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg">
  <!-- the universe: every data type -->
  <rect x="14" y="14" width="732" height="392" rx="12" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="30" y="38" font-size="13" fill="#888" font-weight="bold">all data types</text>

  <!-- left circle: user-defined -->
  <circle cx="310" cy="200" r="125" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.8"/>
  <!-- right circle: composite -->
  <circle cx="450" cy="200" r="125" fill="rgba(245,158,11,0.14)" stroke="#f59e0b" stroke-width="1.8"/>

  <!-- circle labels, inside the tops -->
  <text x="255" y="110" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">user-defined</text>
  <text x="255" y="127" text-anchor="middle" font-size="11" fill="#888">you add it to the menu</text>
  <text x="505" y="110" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">composite</text>
  <text x="505" y="127" text-anchor="middle" font-size="11" fill="#888">built out of other types</text>

  <!-- region: user-defined only (non-composite) -->
  <text x="252" y="200" text-anchor="middle" font-size="14" fill="#888">enumerated</text>
  <text x="252" y="222" text-anchor="middle" font-size="14" fill="#888">pointer</text>
  <text x="252" y="250" text-anchor="middle" font-size="10.5" fill="#888">user-defined,</text>
  <text x="252" y="264" text-anchor="middle" font-size="10.5" fill="#888">non-composite</text>

  <!-- region: overlap -->
  <text x="380" y="178" text-anchor="middle" font-size="14" fill="#888">record</text>
  <text x="380" y="200" text-anchor="middle" font-size="14" fill="#888">set</text>
  <text x="380" y="222" text-anchor="middle" font-size="14" fill="#888">class / object</text>
  <text x="380" y="250" text-anchor="middle" font-size="10" fill="#888">and the ADTs: stack,</text>
  <text x="380" y="263" text-anchor="middle" font-size="10" fill="#888">queue, linked list,</text>
  <text x="380" y="276" text-anchor="middle" font-size="10" fill="#888">dictionary, tree</text>

  <!-- region: composite only (built-in composite) -->
  <text x="512" y="205" text-anchor="middle" font-size="14" fill="#888">ARRAY</text>
  <text x="512" y="232" text-anchor="middle" font-size="10.5" fill="#888">built-in, yet built</text>
  <text x="512" y="246" text-anchor="middle" font-size="10.5" fill="#888">out of another type</text>

  <!-- region: outside both = primitive -->
  <text x="30" y="356" font-size="12.5" fill="#888" font-weight="bold">primitive (built-in, non-composite)</text>
  <text x="30" y="376" font-size="12.5" fill="#888">INTEGER  REAL  CHAR  STRING  BOOLEAN  DATE</text>

  <text x="730" y="356" text-anchor="end" font-size="11" fill="#888">non-composite = everything outside the amber circle,</text>
  <text x="730" y="372" text-anchor="end" font-size="11" fill="#888">primitive or user-defined (a mark point, June 2024)</text>

  <!-- caption -->
  <text x="380" y="428" text-anchor="middle" font-size="11.5" fill="#888">Two independent questions: who defined it, and is it built from other types</text>
</svg>
