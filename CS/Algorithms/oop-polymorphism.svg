<svg width="100%" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <rect x="40" y="110" width="250" height="80" rx="8" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="165" y="140" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">for a in animals:</text>
  <text x="165" y="166" text-anchor="middle" font-size="14" fill="#888">print(a.description())</text>
  <text x="165" y="215" text-anchor="middle" font-size="11.5" fill="#888">one line of code, written once —</text>
  <text x="165" y="231" text-anchor="middle" font-size="11.5" fill="#888">it never asks which kind of animal</text>

  <line x1="290" y1="150" x2="470" y2="60" stroke="#059669" stroke-width="1.6"/>
  <line x1="290" y1="150" x2="470" y2="150" stroke="#059669" stroke-width="1.6"/>
  <line x1="290" y1="150" x2="470" y2="240" stroke="#059669" stroke-width="1.6"/>
  <text x="380" y="92" text-anchor="middle" font-size="11" fill="#888">the object decides</text>

  <rect x="470" y="35" width="260" height="50" rx="6" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.3"/>
  <text x="600" y="55" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold">Parrot.description()</text>
  <text x="600" y="73" text-anchor="middle" font-size="11" fill="#888">"… can say 31 words."</text>

  <rect x="470" y="125" width="260" height="50" rx="6" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.3"/>
  <text x="600" y="145" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold">Wolf.description()</text>
  <text x="600" y="163" text-anchor="middle" font-size="11" fill="#888">"… territory of 80 square miles."</text>

  <rect x="470" y="215" width="260" height="50" rx="6" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.3"/>
  <text x="600" y="235" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold">Animal.description()</text>
  <text x="600" y="253" text-anchor="middle" font-size="11" fill="#888">"… intelligence level is 6"</text>
</svg>
