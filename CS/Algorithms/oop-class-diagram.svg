<svg width="100%" viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Animal -->
  <rect x="270" y="20" width="240" height="118" rx="6" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="390" y="42" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">Animal</text>
  <line x1="270" y1="50" x2="510" y2="50" stroke="#2563eb" stroke-width="1"/>
  <text x="282" y="68" font-size="11.5" fill="#888">name : str</text><text x="400" y="68" font-size="11.5" fill="#888">sound : str</text>
  <text x="282" y="84" font-size="11.5" fill="#888">size : int</text><text x="400" y="84" font-size="11.5" fill="#888">intelligence : int</text>
  <line x1="270" y1="92" x2="510" y2="92" stroke="#2563eb" stroke-width="1"/>
  <text x="282" y="110" font-size="11.5" fill="#888">__init__(name, sound, size, intelligence)</text>
  <text x="282" y="126" font-size="11.5" fill="#888">description() : str</text>

  <!-- inheritance arrows (hollow triangle) -->
  <line x1="200" y1="230" x2="360" y2="150" stroke="#888" stroke-width="1.4"/>
  <line x1="580" y1="230" x2="420" y2="150" stroke="#888" stroke-width="1.4"/>
  <polygon points="390,138 378,156 402,156" fill="none" stroke="#888" stroke-width="1.4"/>
  <text x="390" y="176" text-anchor="middle" font-size="11" fill="#888">is-a  (inheritance)</text>

  <!-- Parrot -->
  <rect x="60" y="230" width="270" height="118" rx="6" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-width="1.5"/>
  <text x="195" y="252" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">Parrot</text>
  <line x1="60" y1="260" x2="330" y2="260" stroke="#059669" stroke-width="1"/>
  <text x="72" y="278" font-size="11.5" fill="#888">wing_span : int</text><text x="200" y="278" font-size="11.5" fill="#888">number_words : int</text>
  <line x1="60" y1="288" x2="330" y2="288" stroke="#059669" stroke-width="1"/>
  <text x="72" y="306" font-size="11.5" fill="#888">__init__(…, wing_span, number_words)</text>
  <text x="72" y="322" font-size="11.5" fill="#888">change_number_words(n)</text>
  <text x="72" y="338" font-size="11.5" fill="#888">description() : str   (overrides)</text>

  <!-- Wolf -->
  <rect x="450" y="230" width="270" height="118" rx="6" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-width="1.5"/>
  <text x="585" y="252" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">Wolf</text>
  <line x1="450" y1="260" x2="720" y2="260" stroke="#059669" stroke-width="1"/>
  <text x="462" y="278" font-size="11.5" fill="#888">territory_size : int</text>
  <line x1="450" y1="288" x2="720" y2="288" stroke="#059669" stroke-width="1"/>
  <text x="462" y="306" font-size="11.5" fill="#888">__init__(…, territory_size)</text>
  <text x="462" y="322" font-size="11.5" fill="#888">set_territory_size(n)</text>
  <text x="462" y="338" font-size="11.5" fill="#888">description() : str   (overrides)</text>

  <!-- has-a: Station ◇— Train -->
  <rect x="60" y="380" width="200" height="32" rx="6" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="401" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">Station</text>
  <rect x="520" y="380" width="200" height="32" rx="6" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="620" y="401" text-anchor="middle" font-size="13" fill="#888" font-weight="bold">Train</text>
  <line x1="280" y1="396" x2="520" y2="396" stroke="#888" stroke-width="1.4"/>
  <polygon points="260,396 272,389 284,396 272,403" fill="none" stroke="#888" stroke-width="1.4"/>
  <text x="400" y="390" text-anchor="middle" font-size="11" fill="#888">has-a  (containment / aggregation)</text>
  <text x="400" y="410" text-anchor="middle" font-size="11" fill="#888">trains : list of Train, at most number_platforms</text>
</svg>
