<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .lst { font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .srt { font-size: 13px; font-weight: 600; letter-spacing: 1px; fill: #059669; }
    .leaf { font-size: 13px; font-weight: 600; }
    .lbl { font-size: 12px; }
    .legend { font-size: 12px; }
  </style>

  <!-- connectors (grey): parent bottom -> child top -->
  <g stroke="#888" stroke-width="1.2" opacity="0.5">
    <line x1="380" y1="70" x2="180" y2="120"/>
    <line x1="380" y1="70" x2="560" y2="120"/>
    <line x1="180" y1="166" x2="110" y2="218"/>
    <line x1="180" y1="166" x2="250" y2="218"/>
    <line x1="560" y1="166" x2="470" y2="218"/>
    <line x1="560" y1="166" x2="620" y2="218"/>
    <line x1="620" y1="264" x2="585" y2="302"/>
    <line x1="620" y1="264" x2="665" y2="302"/>
  </g>

  <!-- ROOT [5 1 4 2 8] / (1 2 4 5 8) -->
  <rect x="320" y="26" width="120" height="44" rx="6" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.3"/>
  <text x="380" y="44" text-anchor="middle" class="lst">5 1 4 2 8</text>
  <text x="380" y="62" text-anchor="middle" class="srt">1 2 4 5 8</text>

  <!-- LEVEL 1 -->
  <rect x="145" y="122" width="70" height="44" rx="6" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.3"/>
  <text x="180" y="140" text-anchor="middle" class="lst">5 1</text>
  <text x="180" y="158" text-anchor="middle" class="srt">1 5</text>

  <rect x="514" y="122" width="92" height="44" rx="6" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.3"/>
  <text x="560" y="140" text-anchor="middle" class="lst">4 2 8</text>
  <text x="560" y="158" text-anchor="middle" class="srt">2 4 8</text>

  <!-- LEVEL 2 -->
  <rect x="93" y="218" width="34" height="28" rx="6" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.3"/>
  <text x="110" y="237" text-anchor="middle" class="leaf">5</text>

  <rect x="233" y="218" width="34" height="28" rx="6" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.3"/>
  <text x="250" y="237" text-anchor="middle" class="leaf">1</text>

  <rect x="453" y="218" width="34" height="28" rx="6" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.3"/>
  <text x="470" y="237" text-anchor="middle" class="leaf">4</text>

  <rect x="585" y="218" width="70" height="44" rx="6" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.3"/>
  <text x="620" y="236" text-anchor="middle" class="lst">2 8</text>
  <text x="620" y="254" text-anchor="middle" class="srt">2 8</text>

  <!-- LEVEL 3 -->
  <rect x="568" y="302" width="34" height="28" rx="6" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.3"/>
  <text x="585" y="321" text-anchor="middle" class="leaf">2</text>

  <rect x="648" y="302" width="34" height="28" rx="6" fill="rgba(136,136,136,0.06)" stroke="#888" stroke-width="1.3"/>
  <text x="665" y="321" text-anchor="middle" class="leaf">8</text>

  <!-- phase labels -->
  <text x="20" y="100" class="lbl">divide ▼</text>
  <text x="20" y="120" class="lbl" fill="#059669">merge ▲</text>

  <!-- legend -->
  <text x="380" y="364" text-anchor="middle" class="legend">grey top line = sublist being split (read downward); green line = sorted result merged back up.</text>
  <text x="380" y="382" text-anchor="middle" class="legend">A single element is already sorted — so the leaves need no work; all the sorting happens in the merges.</text>
</svg>
