<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 330" font-family="Helvetica, Arial, sans-serif">
  <!-- Three file organisations: serial (arrival order), sequential (key order), random (hashed slot) -->
  <defs>
    <marker id="fp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="fp-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- ===== SERIAL ===== -->
  <text x="150" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#888">SERIAL</text>
  <text x="150" y="44" text-anchor="middle" font-size="11" fill="#888">records in arrival order</text>
  <g stroke="#2563eb" stroke-width="1.5" fill="rgba(37,99,235,0.12)">
    <rect x="40" y="60" width="220" height="26"/>
    <rect x="40" y="86" width="220" height="26"/>
    <rect x="40" y="112" width="220" height="26"/>
    <rect x="40" y="138" width="220" height="26"/>
    <rect x="40" y="164" width="220" height="26"/>
    <rect x="40" y="190" width="220" height="26" stroke-dasharray="4 3" fill="none"/>
  </g>
  <g font-size="12" fill="#888">
    <text x="50" y="78">4471  Grace</text>
    <text x="50" y="104">1030  Ada</text>
    <text x="50" y="130">8812  Linus</text>
    <text x="50" y="156">2207  Guido</text>
    <text x="50" y="182">6153  Ken</text>
    <text x="50" y="208" font-style="italic">next arrival appends here</text>
  </g>
  <!-- scan arrow -->
  <line x1="24" y1="66" x2="24" y2="184" stroke="#dc2626" stroke-width="2" marker-end="url(#fp-arrow)"/>
  <text x="150" y="246" text-anchor="middle" font-size="11" fill="#888">write: append, O(1)</text>
  <text x="150" y="262" text-anchor="middle" font-size="11" fill="#888">find one: scan from the top, O(n)</text>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#888">a missing key costs the whole file</text>
  <text x="150" y="300" text-anchor="middle" font-size="11" fill="#dc2626">log files, transaction files, backups</text>

  <!-- ===== SEQUENTIAL ===== -->
  <text x="450" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#888">SEQUENTIAL</text>
  <text x="450" y="44" text-anchor="middle" font-size="11" fill="#888">records in key order</text>
  <g stroke="#7c3aed" stroke-width="1.5" fill="rgba(124,58,237,0.12)">
    <rect x="340" y="60" width="220" height="26"/>
    <rect x="340" y="86" width="220" height="26"/>
    <rect x="340" y="112" width="220" height="26"/>
    <rect x="340" y="138" width="220" height="26"/>
    <rect x="340" y="164" width="220" height="26"/>
  </g>
  <g font-size="12" fill="#888">
    <text x="350" y="78">1030  Ada</text>
    <text x="350" y="104">2207  Guido</text>
    <text x="350" y="130">4471  Grace</text>
    <text x="350" y="156">6153  Ken</text>
    <text x="350" y="182">8812  Linus</text>
  </g>
  <!-- scan that stops early -->
  <line x1="324" y1="66" x2="324" y2="128" stroke="#dc2626" stroke-width="2" marker-end="url(#fp-arrow)"/>
  <text x="324" y="146" text-anchor="middle" font-size="10" fill="#dc2626">stop</text>
  <!-- insert needs a rewrite -->
  <path d="M566,96 q30,0 30,40" stroke="#f59e0b" stroke-width="1.5" fill="none" marker-end="url(#fp-arrow)"/>
  <text x="570" y="92" font-size="10" fill="#f59e0b">insert 3000?</text>
  <text x="570" y="104" font-size="10" fill="#f59e0b">rewrite the file</text>
  <text x="450" y="246" text-anchor="middle" font-size="11" fill="#888">write: merge with a sorted transaction file</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#888">find one: scan, but stop once the keys pass it</text>
  <text x="450" y="278" text-anchor="middle" font-size="11" fill="#888">batch jobs over every record fly</text>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#7c3aed">payroll master files, sorted exports</text>

  <!-- ===== RANDOM ===== -->
  <text x="750" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#888">RANDOM (direct)</text>
  <text x="750" y="44" text-anchor="middle" font-size="11" fill="#888">slot computed from the key</text>
  <g stroke="#059669" stroke-width="1.5" fill="rgba(5,150,105,0.12)">
    <rect x="660" y="60" width="180" height="22"/>
    <rect x="660" y="82" width="180" height="22"/>
    <rect x="660" y="104" width="180" height="22"/>
    <rect x="660" y="126" width="180" height="22"/>
    <rect x="660" y="148" width="180" height="22"/>
    <rect x="660" y="170" width="180" height="22"/>
    <rect x="660" y="192" width="180" height="22"/>
  </g>
  <g font-size="11" fill="#888">
    <text x="646" y="75" text-anchor="end">0</text>
    <text x="646" y="97" text-anchor="end">1</text>
    <text x="646" y="119" text-anchor="end">2</text>
    <text x="646" y="141" text-anchor="end">3</text>
    <text x="646" y="163" text-anchor="end">4</text>
    <text x="646" y="185" text-anchor="end">5</text>
    <text x="646" y="207" text-anchor="end">6</text>
    <text x="668" y="75">6153  Ken</text>
    <text x="668" y="97">1030  Ada</text>
    <text x="668" y="119">2207  Guido</text>
    <text x="668" y="141">1121  Barbara</text>
    <text x="668" y="163" font-style="italic">empty</text>
    <text x="668" y="185">4471  Grace</text>
    <text x="668" y="207">8812  Linus</text>
  </g>
  <!-- hash arrow for 1030: MOD 7 = 1, straight in -->
  <path d="M870,40 L870,93 L846,93" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#fp-arrow-green)"/>
  <text x="872" y="34" text-anchor="end" font-size="10" fill="#059669">1030 MOD 7 = 1</text>
  <!-- collision for 1121: MOD 7 = 1 taken, 2 taken, lands in 3 -->
  <path d="M856,100 L856,134 L846,134" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-dasharray="3 2" marker-end="url(#fp-arrow)"/>
  <text x="862" y="112" font-size="9" fill="#f59e0b">1121 MOD 7 = 1</text>
  <text x="862" y="123" font-size="9" fill="#f59e0b">1 taken, 2 taken,</text>
  <text x="862" y="134" font-size="9" fill="#f59e0b">lands in 3</text>
  <text x="750" y="232" text-anchor="middle" font-size="11" fill="#059669">SEEK slot, then one read: address = slot x record size</text>
  <text x="750" y="246" text-anchor="middle" font-size="11" fill="#888">so every record must be the same length</text>
  <text x="750" y="262" text-anchor="middle" font-size="11" fill="#888">find one: hash, one seek, one read, O(1)</text>
  <text x="750" y="278" text-anchor="middle" font-size="11" fill="#888">collision: probe on to the next free slot</text>
  <text x="750" y="300" text-anchor="middle" font-size="11" fill="#059669">account lookups, booking systems, databases</text>
</svg>
