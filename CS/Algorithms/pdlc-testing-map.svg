<svg width="100%" viewBox="0 0 980 330" xmlns="http://www.w3.org/2000/svg">
  <text x="490" y="26" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">Nine testing methods: when, who, and what they look at</text>
  <!-- timeline -->
  <line x1="60" y1="150" x2="920" y2="150" stroke="#888" stroke-width="1.5"/><polygon points="928,150 918,145 918,155" fill="#888"/>
  <text x="176" y="176" text-anchor="middle" font-size="10.5" fill="#888">while writing</text><text x="490" y="176" text-anchor="middle" font-size="10.5" fill="#888">modules joined</text><text x="900" y="176" text-anchor="end" font-size="10.5" fill="#888">before release</text>
  <g font-size="11" fill="#888" text-anchor="middle">
    <rect x="50" y="60" width="116" height="40" rx="6" fill="rgba(124,58,237,0.14)" stroke="#7c3aed"/><text x="108" y="77">dry run</text><text x="108" y="92" font-size="9.5">by hand, on paper</text>
    <rect x="50" y="200" width="116" height="40" rx="6" fill="rgba(124,58,237,0.14)" stroke="#7c3aed"/><text x="108" y="217">walkthrough</text><text x="108" y="232" font-size="9.5">by hand, with others</text>
    <rect x="180" y="60" width="130" height="40" rx="6" fill="rgba(37,99,235,0.14)" stroke="#2563eb"/><text x="245" y="77">white-box</text><text x="245" y="92" font-size="9.5">every path, code known</text>
    <rect x="180" y="200" width="130" height="40" rx="6" fill="rgba(37,99,235,0.14)" stroke="#2563eb"/><text x="245" y="217">black-box</text><text x="245" y="232" font-size="9.5">inputs vs expected outputs</text>
    <rect x="330" y="60" width="140" height="40" rx="6" fill="rgba(8,145,178,0.14)" stroke="#0891b2"/><text x="400" y="77">stub</text><text x="400" y="92" font-size="9.5">stand-in for a missing module</text>
    <rect x="490" y="60" width="130" height="40" rx="6" fill="rgba(8,145,178,0.14)" stroke="#0891b2"/><text x="555" y="77">integration</text><text x="555" y="92" font-size="9.5">modules working together</text>
    <rect x="640" y="60" width="86" height="40" rx="6" fill="rgba(245,158,11,0.16)" stroke="#f59e0b"/><text x="683" y="77">alpha</text><text x="683" y="92" font-size="9.5">in-house users</text>
    <rect x="742" y="60" width="86" height="40" rx="6" fill="rgba(245,158,11,0.16)" stroke="#f59e0b"/><text x="785" y="77">beta</text><text x="785" y="92" font-size="9.5">real users outside</text>
    <rect x="844" y="60" width="96" height="40" rx="6" fill="rgba(5,150,105,0.16)" stroke="#059669"/><text x="892" y="77">acceptance</text><text x="892" y="92" font-size="9.5">the client signs off</text>
  </g>
  <g stroke="#888" stroke-width="1" stroke-dasharray="3 3"><line x1="108" y1="100" x2="108" y2="150"/><line x1="108" y1="200" x2="108" y2="150"/><line x1="245" y1="100" x2="245" y2="150"/><line x1="245" y1="200" x2="245" y2="150"/><line x1="400" y1="100" x2="400" y2="150"/><line x1="555" y1="100" x2="555" y2="150"/><line x1="683" y1="100" x2="683" y2="150"/><line x1="785" y1="100" x2="785" y2="150"/><line x1="892" y1="100" x2="892" y2="150"/></g>
  <text x="245" y="262" text-anchor="middle" font-size="10" fill="#2563eb">white and black box are lenses, not stages: either can be used at any point</text>
  <text x="490" y="300" text-anchor="middle" font-size="10.5" fill="#888">a test STRATEGY says which of these will be used and by whom; a test PLAN lists each test: input, expected output, actual output, pass or fail</text>
</svg>
