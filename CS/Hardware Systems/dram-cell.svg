<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 600; }
    .label { font-size: 13px; }
    .note { font-size: 11.5px; opacity: 0.8; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 14px; }
  </style>
  <defs>
    <marker id="leak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="250" y="26" class="title" text-anchor="middle">DRAM cell — a bit is a drop of charge</text>
  <text x="250" y="46" class="note" text-anchor="middle">1 transistor + 1 capacitor = 1 bit</text>

  <!-- word line -->
  <line x1="70" y1="100" x2="300" y2="100" stroke="#888" stroke-width="1.8"/>
  <text x="70" y="92" class="label" text-anchor="start">word line (row select)</text>

  <!-- bit line -->
  <line x1="360" y1="70" x2="360" y2="252" stroke="#888" stroke-width="1.8"/>
  <text x="360" y="62" class="label" text-anchor="middle">bit line</text>

  <!-- access wire -->
  <line x1="360" y1="160" x2="275" y2="160" stroke="#888" stroke-width="1.8"/>
  <line x1="235" y1="160" x2="190" y2="160" stroke="#888" stroke-width="1.8"/>

  <!-- transistor (switch) -->
  <line x1="255" y1="146" x2="255" y2="100" stroke="#7c3aed" stroke-width="1.4" stroke-dasharray="4,3"/>
  <rect x="235" y="146" width="40" height="28" rx="3" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="255" y="165" class="math" text-anchor="middle" fill="#7c3aed">T</text>
  <text x="255" y="190" class="note" text-anchor="middle" fill="#7c3aed">transistor = switch</text>

  <!-- capacitor -->
  <line x1="190" y1="160" x2="190" y2="170" stroke="#888" stroke-width="1.8"/>
  <line x1="168" y1="170" x2="212" y2="170" stroke="#0891b2" stroke-width="3"/>
  <line x1="168" y1="180" x2="212" y2="180" stroke="#0891b2" stroke-width="3"/>
  <line x1="190" y1="180" x2="190" y2="202" stroke="#888" stroke-width="1.8"/>
  <line x1="174" y1="202" x2="206" y2="202" stroke="#888" stroke-width="1.5"/>
  <line x1="180" y1="208" x2="200" y2="208" stroke="#888" stroke-width="1.5"/>
  <line x1="185" y1="213" x2="195" y2="213" stroke="#888" stroke-width="1.5"/>
  <text x="190" y="234" class="label" text-anchor="middle" fill="#0891b2">capacitor</text>
  <text x="190" y="249" class="note" text-anchor="middle">charge = the bit (1 = full, 0 = empty)</text>

  <!-- leak -->
  <line x1="166" y1="175" x2="134" y2="175" stroke="#dc2626" stroke-width="1.6" marker-end="url(#leak)"/>
  <text x="130" y="178" class="note" text-anchor="end" fill="#dc2626">charge leaks</text>

  <!-- sense amplifier -->
  <path d="M 340 252 L 380 252 L 360 288 Z" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.8"/>
  <text x="360" y="306" class="label" text-anchor="middle" fill="#059669">sense amplifier</text>
  <text x="360" y="320" class="note" text-anchor="middle">reads the tiny charge</text>

  <text x="250" y="346" class="note" text-anchor="middle">reading empties the cell -&gt; it must be rewritten</text>
</svg>
