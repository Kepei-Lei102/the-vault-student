<svg width="100%" viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrT" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#888" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="14" font-weight="bold" fill="#888">Nesting: a stack of protected scenes</text>

  <!-- lane labels -->
  <text x="180" y="86" text-anchor="end" font-size="11" font-weight="bold" fill="#888">main program</text>
  <text x="180" y="146" text-anchor="end" font-size="11" font-weight="bold" fill="#888">low-priority ISR</text>
  <text x="180" y="141" text-anchor="end" font-size="8.5" fill="#888" dy="18">(disk transfer done)</text>
  <text x="180" y="206" text-anchor="end" font-size="11" font-weight="bold" fill="#888">high-priority ISR</text>
  <text x="180" y="201" text-anchor="end" font-size="8.5" fill="#888" dy="18">(power warning)</text>

  <!-- time axis -->
  <line x1="195" y1="240" x2="730" y2="240" stroke="#888" stroke-width="1.4" marker-end="url(#arrT)"/>
  <text x="726" y="256" text-anchor="end" font-size="10" fill="#888">time</text>

  <!-- main program band: runs, pauses, resumes -->
  <rect x="195" y="70" width="115" height="24" fill="rgba(37,99,235,0.55)"/>
  <rect x="310" y="70" width="330" height="24" fill="rgba(37,99,235,0.12)"/>
  <rect x="640" y="70" width="90" height="24" fill="rgba(37,99,235,0.55)"/>
  <text x="475" y="86" text-anchor="middle" font-size="9.5" fill="#888">paused — scene on the stack</text>

  <!-- low ISR band: runs, preempted, resumes -->
  <rect x="310" y="130" width="90" height="24" fill="rgba(5,150,105,0.55)"/>
  <rect x="400" y="130" width="150" height="24" fill="rgba(5,150,105,0.12)"/>
  <rect x="550" y="130" width="90" height="24" fill="rgba(5,150,105,0.55)"/>
  <text x="475" y="146" text-anchor="middle" font-size="9.5" fill="#888">preempted</text>

  <!-- high ISR band -->
  <rect x="400" y="190" width="150" height="24" fill="rgba(245,158,11,0.6)"/>

  <!-- event lines -->
  <line x1="310" y1="60" x2="310" y2="240" stroke="rgba(136,136,136,0.5)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="60" x2="400" y2="240" stroke="rgba(136,136,136,0.5)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="550" y1="60" x2="550" y2="240" stroke="rgba(136,136,136,0.5)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="640" y1="60" x2="640" y2="240" stroke="rgba(136,136,136,0.5)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- bells -->
  <circle cx="310" cy="52" r="9" fill="rgba(5,150,105,0.2)" stroke="#059669" stroke-width="1.5"/>
  <text x="310" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">!</text>
  <circle cx="400" cy="52" r="9" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#f59e0b">!</text>

  <!-- moment labels under axis -->
  <text x="310" y="266" text-anchor="middle" font-size="9.5" fill="#888">bell 1 — main pauses</text>
  <text x="400" y="280" text-anchor="middle" font-size="9.5" fill="#888">bell 2 outranks it —</text>
  <text x="400" y="293" text-anchor="middle" font-size="9.5" fill="#888">the ISR itself pauses</text>
  <text x="550" y="266" text-anchor="middle" font-size="9.5" fill="#888">urgent done — pop</text>
  <text x="640" y="280" text-anchor="middle" font-size="9.5" fill="#888">done — pop again,</text>
  <text x="640" y="293" text-anchor="middle" font-size="9.5" fill="#888">main resumes</text>

  <!-- stack snapshots -->
  <text x="20" y="330" font-size="11" font-weight="bold" fill="#888">the stack, moment by moment:</text>

  <rect x="285" y="340" width="50" height="20" rx="3" fill="rgba(37,99,235,0.25)" stroke="#2563eb" stroke-width="1"/>
  <text x="310" y="354" text-anchor="middle" font-size="9" fill="#888">main</text>

  <rect x="375" y="340" width="50" height="20" rx="3" fill="rgba(5,150,105,0.25)" stroke="#059669" stroke-width="1"/>
  <text x="400" y="354" text-anchor="middle" font-size="9" fill="#888">low ISR</text>
  <rect x="375" y="364" width="50" height="20" rx="3" fill="rgba(37,99,235,0.25)" stroke="#2563eb" stroke-width="1"/>
  <text x="400" y="378" text-anchor="middle" font-size="9" fill="#888">main</text>

  <rect x="525" y="340" width="50" height="20" rx="3" fill="rgba(37,99,235,0.25)" stroke="#2563eb" stroke-width="1"/>
  <text x="550" y="354" text-anchor="middle" font-size="9" fill="#888">main</text>

  <text x="640" y="354" text-anchor="middle" font-size="9" fill="#888">(empty)</text>

  <!-- caption -->
  <text x="380" y="410" text-anchor="middle" font-size="11.5" fill="#888">Each interruption pushes a protected scene; each return pops one. Last suspended, first resumed — the save-area must be a stack.</text>
</svg>
