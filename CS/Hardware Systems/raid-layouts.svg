<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1080 885" font-family="Arial, sans-serif"><title>raid-layouts</title><text x="28" y="35" font-size="29" text-anchor="start" fill="#888">Five layouts. Different promises.</text><text x="28" y="66" font-size="18" text-anchor="start" fill="#888">Columns are drives; rows are stripes. Same letter = same stored data.</text><text x="28" y="100" font-size="23" text-anchor="start" fill="#888">RAID 0 · split</text><text x="78" y="131" font-size="16" text-anchor="middle" fill="#888">Drive 0</text><text x="194" y="131" font-size="16" text-anchor="middle" fill="#888">Drive 1</text><text x="310" y="131" font-size="16" text-anchor="middle" fill="#888">Drive 2</text><text x="426" y="131" font-size="16" text-anchor="middle" fill="#888">Drive 3</text><rect x="28" y="145" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="78.0" y="169.0" font-size="18" text-anchor="middle" fill="#888">A</text><rect x="144" y="145" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="194.0" y="169.0" font-size="18" text-anchor="middle" fill="#888">B</text><rect x="260" y="145" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="169.0" font-size="18" text-anchor="middle" fill="#888">C</text><rect x="376" y="145" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="426.0" y="169.0" font-size="18" text-anchor="middle" fill="#888">D</text><rect x="28" y="191" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="78.0" y="215.0" font-size="18" text-anchor="middle" fill="#888">E</text><rect x="144" y="191" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="194.0" y="215.0" font-size="18" text-anchor="middle" fill="#888">F</text><rect x="260" y="191" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="215.0" font-size="18" text-anchor="middle" fill="#888">G</text><rect x="376" y="191" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="426.0" y="215.0" font-size="18" text-anchor="middle" fill="#888">H</text><text x="28" y="305" font-size="17" text-anchor="start" fill="#888">Four drives: 4C usable. No drive failure tolerated.</text><text x="560" y="100" font-size="23" text-anchor="start" fill="#888">RAID 1 · copy</text><text x="610" y="131" font-size="16" text-anchor="middle" fill="#888">Drive 0</text><text x="726" y="131" font-size="16" text-anchor="middle" fill="#888">Drive 1</text><rect x="560" y="145" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="610.0" y="169.0" font-size="18" text-anchor="middle" fill="#888">A</text><rect x="676" y="145" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="726.0" y="169.0" font-size="18" text-anchor="middle" fill="#888">A</text><rect x="560" y="191" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="610.0" y="215.0" font-size="18" text-anchor="middle" fill="#888">B</text><rect x="676" y="191" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="726.0" y="215.0" font-size="18" text-anchor="middle" fill="#888">B</text><text x="560" y="305" font-size="17" text-anchor="start" fill="#888">Two drives: C usable. Either one may fail.</text><text x="28" y="350" font-size="23" text-anchor="start" fill="#888">RAID 5 · one parity</text><text x="78" y="381" font-size="16" text-anchor="middle" fill="#888">Drive 0</text><text x="194" y="381" font-size="16" text-anchor="middle" fill="#888">Drive 1</text><text x="310" y="381" font-size="16" text-anchor="middle" fill="#888">Drive 2</text><text x="426" y="381" font-size="16" text-anchor="middle" fill="#888">Drive 3</text><rect x="28" y="395" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="78.0" y="419.0" font-size="18" text-anchor="middle" fill="#888">A</text><rect x="144" y="395" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="194.0" y="419.0" font-size="18" text-anchor="middle" fill="#888">B</text><rect x="260" y="395" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="419.0" font-size="18" text-anchor="middle" fill="#888">C</text><rect x="376" y="395" width="100" height="36" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="426.0" y="419.0" font-size="18" text-anchor="middle" fill="#888">P0</text><rect x="28" y="441" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="78.0" y="465.0" font-size="18" text-anchor="middle" fill="#888">D</text><rect x="144" y="441" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="194.0" y="465.0" font-size="18" text-anchor="middle" fill="#888">E</text><rect x="260" y="441" width="100" height="36" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="310.0" y="465.0" font-size="18" text-anchor="middle" fill="#888">P1</text><rect x="376" y="441" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="426.0" y="465.0" font-size="18" text-anchor="middle" fill="#888">F</text><rect x="28" y="487" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="78.0" y="511.0" font-size="18" text-anchor="middle" fill="#888">G</text><rect x="144" y="487" width="100" height="36" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="194.0" y="511.0" font-size="18" text-anchor="middle" fill="#888">P2</text><rect x="260" y="487" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="511.0" font-size="18" text-anchor="middle" fill="#888">H</text><rect x="376" y="487" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="426.0" y="511.0" font-size="18" text-anchor="middle" fill="#888">I</text><text x="28" y="555" font-size="17" text-anchor="start" fill="#888">Four drives: 3C usable. Any one may fail.</text><text x="560" y="350" font-size="23" text-anchor="start" fill="#888">RAID 6 · two relations</text><text x="610" y="381" font-size="16" text-anchor="middle" fill="#888">Drive 0</text><text x="726" y="381" font-size="16" text-anchor="middle" fill="#888">Drive 1</text><text x="842" y="381" font-size="16" text-anchor="middle" fill="#888">Drive 2</text><text x="958" y="381" font-size="16" text-anchor="middle" fill="#888">Drive 3</text><rect x="560" y="395" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="610.0" y="419.0" font-size="18" text-anchor="middle" fill="#888">A</text><rect x="676" y="395" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="726.0" y="419.0" font-size="18" text-anchor="middle" fill="#888">B</text><rect x="792" y="395" width="100" height="36" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="842.0" y="419.0" font-size="18" text-anchor="middle" fill="#888">P0</text><rect x="908" y="395" width="100" height="36" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="958.0" y="419.0" font-size="18" text-anchor="middle" fill="#888">Q0</text><rect x="560" y="441" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="610.0" y="465.0" font-size="18" text-anchor="middle" fill="#888">C</text><rect x="676" y="441" width="100" height="36" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="726.0" y="465.0" font-size="18" text-anchor="middle" fill="#888">P1</text><rect x="792" y="441" width="100" height="36" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="842.0" y="465.0" font-size="18" text-anchor="middle" fill="#888">Q1</text><rect x="908" y="441" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="958.0" y="465.0" font-size="18" text-anchor="middle" fill="#888">D</text><rect x="560" y="487" width="100" height="36" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="610.0" y="511.0" font-size="18" text-anchor="middle" fill="#888">P2</text><rect x="676" y="487" width="100" height="36" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="726.0" y="511.0" font-size="18" text-anchor="middle" fill="#888">Q2</text><rect x="792" y="487" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="842.0" y="511.0" font-size="18" text-anchor="middle" fill="#888">E</text><rect x="908" y="487" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="958.0" y="511.0" font-size="18" text-anchor="middle" fill="#888">F</text><text x="560" y="555" font-size="17" text-anchor="start" fill="#888">Four drives: 2C usable. Any two may fail.</text><text x="28" y="650" font-size="23" text-anchor="start" fill="#888">RAID 10 · stripe over mirrored pairs</text><text x="78" y="681" font-size="16" text-anchor="middle" fill="#888">Drive 0</text><text x="194" y="681" font-size="16" text-anchor="middle" fill="#888">Drive 1</text><text x="310" y="681" font-size="16" text-anchor="middle" fill="#888">Drive 2</text><text x="426" y="681" font-size="16" text-anchor="middle" fill="#888">Drive 3</text><rect x="28" y="695" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="78.0" y="719.0" font-size="18" text-anchor="middle" fill="#888">A</text><rect x="144" y="695" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="194.0" y="719.0" font-size="18" text-anchor="middle" fill="#888">A</text><rect x="260" y="695" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="719.0" font-size="18" text-anchor="middle" fill="#888">B</text><rect x="376" y="695" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="426.0" y="719.0" font-size="18" text-anchor="middle" fill="#888">B</text><rect x="28" y="741" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="78.0" y="765.0" font-size="18" text-anchor="middle" fill="#888">C</text><rect x="144" y="741" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="194.0" y="765.0" font-size="18" text-anchor="middle" fill="#888">C</text><rect x="260" y="741" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="310.0" y="765.0" font-size="18" text-anchor="middle" fill="#888">D</text><rect x="376" y="741" width="100" height="36" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="426.0" y="765.0" font-size="18" text-anchor="middle" fill="#888">D</text><text x="28" y="855" font-size="17" text-anchor="start" fill="#888">Four drives: 2C usable. One survivor needed in EACH pair.</text><text x="560" y="699" font-size="20" text-anchor="start" fill="#888">RAID 10: the identity of the failures matters</text><text x="560" y="745" font-size="18" text-anchor="start" fill="#888">Lose drives 0 + 2: one copy of A and B survives.</text><text x="560" y="783" font-size="18" text-anchor="start" fill="#888">Lose drives 0 + 1: both copies of A disappear.</text><text x="560" y="826" font-size="18" text-anchor="start" fill="#888">C = capacity of one equal-sized drive.</text><text x="560" y="858" font-size="17" text-anchor="start" fill="#888">Metadata and file-system overhead omitted.</text></svg>
