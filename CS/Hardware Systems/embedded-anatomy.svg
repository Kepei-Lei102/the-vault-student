<svg width="100%" viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#2563eb" stroke-width="1.8"/>
    </marker>
    <marker id="arrG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#059669" stroke-width="1.8"/>
    </marker>
  </defs>

  <text x="380" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#888">The microcontroller: a whole computer on one chip</text>
  <text x="380" y="47" text-anchor="middle" font-size="12" fill="#888">a few millimetres across, about two yuan</text>

  <!-- chip body -->
  <rect x="235" y="70" width="290" height="250" rx="10" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="2"/>

  <!-- chip pins: left edge -->
  <rect x="221" y="100" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="221" y="130" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="221" y="160" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="221" y="190" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="221" y="220" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="221" y="250" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="221" y="280" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <!-- chip pins: right edge -->
  <rect x="525" y="100" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="525" y="130" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="525" y="160" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="525" y="190" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="525" y="220" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="525" y="250" width="14" height="7" fill="rgba(136,136,136,0.6)"/>
  <rect x="525" y="280" width="14" height="7" fill="rgba(136,136,136,0.6)"/>

  <!-- blocks inside -->
  <rect x="255" y="90" width="120" height="70" rx="6" fill="rgba(124,58,237,0.18)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="315" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">CPU core</text>
  <text x="315" y="138" text-anchor="middle" font-size="10" fill="#888">16–200 MHz</text>

  <rect x="390" y="90" width="115" height="70" rx="6" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="447" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">SRAM</text>
  <text x="447" y="138" text-anchor="middle" font-size="10" fill="#888">4–256 KB</text>

  <rect x="255" y="175" width="250" height="52" rx="6" fill="rgba(245,158,11,0.16)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="380" y="197" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">Flash — the firmware</text>
  <text x="380" y="215" text-anchor="middle" font-size="10" fill="#888">one program, written at the factory</text>

  <rect x="255" y="242" width="75" height="58" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="292" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">Timers</text>
  <text x="292" y="284" text-anchor="middle" font-size="9" fill="#888">deadlines</text>

  <rect x="342" y="242" width="75" height="58" rx="6" fill="rgba(37,99,235,0.14)" stroke="#2563eb" stroke-width="1.2"/>
  <text x="379" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">ADC</text>
  <text x="379" y="284" text-anchor="middle" font-size="9" fill="#888">world in</text>

  <rect x="430" y="242" width="75" height="58" rx="6" fill="rgba(5,150,105,0.14)" stroke="#059669" stroke-width="1.2"/>
  <text x="467" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">GPIO</text>
  <text x="467" y="284" text-anchor="middle" font-size="9" fill="#888">bare pins</text>

  <!-- world, input side -->
  <circle cx="95" cy="163" r="26" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">sensor</text>
  <text x="95" y="173" text-anchor="middle" font-size="9" fill="#888">thermistor</text>
  <line x1="123" y1="163" x2="216" y2="163" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="168" y="152" text-anchor="middle" font-size="10" fill="#2563eb">analogue in</text>

  <circle cx="95" cy="253" r="26" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">button</text>
  <text x="95" y="263" text-anchor="middle" font-size="9" fill="#888">start / select</text>
  <line x1="123" y1="253" x2="216" y2="253" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrB)"/>
  <text x="168" y="242" text-anchor="middle" font-size="10" fill="#2563eb">digital in</text>

  <!-- world, output side -->
  <circle cx="655" cy="163" r="26" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.5"/>
  <text x="655" y="159" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">relay</text>
  <text x="655" y="173" text-anchor="middle" font-size="9" fill="#888">motor / heater</text>
  <line x1="544" y1="163" x2="624" y2="163" stroke="#059669" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="584" y="152" text-anchor="middle" font-size="10" fill="#059669">act</text>

  <circle cx="655" cy="253" r="26" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.5"/>
  <text x="655" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">LED</text>
  <text x="655" y="263" text-anchor="middle" font-size="9" fill="#888">status light</text>
  <line x1="544" y1="253" x2="624" y2="253" stroke="#059669" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="584" y="242" text-anchor="middle" font-size="10" fill="#059669">show</text>

  <!-- caption -->
  <text x="380" y="356" text-anchor="middle" font-size="12" fill="#888">Everything the big computer spreads across a motherboard, on one die —</text>
  <text x="380" y="374" text-anchor="middle" font-size="12" fill="#888">no screen, no keyboard, no operating system: the world itself is its I/O.</text>
</svg>
