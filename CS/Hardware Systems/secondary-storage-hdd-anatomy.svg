<svg width="100%" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- ===== LEFT: top view ===== -->
  <text x="190" y="28" font-size="15" fill="#888" text-anchor="middle" font-weight="bold">top view</text>

  <!-- platter -->
  <circle cx="190" cy="215" r="150" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="2"/>
  <!-- tracks -->
  <circle cx="190" cy="215" r="120" fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="190" cy="215" r="95"  fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <circle cx="190" cy="215" r="70"  fill="none" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0.6"/>
  <!-- sector lines every 30 deg, from r=45 to r=150 -->
  <g stroke="#888" stroke-width="1" opacity="0.35">
    <line x1="235" y1="215" x2="340" y2="215"/>
    <line x1="145" y1="215" x2="40"  y2="215"/>
    <line x1="190" y1="170" x2="190" y2="65"/>
    <line x1="190" y1="260" x2="190" y2="365"/>
    <line x1="228.97" y1="192.5" x2="319.9" y2="140"/>
    <line x1="151.03" y1="237.5" x2="60.1"  y2="290"/>
    <line x1="228.97" y1="237.5" x2="319.9" y2="290"/>
    <line x1="151.03" y1="192.5" x2="60.1"  y2="140"/>
    <line x1="212.5" y1="176.03" x2="265" y2="85.1"/>
    <line x1="167.5" y1="253.97" x2="115" y2="344.9"/>
    <line x1="212.5" y1="253.97" x2="265" y2="344.9"/>
    <line x1="167.5" y1="176.03" x2="115" y2="85.1"/>
  </g>
  <!-- highlighted sector: wedge between 0 and 30 deg, r 95..120 -->
  <path d="M 285 215 A 95 95 0 0 0 272.27 167.5 L 293.92 155 A 120 120 0 0 1 310 215 Z"
        fill="rgba(245,158,11,0.35)" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- spindle -->
  <circle cx="190" cy="215" r="14" fill="rgba(136,136,136,0.25)" stroke="#888" stroke-width="1.5"/>

  <!-- actuator arm -->
  <circle cx="392" cy="392" r="10" fill="rgba(124,58,237,0.2)" stroke="#7c3aed" stroke-width="2"/>
  <path d="M 388 384 L 218 190 L 230 182 L 398 378 Z" fill="rgba(124,58,237,0.2)" stroke="#7c3aed" stroke-width="2"/>
  <rect x="212" y="178" width="14" height="14" rx="2" fill="rgba(124,58,237,0.45)" stroke="#7c3aed" stroke-width="1.5" transform="rotate(49 219 185)"/>

  <!-- labels, left -->
  <text x="52" y="55" font-size="13" fill="#888">platter, spinning 7200 rpm</text>
  <line x1="86" y1="60" x2="102" y2="86" stroke="#888" stroke-width="1" marker-end="url(#ah)"/>

  <text x="330" y="120" font-size="13" fill="#f59e0b">one sector</text>
  <line x1="340" y1="126" x2="300" y2="168" stroke="#888" stroke-width="1" marker-end="url(#ah)"/>

  <text x="20" y="330" font-size="13" fill="#888">track</text>
  <line x1="48" y1="322" x2="86" y2="292" stroke="#888" stroke-width="1" marker-end="url(#ah)"/>

  <text x="20" y="150" font-size="13" fill="#7c3aed">read/write head</text>
  <line x1="118" y1="155" x2="203" y2="177" stroke="#888" stroke-width="1" marker-end="url(#ah)"/>

  <text x="120" y="402" font-size="13" fill="#7c3aed">actuator arm</text>
  <text x="120" y="418" font-size="12" fill="#888">seeks between tracks</text>
  <line x1="215" y1="398" x2="326" y2="342" stroke="#888" stroke-width="1" marker-end="url(#ah)"/>

  <!-- ===== RIGHT: side view ===== -->
  <text x="590" y="28" font-size="15" fill="#888" text-anchor="middle" font-weight="bold">side view</text>

  <!-- spindle -->
  <rect x="584" y="52" width="12" height="180" fill="rgba(136,136,136,0.20)" stroke="#888" stroke-width="1"/>
  <!-- platters -->
  <g fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5">
    <rect x="490" y="78"  width="200" height="9"/>
    <rect x="490" y="130" width="200" height="9"/>
    <rect x="490" y="182" width="200" height="9"/>
  </g>
  <!-- arm comb at right -->
  <rect x="712" y="60" width="14" height="150" rx="4" fill="rgba(124,58,237,0.2)" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- arms above and below each platter -->
  <g stroke="#7c3aed" stroke-width="2" fill="none">
    <line x1="712" y1="70"  x2="530" y2="70"/>
    <line x1="712" y1="95"  x2="530" y2="95"/>
    <line x1="712" y1="122" x2="530" y2="122"/>
    <line x1="712" y1="147" x2="530" y2="147"/>
    <line x1="712" y1="174" x2="530" y2="174"/>
    <line x1="712" y1="199" x2="530" y2="199"/>
  </g>
  <!-- head tips -->
  <g fill="rgba(124,58,237,0.45)" stroke="#7c3aed" stroke-width="1">
    <rect x="522" y="68"  width="10" height="6" rx="1"/>
    <rect x="522" y="91"  width="10" height="6" rx="1"/>
    <rect x="522" y="120" width="10" height="6" rx="1"/>
    <rect x="522" y="143" width="10" height="6" rx="1"/>
    <rect x="522" y="172" width="10" height="6" rx="1"/>
    <rect x="522" y="195" width="10" height="6" rx="1"/>
  </g>
  <text x="470" y="230" font-size="12" fill="#888">one head per surface, all arms move together</text>

  <!-- flying height inset -->
  <rect x="470" y="262" width="270" height="120" rx="8" fill="rgba(136,136,136,0.08)" stroke="#888" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="605" y="284" font-size="13" fill="#888" text-anchor="middle" font-weight="bold">zoom: the head flies</text>
  <!-- head block -->
  <rect x="540" y="296" width="60" height="24" rx="3" fill="rgba(124,58,237,0.3)" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- air gap -->
  <line x1="490" y1="332" x2="720" y2="332" stroke="#0891b2" stroke-width="2.5"/>
  <text x="622" y="316" font-size="12" fill="#888">gap: a few nanometres</text>
  <line x1="618" y1="320" x2="606" y2="327" stroke="#888" stroke-width="1" marker-end="url(#ah)"/>
  <text x="605" y="352" font-size="12" fill="#0891b2" text-anchor="middle">magnetic surface</text>
  <text x="605" y="372" font-size="12" fill="#888" text-anchor="middle" font-style="italic">scaled up: a jumbo jet, millimetres off the ground</text>
</svg>
