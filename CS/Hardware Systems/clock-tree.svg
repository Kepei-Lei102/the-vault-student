<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 700; }
    .src   { font-size: 13px; font-weight: 700; fill: #0891b2; }
    .dom   { font-size: 13px; font-weight: 700; }
    .frq   { font-size: 13px; font-weight: 800; fill: #059669; }
    .tag   { font-size: 11px; font-weight: 600; fill: #7c3aed; }
    .cap   { font-size: 11px; }
  </style>

  <text x="360" y="28" class="title" text-anchor="middle">The clock tree: one reference, many domains</text>

  <!-- Crystal / base clock -->
  <rect x="40" y="188" width="130" height="48" rx="8" fill="rgba(8,145,178,0.12)" stroke="#0891b2" stroke-width="1.8"/>
  <text x="105" y="210" class="src" text-anchor="middle">Crystal</text>
  <text x="105" y="227" class="cap" text-anchor="middle">100 MHz base clock</text>

  <!-- trunk + distribution bus -->
  <line x1="170" y1="212" x2="215" y2="212" stroke="#9ca3af" stroke-width="1.8"/>
  <line x1="215" y1="80" x2="215" y2="368" stroke="#9ca3af" stroke-width="1.8"/>

  <!-- ===== branches ===== -->
  <!-- core 0 -->
  <circle cx="215" cy="80" r="3.5" fill="#9ca3af"/>
  <line x1="215" y1="80" x2="310" y2="80" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="262" y="72" class="tag" text-anchor="middle">PLL x45</text>
  <rect x="310" y="60" width="250" height="40" rx="7" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="324" y="85" class="dom" text-anchor="start">CPU core 0</text>
  <text x="546" y="85" class="frq" text-anchor="end">4.5 GHz</text>

  <!-- core 1 -->
  <circle cx="215" cy="150" r="3.5" fill="#9ca3af"/>
  <line x1="215" y1="150" x2="310" y2="150" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="262" y="142" class="tag" text-anchor="middle">PLL x43</text>
  <rect x="310" y="130" width="250" height="40" rx="7" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="324" y="155" class="dom" text-anchor="start">CPU core 1</text>
  <text x="546" y="155" class="frq" text-anchor="end">4.3 GHz</text>

  <!-- L3 / ring -->
  <circle cx="215" cy="220" r="3.5" fill="#9ca3af"/>
  <line x1="215" y1="220" x2="310" y2="220" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="262" y="212" class="tag" text-anchor="middle">PLL x30</text>
  <rect x="310" y="200" width="250" height="40" rx="7" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="324" y="225" class="dom" text-anchor="start">L3 cache / ring</text>
  <text x="546" y="225" class="frq" text-anchor="end">3.0 GHz</text>

  <!-- memory controller -->
  <circle cx="215" cy="290" r="3.5" fill="#9ca3af"/>
  <line x1="215" y1="290" x2="310" y2="290" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="262" y="282" class="tag" text-anchor="middle">PLL x32</text>
  <rect x="310" y="270" width="250" height="40" rx="7" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="324" y="295" class="dom" text-anchor="start">Memory controller</text>
  <text x="546" y="295" class="frq" text-anchor="end">3.2 GHz</text>

  <!-- PCIe / USB -->
  <circle cx="215" cy="360" r="3.5" fill="#9ca3af"/>
  <line x1="215" y1="360" x2="310" y2="360" stroke="#9ca3af" stroke-width="1.6"/>
  <text x="262" y="352" class="tag" text-anchor="middle">/ divide</text>
  <rect x="310" y="340" width="250" height="40" rx="7" fill="rgba(124,58,237,0.08)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="324" y="365" class="dom" text-anchor="start">PCIe / USB</text>
  <text x="546" y="365" class="frq" text-anchor="end">100 MHz</text>

  <text x="360" y="410" class="cap" text-anchor="middle">One crystal -&gt; PLLs (multiply up) + dividers (down) -&gt; many clocks. Each box is its own clock domain.</text>
</svg>
