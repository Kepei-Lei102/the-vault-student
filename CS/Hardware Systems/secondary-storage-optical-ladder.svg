<svg width="100%" viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahcd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="ahdvd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="ahbd" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <text x="380" y="26" font-size="15" fill="#888" text-anchor="middle" font-weight="bold">same 12 cm of plastic, three sizes of pen</text>

  <!-- ===== CD row ===== -->
  <text x="40" y="76" font-size="14" fill="#888" font-weight="bold">CD</text>
  <text x="40" y="94" font-size="12" fill="#888">1982, laser 780 nm</text>
  <rect x="200" y="58" width="400" height="44" rx="6" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
  <!-- pits: big -->
  <g fill="rgba(8,145,178,0.55)">
    <rect x="220" y="72" width="44" height="16" rx="8"/>
    <rect x="292" y="72" width="30" height="16" rx="8"/>
    <rect x="350" y="72" width="58" height="16" rx="8"/>
    <rect x="436" y="72" width="30" height="16" rx="8"/>
    <rect x="494" y="72" width="44" height="16" rx="8"/>
  </g>
  <!-- laser beam -->
  <line x1="404" y1="132" x2="404" y2="106" stroke="#888" stroke-width="2.5" marker-end="url(#ahcd)"/>
  <text x="416" y="128" font-size="11" fill="#888">infrared</text>
  <text x="622" y="84" font-size="16" fill="#0891b2" font-weight="bold">700 MB</text>

  <!-- ===== DVD row ===== -->
  <text x="40" y="182" font-size="14" fill="#888" font-weight="bold">DVD</text>
  <text x="40" y="200" font-size="12" fill="#888">1995, laser 650 nm</text>
  <rect x="200" y="164" width="400" height="44" rx="6" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
  <!-- pits: medium -->
  <g fill="rgba(8,145,178,0.55)">
    <rect x="214" y="181" width="26" height="10" rx="5"/>
    <rect x="256" y="181" width="18" height="10" rx="5"/>
    <rect x="290" y="181" width="34" height="10" rx="5"/>
    <rect x="340" y="181" width="18" height="10" rx="5"/>
    <rect x="374" y="181" width="26" height="10" rx="5"/>
    <rect x="416" y="181" width="18" height="10" rx="5"/>
    <rect x="450" y="181" width="34" height="10" rx="5"/>
    <rect x="500" y="181" width="18" height="10" rx="5"/>
    <rect x="534" y="181" width="26" height="10" rx="5"/>
  </g>
  <line x1="404" y1="238" x2="404" y2="212" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahdvd)"/>
  <text x="416" y="234" font-size="11" fill="#dc2626">red</text>
  <text x="622" y="190" font-size="16" fill="#0891b2" font-weight="bold">4.7 GB</text>

  <!-- ===== Blu-ray row ===== -->
  <text x="40" y="288" font-size="14" fill="#888" font-weight="bold">Blu-ray</text>
  <text x="40" y="306" font-size="12" fill="#888">2006, laser 405 nm</text>
  <rect x="200" y="270" width="400" height="44" rx="6" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
  <!-- pits: tiny, two tracks to show tighter spiral -->
  <g fill="rgba(8,145,178,0.55)">
    <rect x="210" y="280" width="13" height="6" rx="3"/>
    <rect x="231" y="280" width="9"  height="6" rx="3"/>
    <rect x="248" y="280" width="17" height="6" rx="3"/>
    <rect x="273" y="280" width="9"  height="6" rx="3"/>
    <rect x="290" y="280" width="13" height="6" rx="3"/>
    <rect x="311" y="280" width="9"  height="6" rx="3"/>
    <rect x="328" y="280" width="17" height="6" rx="3"/>
    <rect x="353" y="280" width="13" height="6" rx="3"/>
    <rect x="374" y="280" width="9"  height="6" rx="3"/>
    <rect x="391" y="280" width="13" height="6" rx="3"/>
    <rect x="412" y="280" width="17" height="6" rx="3"/>
    <rect x="437" y="280" width="9"  height="6" rx="3"/>
    <rect x="454" y="280" width="13" height="6" rx="3"/>
    <rect x="475" y="280" width="9"  height="6" rx="3"/>
    <rect x="492" y="280" width="17" height="6" rx="3"/>
    <rect x="517" y="280" width="13" height="6" rx="3"/>
    <rect x="538" y="280" width="9"  height="6" rx="3"/>
    <rect x="555" y="280" width="13" height="6" rx="3"/>
    <rect x="216" y="298" width="9"  height="6" rx="3"/>
    <rect x="241" y="298" width="17" height="6" rx="3"/>
    <rect x="266" y="298" width="13" height="6" rx="3"/>
    <rect x="287" y="298" width="9"  height="6" rx="3"/>
    <rect x="304" y="298" width="13" height="6" rx="3"/>
    <rect x="325" y="298" width="17" height="6" rx="3"/>
    <rect x="350" y="298" width="9"  height="6" rx="3"/>
    <rect x="367" y="298" width="13" height="6" rx="3"/>
    <rect x="388" y="298" width="9"  height="6" rx="3"/>
    <rect x="405" y="298" width="17" height="6" rx="3"/>
    <rect x="430" y="298" width="13" height="6" rx="3"/>
    <rect x="451" y="298" width="9"  height="6" rx="3"/>
    <rect x="468" y="298" width="17" height="6" rx="3"/>
    <rect x="493" y="298" width="13" height="6" rx="3"/>
    <rect x="514" y="298" width="9"  height="6" rx="3"/>
    <rect x="531" y="298" width="17" height="6" rx="3"/>
    <rect x="556" y="298" width="9"  height="6" rx="3"/>
  </g>
  <line x1="404" y1="344" x2="404" y2="318" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ahbd)"/>
  <text x="416" y="340" font-size="11" fill="#7c3aed">blue-violet</text>
  <text x="622" y="296" font-size="16" fill="#0891b2" font-weight="bold">25 GB</text>

  <!-- caption -->
  <text x="380" y="44" font-size="12" fill="#888" text-anchor="middle" font-style="italic">a pit cannot be smaller than the spot of light reading it, and the spot size is set by the wavelength</text>
</svg>
