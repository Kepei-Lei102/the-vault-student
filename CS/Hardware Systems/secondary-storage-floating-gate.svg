<svg width="100%" viewBox="0 0 760 410" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ahr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="ahp" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <text x="240" y="26" font-size="15" fill="#888" text-anchor="middle" font-weight="bold">the flash cell, in cross-section</text>

  <!-- control gate -->
  <rect x="140" y="48" width="200" height="42" rx="4" fill="rgba(37,99,235,0.18)" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="74" font-size="13" fill="#2563eb" text-anchor="middle">control gate</text>

  <!-- upper oxide -->
  <rect x="140" y="90" width="200" height="16" fill="rgba(136,136,136,0.18)" stroke="#888" stroke-width="1"/>

  <!-- floating gate -->
  <rect x="150" y="106" width="180" height="46" rx="4" fill="rgba(245,158,11,0.22)" stroke="#f59e0b" stroke-width="2"/>
  <g fill="#0891b2">
    <circle cx="175" cy="122" r="4"/>
    <circle cx="200" cy="134" r="4"/>
    <circle cx="225" cy="120" r="4"/>
    <circle cx="250" cy="136" r="4"/>
    <circle cx="275" cy="121" r="4"/>
    <circle cx="300" cy="133" r="4"/>
  </g>
  <text x="240" y="147" font-size="11" fill="#f59e0b" text-anchor="middle">floating gate</text>

  <!-- tunnel oxide -->
  <rect x="140" y="152" width="200" height="16" fill="rgba(136,136,136,0.18)" stroke="#888" stroke-width="1"/>
  <text x="352" y="164" font-size="12" fill="#888">tunnel oxide, the wall</text>

  <!-- substrate -->
  <rect x="60" y="168" width="360" height="90" fill="rgba(136,136,136,0.10)" stroke="#888" stroke-width="1"/>
  <text x="240" y="246" font-size="12" fill="#888" text-anchor="middle">silicon substrate</text>

  <!-- source / drain -->
  <rect x="70"  y="168" width="66" height="34" rx="4" fill="rgba(5,150,105,0.20)" stroke="#059669" stroke-width="1.5"/>
  <rect x="344" y="168" width="66" height="34" rx="4" fill="rgba(5,150,105,0.20)" stroke="#059669" stroke-width="1.5"/>
  <text x="103" y="190" font-size="12" fill="#059669" text-anchor="middle">source</text>
  <text x="377" y="190" font-size="12" fill="#059669" text-anchor="middle">drain</text>
  <!-- channel -->
  <line x1="140" y1="176" x2="340" y2="176" stroke="#059669" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="240" y="216" font-size="12" fill="#059669" text-anchor="middle">channel</text>

  <!-- trapped-electrons label, left -->
  <text x="20" y="112" font-size="12" fill="#888">trapped electrons,</text>
  <text x="20" y="127" font-size="12" fill="#888">insulated on every side</text>
  <line x1="98" y1="132" x2="164" y2="124" stroke="#888" stroke-width="1" marker-end="url(#ahg)"/>

  <!-- WRITE arrow -->
  <line x1="180" y1="200" x2="180" y2="140" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ahr)"/>
  <text x="20" y="282" font-size="12.5" fill="#dc2626" font-weight="bold">WRITE</text>
  <text x="20" y="298" font-size="12" fill="#888">high voltage forces electrons</text>
  <text x="20" y="313" font-size="12" fill="#888">to tunnel through the wall, in</text>

  <!-- ERASE arrow -->
  <line x1="300" y1="146" x2="300" y2="204" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#ahp)"/>
  <text x="250" y="282" font-size="12.5" fill="#7c3aed" font-weight="bold">ERASE</text>
  <text x="250" y="298" font-size="12" fill="#888">reverse voltage pulls them out,</text>
  <text x="250" y="313" font-size="12" fill="#888">a whole block at a time</text>

  <!-- ===== RIGHT: read mechanism ===== -->
  <text x="590" y="26" font-size="15" fill="#888" text-anchor="middle" font-weight="bold">READ: ask the transistor</text>

  <!-- case 1: empty -->
  <rect x="470" y="48" width="240" height="104" rx="8" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.5"/>
  <rect x="490" y="70" width="52" height="26" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="516" y="116" font-size="11.5" fill="#888" text-anchor="middle">island empty</text>
  <text x="560" y="78" font-size="12" fill="#888">transistor switches on,</text>
  <text x="560" y="94" font-size="12" fill="#888">current flows</text>
  <text x="560" y="132" font-size="15" fill="#059669" font-weight="bold">read as 1</text>

  <!-- case 2: charged -->
  <rect x="470" y="168" width="240" height="104" rx="8" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="490" y="190" width="52" height="26" rx="3" fill="rgba(245,158,11,0.22)" stroke="#f59e0b" stroke-width="1.5"/>
  <g fill="#0891b2">
    <circle cx="502" cy="200" r="3"/>
    <circle cx="514" cy="207" r="3"/>
    <circle cx="527" cy="199" r="3"/>
  </g>
  <text x="516" y="236" font-size="11.5" fill="#888" text-anchor="middle">island charged</text>
  <text x="560" y="198" font-size="12" fill="#888">charge pushes back,</text>
  <text x="560" y="214" font-size="12" fill="#888">transistor stays off</text>
  <text x="560" y="252" font-size="15" fill="#2563eb" font-weight="bold">read as 0</text>

  <!-- punchline -->
  <text x="380" y="360" font-size="13.5" fill="#888" text-anchor="middle" font-style="italic">The island has no wires. The charge is invisible,</text>
  <text x="380" y="380" font-size="13.5" fill="#888" text-anchor="middle" font-style="italic">but the transistor's switching point betrays it.</text>
</svg>
