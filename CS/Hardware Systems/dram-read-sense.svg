<!-- stack: SMIL -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13px; }
    .note { font-size: 11.5px; opacity: 0.85; }
    .big { font-size: 20px; font-weight: 700; }
  </style>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 9 L 5 1 L 10 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 5 9 L 10 1 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- phase labels (cross-faded) -->
  <text x="340" y="30" class="title" text-anchor="middle" fill="#9ca3af">
    1 — precharge the bit line to Vdd/2 (on the fence between 0 and 1)
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.34;0.97;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="340" y="30" class="title" text-anchor="middle" fill="#0891b2" opacity="0">
    2 — open the word line: the cell nudges the line up (1) or down (0)
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.38;0.49;0.53;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="340" y="30" class="title" text-anchor="middle" fill="#059669" opacity="0">
    3 — the sense amp amplifies the nudge to a full rail = the read
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.9;0.94;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <line x1="340" y1="70" x2="340" y2="360" stroke="#888" stroke-width="0.7" opacity="0.25" stroke-dasharray="4,4"/>

  <!-- ================= LEFT PANEL: reading a stored 1 ================= -->
  <text x="175" y="66" class="label" text-anchor="middle">cell holds <tspan fill="#0891b2" font-weight="700">1</tspan></text>

  <!-- gauge -->
  <rect x="150" y="120" width="50" height="200" fill="none" stroke="#888" stroke-width="1.4"/>
  <text x="145" y="126" class="note" text-anchor="end">Vdd</text>
  <text x="145" y="324" class="note" text-anchor="end">0</text>
  <line x1="142" y1="220" x2="208" y2="220" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="140" y="223" class="note" text-anchor="end" fill="#9ca3af">Vdd/2</text>

  <!-- animated bit-line voltage fill -->
  <rect x="152" width="46" fill="rgba(8,145,178,0.38)" y="220" height="100">
    <animate attributeName="y" values="220;220;200;122;122;220" keyTimes="0;0.33;0.5;0.7;0.92;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="height" values="100;100;120;198;198;100" keyTimes="0;0.33;0.5;0.7;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="175" y="338" class="note" text-anchor="middle">bit line</text>

  <!-- nudge arrow up -->
  <line x1="216" y1="222" x2="216" y2="196" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#up)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.4;0.49;0.53;1" dur="9s" repeatCount="indefinite"/>
  </line>

  <!-- sense amp + result -->
  <path d="M 158 352 L 192 352 L 175 380 Z" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.5">
    <animate attributeName="fill" values="rgba(5,150,105,0.12);rgba(5,150,105,0.12);rgba(5,150,105,0.5);rgba(5,150,105,0.5);rgba(5,150,105,0.12)" keyTimes="0;0.55;0.6;0.9;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <text x="175" y="404" class="big" text-anchor="middle" fill="#059669" opacity="0">reads 1
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.9;0.94;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <!-- ================= RIGHT PANEL: reading a stored 0 ================= -->
  <text x="505" y="66" class="label" text-anchor="middle">cell holds <tspan fill="#dc2626" font-weight="700">0</tspan></text>

  <rect x="480" y="120" width="50" height="200" fill="none" stroke="#888" stroke-width="1.4"/>
  <text x="475" y="126" class="note" text-anchor="end">Vdd</text>
  <text x="475" y="324" class="note" text-anchor="end">0</text>
  <line x1="472" y1="220" x2="538" y2="220" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="470" y="223" class="note" text-anchor="end" fill="#9ca3af">Vdd/2</text>

  <rect x="482" width="46" fill="rgba(8,145,178,0.38)" y="220" height="100">
    <animate attributeName="y" values="220;220;240;318;318;220" keyTimes="0;0.33;0.5;0.7;0.92;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="height" values="100;100;80;2;2;100" keyTimes="0;0.33;0.5;0.7;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="505" y="338" class="note" text-anchor="middle">bit line</text>

  <line x1="546" y1="218" x2="546" y2="244" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#dn)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.36;0.4;0.49;0.53;1" dur="9s" repeatCount="indefinite"/>
  </line>

  <path d="M 488 352 L 522 352 L 505 380 Z" fill="rgba(5,150,105,0.12)" stroke="#059669" stroke-width="1.5">
    <animate attributeName="fill" values="rgba(5,150,105,0.12);rgba(5,150,105,0.12);rgba(5,150,105,0.5);rgba(5,150,105,0.5);rgba(5,150,105,0.12)" keyTimes="0;0.55;0.6;0.9;1" dur="9s" repeatCount="indefinite"/>
  </path>
  <text x="505" y="404" class="big" text-anchor="middle" fill="#059669" opacity="0">reads 0
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.6;0.9;0.94;1" dur="9s" repeatCount="indefinite"/>
  </text>

  <text x="340" y="426" class="note" text-anchor="middle">the nudge is tiny — the sense amp amplifies its direction into a clean 0 or 1</text>
  <text x="340" y="442" class="note" text-anchor="middle">driving the line to the rail also rewrites the cell, so the read restores it</text>
</svg>
