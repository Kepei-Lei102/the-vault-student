<svg width="100%" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="nng" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- ===== NOR panel ===== -->
  <text x="200" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="bold">NOR — parallel</text>
  <text x="200" y="50" font-size="12" fill="#888" text-anchor="middle">every cell has its own contact</text>

  <!-- bit line -->
  <line x1="60" y1="86" x2="340" y2="86" stroke="#2563eb" stroke-width="2.5"/>
  <text x="60" y="76" font-size="12" fill="#2563eb">bit line</text>

  <!-- cells: 4 in a row -->
  <g>
    <!-- cell template drawn 4 times at x centers 105,170,235,300 -->
    <!-- contacts -->
    <line x1="105" y1="86" x2="105" y2="150" stroke="#888" stroke-width="1.8"/>
    <line x1="170" y1="86" x2="170" y2="150" stroke="#888" stroke-width="1.8"/>
    <line x1="235" y1="86" x2="235" y2="150" stroke="#888" stroke-width="1.8"/>
    <line x1="300" y1="86" x2="300" y2="150" stroke="#888" stroke-width="1.8"/>
    <!-- contact dots on the bit line -->
    <circle cx="105" cy="86" r="3.5" fill="#2563eb"/>
    <circle cx="170" cy="86" r="3.5" fill="#2563eb"/>
    <circle cx="235" cy="86" r="3.5" fill="#2563eb"/>
    <circle cx="300" cy="86" r="3.5" fill="#2563eb"/>
  </g>
  <!-- cell boxes -->
  <g>
    <g transform="translate(87,150)">
      <rect x="0" y="0" width="36" height="46" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
      <rect x="5" y="8"  width="26" height="8" fill="rgba(37,99,235,0.35)"/>
      <rect x="5" y="22" width="26" height="8" fill="rgba(245,158,11,0.45)"/>
    </g>
    <g transform="translate(152,150)">
      <rect x="0" y="0" width="36" height="46" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
      <rect x="5" y="8"  width="26" height="8" fill="rgba(37,99,235,0.35)"/>
      <rect x="5" y="22" width="26" height="8" fill="rgba(245,158,11,0.45)"/>
    </g>
    <g transform="translate(217,150)">
      <rect x="0" y="0" width="36" height="46" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
      <rect x="5" y="8"  width="26" height="8" fill="rgba(37,99,235,0.35)"/>
      <rect x="5" y="22" width="26" height="8" fill="rgba(245,158,11,0.45)"/>
    </g>
    <g transform="translate(282,150)">
      <rect x="0" y="0" width="36" height="46" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
      <rect x="5" y="8"  width="26" height="8" fill="rgba(37,99,235,0.35)"/>
      <rect x="5" y="22" width="26" height="8" fill="rgba(245,158,11,0.45)"/>
    </g>
  </g>
  <!-- source line -->
  <line x1="105" y1="196" x2="105" y2="240" stroke="#888" stroke-width="1.8"/>
  <line x1="170" y1="196" x2="170" y2="240" stroke="#888" stroke-width="1.8"/>
  <line x1="235" y1="196" x2="235" y2="240" stroke="#888" stroke-width="1.8"/>
  <line x1="300" y1="196" x2="300" y2="240" stroke="#888" stroke-width="1.8"/>
  <line x1="60" y1="240" x2="340" y2="240" stroke="#059669" stroke-width="2.5"/>
  <text x="60" y="260" font-size="12" fill="#059669">source line</text>

  <!-- annotation -->
  <text x="200" y="300" font-size="12" fill="#888" text-anchor="middle">parallel, like a NOR gate's inputs</text>
  <text x="200" y="322" font-size="12.5" fill="#888" text-anchor="middle">any byte, any moment — random access,</text>
  <text x="200" y="338" font-size="12.5" fill="#888" text-anchor="middle">firmware executes in place —</text>
  <text x="200" y="354" font-size="12.5" fill="#888" text-anchor="middle">but every contact costs silicon</text>

  <!-- ===== NAND panel ===== -->
  <text x="560" y="30" font-size="15" fill="#888" text-anchor="middle" font-weight="bold">NAND — series string</text>
  <text x="560" y="50" font-size="12" fill="#888" text-anchor="middle">one contact per whole string</text>

  <!-- bit line -->
  <line x1="440" y1="86" x2="700" y2="86" stroke="#2563eb" stroke-width="2.5"/>
  <text x="440" y="76" font-size="12" fill="#2563eb">bit line</text>
  <circle cx="570" cy="86" r="3.5" fill="#2563eb"/>
  <text x="590" y="104" font-size="12" fill="#888">the only contact</text>
  <line x1="588" y1="100" x2="576" y2="90" stroke="#888" stroke-width="1" marker-end="url(#nng)"/>

  <!-- select transistor top -->
  <line x1="570" y1="86" x2="570" y2="112" stroke="#888" stroke-width="1.8"/>
  <rect x="554" y="112" width="32" height="20" rx="3" fill="rgba(136,136,136,0.15)" stroke="#888" stroke-width="1.2"/>
  <text x="608" y="126" font-size="11" fill="#888">select</text>

  <!-- 4 cells stacked -->
  <line x1="570" y1="132" x2="570" y2="142" stroke="#888" stroke-width="1.8"/>
  <g transform="translate(552,142)">
    <rect x="0" y="0" width="36" height="38" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="5" y="6"  width="26" height="7" fill="rgba(37,99,235,0.35)"/>
    <rect x="5" y="18" width="26" height="7" fill="rgba(245,158,11,0.45)"/>
  </g>
  <line x1="570" y1="180" x2="570" y2="188" stroke="#888" stroke-width="1.8"/>
  <g transform="translate(552,188)">
    <rect x="0" y="0" width="36" height="38" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="5" y="6"  width="26" height="7" fill="rgba(37,99,235,0.35)"/>
    <rect x="5" y="18" width="26" height="7" fill="rgba(245,158,11,0.45)"/>
  </g>
  <line x1="570" y1="226" x2="570" y2="234" stroke="#888" stroke-width="1.8"/>
  <g transform="translate(552,234)">
    <rect x="0" y="0" width="36" height="38" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="5" y="6"  width="26" height="7" fill="rgba(37,99,235,0.35)"/>
    <rect x="5" y="18" width="26" height="7" fill="rgba(245,158,11,0.45)"/>
  </g>
  <line x1="570" y1="272" x2="570" y2="280" stroke="#888" stroke-width="1.8"/>
  <g transform="translate(552,280)">
    <rect x="0" y="0" width="36" height="38" rx="3" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="5" y="6"  width="26" height="7" fill="rgba(37,99,235,0.35)"/>
    <rect x="5" y="18" width="26" height="7" fill="rgba(245,158,11,0.45)"/>
  </g>
  <!-- select bottom + ground -->
  <line x1="570" y1="318" x2="570" y2="326" stroke="#888" stroke-width="1.8"/>
  <rect x="554" y="326" width="32" height="20" rx="3" fill="rgba(136,136,136,0.15)" stroke="#888" stroke-width="1.2"/>
  <line x1="570" y1="346" x2="570" y2="360" stroke="#888" stroke-width="1.8"/>
  <line x1="530" y1="360" x2="610" y2="360" stroke="#059669" stroke-width="2.5"/>
  <text x="620" y="364" font-size="12" fill="#059669">source</text>

  <!-- side annotation -->
  <text x="466" y="200" font-size="12" fill="#888" text-anchor="middle">current must</text>
  <text x="466" y="216" font-size="12" fill="#888" text-anchor="middle">pass through</text>
  <text x="466" y="232" font-size="12" fill="#888" text-anchor="middle">every cell</text>
  <line x1="466" y1="240" x2="466" y2="260" stroke="#888" stroke-width="1" marker-end="url(#nng)"/>

  <text x="560" y="392" font-size="12" fill="#888" text-anchor="middle">stacked, like a NAND gate's transistors</text>
  <text x="560" y="412" font-size="12.5" fill="#888" text-anchor="middle">far denser and cheaper — but read in whole pages: the engine of SSDs</text>
</svg>
