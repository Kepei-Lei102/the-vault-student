<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 270">
  <style>text{font-family:Helvetica,Arial,sans-serif;fill:#888} .title{font-size:18px;font-weight:bold}.label{font-size:15px}.note{font-size:13px}</style>
  <text x="380" y="30" text-anchor="middle" class="title">Classify the role the computer serves</text>
  <rect x="24" y="54" width="344" height="145" rx="12" fill="rgba(37,99,235,0.12)" stroke="#2563eb"/>
  <rect x="392" y="54" width="344" height="145" rx="12" fill="rgba(5,150,105,0.12)" stroke="#059669"/>
  <text x="196" y="82" text-anchor="middle" class="title">General-purpose</text>
  <text x="196" y="112" text-anchor="middle" class="label">A platform for many kinds of task</text>
  <text x="196" y="143" text-anchor="middle" class="note">Laptop: spreadsheet, game, compiler</text>
  <text x="196" y="178" text-anchor="middle" class="note">Can contain embedded controllers</text>
  <text x="564" y="82" text-anchor="middle" class="title">Embedded</text>
  <text x="564" y="112" text-anchor="middle" class="label">A dedicated function inside a product</text>
  <text x="564" y="143" text-anchor="middle" class="note">Wash controller: sense, decide, actuate</text>
  <text x="564" y="178" text-anchor="middle" class="note">Can run an OS and receive updates</text>
  <text x="380" y="230" text-anchor="middle" class="label">Size, computing power and permission to install apps are not definitions.</text>
  <text x="380" y="252" text-anchor="middle" class="note">Ask which system is being described: the whole device or a controller inside it.</text>
</svg>
