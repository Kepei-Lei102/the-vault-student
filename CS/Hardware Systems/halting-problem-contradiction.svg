<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 700; }
    .step  { font-size: 12px; font-style: italic; }
    .lab   { font-size: 14px; font-weight: 700; }
    .body  { font-size: 13px; }
    .small { font-size: 11.5px; }
    .mono  { font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
  </style>

  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="380" y="26" class="title" text-anchor="middle">Why no halting-decider can exist</text>

  <!-- STAGE 1 -->
  <text x="46" y="88" class="step" text-anchor="start">assume</text>
  <rect x="200" y="52" width="360" height="62" rx="10" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="79" class="lab mono" text-anchor="middle" fill="#7c3aed">H(P, x): does P halt on input x?</text>
  <text x="380" y="99" class="small" text-anchor="middle">assume it ALWAYS halts and is NEVER wrong</text>

  <line x1="380" y1="114" x2="380" y2="144" stroke="#888" stroke-width="1.6" marker-end="url(#dn)"/>
  <text x="392" y="133" class="small" text-anchor="start">use H to build:</text>

  <!-- STAGE 2 -->
  <text x="46" y="198" class="step" text-anchor="start">build</text>
  <rect x="170" y="146" width="420" height="96" rx="10" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="2"/>
  <text x="380" y="170" class="lab mono" text-anchor="middle" fill="#0891b2">D(P): run H(P, P), then do the OPPOSITE</text>
  <text x="380" y="195" class="body" text-anchor="middle">H says P halts  ->  D loops forever</text>
  <text x="380" y="217" class="body" text-anchor="middle">H says P loops  ->  D halts</text>

  <line x1="380" y1="242" x2="380" y2="272" stroke="#888" stroke-width="1.6" marker-end="url(#dn)"/>
  <text x="392" y="261" class="small" text-anchor="start">now feed D its own description:</text>

  <!-- STAGE 3 -->
  <text x="46" y="300" class="step" text-anchor="start">ask</text>
  <text x="380" y="300" class="lab mono" text-anchor="middle" fill="#f59e0b">does  D(D)  halt?</text>

  <rect x="110" y="316" width="540" height="40" rx="8" fill="rgba(220,38,38,0.07)" stroke="#dc2626" stroke-width="1.6"/>
  <text x="126" y="341" class="body" text-anchor="start">If D(D) HALTS:  H said "LOOPS",  so D loops instead.</text>
  <text x="640" y="341" class="body" text-anchor="end" fill="#dc2626">contradiction</text>

  <rect x="110" y="364" width="540" height="40" rx="8" fill="rgba(220,38,38,0.07)" stroke="#dc2626" stroke-width="1.6"/>
  <text x="126" y="389" class="body" text-anchor="start">If D(D) LOOPS:  H said "HALTS",  so D halts instead.</text>
  <text x="640" y="389" class="body" text-anchor="end" fill="#dc2626">contradiction</text>

  <!-- CONCLUSION -->
  <rect x="150" y="416" width="460" height="46" rx="10" fill="rgba(220,38,38,0.12)" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="437" class="lab" text-anchor="middle" fill="#dc2626">Every answer refutes itself.</text>
  <text x="380" y="455" class="body" text-anchor="middle">No such H exists  ->  halting is UNDECIDABLE.</text>
</svg>
