<svg width="100%" viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#888" stroke-width="1.7"/>
    </marker>
    <marker id="arrB" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#2563eb" stroke-width="1.7"/>
    </marker>
    <marker id="arrA" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#f59e0b" stroke-width="1.7"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="14" font-weight="bold" fill="#888">The cycle's hidden fourth beat — and the detour</text>

  <!-- ring nodes -->
  <rect x="150" y="102" width="100" height="40" rx="7" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="200" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">FETCH</text>

  <rect x="32" y="220" width="100" height="40" rx="7" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="82" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">DECODE</text>

  <rect x="150" y="338" width="100" height="40" rx="7" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="200" y="363" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">EXECUTE</text>

  <!-- the check diamond -->
  <polygon points="318,200 392,240 318,280 244,240" fill="rgba(245,158,11,0.14)" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="318" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">interrupt</text>
  <text x="318" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">raised?</text>

  <!-- ring arrows (fetch -> decode -> execute -> check -> fetch) -->
  <path d="M 148,135 Q 90,160 80,215" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 80,265 Q 90,320 148,348" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 252,345 Q 292,320 306,286" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <path d="M 308,196 Q 290,155 254,133" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="300" y="152" font-size="10" fill="#888">no — next</text>
  <text x="300" y="166" font-size="10" fill="#888">instruction</text>

  <!-- device raising the line -->
  <rect x="243" y="400" width="150" height="42" rx="7" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="318" y="418" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">device</text>
  <text x="318" y="433" text-anchor="middle" font-size="9" fill="#888">key pressed · disk done · timer tick</text>
  <line x1="318" y1="398" x2="318" y2="286" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrB)"/>
  <text x="328" y="330" font-size="10" fill="#2563eb">interrupt line</text>
  <text x="328" y="344" font-size="10" fill="#2563eb">(control bus)</text>

  <!-- yes branch into the detour -->
  <line x1="394" y1="236" x2="470" y2="124" stroke="#f59e0b" stroke-width="1.7" marker-end="url(#arrA)"/>
  <text x="352" y="264" font-size="10" fill="#f59e0b">yes — after the current</text>
  <text x="352" y="278" font-size="10" fill="#f59e0b">instruction completes</text>

  <!-- detour column -->
  <rect x="475" y="88" width="150" height="52" rx="7" fill="rgba(245,158,11,0.14)" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="550" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888">1 · SAVE THE STATE</text>
  <text x="550" y="126" text-anchor="middle" font-size="9.5" fill="#888">PC + registers pushed to the stack</text>

  <rect x="475" y="166" width="150" height="52" rx="7" fill="rgba(8,145,178,0.13)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="550" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888">2 · VECTOR TABLE</text>
  <text x="550" y="204" text-anchor="middle" font-size="9.5" fill="#888">interrupt number, ISR address</text>

  <rect x="475" y="244" width="150" height="52" rx="7" fill="rgba(124,58,237,0.13)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="550" y="264" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888">3 · RUN THE ISR</text>
  <text x="550" y="282" text-anchor="middle" font-size="9.5" fill="#888">short, specific, then return</text>

  <rect x="475" y="322" width="150" height="52" rx="7" fill="rgba(5,150,105,0.13)" stroke="#059669" stroke-width="1.6"/>
  <text x="550" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#888">4 · RESTORE THE STATE</text>
  <text x="550" y="360" text-anchor="middle" font-size="9.5" fill="#888">pop the stack — the PC comes back</text>

  <line x1="550" y1="142" x2="550" y2="162" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="550" y1="220" x2="550" y2="240" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="550" y1="298" x2="550" y2="318" stroke="#888" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- return path -->
  <path d="M 627,348 L 685,348 Q 712,348 712,321 L 712,88 Q 712,62 685,62 L 300,62 Q 275,62 260,80 L 246,97" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="560" y="52" text-anchor="middle" font-size="10.5" fill="#888">resume as if nothing happened</text>

  <!-- caption -->
  <text x="380" y="456" text-anchor="middle" font-size="11.5" fill="#888">Fetch, decode, execute — check. The bell is only heard between instructions; the detour protects the scene first.</text>
</svg>
