<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1040 394" font-family="Arial, sans-serif"><title>raid-xor-recovery</title><text x="30" y="37" font-size="28" text-anchor="start" fill="#888">Why XOR can put a missing block back</text><text x="30" y="69" font-size="18" text-anchor="start" fill="#888">One bit column at a time; no carries between columns.</text><text x="30" y="130" font-size="18" text-anchor="start" fill="#888">A</text><rect x="280" y="104" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="297.0" y="127.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="323" y="104" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="340.0" y="127.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="366" y="104" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="383.0" y="127.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="409" y="104" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="426.0" y="127.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="452" y="104" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="469.0" y="127.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="495" y="104" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="512.0" y="127.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="538" y="104" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="555.0" y="127.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="581" y="104" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="598.0" y="127.0" font-size="18" text-anchor="middle" fill="#888">0</text><text x="30" y="178" font-size="18" text-anchor="start" fill="#888">B (recovered)</text><rect x="280" y="152" width="34" height="34" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="297.0" y="175.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="323" y="152" width="34" height="34" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="340.0" y="175.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="366" y="152" width="34" height="34" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="383.0" y="175.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="409" y="152" width="34" height="34" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="426.0" y="175.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="452" y="152" width="34" height="34" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="469.0" y="175.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="495" y="152" width="34" height="34" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="512.0" y="175.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="538" y="152" width="34" height="34" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="555.0" y="175.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="581" y="152" width="34" height="34" rx="7" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="2"/><text x="598.0" y="175.0" font-size="18" text-anchor="middle" fill="#888">1</text><text x="30" y="226" font-size="18" text-anchor="start" fill="#888">C</text><rect x="280" y="200" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="297.0" y="223.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="323" y="200" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="340.0" y="223.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="366" y="200" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="383.0" y="223.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="409" y="200" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="426.0" y="223.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="452" y="200" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="469.0" y="223.0" font-size="18" text-anchor="middle" fill="#888">0</text><rect x="495" y="200" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="512.0" y="223.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="538" y="200" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="555.0" y="223.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="581" y="200" width="34" height="34" rx="7" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-width="2"/><text x="598.0" y="223.0" font-size="18" text-anchor="middle" fill="#888">0</text><text x="30" y="274" font-size="18" text-anchor="start" fill="#888">P = A XOR B XOR C</text><rect x="280" y="248" width="34" height="34" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="297.0" y="271.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="323" y="248" width="34" height="34" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="340.0" y="271.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="366" y="248" width="34" height="34" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="383.0" y="271.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="409" y="248" width="34" height="34" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="426.0" y="271.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="452" y="248" width="34" height="34" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="469.0" y="271.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="495" y="248" width="34" height="34" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="512.0" y="271.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="538" y="248" width="34" height="34" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="555.0" y="271.0" font-size="18" text-anchor="middle" fill="#888">1</text><rect x="581" y="248" width="34" height="34" rx="7" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="598.0" y="271.0" font-size="18" text-anchor="middle" fill="#888">1</text><text x="675" y="127" font-size="23" text-anchor="start" fill="#888">B is missing.</text><text x="675" y="170" font-size="23" text-anchor="start" fill="#888">A XOR C XOR P = B</text><text x="675" y="214" font-size="20" text-anchor="start" fill="#888">10100101 is recovered.</text><text x="30" y="330" font-size="21" text-anchor="start" fill="#888">WHY: A XOR A = 0, C XOR C = 0, and 0 XOR B = B.</text><text x="30" y="367" font-size="18" text-anchor="start" fill="#888">Known location matters: one parity relation alone cannot locate an arbitrary corrupt block.</text></svg>
