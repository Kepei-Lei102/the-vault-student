<svg width="100%" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrQ" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#888" stroke-width="1.7"/>
    </marker>
    <marker id="arrQa" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#f59e0b" stroke-width="1.7"/>
    </marker>
    <marker id="arrQg" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#059669" stroke-width="1.7"/>
    </marker>
  </defs>

  <text x="20" y="26" font-size="14" font-weight="bold" fill="#888">Two structures run the show</text>

  <!-- ================= left: the pending queue ================= -->
  <text x="150" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#0891b2">the PENDING QUEUE</text>
  <text x="150" y="82" text-anchor="middle" font-size="10" fill="#888">who rings next — ordered by priority</text>

  <!-- new arrival dropping in -->
  <circle cx="66" cy="118" r="14" fill="rgba(8,145,178,0.15)" stroke="#0891b2" stroke-width="1.5"/>
  <text x="66" y="122" text-anchor="middle" font-size="9" font-weight="bold" fill="#888">P3</text>
  <line x1="84" y1="126" x2="112" y2="152" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrQ)"/>
  <text x="60" y="148" font-size="9" fill="#888">a new bell</text>
  <text x="60" y="160" font-size="9" fill="#888">joins by rank</text>

  <!-- the queue, head at right -->
  <rect x="40" y="168" width="66" height="40" rx="6" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.3"/>
  <text x="73" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#888">P7</text>
  <text x="73" y="199" text-anchor="middle" font-size="8.5" fill="#888">keyboard</text>

  <rect x="112" y="168" width="66" height="40" rx="6" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1.3"/>
  <text x="145" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#888">P4</text>
  <text x="145" y="199" text-anchor="middle" font-size="8.5" fill="#888">disk done</text>

  <rect x="184" y="168" width="66" height="40" rx="6" fill="rgba(8,145,178,0.20)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="217" y="185" text-anchor="middle" font-size="10" font-weight="bold" fill="#888">P1</text>
  <text x="217" y="199" text-anchor="middle" font-size="8.5" fill="#888">power!</text>

  <text x="145" y="228" text-anchor="middle" font-size="9" fill="#888">lowest rank waits at the back</text>

  <!-- head served -->
  <line x1="254" y1="188" x2="308" y2="188" stroke="#888" stroke-width="1.6" marker-end="url(#arrQ)"/>
  <text x="281" y="177" text-anchor="middle" font-size="9" fill="#888">served next</text>

  <!-- ================= centre: the CPU ================= -->
  <rect x="312" y="150" width="136" height="76" rx="9" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="2"/>
  <text x="380" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">CPU</text>
  <text x="380" y="198" text-anchor="middle" font-size="9.5" fill="#888">one core, one job at a time —</text>
  <text x="380" y="212" text-anchor="middle" font-size="9.5" fill="#888">currently: the served ISR</text>

  <!-- ================= right: the stack of scenes ================= -->
  <text x="600" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#f59e0b">the STACK of scenes</text>
  <text x="600" y="82" text-anchor="middle" font-size="10" fill="#888">who resumes next — last suspended, first resumed</text>

  <!-- push / pop arrows -->
  <line x1="452" y1="168" x2="524" y2="128" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrQa)"/>
  <text x="462" y="128" font-size="9" fill="#f59e0b">preempted?</text>
  <text x="462" y="140" font-size="9" fill="#f59e0b">push the scene</text>

  <line x1="524" y1="212" x2="452" y2="204" stroke="#059669" stroke-width="1.6" marker-end="url(#arrQg)"/>
  <text x="452" y="244" font-size="9" fill="#059669">ISR done?</text>
  <text x="452" y="256" font-size="9" fill="#059669">pop and resume</text>

  <!-- the stack, top open -->
  <rect x="530" y="108" width="140" height="42" rx="6" fill="rgba(5,150,105,0.16)" stroke="#059669" stroke-width="1.4"/>
  <text x="600" y="126" text-anchor="middle" font-size="10" font-weight="bold" fill="#888">low ISR — preempted</text>
  <text x="600" y="141" text-anchor="middle" font-size="8.5" fill="#888">its PC + registers, parked</text>

  <rect x="530" y="156" width="140" height="42" rx="6" fill="rgba(37,99,235,0.16)" stroke="#2563eb" stroke-width="1.4"/>
  <text x="600" y="174" text-anchor="middle" font-size="10" font-weight="bold" fill="#888">main program — paused</text>
  <text x="600" y="189" text-anchor="middle" font-size="8.5" fill="#888">its scene, safe underneath</text>

  <!-- stack floor -->
  <line x1="530" y1="210" x2="670" y2="210" stroke="#888" stroke-width="2"/>
  <text x="600" y="228" text-anchor="middle" font-size="9" fill="#888">the floor — empty stack = an idle machine</text>

  <!-- caption -->
  <text x="380" y="296" text-anchor="middle" font-size="11.5" fill="#888">The queue decides who rings next: arrivals jump the line by rank, whatever order the bells rang.</text>
  <text x="380" y="314" text-anchor="middle" font-size="11.5" fill="#888">The stack decides who resumes next: strictly last-suspended, first-resumed, no exceptions.</text>
  <text x="380" y="340" text-anchor="middle" font-size="11" fill="#888">One structure for the waiting; one for the waited-on. Confusing them is the classic six-marker wobble.</text>
</svg>
