   <g id="text_1">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(93.240563 79.901062)">COLLECT</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(48.929125 91.00625)">a lawful basis, stated openly;</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(49.12575 102.88625)">only what the purpose needs</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(81.342688 115.101062)">(minimisation)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(299.318062 79.901062)">STORE</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(253.903188 91.00625)">kept accurate, kept secure:</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(257.374375 102.88625)">access levels, encryption,</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(272.84175 115.61875)">breach notification</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(506.186188 79.901062)">USE</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(456.816813 91.00625)">only for the purpose given</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(469.987938 102.88625)">(purpose limitation);</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(461.817688 114.76625)">no surprise second uses</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(98.270313 210.185062)">SHARE</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(50.980625 221.29025)">a processor acts only on the</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(43.109438 233.573812)">controller's written instructions;</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(57.34 245.05025)">the controller stays liable</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(281.577813 210.185062)">SEND ABROAD</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(260.189687 221.29025)">only to where protection</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(258.187688 233.17025)">travels with it: adequacy,</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(261.050438 245.200125)">contract, or assessment</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(498.112188 210.189875)">DELETE</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(456.5865 221.29025)">when the purpose is spent</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(452.05175 233.17025)">(storage limitation), or when</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(458.507375 245.05025)">the person asks (erasure)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="314.1" y="23.832" transform="rotate(-0 314.1 23.832)">The life of one piece of personal data, and the principle that binds each stage</text>
   </g>
   <g id="text_8">
    <text style="font-style: italic; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="314.1" y="301.032" transform="rotate(-0 314.1 301.032)">at every stage the person keeps their rights: to be told, to see a copy, to correct, to erase, to object, to take the data elsewhere</text>
   </g>
  </g>
 </g>
