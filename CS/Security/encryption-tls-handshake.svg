<svg width="100%" viewBox="0 0 900 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#888"/></marker></defs>
  <text x="450" y="28" text-anchor="middle" fill="#888" font-weight="bold" font-size="15">What happens in the padlock: a TLS handshake, in five lines</text>
  <text x="110" y="62" text-anchor="middle" fill="#888" font-weight="bold">your browser</text>
  <text x="110" y="78" text-anchor="middle" fill="#888" font-size="11">holds ~150 CA public keys (the root store)</text>
  <text x="790" y="62" text-anchor="middle" fill="#888" font-weight="bold">bank.example</text>
  <text x="790" y="78" text-anchor="middle" fill="#888" font-size="11">holds its own PRIVATE key + a certificate</text>
  <line x1="110" y1="90" x2="110" y2="440" stroke="#888" stroke-width="1.5"/><line x1="790" y1="90" x2="790" y2="440" stroke="#888" stroke-width="1.5"/>
  <!-- 1 -->
  <path d="M120 120 L780 120" stroke="#2563eb" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="450" y="112" text-anchor="middle" fill="#888">1 · "hello — here are the ciphers I speak, and my half of a key exchange"</text>
  <!-- 2 -->
  <path d="M780 175 L120 175" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="450" y="167" text-anchor="middle" fill="#888">2 · "hello — my half of the key exchange, and my CERTIFICATE (my public key, signed by a CA)"</text>
  <!-- 3 -->
  <rect x="130" y="200" width="300" height="58" rx="6" fill="rgba(245,158,11,0.12)" stroke="#f59e0b"/>
  <text x="280" y="220" text-anchor="middle" fill="#888" font-size="12">3 · browser checks the CA's SIGNATURE on the certificate</text>
  <text x="280" y="236" text-anchor="middle" fill="#888" font-size="12">with the CA's PUBLIC key it already has,</text>
  <text x="280" y="251" text-anchor="middle" fill="#888" font-size="12">and that the name inside matches bank.example</text>
  <!-- 4 -->
  <rect x="470" y="200" width="300" height="58" rx="6" fill="rgba(245,158,11,0.12)" stroke="#f59e0b"/>
  <text x="620" y="220" text-anchor="middle" fill="#888" font-size="12">4 · server SIGNS the handshake so far with its</text>
  <text x="620" y="236" text-anchor="middle" fill="#888" font-size="12">PRIVATE key — proving it owns the key in the</text>
  <text x="620" y="251" text-anchor="middle" fill="#888" font-size="12">certificate, not merely a copy of the certificate</text>
  <!-- 5 -->
  <rect x="250" y="285" width="400" height="60" rx="6" fill="rgba(5,150,105,0.12)" stroke="#059669"/>
  <text x="450" y="305" text-anchor="middle" fill="#888" font-size="12">5 · both halves combine (Diffie–Hellman) into one shared secret</text>
  <text x="450" y="321" text-anchor="middle" fill="#888" font-size="12">that was never transmitted; from it, SYMMETRIC session keys (AES)</text>
  <text x="450" y="337" text-anchor="middle" fill="#888" font-size="12">— every byte of the page from here on is symmetric, fast, and fresh per session</text>
  <path d="M120 380 L780 380" stroke="#059669" stroke-width="2.5" marker-end="url(#a2)"/><path d="M780 400 L120 400" stroke="#059669" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="450" y="372" text-anchor="middle" fill="#059669" font-size="12">AES-encrypted traffic, both ways</text>
  <text x="450" y="432" text-anchor="middle" fill="#888" font-size="12">asymmetric work happens exactly twice (verify a signature, make one) and then never again; the public key's job is to bootstrap a private, symmetric channel</text>
  <text x="450" y="452" text-anchor="middle" fill="#dc2626" font-size="12">the private key stays on the server the whole time — nothing secret is ever sent</text>
</svg>
