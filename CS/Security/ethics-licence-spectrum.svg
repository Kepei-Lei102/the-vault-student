<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 980 360" font-family="Helvetica, Arial, sans-serif">
  <!-- The licence spectrum: from no restrictions to no rights -->
  <defs>
    <marker id="ls-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>
  <text x="490" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#888">The licence spectrum: what the person who receives the code may do</text>
  <line x1="40" y1="60" x2="940" y2="60" stroke="#888" stroke-width="2" marker-end="url(#ls-arrow)" marker-start="url(#ls-arrow)"/>
  <text x="40" y="48" font-size="11" fill="#888">most freedom for the receiver</text>
  <text x="940" y="48" text-anchor="end" font-size="11" fill="#888">most control for the author</text>

  <!-- six boxes -->
  <g stroke-width="1.5">
    <rect x="40" y="80" width="140" height="150" rx="6" stroke="#059669" fill="rgba(5,150,105,0.12)"/>
    <rect x="192" y="80" width="140" height="150" rx="6" stroke="#059669" fill="rgba(5,150,105,0.12)"/>
    <rect x="344" y="80" width="140" height="150" rx="6" stroke="#0891b2" fill="rgba(8,145,178,0.12)"/>
    <rect x="496" y="80" width="140" height="150" rx="6" stroke="#2563eb" fill="rgba(37,99,235,0.12)"/>
    <rect x="648" y="80" width="140" height="150" rx="6" stroke="#f59e0b" fill="rgba(245,158,11,0.14)"/>
    <rect x="800" y="80" width="140" height="150" rx="6" stroke="#dc2626" fill="rgba(220,38,38,0.12)"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#888" text-anchor="middle">
    <text x="110" y="100">Public domain</text>
    <text x="262" y="100">Permissive</text>
    <text x="414" y="100">Weak copyleft</text>
    <text x="566" y="100">Strong copyleft</text>
    <text x="718" y="100">Shareware</text>
    <text x="870" y="100">Commercial</text>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="110" y="118">CC0, Unlicense</text>
    <text x="262" y="118">MIT, BSD, Apache 2.0</text>
    <text x="414" y="118">LGPL, MPL</text>
    <text x="566" y="118">GPL, AGPL</text>
    <text x="718" y="118">try, then pay</text>
    <text x="870" y="118">proprietary, EULA</text>
  </g>
  <g font-size="10" fill="#888">
    <text x="48" y="140">source: yes</text>
    <text x="48" y="156">modify: yes</text>
    <text x="48" y="172">redistribute: yes</text>
    <text x="48" y="188">must share changes: no</text>
    <text x="48" y="204">must keep notice: no</text>
    <text x="48" y="220">fee: none</text>

    <text x="200" y="140">source: yes</text>
    <text x="200" y="156">modify: yes</text>
    <text x="200" y="172">redistribute: yes</text>
    <text x="200" y="188">must share changes: no</text>
    <text x="200" y="204">must keep notice: YES</text>
    <text x="200" y="220">fee: none</text>

    <text x="352" y="140">source: yes</text>
    <text x="352" y="156">modify: yes</text>
    <text x="352" y="172">redistribute: yes</text>
    <text x="352" y="188">share changes: to the library</text>
    <text x="352" y="204">your own program: may close</text>
    <text x="352" y="220">fee: none</text>

    <text x="504" y="140">source: yes</text>
    <text x="504" y="156">modify: yes</text>
    <text x="504" y="172">redistribute: yes</text>
    <text x="504" y="188">share changes: EVERYTHING</text>
    <text x="504" y="204">under the same licence</text>
    <text x="504" y="220">fee: none for the code</text>

    <text x="656" y="140">source: no</text>
    <text x="656" y="156">modify: no</text>
    <text x="656" y="172">redistribute: the trial, often</text>
    <text x="656" y="188">trial period or limited</text>
    <text x="656" y="204">features, then a fee</text>
    <text x="656" y="220">fee: after the trial</text>

    <text x="808" y="140">source: no</text>
    <text x="808" y="156">modify: no</text>
    <text x="808" y="172">redistribute: no</text>
    <text x="808" y="188">limits on installs / users</text>
    <text x="808" y="204">support and updates included</text>
    <text x="808" y="220">fee: yes, up front</text>
  </g>

  <!-- brackets for the exam's four names -->
  <path d="M192,246 L192,256 L636,256 L636,246" stroke="#888" stroke-width="1.2" fill="none"/>
  <text x="414" y="272" text-anchor="middle" font-size="11" fill="#888">"free software" (FSF: the four freedoms) and "open source" (OSI) both live here</text>
  <path d="M648,246 L648,256 L940,256 L940,246" stroke="#888" stroke-width="1.2" fill="none"/>
  <text x="794" y="272" text-anchor="middle" font-size="11" fill="#888">closed source: the receiver never sees the code</text>

  <text x="490" y="304" text-anchor="middle" font-size="11" fill="#dc2626">Freeware is NOT here: free of charge but closed source, no right to modify. Free software is about freedom, freeware about price.</text>
  <text x="490" y="324" text-anchor="middle" font-size="11" fill="#888">Copyright is what makes every one of these enforceable: the author owns the code, the licence is the permission they attach.</text>
  <text x="490" y="344" text-anchor="middle" font-size="11" fill="#888">The dividing question is not "does it cost money" but "what may the receiver do, and what must they do in return".</text>
</svg>
