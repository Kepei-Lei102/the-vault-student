<svg xmlns='http://www.w3.org/2000/svg' width='100%' viewBox='0 0 910 285' font-family='Helvetica, Arial, sans-serif'><text x='160' y='22' font-size='13' text-anchor='middle' fill='#888' font-weight='bold'>The stack frame of a careless function</text><rect x='40' y='40' width='240' height='34' fill='rgba(136,136,136,0.15)' stroke='rgb(136,136,136)' stroke-width='1.5'/><text x='160.0' y='61.0' text-anchor='middle' font-size='12' font-weight='bold' fill='#888'>caller's frame</text><rect x='40' y='74' width='240' height='40' fill='rgba(37,99,235,0.15)' stroke='rgb(37,99,235)' stroke-width='1.5'/><text x='160.0' y='92' text-anchor='middle' font-size='12' font-weight='bold' fill='#888'>return address</text><text x='160.0' y='107' text-anchor='middle' font-size='10.5' fill='#888'>where to go when this function ends</text><rect x='40' y='114' width='240' height='28' fill='rgba(136,136,136,0.15)' stroke='rgb(136,136,136)' stroke-width='1.5'/><text x='160.0' y='132.0' text-anchor='middle' font-size='12' font-weight='bold' fill='#888'>saved frame pointer</text><rect x='40' y='142' width='240' height='110' fill='rgba(5,150,105,0.15)' stroke='rgb(5,150,105)' stroke-width='1.5'/><text x='160.0' y='160' text-anchor='middle' font-size='12' font-weight='bold' fill='#888'>char name[64]</text><text x='160.0' y='175' text-anchor='middle' font-size='10.5' fill='#888'>the buffer — filled by gets(),</text><text x='160.0' y='188' text-anchor='middle' font-size='10.5' fill='#888'>which never checks the length</text><text x='292' y='58' font-size='10' text-anchor='start' fill='#888' font-weight='normal'>higher addresses</text><text x='292' y='250' font-size='10' text-anchor='start' fill='#888' font-weight='normal'>lower addresses</text><path d='M160.0,250 L160.0,96' stroke='#dc2626' stroke-width='7' opacity='0.3' fill='none'/><polygon points='160.0,82 151.0,100 169.0,100' fill='#dc2626' opacity='0.8'/><text x='292' y='110' font-size='11' text-anchor='start' fill='#dc2626' font-weight='normal'>a 100-byte input keeps</text><text x='292' y='124' font-size='11' text-anchor='start' fill='#dc2626' font-weight='normal'>writing upward past the</text><text x='292' y='138' font-size='11' text-anchor='start' fill='#dc2626' font-weight='normal'>end of the buffer…</text><text x='292' y='152' font-size='11' text-anchor='start' fill='#dc2626' font-weight='normal'>…and overwrites the return</text><text x='292' y='166' font-size='11' text-anchor='start' fill='#dc2626' font-weight='normal'>address with one the</text><text x='292' y='180' font-size='11' text-anchor='start' fill='#dc2626' font-weight='normal'>attacker chose</text><text x='680' y='22' font-size='13' text-anchor='middle' fill='#888' font-weight='bold'>Three walls, each answering one move of the attack</text><rect x='470' y='40' width='420' height='62' fill='rgba(245,158,11,0.15)' stroke='rgb(245,158,11)' stroke-width='1.5'/><text x='680.0' y='58' text-anchor='middle' font-size='12' font-weight='bold' fill='#888'>Stack canary (StackGuard, 1998)</text><text x='680.0' y='73' text-anchor='middle' font-size='10.5' fill='#888'>a secret value sits just below the return address and is checked</text><text x='680.0' y='86' text-anchor='middle' font-size='10.5' fill='#888'>before returning — if it changed, an overflow happened: abort</text><rect x='470' y='112' width='420' height='62' fill='rgba(124,58,237,0.15)' stroke='rgb(124,58,237)' stroke-width='1.5'/><text x='680.0' y='130' text-anchor='middle' font-size='12' font-weight='bold' fill='#888'>NX / DEP / W^X (AMD 2003, Windows XP SP2 2004)</text><text x='680.0' y='145' text-anchor='middle' font-size='10.5' fill='#888'>memory is writable or executable, never both — the bytes</text><text x='680.0' y='158' text-anchor='middle' font-size='10.5' fill='#888'>the attacker wrote into the buffer cannot be run as code</text><rect x='470' y='184' width='420' height='62' fill='rgba(37,99,235,0.15)' stroke='rgb(37,99,235)' stroke-width='1.5'/><text x='680.0' y='202' text-anchor='middle' font-size='12' font-weight='bold' fill='#888'>ASLR (PaX 2001 · Linux 2005 · Vista 2007)</text><text x='680.0' y='217' text-anchor='middle' font-size='10.5' fill='#888'>stack, heap and libraries land at a different address every run —</text><text x='680.0' y='230' text-anchor='middle' font-size='10.5' fill='#888'>the attacker's chosen return address points at nothing, twice</text><text x='680' y='268' font-size='10' text-anchor='middle' fill='#888' font-weight='normal'>a teaching lab switches ASLR off so the address the students compute is the one the program has</text></svg>