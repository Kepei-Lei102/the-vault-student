   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(50.208047 138.861141)">DATA SUBJECT</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(37.908281 151.055437)">the person the data</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(53.306719 163.205437)">is about: you</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(297.59625 133.622859)">CONTROLLER</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(278.222344 144.980437)">decides why and how:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(283.230703 157.130437)">the school, the app,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(308.162813 170.152312)">the bank</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(545.819063 133.622859)">PROCESSOR</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(529.112109 145.852312)">handles it for them:</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(539.994375 157.543172)">the cloud host,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(539.053594 169.280437)">the payroll firm</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(300.542344 39.050859)">REGULATOR</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(269.801016 50.408437)">investigates, orders, fines</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #2563eb" transform="translate(173.67375 110.922144)">personal data,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #2563eb" transform="translate(162.3625 120.524331)">under a lawful basis</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #7c3aed" transform="translate(173.0875 184.657344)">notice, a copy,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #7c3aed" transform="translate(164.664375 194.259531)">correction, erasure</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #7c3aed" transform="translate(439.440625 110.922144)">written</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #7c3aed" transform="translate(430.1775 120.524331)">instructions</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0891b2" transform="translate(439.299375 184.657031)">reports</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0891b2" transform="translate(435.3125 194.259219)">breaches</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #2563eb" x="142.515" y="63.332437" transform="rotate(-0 142.515 63.332437)">complains</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(64.85025 232.257594)">GDPR says controller and processor; China's PIPL says personal information handler (who decides) and entrusted party.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(99.190187 242.82)">The test is the same in both: who decides the purpose? That party answers for everything downstream.</text>
   </g>
  </g>
 </g>
