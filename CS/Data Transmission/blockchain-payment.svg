<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 576" role="img" aria-label="Payment through signature, validation, block proposal and agreement"><title>Payment through signature, validation, block proposal and agreement</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#888" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><text x="380" y="32" text-anchor="middle" font-size="21" fill="#888">A payment: authorise → validate → propose → agree</text><rect x="35" y="60" width="690" height="91" rx="12" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/><text x="380" y="92" text-anchor="middle" font-size="20" fill="#888">1  Wallet signs and broadcasts</text><text x="380" y="124" text-anchor="middle" font-size="17" fill="#888">Payment data + authorisation; private key stays private</text><path d="M380,155 L380,179" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="183" width="690" height="91" rx="12" fill="#7c3aed" fill-opacity="0.10" stroke="#7c3aed" stroke-width="2"/><text x="380" y="215" text-anchor="middle" font-size="20" fill="#888">2  Peers validate</text><text x="380" y="247" text-anchor="middle" font-size="17" fill="#888">Check signature, available funds and no repeated spend</text><path d="M380,278 L380,302" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="306" width="690" height="91" rx="12" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="2"/><text x="380" y="338" text-anchor="middle" font-size="20" fill="#888">3  A producer proposes a block</text><text x="380" y="370" text-anchor="middle" font-size="17" fill="#888">Batch records + timestamp + previous-block hash</text><path d="M380,401 L380,425" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="429" width="690" height="91" rx="12" fill="#059669" fill-opacity="0.10" stroke="#059669" stroke-width="2"/><text x="380" y="461" text-anchor="middle" font-size="20" fill="#888">4  Nodes validate and apply consensus rules</text><text x="380" y="493" text-anchor="middle" font-size="17" fill="#888">Accept a history; update ledger copies as it propagates</text><text x="380" y="551" text-anchor="middle" font-size="17" fill="#888">A valid signature is not a guarantee of funds, freshness or finality.</text></g></svg>
