<svg width="100%" viewBox="0 0 960 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="480" y="24" text-anchor="middle" fill="#888" font-weight="bold" font-size="15">Three addresses on one laptop</text>
<rect x="30" y="38" width="900" height="78" rx="8" fill="rgba(0,0,0,0)" stroke="#f59e0b" stroke-width="1.2"/>
<text x="45" y="60" fill="#888" font-weight="bold">MAC address</text><text x="190" y="60" fill="#888" font-family="Menlo, Consolas, monospace" font-size="17">3C:22:FB:9A:12:7E</text>
<text x="45" y="82" fill="#888" font-size="11">48 bits · hexadecimal · this factory-assigned example identifies the NIC; software can use a local or randomised address</text>
<text x="45" y="102" fill="#888" font-family="Menlo, Consolas, monospace" font-size="12">3C:22:FB</text><text x="112.2" y="102" fill="#888" font-size="11">= manufacturer (Apple)</text>
<text x="274.2" y="102" fill="#888" font-family="Menlo, Consolas, monospace" font-size="12">9A:12:7E</text><text x="341.4" y="102" fill="#888" font-size="11">= device identifier</text>
<rect x="30" y="130" width="900" height="78" rx="8" fill="rgba(0,0,0,0)" stroke="#2563eb" stroke-width="1.2"/>
<text x="45" y="152" fill="#888" font-weight="bold">IPv4 address</text><text x="190" y="152" fill="#888" font-family="Menlo, Consolas, monospace" font-size="17">192.168.1.37</text>
<text x="45" y="174" fill="#888" font-size="11">32 bits · four numbers from 0 to 255 · private example assigned by home DHCP; not globally routed</text>
<text x="45" y="194" fill="#888" font-family="Menlo, Consolas, monospace" font-size="12">192.168.1</text><text x="119.60000000000001" y="194" fill="#888" font-size="11">= network (/24)</text>
<text x="197.10000000000002" y="194" fill="#888" font-family="Menlo, Consolas, monospace" font-size="12">37</text><text x="219.90000000000003" y="194" fill="#888" font-size="11">= host</text>
<rect x="30" y="222" width="900" height="78" rx="8" fill="rgba(0,0,0,0)" stroke="#7c3aed" stroke-width="1.2"/>
<text x="45" y="244" fill="#888" font-weight="bold">IPv6 address</text><text x="190" y="244" fill="#888" font-family="Menlo, Consolas, monospace" font-size="17">2001:db8::8a2e:370</text>
<text x="45" y="266" fill="#888" font-size="11">128 bits · eight groups of four hex digits · one run of zero groups can collapse to :: · 3.4 × 10^38 possible addresses</text>
<text x="45" y="286" fill="#888" font-family="Menlo, Consolas, monospace" font-size="12">2001:0db8:0000:0000:0000:0000:8a2e:0370</text><text x="341.6" y="286" fill="#888" font-size="11">= the same address written in full</text>
<text x="480" y="322" text-anchor="middle" fill="#888" font-size="12">Typical home NAT shares a public IPv4 address; MAC addresses work on a local link, IP addresses route between networks.</text>
</svg>