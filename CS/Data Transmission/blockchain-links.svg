<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 614" role="img" aria-label="Original and edited hash-linked histories"><title>Original and edited hash-linked histories</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#888" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><text x="380" y="30" text-anchor="middle" font-size="21" fill="#888">Changing a record changes what later blocks refer to</text><text x="195" y="70" text-anchor="middle" font-size="19" fill="#888">Original history</text><text x="565" y="70" text-anchor="middle" font-size="19" fill="#888">Edited copy</text><rect x="30" y="92" width="330" height="108" rx="12" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/><text x="195" y="119" text-anchor="middle" font-size="18" fill="#888">Block 1</text><text x="195" y="148" text-anchor="middle" font-size="17" fill="#888">Alice pays Bob 7</text><text x="195" y="176" text-anchor="middle" font-size="17" fill="#888">hash = h1</text><path d="M195,205 L195,242" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="249" width="330" height="108" rx="12" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/><text x="195" y="276" text-anchor="middle" font-size="18" fill="#888">Block 2</text><text x="195" y="305" text-anchor="middle" font-size="17" fill="#888">previous hash = h1</text><text x="195" y="333" text-anchor="middle" font-size="17" fill="#888">hash = h2</text><path d="M195,362 L195,399" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="406" width="330" height="108" rx="12" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="2"/><text x="195" y="433" text-anchor="middle" font-size="18" fill="#888">Block 3</text><text x="195" y="462" text-anchor="middle" font-size="17" fill="#888">previous hash = h2</text><text x="195" y="490" text-anchor="middle" font-size="17" fill="#888">hash = h3</text><rect x="400" y="92" width="330" height="108" rx="12" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="2"/><text x="565" y="119" text-anchor="middle" font-size="18" fill="#888">Block 1</text><text x="565" y="148" text-anchor="middle" font-size="17" fill="#888">Alice pays Bob 6</text><text x="565" y="176" text-anchor="middle" font-size="17" fill="#888">new hash = h1′</text><path d="M565,205 L565,242" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/><rect x="400" y="249" width="330" height="108" rx="12" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="2"/><text x="565" y="276" text-anchor="middle" font-size="18" fill="#888">Block 2</text><text x="565" y="305" text-anchor="middle" font-size="17" fill="#888">previous hash = h1</text><text x="565" y="333" text-anchor="middle" font-size="17" fill="#888">link fails: h1 ≠ h1′</text><path d="M565,362 L565,399" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/><rect x="400" y="406" width="330" height="108" rx="12" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-width="2"/><text x="565" y="433" text-anchor="middle" font-size="18" fill="#888">Block 3</text><text x="565" y="462" text-anchor="middle" font-size="17" fill="#888">previous hash = h2</text><text x="565" y="490" text-anchor="middle" font-size="17" fill="#888">repair above → changes here</text><text x="380" y="562" text-anchor="middle" font-size="18" fill="#888">Repairing every later hash can make a local copy consistent.</text><text x="380" y="590" text-anchor="middle" font-size="18" fill="#888">It cannot make the network accept that history.</text></g></svg>
