<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .hd   { font-size: 14px; font-weight: 600; }
    .lbl  { font-size: 12.5px; }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .note { font-size: 12.5px; }
    .step { font-size: 12.5px; }
  </style>

  <defs>
    <marker id="rt" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="gn" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- program -->
  <rect x="40" y="130" width="170" height="92" rx="4"
        fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="2"/>
  <text x="125" y="120" class="hd" text-anchor="middle">your program</text>
  <text x="125" y="168" class="lbl" text-anchor="middle">variables in RAM</text>
  <text x="125" y="190" class="lbl" text-anchor="middle">gone when it ends</text>

  <!-- buffer -->
  <rect x="310" y="130" width="176" height="92" rx="4"
        fill="rgba(245,158,11,0.18)" stroke="#f59e0b" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="398" y="120" class="hd" text-anchor="middle">buffer</text>
  <text x="398" y="168" class="lbl" text-anchor="middle">still in RAM</text>
  <text x="398" y="190" class="lbl" text-anchor="middle" fill="#dc2626">not saved yet</text>

  <!-- file -->
  <rect x="596" y="112" width="200" height="128" rx="4"
        fill="rgba(8,145,178,0.12)" stroke="#0891b2" stroke-width="2"/>
  <text x="696" y="102" class="hd" text-anchor="middle">the file, on disk</text>

  <rect x="612" y="124" width="168" height="24" fill="rgba(8,145,178,0.18)" stroke="#0891b2" stroke-width="1"/>
  <rect x="612" y="150" width="168" height="24" fill="rgba(8,145,178,0.18)" stroke="#0891b2" stroke-width="1"/>
  <rect x="612" y="176" width="168" height="24" fill="rgba(5,150,105,0.28)" stroke="#059669" stroke-width="1.8"/>
  <rect x="612" y="202" width="168" height="24" fill="rgba(8,145,178,0.18)" stroke="#0891b2" stroke-width="1"/>
  <text x="696" y="141" class="mono" text-anchor="middle">line 1</text>
  <text x="696" y="167" class="mono" text-anchor="middle">line 2</text>
  <text x="696" y="193" class="mono" text-anchor="middle">line 3</text>
  <text x="696" y="219" class="mono" text-anchor="middle">line 4</text>

  <!-- file pointer, clear of both arrow rows -->
  <path d="M 800 188 L 814 181 L 814 195 Z" fill="#059669"/>
  <text x="820" y="192" class="lbl" fill="#059669">pointer</text>

  <!-- reading: upper level, right to left -->
  <line x1="592" y1="152" x2="492" y2="152" stroke="#888" stroke-width="2" marker-end="url(#rt)"/>
  <line x1="304" y1="152" x2="216" y2="152" stroke="#888" stroke-width="2" marker-end="url(#rt)"/>
  <text x="541" y="142" class="lbl" text-anchor="middle">read</text>
  <text x="259" y="142" class="lbl" text-anchor="middle">read</text>

  <!-- writing: lower level, left to right -->
  <line x1="214" y1="200" x2="304" y2="200" stroke="#888" stroke-width="2" marker-end="url(#rt)"/>
  <line x1="490" y1="200" x2="590" y2="200" stroke="#059669" stroke-width="2" marker-end="url(#gn)"/>
  <text x="259" y="218" class="lbl" text-anchor="middle">write</text>
  <text x="540" y="218" class="lbl" text-anchor="middle" fill="#059669">only on close</text>

  <!-- steps -->
  <line x1="52" y1="266" x2="828" y2="266" stroke="#888" stroke-width="1" opacity="0.3"/>

  <text x="60" y="294" class="step" fill="#2563eb">open</text>
  <text x="140" y="294" class="step">resolve the name, check permission, make a buffer, set the pointer to the start</text>

  <text x="60" y="322" class="step" fill="#2563eb">read</text>
  <text x="140" y="322" class="step">hand back the next piece and advance the pointer past it</text>

  <text x="60" y="350" class="step" fill="#2563eb">write</text>
  <text x="140" y="350" class="step">put the data in the buffer &#8212; the disk has not been touched</text>

  <text x="60" y="378" class="step" fill="#2563eb">close</text>
  <text x="140" y="378" class="step">empty the buffer to the disk, then release the connection</text>

  <line x1="52" y1="404" x2="828" y2="404" stroke="#888" stroke-width="1" opacity="0.3"/>
  <text x="440" y="428" class="note" text-anchor="middle">EOF is not a character in the file. It is the question &#8220;has the pointer reached the end?&#8221;</text>
  <text x="440" y="450" class="note" text-anchor="middle">Skip the close and the tail of your data was never written &#8212; and nothing reported an error.</text>
</svg>
