<text x="560" y="160" text-anchor="start" fill="#888" font-size="13">in-order (bottom): 8 10 20 22 26</text>
<text x="560" y="180" text-anchor="start" fill="#888" font-size="11.5">&#8212; sorted, always, for any BST</text>
<text x="560" y="220" text-anchor="start" fill="#888" font-size="13">post-order (right flank): 8 10 22 26 20</text>
<text x="250" y="375" text-anchor="middle" fill="#888" font-size="12.5">the expression tree of (3 + 4) &#215; 5</text>
