<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 13.5px; font-weight: 600; }
    .cell  { font-size: 12.5px; }
    .lbl   { font-size: 12px; }
    .form  { font-size: 15.5px; font-weight: 600; }
    .note  { font-size: 12.5px; }
  </style>

  <text x="440" y="30" class="title" text-anchor="middle">What the notation shows you</text>

  <!-- ===== the grid ===== -->
  <g>
    <rect x="290" y="46" width="80" height="46" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="370" y="46" width="80" height="46" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="450" y="46" width="80" height="46" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="530" y="46" width="80" height="46" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.6"/>

    <rect x="290" y="92" width="80" height="46" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="370" y="92" width="80" height="46" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="450" y="92" width="80" height="46" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="530" y="92" width="80" height="46" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.6"/>

    <rect x="290" y="138" width="80" height="46" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.6"/>
    <rect x="370" y="138" width="80" height="46" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.6"/>
    <rect x="450" y="138" width="80" height="46" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.6"/>
    <rect x="530" y="138" width="80" height="46" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.6"/>

    <text x="330" y="74" class="cell" text-anchor="middle">0,0</text>
    <text x="410" y="74" class="cell" text-anchor="middle">0,1</text>
    <text x="490" y="74" class="cell" text-anchor="middle">0,2</text>
    <text x="570" y="74" class="cell" text-anchor="middle">0,3</text>

    <text x="330" y="120" class="cell" text-anchor="middle">1,0</text>
    <text x="410" y="120" class="cell" text-anchor="middle">1,1</text>
    <text x="490" y="120" class="cell" text-anchor="middle">1,2</text>
    <text x="570" y="120" class="cell" text-anchor="middle">1,3</text>

    <text x="330" y="166" class="cell" text-anchor="middle">2,0</text>
    <text x="410" y="166" class="cell" text-anchor="middle">2,1</text>
    <text x="490" y="166" class="cell" text-anchor="middle">2,2</text>
    <text x="570" y="166" class="cell" text-anchor="middle">2,3</text>

    <text x="278" y="74"  class="lbl" text-anchor="end" fill="#2563eb">row 0</text>
    <text x="278" y="120" class="lbl" text-anchor="end" fill="#7c3aed">row 1</text>
    <text x="278" y="166" class="lbl" text-anchor="end" fill="#059669">row 2</text>
  </g>

  <text x="440" y="216" class="title" text-anchor="middle">What memory actually holds</text>

  <!-- ===== the flat run ===== -->
  <g>
    <rect x="70"  y="232" width="60" height="46" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="130" y="232" width="60" height="46" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="190" y="232" width="60" height="46" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="250" y="232" width="60" height="46" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.6"/>

    <rect x="310" y="232" width="60" height="46" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="370" y="232" width="60" height="46" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="430" y="232" width="60" height="46" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="490" y="232" width="60" height="46" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="1.6"/>

    <rect x="550" y="232" width="60" height="46" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.6"/>
    <rect x="610" y="232" width="60" height="46" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.6"/>
    <rect x="670" y="232" width="60" height="46" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.6"/>
    <rect x="730" y="232" width="60" height="46" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.6"/>

    <text x="100" y="260" class="cell" text-anchor="middle">0,0</text>
    <text x="160" y="260" class="cell" text-anchor="middle">0,1</text>
    <text x="220" y="260" class="cell" text-anchor="middle">0,2</text>
    <text x="280" y="260" class="cell" text-anchor="middle">0,3</text>
    <text x="340" y="260" class="cell" text-anchor="middle">1,0</text>
    <text x="400" y="260" class="cell" text-anchor="middle">1,1</text>
    <text x="460" y="260" class="cell" text-anchor="middle">1,2</text>
    <text x="520" y="260" class="cell" text-anchor="middle">1,3</text>
    <text x="580" y="260" class="cell" text-anchor="middle">2,0</text>
    <text x="640" y="260" class="cell" text-anchor="middle">2,1</text>
    <text x="700" y="260" class="cell" text-anchor="middle">2,2</text>
    <text x="760" y="260" class="cell" text-anchor="middle">2,3</text>

    <!-- flat index ruler -->
    <text x="100" y="298" class="lbl" text-anchor="middle">0</text>
    <text x="160" y="298" class="lbl" text-anchor="middle">1</text>
    <text x="220" y="298" class="lbl" text-anchor="middle">2</text>
    <text x="280" y="298" class="lbl" text-anchor="middle">3</text>
    <text x="340" y="298" class="lbl" text-anchor="middle">4</text>
    <text x="400" y="298" class="lbl" text-anchor="middle">5</text>
    <text x="460" y="298" class="lbl" text-anchor="middle">6</text>
    <text x="520" y="298" class="lbl" text-anchor="middle">7</text>
    <text x="580" y="298" class="lbl" text-anchor="middle">8</text>
    <text x="640" y="298" class="lbl" text-anchor="middle">9</text>
    <text x="700" y="298" class="lbl" text-anchor="middle">10</text>
    <text x="760" y="298" class="lbl" text-anchor="middle">11</text>
  </g>

  <!-- row spans -->
  <line x1="70"  y1="312" x2="310" y2="312" stroke="#2563eb" stroke-width="1.6"/>
  <line x1="310" y1="312" x2="550" y2="312" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="550" y1="312" x2="790" y2="312" stroke="#059669" stroke-width="1.6"/>
  <text x="190" y="330" class="lbl" text-anchor="middle" fill="#2563eb">row 0</text>
  <text x="430" y="330" class="lbl" text-anchor="middle" fill="#7c3aed">row 1</text>
  <text x="670" y="330" class="lbl" text-anchor="middle" fill="#059669">row 2</text>

  <text x="440" y="366" class="form" text-anchor="middle">address(r, c)  =  base  +  (r &#215; 4  +  c) &#215; size</text>

  <line x1="70" y1="384" x2="810" y2="384" stroke="#888" stroke-width="1" opacity="0.3"/>
  <text x="440" y="406" class="note" text-anchor="middle">Memory has no second dimension. A grid is a helpful lie told by the notation &#8212; the rows are simply laid end to end.</text>
  <text x="440" y="424" class="note" text-anchor="middle">Walking along a row reads memory in a straight line; walking down a column jumps a whole row every step.</text>
</svg>
