<svg width="100%" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="llArrAmber" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- ============ TOP: the logical list ============ -->
  <text x="380" y="34" font-size="15" fill="#888" text-anchor="middle">the story the pointers tell — the logical list</text>
  <text x="146" y="64" font-size="11" fill="#888" text-anchor="middle">data</text>
  <text x="187" y="64" font-size="11" fill="#888" text-anchor="middle">next</text>

  <text x="52" y="111" font-size="15" fill="#f59e0b">head</text>
  <line x1="88" y1="106" x2="112" y2="106" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#llArrAmber)"/>

  <!-- nodes: [data | next] -->
  <g stroke="#888" stroke-width="1.5">
    <rect x="120" y="76" width="52" height="60" fill="rgba(8,145,178,0.18)"/><rect x="172" y="76" width="30" height="60" fill="none"/>
    <rect x="270" y="76" width="52" height="60" fill="rgba(8,145,178,0.18)"/><rect x="322" y="76" width="30" height="60" fill="none"/>
    <rect x="420" y="76" width="52" height="60" fill="rgba(8,145,178,0.18)"/><rect x="472" y="76" width="30" height="60" fill="none"/>
    <rect x="570" y="76" width="52" height="60" fill="rgba(8,145,178,0.18)"/><rect x="622" y="76" width="30" height="60" fill="none"/>
  </g>
  <g font-size="20" fill="#0891b2" text-anchor="middle">
    <text x="146" y="113">A</text><text x="296" y="113">B</text>
    <text x="446" y="113">C</text><text x="596" y="113">D</text>
  </g>
  <g stroke="#f59e0b" stroke-width="2.2">
    <line x1="187" y1="106" x2="263" y2="106" marker-end="url(#llArrAmber)"/>
    <line x1="337" y1="106" x2="413" y2="106" marker-end="url(#llArrAmber)"/>
    <line x1="487" y1="106" x2="563" y2="106" marker-end="url(#llArrAmber)"/>
  </g>
  <line x1="626" y1="132" x2="648" y2="80" stroke="#888" stroke-width="1.8"/>
  <text x="637" y="158" font-size="11" fill="#888" text-anchor="middle">null: the chain ends</text>

  <!-- ============ BOTTOM: the physical sea ============ -->
  <text x="380" y="192" font-size="15" fill="#888" text-anchor="middle">where the nodes actually live — the sea of cells</text>

  <!-- the memory strip, addresses 0..9 -->
  <g stroke="#888" stroke-width="1.5">
    <rect x="60"  y="250" width="64" height="60" fill="none"/>
    <rect x="124" y="250" width="64" height="60" fill="rgba(8,145,178,0.18)"/>
    <rect x="188" y="250" width="64" height="60" fill="none"/>
    <rect x="252" y="250" width="64" height="60" fill="rgba(8,145,178,0.18)"/>
    <rect x="316" y="250" width="64" height="60" fill="none"/>
    <rect x="380" y="250" width="64" height="60" fill="none"/>
    <rect x="444" y="250" width="64" height="60" fill="rgba(8,145,178,0.18)"/>
    <rect x="508" y="250" width="64" height="60" fill="none"/>
    <rect x="572" y="250" width="64" height="60" fill="rgba(8,145,178,0.18)"/>
    <rect x="636" y="250" width="64" height="60" fill="none"/>
  </g>
  <!-- tiny addresses, top-left corners -->
  <g font-size="10" fill="#888" opacity="0.8">
    <text x="65" y="262">0</text><text x="129" y="262">1</text><text x="193" y="262">2</text>
    <text x="257" y="262">3</text><text x="321" y="262">4</text><text x="385" y="262">5</text>
    <text x="449" y="262">6</text><text x="513" y="262">7</text><text x="577" y="262">8</text>
    <text x="641" y="262">9</text>
  </g>
  <!-- occupants: A@3 next 8 · B@8 next 1 · C@1 next 6 · D@6 null -->
  <g font-size="20" fill="#0891b2" text-anchor="middle">
    <text x="284" y="287">A</text><text x="604" y="287">B</text>
    <text x="156" y="287">C</text><text x="476" y="287">D</text>
  </g>
  <g font-size="11" fill="#f59e0b" text-anchor="end">
    <text x="312" y="304">8</text><text x="632" y="304">1</text>
    <text x="184" y="304">6</text><text x="504" y="304">–1</text>
  </g>

  <text x="284" y="356" font-size="15" fill="#f59e0b" text-anchor="middle">head = 3</text>
  <line x1="284" y1="340" x2="284" y2="314" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#llArrAmber)"/>

  <text x="380" y="404" font-size="15" fill="#888" text-anchor="middle">same list, two truths — the order lives in the pointers, not in the geography</text>

  <!-- the walk: read the next value, jump, land (12s loop) -->
