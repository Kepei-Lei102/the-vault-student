<svg width="100%" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="olB" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">The layer cake — and the boot that climbs it</text>

  <!-- layers, bottom to top -->
  <rect x="150" y="330" width="440" height="52" rx="7" fill="rgba(136,136,136,0.12)" stroke="#888" stroke-width="1.8"/>
  <text x="370" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">HARDWARE</text>
  <text x="370" y="368" text-anchor="middle" font-size="9.5" fill="#888">CPU, RAM, disk, devices — the savage machine</text>

  <rect x="150" y="266" width="440" height="52" rx="7" fill="rgba(245,158,11,0.10)" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="370" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#f59e0b">FIRMWARE</text>
  <text x="370" y="304" text-anchor="middle" font-size="9.5" fill="#888">software stored in the hardware — runs first at power-on (BIOS/UEFI)</text>

  <rect x="150" y="176" width="440" height="78" rx="7" fill="rgba(124,58,237,0.10)" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">OPERATING SYSTEM</text>
  <text x="370" y="214" text-anchor="middle" font-size="9.5" fill="#888">the kernel: process, memory, file, I/O and security management</text>
  <rect x="163" y="222" width="196" height="24" rx="5" fill="rgba(8,145,178,0.12)" stroke="#0891b2" stroke-width="1.3"/>
  <text x="261" y="238" text-anchor="middle" font-size="9.5" fill="#0891b2">utility software (the toolbox)</text>
  <rect x="379" y="222" width="196" height="24" rx="5" fill="rgba(8,145,178,0.12)" stroke="#0891b2" stroke-width="1.3"/>
  <text x="477" y="238" text-anchor="middle" font-size="9.5" fill="#0891b2">program libraries / DLLs</text>

  <rect x="150" y="112" width="440" height="52" rx="7" fill="rgba(5,150,105,0.10)" stroke="#059669" stroke-width="1.8"/>
  <text x="370" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">APPLICATIONS</text>
  <text x="370" y="150" text-anchor="middle" font-size="9.5" fill="#888">the user's actual tasks — browser, editor, game</text>

  <!-- boot ladder, left -->
  <text x="72" y="356" text-anchor="middle" font-size="10" fill="#f59e0b">1 · power on</text>
  <path d="M 72,344 L 72,296 L 138,296" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#olB)"/>
  <text x="66" y="252" text-anchor="middle" font-size="10" fill="#f59e0b">2 · firmware</text>
  <text x="66" y="264" text-anchor="middle" font-size="10" fill="#f59e0b">loads the OS</text>
  <path d="M 66,240 L 66,214 L 138,214" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#olB)"/>
  <text x="66" y="158 " text-anchor="middle" font-size="10" fill="#f59e0b">3 · OS runs</text>
  <text x="66" y="170" text-anchor="middle" font-size="10" fill="#f59e0b">the apps</text>
  <path d="M 66,146 L 66,138 L 138,138" fill="none" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#olB)"/>

  <!-- classification bracket, right -->
  <line x1="612" y1="176" x2="612" y2="318" stroke="#0891b2" stroke-width="1.6"/>
  <line x1="606" y1="176" x2="612" y2="176" stroke="#0891b2" stroke-width="1.6"/>
  <line x1="606" y1="318" x2="612" y2="318" stroke="#0891b2" stroke-width="1.6"/>
  <text x="622" y="240" font-size="10" fill="#0891b2">system</text>
  <text x="622" y="253" font-size="10" fill="#0891b2">software:</text>
  <text x="622" y="266" font-size="10" fill="#0891b2">runs the</text>
  <text x="622" y="279" font-size="10" fill="#0891b2">machine</text>
  <line x1="612" y1="112" x2="612" y2="164" stroke="#059669" stroke-width="1.6"/>
  <line x1="606" y1="112" x2="612" y2="112" stroke="#059669" stroke-width="1.6"/>
  <line x1="606" y1="164" x2="612" y2="164" stroke="#059669" stroke-width="1.6"/>
  <text x="622" y="132" font-size="10" fill="#059669">application:</text>
  <text x="622" y="145" font-size="10" fill="#059669">the user's task</text>

  <text x="370" y="412" text-anchor="middle" font-size="10.5" fill="#888">hardware runs firmware — firmware loads the OS — the OS runs applications: each layer hides the one below</text>
</svg>
