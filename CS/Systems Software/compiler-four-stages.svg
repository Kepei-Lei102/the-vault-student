<svg width="100%" viewBox="0 0 760 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fsA" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5,1 L8,4.5 L1.5,8" fill="none" stroke="#888" stroke-width="1.7"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">One statement through the four stages</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#2563eb" font-family="Menlo, monospace">area = 3 * (w + 2)</text>

  <line x1="380" y1="60" x2="380" y2="82" stroke="#888" stroke-width="1.8" marker-end="url(#fsA)"/>

  <!-- 1 lexical -->
  <rect x="90" y="86" width="580" height="84" rx="9" fill="rgba(8,145,178,0.08)" stroke="#0891b2" stroke-width="2"/>
  <text x="110" y="108" font-size="11.5" font-weight="bold" fill="#0891b2">1 · LEXICAL ANALYSIS</text>
  <text x="110" y="124" font-size="9.5" fill="#888">characters become tokens; spacing and comments discarded; names enter the symbol table</text>
  <g font-family="Menlo, monospace" font-size="9.5">
    <rect x="110" y="134" width="66" height="22" rx="4" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1"/><text x="143" y="149" text-anchor="middle" fill="#888">id:area</text>
    <rect x="182" y="134" width="30" height="22" rx="4" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1"/><text x="197" y="149" text-anchor="middle" fill="#888">=</text>
    <rect x="218" y="134" width="58" height="22" rx="4" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1"/><text x="247" y="149" text-anchor="middle" fill="#888">const:3</text>
    <rect x="282" y="134" width="30" height="22" rx="4" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1"/><text x="297" y="149" text-anchor="middle" fill="#888">*</text>
    <rect x="318" y="134" width="30" height="22" rx="4" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1"/><text x="333" y="149" text-anchor="middle" fill="#888">(</text>
    <rect x="354" y="134" width="46" height="22" rx="4" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1"/><text x="377" y="149" text-anchor="middle" fill="#888">id:w</text>
    <rect x="406" y="134" width="30" height="22" rx="4" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1"/><text x="421" y="149" text-anchor="middle" fill="#888">+</text>
    <rect x="442" y="134" width="58" height="22" rx="4" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1"/><text x="471" y="149" text-anchor="middle" fill="#888">const:2</text>
    <rect x="506" y="134" width="30" height="22" rx="4" fill="rgba(8,145,178,0.14)" stroke="#0891b2" stroke-width="1"/><text x="521" y="149" text-anchor="middle" fill="#888">)</text>
  </g>

  <line x1="380" y1="170" x2="380" y2="192" stroke="#888" stroke-width="1.8" marker-end="url(#fsA)"/>

  <!-- 2 syntax -->
  <rect x="90" y="196" width="580" height="128" rx="9" fill="rgba(124,58,237,0.07)" stroke="#7c3aed" stroke-width="2"/>
  <text x="110" y="218" font-size="11.5" font-weight="bold" fill="#7c3aed">2 · SYNTAX ANALYSIS</text>
  <text x="110" y="234" font-size="9.5" fill="#888">tokens checked against the grammar (BNF) and built into a tree — "syntax error" lives here</text>
  <!-- tiny tree -->
  <g font-family="Menlo, monospace" font-size="10.5" fill="#888">
    <text x="380" y="256" text-anchor="middle">=</text>
    <line x1="371" y1="259" x2="326" y2="269" stroke="#7c3aed" stroke-width="1.2"/>
    <line x1="389" y1="259" x2="434" y2="269" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="318" y="280" text-anchor="middle">area</text>
    <text x="440" y="280" text-anchor="middle">*</text>
    <line x1="432" y1="283" x2="410" y2="291" stroke="#7c3aed" stroke-width="1.2"/>
    <line x1="448" y1="283" x2="470" y2="291" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="406" y="302" text-anchor="middle">3</text>
    <text x="474" y="302" text-anchor="middle">+</text>
    <line x1="466" y1="305" x2="450" y2="312" stroke="#7c3aed" stroke-width="1.2"/>
    <line x1="482" y1="305" x2="498" y2="312" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="447" y="322" text-anchor="middle">w</text>
    <text x="501" y="322" text-anchor="middle">2</text>
    <text x="538" y="284" text-anchor="start" fill="#7c3aed" font-size="9.5">+ owns w and 2;</text>
    <text x="538" y="297" text-anchor="start" fill="#7c3aed" font-size="9.5">* owns 3 and the sum;</text>
    <text x="538" y="310" text-anchor="start" fill="#7c3aed" font-size="9.5">= owns everything</text>
  </g>

  <line x1="380" y1="324" x2="380" y2="346" stroke="#888" stroke-width="1.8" marker-end="url(#fsA)"/>

  <!-- 3 code gen -->
  <rect x="90" y="350" width="580" height="88" rx="9" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="2"/>
  <text x="110" y="372" font-size="11.5" font-weight="bold" fill="#059669">3 · CODE GENERATION</text>
  <text x="110" y="388" font-size="9.5" fill="#888">the tree is walked and object code emitted — the assembly world, produced mechanically</text>
  <g font-family="Menlo, monospace" font-size="10" fill="#888">
    <text x="140" y="408">LDD  w</text>
    <text x="250" y="408">ADD  #2</text>
    <text x="360" y="408">MUL  #3</text>
    <text x="470" y="408">STO  area</text>
  </g>
  <text x="140" y="426" font-size="9" fill="#059669" font-family="Menlo, monospace">(load w — add 2 — times 3 — store the result)</text>

  <line x1="380" y1="438" x2="380" y2="460" stroke="#888" stroke-width="1.8" marker-end="url(#fsA)"/>

  <!-- 4 optimisation -->
  <rect x="90" y="464" width="580" height="66" rx="9" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="2"/>
  <text x="110" y="486" font-size="11.5" font-weight="bold" fill="#f59e0b">4 · OPTIMISATION</text>
  <text x="110" y="502" font-size="9.5" fill="#888">same meaning, better code: fold constants at compile time (60 * 60 becomes 3600),</text>
  <text x="110" y="516" font-size="9.5" fill="#888">hoist unchanging work out of loops, delete code that can never run</text>
</svg>
