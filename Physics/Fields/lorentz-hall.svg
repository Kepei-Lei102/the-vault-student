<svg width="100%" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>The Hall effect: carriers shoved sideways until the voltages balance</title>
  <defs>
    <marker id="hGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="hTeal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#0891b2"/>
    </marker>
    <marker id="hPurple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#7c3aed"/>
    </marker>
    <marker id="hBlue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="480" y="26" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">The Hall effect: the sideways law, indoors</text>

  <!-- slab -->
  <rect x="150" y="110" width="550" height="140" rx="4" fill="rgba(136,136,136,0.07)" stroke="#888" stroke-width="2"/>

  <!-- B out of page -->
  <g stroke="#f59e0b" stroke-width="2">
    <circle cx="205" cy="142" r="8" fill="none"/><circle cx="205" cy="142" r="2.5" fill="#f59e0b" stroke="none"/>
    <circle cx="620" cy="142" r="8" fill="none"/><circle cx="620" cy="142" r="2.5" fill="#f59e0b" stroke="none"/>
  </g>
  <text x="425" y="100" text-anchor="middle" font-size="12.5" fill="#f59e0b">B out of the page</text>

  <!-- current in / out -->
  <line x1="55" y1="180" x2="143" y2="180" stroke="#059669" stroke-width="3" marker-end="url(#hGreen)"/>
  <text x="66" y="168" font-size="14" fill="#059669" font-weight="bold">I</text>
  <line x1="705" y1="180" x2="790" y2="180" stroke="#059669" stroke-width="3" marker-end="url(#hGreen)"/>
  <text x="770" y="168" font-size="14" fill="#059669" font-weight="bold">I</text>

  <!-- electrons drifting left -->
  <g fill="#0891b2">
    <circle cx="310" cy="180" r="6"/><circle cx="440" cy="180" r="6"/><circle cx="570" cy="180" r="6"/>
  </g>
  <line x1="300" y1="180" x2="266" y2="180" stroke="#0891b2" stroke-width="2" marker-end="url(#hTeal)"/>
  <line x1="430" y1="180" x2="396" y2="180" stroke="#0891b2" stroke-width="2" marker-end="url(#hTeal)"/>
  <line x1="560" y1="180" x2="526" y2="180" stroke="#0891b2" stroke-width="2" marker-end="url(#hTeal)"/>
  <text x="440" y="163" text-anchor="middle" font-size="11.5" fill="#0891b2">electron drift (opposite to I)</text>

  <!-- deflection down -->
  <path d="M310,190 Q 305,208 298,228" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#hPurple)"/>
  <path d="M440,190 Q 435,208 428,228" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#hPurple)"/>
  <path d="M570,190 Q 565,208 558,228" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#hPurple)"/>
  <text x="345" y="222" font-size="11.5" fill="#7c3aed">Bqv shoves them down</text>

  <!-- charge buildup -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="260" y="130" fill="#f59e0b">+</text><text x="340" y="130" fill="#f59e0b">+</text><text x="420" y="130" fill="#f59e0b">+</text><text x="500" y="130" fill="#f59e0b">+</text><text x="580" y="130" fill="#f59e0b">+</text>
    <text x="260" y="246" fill="#0891b2">-</text><text x="340" y="246" fill="#0891b2">-</text><text x="420" y="246" fill="#0891b2">-</text><text x="500" y="246" fill="#0891b2">-</text><text x="580" y="246" fill="#0891b2">-</text>
  </g>

  <!-- internal E -->
  <line x1="655" y1="140" x2="655" y2="222" stroke="#2563eb" stroke-width="2.5" marker-end="url(#hBlue)"/>
  <text x="667" y="185" font-size="13" fill="#2563eb" font-weight="bold">E</text>

  <!-- voltmeter -->
  <line x1="640" y1="110" x2="850" y2="110" stroke="#888" stroke-width="1.5"/>
  <line x1="850" y1="110" x2="850" y2="158" stroke="#888" stroke-width="1.5"/>
  <line x1="640" y1="250" x2="850" y2="250" stroke="#888" stroke-width="1.5"/>
  <line x1="850" y1="250" x2="850" y2="202" stroke="#888" stroke-width="1.5"/>
  <circle cx="850" cy="180" r="22" fill="none" stroke="#888" stroke-width="2"/>
  <text x="850" y="186" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">V</text>
  <text x="850" y="290" text-anchor="middle" font-size="13" fill="#888">the Hall voltage</text>

  <text x="480" y="330" text-anchor="middle" font-size="13" fill="#888" font-style="italic">carriers pile on one face until the internal electric push-back balances the magnetic shove:</text>
  <text x="480" y="348" text-anchor="middle" font-size="13" fill="#888" font-style="italic">the steady voltage reads B - and its sign reveals the carriers' sign</text>
</svg>
