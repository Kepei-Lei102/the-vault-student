<svg width="100%" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dA" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    </marker>
    <marker id="dG" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#888" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">One law, three costumes</text>

  <!-- ===== panel 1: magnet into coil ===== -->
  <text x="135" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">magnet into coil</text>
  <!-- magnet -->
  <rect x="30" y="106" width="34" height="26" rx="3" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="1.6"/>
  <text x="47" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">N</text>
  <line x1="68" y1="119" x2="102" y2="119" stroke="#f59e0b" stroke-width="2" marker-end="url(#dA)"/>
  <text x="84" y="106" text-anchor="middle" font-size="10" fill="#f59e0b">push</text>
  <!-- coil -->
  <ellipse cx="130" cy="119" rx="9" ry="26" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <ellipse cx="148" cy="119" rx="9" ry="26" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <ellipse cx="166" cy="119" rx="9" ry="26" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <ellipse cx="184" cy="119" rx="9" ry="26" fill="none" stroke="#7c3aed" stroke-width="2.4"/>
  <!-- galvanometer -->
  <line x1="193" y1="119" x2="228" y2="119" stroke="#888" stroke-width="1.5"/>
  <circle cx="228" cy="155" r="20" fill="none" stroke="#888" stroke-width="1.8"/>
  <line x1="228" y1="119" x2="228" y2="135" stroke="#888" stroke-width="1.5"/>
  <line x1="228" y1="155" x2="240" y2="141" stroke="#dc2626" stroke-width="2"/>
  <text x="228" y="161" text-anchor="middle" font-size="9" fill="#888">G</text>
  <text x="135" y="205" text-anchor="middle" font-size="10" fill="#888">the needle kicks only while</text>
  <text x="135" y="219" text-anchor="middle" font-size="10" fill="#888">the magnet MOVES</text>
  <text x="135" y="243" text-anchor="middle" font-size="10" fill="#f59e0b">faster · more turns · stronger</text>
  <text x="135" y="257" text-anchor="middle" font-size="10" fill="#f59e0b">— all give a bigger kick</text>

  <!-- ===== panel 2: rod on rails ===== -->
  <text x="392" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">rod sliding on rails</text>
  <!-- field into page: crosses in circles -->
  <g stroke="#0891b2" stroke-width="1.3" fill="none">
    <circle cx="320" cy="95" r="7"/><line x1="315" y1="90" x2="325" y2="100"/><line x1="325" y1="90" x2="315" y2="100"/>
    <circle cx="392" cy="95" r="7"/><line x1="387" y1="90" x2="397" y2="100"/><line x1="397" y1="90" x2="387" y2="100"/>
    <circle cx="464" cy="95" r="7"/><line x1="459" y1="90" x2="469" y2="100"/><line x1="469" y1="90" x2="459" y2="100"/>
    <circle cx="320" cy="185" r="7"/><line x1="315" y1="180" x2="325" y2="190"/><line x1="325" y1="180" x2="315" y2="190"/>
    <circle cx="464" cy="185" r="7"/><line x1="459" y1="180" x2="469" y2="190"/><line x1="469" y1="180" x2="459" y2="190"/>
  </g>
  <text x="484" y="72" font-size="10" fill="#0891b2">B into page</text>
  <!-- rails -->
  <line x1="300" y1="120" x2="490" y2="120" stroke="#888" stroke-width="2.5"/>
  <line x1="300" y1="160" x2="490" y2="160" stroke="#888" stroke-width="2.5"/>
  <!-- rod -->
  <line x1="400" y1="112" x2="400" y2="168" stroke="#7c3aed" stroke-width="5"/>
  <line x1="412" y1="140" x2="452" y2="140" stroke="#f59e0b" stroke-width="2" marker-end="url(#dA)"/>
  <text x="432" y="128" text-anchor="middle" font-size="10" fill="#f59e0b">v</text>
  <text x="392" y="205" text-anchor="middle" font-size="10" fill="#888">each free charge feels F = Bqv</text>
  <text x="392" y="219" text-anchor="middle" font-size="10" fill="#888">along the rod — a battery on wheels</text>
  <text x="392" y="243" text-anchor="middle" font-size="11" fill="#7c3aed">E = BLv</text>

  <!-- ===== panel 3: rotating coil ===== -->
  <text x="640" y="54" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">coil rotating in the field</text>
  <line x1="560" y1="100" x2="720" y2="100" stroke="#0891b2" stroke-width="1.4" marker-end="url(#dG)"/>
  <line x1="560" y1="140" x2="720" y2="140" stroke="#0891b2" stroke-width="1.4" marker-end="url(#dG)"/>
  <line x1="560" y1="180" x2="720" y2="180" stroke="#0891b2" stroke-width="1.4" marker-end="url(#dG)"/>
  <ellipse cx="640" cy="140" rx="20" ry="48" fill="rgba(124,58,237,0.10)" stroke="#7c3aed" stroke-width="2.5" transform="rotate(28 640 140)"/>
  <path d="M 676,102 A 42 42 0 0 1 686,140" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#dA)"/>
  <text x="700" y="112" font-size="10" fill="#f59e0b">ω</text>
  <text x="640" y="205" text-anchor="middle" font-size="10" fill="#888">the window turns face-on,</text>
  <text x="640" y="219" text-anchor="middle" font-size="10" fill="#888">edge-on, face-on — flux swings,</text>
  <text x="640" y="243" text-anchor="middle" font-size="10" fill="#7c3aed">and the generator is born</text>

  <text x="380" y="292" text-anchor="middle" font-size="11.5" fill="#888">In every costume the same sentence: e.m.f. = rate of change of flux linkage. Nothing changes, nothing induces.</text>
</svg>
