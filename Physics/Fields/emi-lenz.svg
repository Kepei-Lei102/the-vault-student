<svg width="100%" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="lA" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
    </marker>
    <marker id="lR" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M2,1 L10,5 L2,9" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">Lenz's law: the coil is never on your side</text>

  <!-- ===== left: approach -> repel ===== -->
  <text x="195" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">magnet approaches — the coil repels</text>
  <rect x="60" y="120" width="56" height="34" rx="4" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="1.8"/>
  <text x="88" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">N</text>
  <line x1="122" y1="137" x2="162" y2="137" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#lA)"/>
  <text x="142" y="124" text-anchor="middle" font-size="10" fill="#f59e0b">push</text>
  <!-- coil face -->
  <ellipse cx="215" cy="137" rx="14" ry="42" fill="rgba(124,58,237,0.10)" stroke="#7c3aed" stroke-width="2.6"/>
  <text x="215" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">N</text>
  <line x1="196" y1="137" x2="168" y2="137" stroke="#dc2626" stroke-width="2.2" marker-end="url(#lR)"/>
  <text x="182" y="158" text-anchor="middle" font-size="10" fill="#dc2626">pushes back</text>
  <text x="195" y="210" text-anchor="middle" font-size="10.5" fill="#888">flux through the coil is GROWING, so the</text>
  <text x="195" y="225" text-anchor="middle" font-size="10.5" fill="#888">induced current makes the near face a north</text>
  <text x="195" y="240" text-anchor="middle" font-size="10.5" fill="#888">pole — like poles repel: you must do work</text>
  <text x="195" y="262" text-anchor="middle" font-size="10.5" fill="#059669">that work IS the electrical energy</text>

  <!-- ===== right: the copper tube ===== -->
  <text x="570" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">the slow-motion magnet</text>
  <!-- tube -->
  <rect x="530" y="84" width="14" height="200" fill="rgba(136,136,136,0.22)"/>
  <rect x="596" y="84" width="14" height="200" fill="rgba(136,136,136,0.22)"/>
  <text x="638" y="100" font-size="10" fill="#888">copper tube</text>
  <!-- falling magnet -->
  <rect x="551" y="140" width="38" height="30" rx="3" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="1.8"/>
  <text x="570" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#888">N S</text>
  <line x1="570" y1="176" x2="570" y2="206" stroke="#f59e0b" stroke-width="2" marker-end="url(#lA)"/>
  <text x="516" y="196" text-anchor="end" font-size="10" fill="#f59e0b">falls…</text>
  <text x="516" y="210" text-anchor="end" font-size="10" fill="#f59e0b">slowly</text>
  <!-- eddy current rings -->
  <ellipse cx="570" cy="128" rx="32" ry="7" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/>
  <ellipse cx="570" cy="186" rx="32" ry="7" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="656" y="132" font-size="10" fill="#dc2626">eddy currents</text>
  <text x="656" y="146" font-size="10" fill="#dc2626">above and below,</text>
  <text x="656" y="160" font-size="10" fill="#dc2626">both braking</text>
  <text x="570" y="308" text-anchor="middle" font-size="10.5" fill="#888">no contact, no friction — pure Lenz:</text>
  <text x="570" y="323" text-anchor="middle" font-size="10.5" fill="#888">the change is opposed, so the fall is fought</text>

  <text x="230" y="308" text-anchor="middle" font-size="11" fill="#888">Why it MUST oppose: if the coil aided the change,</text>
  <text x="230" y="323" text-anchor="middle" font-size="11" fill="#888">magnets would self-accelerate — free energy. Lenz = energy conservation.</text>
</svg>
