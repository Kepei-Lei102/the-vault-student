<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 16px; font-weight: 700; }
    .sub   { font-size: 13px; font-weight: 700; }
    .lab   { font-size: 11px; }
    .foil  { font-size: 10px; }
    .cap   { font-size: 12px; }
  </style>

  <text x="340" y="26" class="title" text-anchor="middle">How real capacitors are actually built</text>

  <!-- ================= TOP: ROLLED ================= -->
  <text x="300" y="54" class="sub" text-anchor="middle">Rolled — two foils + a film, wound into a cylinder</text>

  <!-- unrolled layered strip -->
  <rect x="40" y="79" width="12" height="6" fill="#dc2626"/>
  <rect x="52" y="76" width="200" height="12" fill="#9ca3af"/>
  <rect x="52" y="88" width="200" height="9" fill="rgba(8,145,178,0.22)"/>
  <rect x="52" y="97" width="200" height="12" fill="#9ca3af"/>
  <rect x="52" y="109" width="200" height="9" fill="rgba(8,145,178,0.22)"/>
  <rect x="252" y="100" width="12" height="6" fill="#2563eb"/>
  <text x="152" y="134" class="lab" text-anchor="middle">two metal foils (the plates) + dielectric film</text>

  <!-- wind arrow -->
  <text x="298" y="86" class="lab" text-anchor="middle">wind</text>
  <path d="M274 96 L314 96" stroke="#9ca3af" stroke-width="1.6" fill="none"/>
  <path d="M308 92 L314 96 L308 100" stroke="#9ca3af" stroke-width="1.6" fill="none"/>

  <!-- rolled cross-section (concentric layers) -->
  <circle cx="368" cy="100" r="38" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="368" cy="100" r="29" fill="none" stroke="#0891b2" stroke-width="1.6"/>
  <circle cx="368" cy="100" r="20" fill="none" stroke="#9ca3af" stroke-width="1.6"/>
  <circle cx="368" cy="100" r="11" fill="none" stroke="#0891b2" stroke-width="1.6"/>
  <line x1="368" y1="100" x2="368" y2="62" stroke="#9ca3af" stroke-width="1.2"/>
  <text x="368" y="156" class="lab" text-anchor="middle">rolled layers</text>

  <!-- finished can (side view) -->
  <ellipse cx="509" cy="66" rx="39" ry="8" fill="rgba(148,163,184,0.25)" stroke="#9ca3af" stroke-width="1.4"/>
  <rect x="470" y="66" width="78" height="90" rx="4" fill="rgba(148,163,184,0.15)" stroke="#9ca3af" stroke-width="1.4"/>
  <line x1="494" y1="156" x2="494" y2="184" stroke="#888" stroke-width="2"/>
  <line x1="524" y1="156" x2="524" y2="184" stroke="#888" stroke-width="2"/>
  <text x="509" y="200" class="lab" text-anchor="middle">the can with two legs</text>

  <!-- divider -->
  <line x1="40" y1="230" x2="640" y2="230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- ================= BOTTOM: STACKED (MLCC) ================= -->
  <text x="300" y="256" class="sub" text-anchor="middle">Stacked — multilayer ceramic (MLCC), the chip inside your phone</text>

  <!-- ceramic body -->
  <rect x="150" y="280" width="195" height="80" rx="5" fill="rgba(245,158,11,0.08)" stroke="#9ca3af" stroke-width="1.4"/>
  <!-- terminals -->
  <rect x="150" y="280" width="12" height="80" fill="#dc2626"/>
  <rect x="333" y="280" width="12" height="80" fill="#2563eb"/>
  <!-- interleaved plates: L = touch left terminal, R = touch right terminal -->
  <rect x="162" y="296" width="155" height="3" fill="#9ca3af"/>
  <rect x="178" y="309" width="155" height="3" fill="#9ca3af"/>
  <rect x="162" y="322" width="155" height="3" fill="#9ca3af"/>
  <rect x="178" y="335" width="155" height="3" fill="#9ca3af"/>
  <rect x="162" y="348" width="155" height="3" fill="#9ca3af"/>

  <text x="362" y="300" class="lab" text-anchor="start">hundreds of interleaved</text>
  <text x="362" y="316" class="lab" text-anchor="start">plate layers in a grain of rice —</text>
  <text x="362" y="332" class="lab" text-anchor="start">the same C = ε₀ε_r A / d,</text>
  <text x="362" y="348" class="lab" text-anchor="start">area A multiplied by the stack</text>

  <text x="340" y="388" class="cap" text-anchor="middle">Every design does one thing: pack a huge plate area A into a tiny volume — rolled, or stacked.</text>
</svg>
