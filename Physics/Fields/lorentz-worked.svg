<svg width="100%" viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>The worked examples, drawn</title>
  <defs>
    <marker id="lwTeal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#0891b2"/>
    </marker>
    <marker id="lwGreen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#059669"/>
    </marker>
    <marker id="lwRed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#dc2626"/>
    </marker>
    <marker id="lwGray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- ============ (a) the electron's circle ============ -->
  <text x="240" y="34" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">(a) the electron's circle</text>
  <rect x="70" y="55" width="360" height="255" rx="10" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5"/>
  <g stroke="#2563eb" stroke-width="1.5" opacity="0.5">
    <g transform="translate(120,280)"><circle r="8" fill="none"/><line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5"/><line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5"/></g>
    <g transform="translate(380,280)"><circle r="8" fill="none"/><line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5"/><line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5"/></g>
  </g>
  <text x="360" y="303" font-size="11.5" fill="#2563eb">B = 2.0 mT into page</text>

  <!-- electron enters at left, curves DOWN (negative charge) -->
  <circle cx="150" cy="130" r="7" fill="#0891b2"/>
  <text x="150" y="118" text-anchor="middle" font-size="12" fill="#0891b2">electron</text>
  <line x1="160" y1="130" x2="225" y2="130" stroke="#0891b2" stroke-width="2.5" marker-end="url(#lwTeal)"/>
  <text x="196" y="120" font-size="12" fill="#0891b2">v</text>
  <path d="M150,130 A 105 105 0 0 1 255,235" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="6 5"/>
  <path d="M255,235 A 105 105 0 0 1 213,318" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="6 5" opacity="0.45"/>
  <line x1="150" y1="235" x2="251" y2="235" stroke="#888" stroke-width="1.6" marker-end="url(#lwGray)"/>
  <text x="200" y="255" text-anchor="middle" font-size="12.5" fill="#888">r = 0.11 m</text>
  <text x="253" y="88" text-anchor="middle" font-size="11.5" fill="#888">v = 4.0e7 m/s - and it never changes: no work done</text>

  <!-- ============ (b) which way does the wire jump? ============ -->
  <text x="720" y="34" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">(b) the wire, seen from above</text>
  <rect x="530" y="55" width="380" height="255" rx="10" fill="rgba(37,99,235,0.06)" stroke="#2563eb" stroke-width="1.5"/>
  <g stroke="#2563eb" stroke-width="1.5" opacity="0.5">
    <g transform="translate(580,95)"><circle r="8" fill="none"/><line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5"/><line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5"/></g>
    <g transform="translate(860,95)"><circle r="8" fill="none"/><line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5"/><line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5"/></g>
    <g transform="translate(580,270)"><circle r="8" fill="none"/><line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5"/><line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5"/></g>
    <g transform="translate(860,270)"><circle r="8" fill="none"/><line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5"/><line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5"/></g>
  </g>
  <text x="806" y="299" font-size="11.5" fill="#2563eb">B points down into the ground</text>

  <!-- compass -->
  <line x1="720" y1="100" x2="720" y2="72" stroke="#888" stroke-width="1.6" marker-end="url(#lwGray)"/>
  <text x="734" y="82" font-size="12" fill="#888">N</text>

  <!-- the wire runs north, current north -->
  <line x1="770" y1="285" x2="770" y2="110" stroke="#059669" stroke-width="4" marker-end="url(#lwGreen)"/>
  <text x="786" y="185" font-size="13" fill="#059669" font-weight="bold">I = 3.0 A, due north</text>

  <!-- force west -->
  <line x1="755" y1="195" x2="640" y2="195" stroke="#dc2626" stroke-width="3.5" marker-end="url(#lwRed)"/>
  <text x="676" y="180" font-size="13" fill="#dc2626" font-weight="bold">F: due west</text>
  <text x="676" y="218" font-size="11.5" fill="#888">0.60 N per metre</text>

  <text x="480" y="358" text-anchor="middle" font-size="12.5" fill="#888" font-style="italic">draw the field, draw the current, and let the left hand answer - the electron's circle bends against the left-hand prediction because its charge is negative</text>
</svg>
