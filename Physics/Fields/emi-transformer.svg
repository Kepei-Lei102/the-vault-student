<svg width="100%" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tF" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1.5,1 L9,4.5 L1.5,8" fill="none" stroke="#0891b2" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">The transformer: two coils sharing one changing flux</text>

  <!-- laminated core: rectangular ring -->
  <rect x="250" y="70" width="260" height="200" fill="none" stroke="#888" stroke-width="26" stroke-opacity="0.35"/>
  <!-- lamination hatching on top limb -->
  <line x1="270" y1="60" x2="270" y2="82" stroke="#888" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="290" y1="60" x2="290" y2="82" stroke="#888" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="310" y1="60" x2="310" y2="82" stroke="#888" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="330" y1="60" x2="330" y2="82" stroke="#888" stroke-width="1" stroke-opacity="0.7"/>
  <text x="392" y="52" text-anchor="middle" font-size="10" fill="#888">soft-iron core, laminated (starves eddy currents)</text>

  <!-- flux arrows circulating the core -->
  <path d="M 380,84 L 470,84" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tF)"/>
  <path d="M 496,140 L 496,210" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tF)"/>
  <path d="M 450,256 L 320,256" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tF)"/>
  <path d="M 264,200 L 264,130 " fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#tF)"/>
  <text x="380" y="176" text-anchor="middle" font-size="11" fill="#0891b2">changing flux Φ(t),</text>
  <text x="380" y="192" text-anchor="middle" font-size="11" fill="#0891b2">guided by the core</text>

  <!-- primary winding: 4 turns on left limb -->
  <ellipse cx="264" cy="120" rx="24" ry="9" fill="none" stroke="#2563eb" stroke-width="3"/>
  <ellipse cx="264" cy="145" rx="24" ry="9" fill="none" stroke="#2563eb" stroke-width="3"/>
  <ellipse cx="264" cy="170" rx="24" ry="9" fill="none" stroke="#2563eb" stroke-width="3"/>
  <ellipse cx="264" cy="195" rx="24" ry="9" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="185" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">primary</text>
  <text x="185" y="148" text-anchor="middle" font-size="11" fill="#2563eb">N_p turns</text>
  <!-- AC source -->
  <circle cx="140" cy="200" r="17" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 130,200 q 5,-9 10,0 q 5,9 10,0" fill="none" stroke="#2563eb" stroke-width="2"/>
  <line x1="157" y1="200" x2="240" y2="200" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="140" y1="183" x2="140" y2="120" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="140" y1="120" x2="240" y2="120" stroke="#2563eb" stroke-width="1.8"/>
  <text x="140" y="242" text-anchor="middle" font-size="11" fill="#2563eb">a.c. in — V_p</text>

  <!-- secondary winding: 8 turns on right limb -->
  <ellipse cx="496" cy="105" rx="24" ry="8" fill="none" stroke="#059669" stroke-width="3"/>
  <ellipse cx="496" cy="124" rx="24" ry="8" fill="none" stroke="#059669" stroke-width="3"/>
  <ellipse cx="496" cy="143" rx="24" ry="8" fill="none" stroke="#059669" stroke-width="3"/>
  <ellipse cx="496" cy="162" rx="24" ry="8" fill="none" stroke="#059669" stroke-width="3"/>
  <ellipse cx="496" cy="181" rx="24" ry="8" fill="none" stroke="#059669" stroke-width="3"/>
  <ellipse cx="496" cy="200" rx="24" ry="8" fill="none" stroke="#059669" stroke-width="3"/>
  <ellipse cx="496" cy="219" rx="24" ry="8" fill="none" stroke="#059669" stroke-width="3"/>
  <ellipse cx="496" cy="238" rx="24" ry="8" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="580" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#059669">secondary</text>
  <text x="580" y="148" text-anchor="middle" font-size="11" fill="#059669">N_s turns</text>
  <line x1="520" y1="105" x2="620" y2="105" stroke="#059669" stroke-width="1.8"/>
  <line x1="520" y1="238" x2="620" y2="238" stroke="#059669" stroke-width="1.8"/>
  <line x1="620" y1="105" x2="620" y2="160" stroke="#059669" stroke-width="1.8"/>
  <line x1="620" y1="185" x2="620" y2="238" stroke="#059669" stroke-width="1.8"/>
  <circle cx="620" cy="172" r="13" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="668" y="177" font-size="11" fill="#059669">V_s out</text>

  <!-- equations -->
  <text x="380" y="312" text-anchor="middle" font-size="13" fill="#888">V_p / V_s = N_p / N_s — more turns, more volts (here N_s = 2N_p: step-up, V_s = 2V_p)</text>
  <text x="380" y="334" text-anchor="middle" font-size="12" fill="#888">and at 100% efficiency I_pV_p = I_sV_s: whatever the voltage gains, the current loses.</text>
</svg>
