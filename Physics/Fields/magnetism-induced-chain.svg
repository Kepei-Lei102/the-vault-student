<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 860 350"><style>text{font-family:Arial,sans-serif;fill:#888;font-size:18px}</style>
<text x="430" y="34" text-anchor="middle" style="font-size:23px">An induced chain: the near end acquires opposite polarity</text>
<rect x="35" y="110" width="95.0" height="70" rx="3" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="2"/>
<text x="82.5" y="151.0" text-anchor="middle" style="font-size:18px">S</text>
<rect x="130.0" y="110" width="95.0" height="70" rx="3" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
<text x="177.5" y="151.0" text-anchor="middle" style="font-size:18px">N</text>
<rect x="275" y="125" width="100.0" height="40" rx="3" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="2"/>
<text x="325.0" y="151.0" text-anchor="middle" style="font-size:18px">S</text>
<rect x="375.0" y="125" width="100.0" height="40" rx="3" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
<text x="425.0" y="151.0" text-anchor="middle" style="font-size:18px">N</text>
<rect x="525" y="125" width="100.0" height="40" rx="3" fill="#dc2626" fill-opacity="0.15" stroke="#dc2626" stroke-width="2"/>
<text x="575.0" y="151.0" text-anchor="middle" style="font-size:18px">S</text>
<rect x="625.0" y="125" width="100.0" height="40" rx="3" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2"/>
<text x="675.0" y="151.0" text-anchor="middle" style="font-size:18px">N</text>
<text x="130" y="225" text-anchor="middle" style="font-size:18px">Permanent magnet</text>
<text x="375" y="225" text-anchor="middle" style="font-size:18px">First nail</text>
<text x="625" y="225" text-anchor="middle" style="font-size:18px">Second nail</text>
<text x="250" y="93" text-anchor="middle" style="font-size:15px">attract</text>
<text x="500" y="93" text-anchor="middle" style="font-size:15px">attract</text>
<text x="430" y="282" text-anchor="middle" style="font-size:17px">Reverse the source: every induced polarity reverses; attraction remains.</text>
<text x="430" y="320" text-anchor="middle" style="font-size:17px">Attraction alone does not prove an object was already a magnet.</text>
</svg>