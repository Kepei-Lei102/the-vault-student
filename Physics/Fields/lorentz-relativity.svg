<svg width="100%" viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <title>Magnetism is relativity in disguise: two frames, one force</title>
  <defs>
    <marker id="lrTeal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#0891b2"/>
    </marker>
    <marker id="lrAmber" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#f59e0b"/>
    </marker>
    <marker id="lrGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#059669"/>
    </marker>
    <marker id="lrBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="480" y="26" text-anchor="middle" font-size="16" fill="#888" font-weight="bold">One force, two bookkeepings</text>

  <!-- ============ LEFT: lab frame ============ -->
  <text x="240" y="60" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">the lab frame: "magnetic"</text>

  <!-- wire -->
  <rect x="60" y="95" width="360" height="66" rx="8" fill="rgba(136,136,136,0.08)" stroke="#888" stroke-width="1.5"/>
  <!-- positive ions, static, even spacing 46 -->
  <g font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold">
    <text x="95" y="118">+</text><text x="141" y="118">+</text><text x="187" y="118">+</text><text x="233" y="118">+</text><text x="279" y="118">+</text><text x="325" y="118">+</text><text x="371" y="118">+</text>
  </g>
  <!-- electrons, drifting left, even spacing 46 -->
  <g font-size="16" fill="#0891b2" text-anchor="middle" font-weight="bold">
    <text x="107" y="148">-</text><text x="153" y="148">-</text><text x="199" y="148">-</text><text x="245" y="148">-</text><text x="291" y="148">-</text><text x="337" y="148">-</text>
  </g>
  <line x1="240" y1="171" x2="196" y2="171" stroke="#0891b2" stroke-width="1.8" marker-end="url(#lrTeal)"/>
  <text x="290" y="175" font-size="11" fill="#0891b2">electrons drift</text>
  <text x="430" y="123" font-size="11.5" fill="#888">equal densities:</text>
  <text x="430" y="138" font-size="11.5" fill="#888">wire is neutral</text>

  <!-- test electron moving parallel -->
  <circle cx="240" cy="255" r="9" fill="#0891b2"/>
  <text x="240" y="260" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">-</text>
  <line x1="226" y1="255" x2="176" y2="255" stroke="#0891b2" stroke-width="2.2" marker-end="url(#lrTeal)"/>
  <text x="196" y="243" font-size="12" fill="#0891b2">v</text>
  <line x1="240" y1="240" x2="240" y2="185" stroke="#059669" stroke-width="3" marker-end="url(#lrGreen)"/>
  <text x="255" y="205" font-size="13" fill="#059669" font-weight="bold">F = qv x B</text>
  <text x="240" y="300" text-anchor="middle" font-size="12" fill="#888">a moving charge, shoved sideways</text>
  <text x="240" y="317" text-anchor="middle" font-size="12" fill="#888">by a "magnetic" field</text>

  <!-- ============ RIGHT: the electron's frame ============ -->
  <text x="720" y="60" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">riding with the electron: "electric"</text>

  <rect x="540" y="95" width="360" height="66" rx="8" fill="rgba(245,158,11,0.10)" stroke="#f59e0b" stroke-width="1.8"/>
  <!-- positive ions now MOVING and length-contracted: spacing 34 -->
  <g font-size="15" fill="#f59e0b" text-anchor="middle" font-weight="bold">
    <text x="568" y="118">+</text><text x="602" y="118">+</text><text x="636" y="118">+</text><text x="670" y="118">+</text><text x="704" y="118">+</text><text x="738" y="118">+</text><text x="772" y="118">+</text><text x="806" y="118">+</text><text x="840" y="118">+</text><text x="874" y="118">+</text>
  </g>
  <line x1="690" y1="82" x2="734" y2="82" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#lrAmber)"/>
  <text x="790" y="86" font-size="11" fill="#f59e0b">ions move: contracted, denser</text>
  <!-- electrons at rest, spacing 46 -->
  <g font-size="16" fill="#0891b2" text-anchor="middle" font-weight="bold">
    <text x="587" y="148">-</text><text x="633" y="148">-</text><text x="679" y="148">-</text><text x="725" y="148">-</text><text x="771" y="148">-</text><text x="817" y="148">-</text>
  </g>
  <text x="908" y="123" font-size="11.5" fill="#f59e0b" font-weight="bold" text-anchor="end"> </text>
  <text x="720" y="180" text-anchor="middle" font-size="12" fill="#f59e0b">more + than - per metre: the wire is now charged</text>

  <!-- test electron at rest -->
  <circle cx="720" cy="255" r="9" fill="#0891b2"/>
  <text x="720" y="260" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">-</text>
  <text x="762" y="259" font-size="11.5" fill="#888">at rest</text>
  <line x1="720" y1="240" x2="720" y2="192" stroke="#2563eb" stroke-width="3" marker-end="url(#lrBlue)"/>
  <text x="735" y="210" font-size="13" fill="#2563eb" font-weight="bold">plain electric pull</text>
  <text x="720" y="300" text-anchor="middle" font-size="12" fill="#888">no motion, no magnetism - just a charged wire</text>
  <text x="720" y="317" text-anchor="middle" font-size="12" fill="#888">attracting a charge, straight toward itself</text>

  <text x="480" y="365" text-anchor="middle" font-size="13" fill="#888" font-style="italic">the same force: what the lab calls magnetic, the rider calls electrostatic -</text>
  <text x="480" y="384" text-anchor="middle" font-size="13" fill="#888" font-style="italic">and "sideways to the motion" in one seat is "straight toward the wire" in the other</text>
  <text x="480" y="412" text-anchor="middle" font-size="12" fill="#888">(spacings exaggerated: at real drift speeds the contraction is one part in a hundred billion billion - yet it moves your fridge magnet)</text>
</svg>
