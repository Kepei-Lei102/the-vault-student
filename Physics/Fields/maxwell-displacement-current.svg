<svg width="100%" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dcI" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#dc2626" stroke-width="1.5"/>
    </marker>
    <marker id="dcE" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">The capacitor that broke Ampère's law</text>

  <!-- wire, left segment with current -->
  <line x1="50" y1="190" x2="352" y2="190" stroke="#888" stroke-width="3.5"/>
  <line x1="90" y1="190" x2="140" y2="190" stroke="#dc2626" stroke-width="0.1" marker-end="url(#dcI)"/>
  <text x="112" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">I</text>
  <!-- plates -->
  <line x1="352" y1="120" x2="352" y2="260" stroke="#888" stroke-width="5"/>
  <line x1="396" y1="120" x2="396" y2="260" stroke="#888" stroke-width="5"/>
  <!-- growing E in gap -->
  <line x1="358" y1="150" x2="388" y2="150" stroke="#2563eb" stroke-width="1.7" marker-end="url(#dcE)"/>
  <line x1="358" y1="190" x2="388" y2="190" stroke="#2563eb" stroke-width="1.7" marker-end="url(#dcE)"/>
  <line x1="358" y1="230" x2="388" y2="230" stroke="#2563eb" stroke-width="1.7" marker-end="url(#dcE)"/>
  <text x="412" y="145" font-size="10" fill="#2563eb">E in the gap, growing</text>
  <text x="412" y="158" font-size="10" fill="#2563eb">as charge piles up</text>
  <!-- wire, right segment -->
  <line x1="396" y1="190" x2="710" y2="190" stroke="#888" stroke-width="3.5"/>

  <!-- Amperian loop around the wire -->
  <ellipse cx="180" cy="190" rx="16" ry="52" fill="none" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="148" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7c3aed">the loop</text>

  <!-- Surface A: flat disc -->
  <ellipse cx="180" cy="190" rx="16" ry="52" fill="rgba(37,99,235,0.15)" stroke="none"/>
  <text x="180" y="302" text-anchor="middle" font-size="10.5" fill="#2563eb">surface A: a flat drumskin on the loop</text>
  <text x="180" y="316" text-anchor="middle" font-size="10.5" fill="#2563eb">the wire punches through it: counts I</text>

  <!-- Surface B: balloon through the gap -->
  <path d="M 180,138 C 280,84 358,96 372,128 L 372,252 C 358,276 292,282 180,242"
        fill="rgba(245,158,11,0.10)" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="7,5"/>
  <text x="560" y="290" text-anchor="middle" font-size="10.5" fill="#f59e0b">surface B: balloons sideways through the gap —</text>
  <text x="560" y="304" text-anchor="middle" font-size="10.5" fill="#f59e0b">same loop, but no charge ever crosses a gap: counts 0 ?!</text>
  <text x="290" y="78" text-anchor="middle" font-size="10" fill="#f59e0b">surface B</text>

  <text x="380" y="340" text-anchor="middle" font-size="11.5" fill="#888">One loop, two legal surfaces, two answers — the law contradicts itself. Maxwell's repair:</text>
  <text x="380" y="358" text-anchor="middle" font-size="11.5" fill="#888">the growing E-flux in the gap counts as a current, and the books balance exactly: ε0 × (rate of E-flux change) = I.</text>
</svg>
