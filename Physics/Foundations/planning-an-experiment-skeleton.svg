   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(51.392813 75.425766)">THE QUESTION</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(59.368359 88.171313)">how does X</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(65.887734 100.321313)">affect Y?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(211.283438 69.866859)">VARIABLES</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(181.517344 81.224438)">change X (independent)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(182.889141 93.374438)">measure Y (dependent)</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(186.854766 105.866859)">hold the rest (control)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(360.772031 69.866859)">APPARATUS</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(344.537578 82.096313)">one instrument for</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(353.735156 93.374438)">every quantity</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(361.322578 105.524438)">you named</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(517.433906 69.866859)">METHOD</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(497.815313 81.498656)">set X, measure Y,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(504.558984 93.374438)">then change X</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(512.736328 105.524438)">and repeat</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(52.380703 208.466859)">ENOUGH DATA</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(36.412734 220.237172)">at least 5 values of X,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(36.471797 231.974438)">widely spread; repeat</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(44.717344 244.124438)">each and average</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(222.064453 214.546781)">TABLE</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(184.701094 225.899438)">a column per quantity,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(179.300391 238.049438)">heading = quantity / unit</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(365.417578 208.466859)">ANALYSIS</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(349.881328 219.824438)">plot Y against X,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(330.470859 231.974438)">axes named; or compare</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(352.854844 244.996313)">down the table</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(505.669922 214.541859)">READ IT BACK</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(500.452031 225.899438)">could a stranger</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(504.954844 238.049438)">carry this out?</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="314.1" y="21.06" transform="rotate(-0 314.1 21.06)">A plan is a chain: each link exists because the one before it demanded it</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="314.1" y="287.172" transform="rotate(-0 314.1 287.172)">the last box is free marks: most lost marks are links the writer never noticed were missing</text>
   </g>
  </g>
 </g>
