    <text style="font-style: italic; font-size: 14px; font-family: 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif; text-anchor: start; fill: #dc2626" x="746.946544" y="110.800705" transform="rotate(-0 746.946544 110.800705)">g</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif; text-anchor: middle; fill: #888888" x="636.567756" y="15.558281" transform="rotate(-0 636.567756 15.558281)">The same lift standing on the Earth</text>
   </g>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans', 'Bitstream Vera Sans', 'Computer Modern Sans Serif', 'Lucida Grande', 'Verdana', 'Geneva', 'Lucid', 'Arial', 'Helvetica', 'Avant Garde', sans-serif; text-anchor: middle; fill: #888888" x="475.385938" y="290.762645" transform="rotate(-0 475.385938 290.762645)">Inside, nothing you can measure tells the two apart: the pulse crosses the lift and arrives lower on the far wall in both. Whatever acceleration does to light and to clocks, gravity does too.</text>
  </g>
 </g>
