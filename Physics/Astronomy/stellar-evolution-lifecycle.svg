   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(131.778675 36.015145)">interstellar cloud of gas and dust</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(170.200472 48.618016)">(mostly hydrogen)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(103.288402 103.491461)">protostar: the cloud collapses under its own</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(132.004261 116.094332)">gravity and its temperature rises</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(100.949691 170.967777)">stable star (main sequence): hydrogen fuses</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(98.879222 183.570648)">to helium; gravity inward = pressure outward</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #f59e0b" x="104.427273" y="216.646484" transform="rotate(-0 104.427273 216.646484)">about the mass of the Sun</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #dc2626" x="332.7" y="216.646484" transform="rotate(-0 332.7 216.646484)">more than about 8 Suns</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="104.427273" y="260.939844" transform="rotate(-0 104.427273 260.939844)">red giant</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(40.397781 314.017566)">planetary nebula, with a</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(40.232898 326.620437)">white dwarf at its centre</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="332.7" y="260.939844" transform="rotate(-0 332.7 260.939844)">red supergiant</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #888888" x="332.7" y="314.920486" transform="rotate(-0 332.7 314.920486)">supernova</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(240.635937 367.565523)">nebula of hydrogen and new heavier</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(259.372656 379.568257)">elements; a neutron star or a</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(263.484375 391.570992)">black hole left at the centre</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #0891b2" transform="translate(486.995455 187.116007)">the nebula may</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #0891b2" transform="translate(486.995455 199.118742)">form new stars,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #0891b2" transform="translate(486.995455 211.121476)">with orbiting</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #0891b2" transform="translate(486.995455 223.124211)">planets</text>
   </g>
   <g id="text_12">
    <text style="font-style: italic; font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(23.608523 359.569371)">hydrogen runs out in the core in</text>
    <text style="font-style: italic; font-size: 10px; font-family: 'DejaVu Sans'; fill: #888888" transform="translate(18.885085 371.572105)">every case; mass decides the rest</text>
   </g>
  </g>
 </g>
