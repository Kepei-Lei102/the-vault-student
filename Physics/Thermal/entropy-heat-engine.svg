<svg viewBox="0 0 540 410" xmlns="http://www.w3.org/2000/svg" width="100%">
  <!-- ===== reservoirs ===== -->
  <rect x="150" y="24" width="240" height="54" rx="8" fill="rgba(220,38,38,0.15)" stroke="#888" stroke-width="1.5"/>
  <text x="270" y="47" font-family="sans-serif" font-size="13" font-weight="bold" fill="#888" text-anchor="middle" letter-spacing="1">HOT RESERVOIR</text>
  <text x="270" y="66" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">temperature T_h</text>

  <rect x="150" y="332" width="240" height="54" rx="8" fill="rgba(37,99,235,0.15)" stroke="#888" stroke-width="1.5"/>
  <text x="270" y="355" font-family="sans-serif" font-size="13" font-weight="bold" fill="#888" text-anchor="middle" letter-spacing="1">COLD RESERVOIR</text>
  <text x="270" y="374" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">temperature T_c</text>

  <!-- ===== engine ===== -->
  <circle cx="270" cy="205" r="58" fill="rgba(124,58,237,0.13)" stroke="#888" stroke-width="2"/>
  <text x="270" y="201" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">ENGINE</text>
  <text x="270" y="220" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">(cyclic)</text>

  <!-- ===== Q_h (heat in, wide red) ===== -->
  <line x1="270" y1="80" x2="270" y2="134" stroke="#dc2626" stroke-width="18"/>
  <polygon points="270,150 256,130 284,130" fill="#dc2626"/>
  <text x="300" y="112" font-family="sans-serif" font-size="13" fill="#888">Q_h  heat drawn in</text>

  <!-- ===== W (work out, green) ===== -->
  <line x1="330" y1="205" x2="442" y2="205" stroke="#059669" stroke-width="9"/>
  <polygon points="458,205 438,194 438,216" fill="#059669"/>
  <text x="372" y="192" font-family="sans-serif" font-size="13" fill="#888">W = useful work</text>

  <!-- ===== Q_c (waste heat, narrower blue) ===== -->
  <line x1="270" y1="263" x2="270" y2="312" stroke="#2563eb" stroke-width="9"/>
  <polygon points="270,328 261,310 279,310" fill="#2563eb"/>
  <text x="300" y="294" font-family="sans-serif" font-size="13" fill="#888">Q_c  waste heat</text>

  <!-- ===== formulas (left) ===== -->
  <text x="16" y="150" font-family="sans-serif" font-size="13" fill="#888">first law:</text>
  <text x="16" y="169" font-family="sans-serif" font-size="14" fill="#888">W = Q_h &#8722; Q_c</text>
  <text x="16" y="205" font-family="sans-serif" font-size="13" fill="#888">efficiency:</text>
  <text x="16" y="224" font-family="sans-serif" font-size="14" fill="#888">&#951; = W / Q_h</text>
  <text x="16" y="243" font-family="sans-serif" font-size="14" fill="#888">= 1 &#8722; Q_c/Q_h</text>
  <text x="16" y="279" font-family="sans-serif" font-size="13" fill="#888">Carnot ceiling:</text>
  <text x="16" y="298" font-family="sans-serif" font-size="14" fill="#888">&#951;_C = 1 &#8722; T_c/T_h</text>
</svg>
