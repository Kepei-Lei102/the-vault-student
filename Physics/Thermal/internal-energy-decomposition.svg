<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .title { font-size: 15.5px; font-weight: 600; }
    .label { font-size: 13px; }
    .small { font-size: 12px; }
    .note  { font-size: 12px; }
  </style>
  <defs>
    <marker id="aKE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
    <marker id="aBulk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>

  <text x="320" y="24" class="title" text-anchor="middle">Internal energy = the molecules' own energy, in the body's rest frame</text>

  <!-- bulk motion arrow (excluded) -->
  <line x1="250" y1="58" x2="408" y2="58" stroke="#dc2626" stroke-width="3" marker-end="url(#aBulk)"/>
  <text x="248" y="50" class="small" text-anchor="start">bulk motion v</text>
  <text x="420" y="62" class="small" text-anchor="start" fill="#dc2626">½Mv² (+ GPE Mgh) — excluded</text>

  <!-- container -->
  <rect x="150" y="78" width="340" height="218" rx="14" fill="rgba(136,136,136,0.05)" stroke="#888" stroke-width="1.5"/>

  <!-- PE springs (drawn under molecules) -->
  <path d="M262,205 L260,217 L243,219 L246,235 L230,236 L232,253 L220,258" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M425,182 L424,196 L408,202 L412,220 L395,225 L400,243 L388,252" fill="none" stroke="#7c3aed" stroke-width="2"/>

  <!-- KE arrows -->
  <line x1="210" y1="135" x2="188" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#aKE)"/>
  <line x1="262" y1="205" x2="286" y2="194" stroke="#2563eb" stroke-width="2" marker-end="url(#aKE)"/>
  <line x1="220" y1="258" x2="205" y2="278" stroke="#2563eb" stroke-width="2" marker-end="url(#aKE)"/>
  <line x1="340" y1="128" x2="358" y2="112" stroke="#2563eb" stroke-width="2" marker-end="url(#aKE)"/>
  <line x1="425" y1="182" x2="446" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#aKE)"/>
  <line x1="388" y1="252" x2="372" y2="272" stroke="#2563eb" stroke-width="2" marker-end="url(#aKE)"/>
  <line x1="458" y1="250" x2="472" y2="230" stroke="#2563eb" stroke-width="2" marker-end="url(#aKE)"/>

  <!-- molecules -->
  <circle cx="210" cy="135" r="12" fill="rgba(136,136,136,0.20)" stroke="#888" stroke-width="1.3"/>
  <circle cx="262" cy="205" r="12" fill="rgba(136,136,136,0.20)" stroke="#888" stroke-width="1.3"/>
  <circle cx="220" cy="258" r="12" fill="rgba(136,136,136,0.20)" stroke="#888" stroke-width="1.3"/>
  <circle cx="340" cy="128" r="12" fill="rgba(136,136,136,0.20)" stroke="#888" stroke-width="1.3"/>
  <circle cx="425" cy="182" r="12" fill="rgba(136,136,136,0.20)" stroke="#888" stroke-width="1.3"/>
  <circle cx="388" cy="252" r="12" fill="rgba(136,136,136,0.20)" stroke="#888" stroke-width="1.3"/>
  <circle cx="458" cy="250" r="12" fill="rgba(136,136,136,0.20)" stroke="#888" stroke-width="1.3"/>

  <!-- legend -->
  <line x1="156" y1="320" x2="178" y2="320" stroke="#2563eb" stroke-width="2" marker-end="url(#aKE)"/>
  <text x="186" y="324" class="small" text-anchor="start">random molecular KE — the part temperature reads</text>
  <path d="M156,344 L160,340 L168,348 L176,340 L180,344" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text x="186" y="348" class="small" text-anchor="start">intermolecular PE — the bonds (negative when bound)</text>

  <!-- summary + ideal-gas note -->
  <text x="320" y="382" class="label" text-anchor="middle" style="font-size:14px">U  =  Σ(random KE)  +  Σ(intermolecular potential energy)</text>
  <text x="320" y="408" class="note" text-anchor="middle">Ideal gas: no intermolecular forces, so PE = 0, and U = Σ KE = (3/2)NkT</text>
</svg>
