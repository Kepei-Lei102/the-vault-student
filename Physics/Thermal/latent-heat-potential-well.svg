<?xml version="1.0" encoding="UTF-8"?>
<!-- stack: SMIL -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13px; }
    .note  { font-size: 11px; opacity: 0.7; }
    .zone  { font-size: 12px; opacity: 0.8; }
  </style>
  <defs>
    <marker id="axg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <text x="290" y="26" class="title" text-anchor="middle">Latent heat — climbing out of the well</text>

  <!-- ===== axes ===== -->
  <!-- E_p axis (vertical) -->
  <line x1="78" y1="345" x2="78" y2="74" stroke="#888" stroke-width="1.5" marker-end="url(#axg)"/>
  <text x="58" y="80" class="math label">E<tspan baseline-shift="sub" font-size="9">p</tspan></text>
  <!-- r axis (horizontal) -->
  <line x1="78" y1="345" x2="552" y2="345" stroke="#888" stroke-width="1.5" marker-end="url(#axg)"/>
  <text x="548" y="365" class="math label" text-anchor="end">separation r</text>

  <!-- E_p = 0 dashed level -->
  <line x1="78" y1="120" x2="545" y2="120" stroke="#888" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.7"/>
  <text x="318" y="112" class="note">E<tspan baseline-shift="sub" font-size="8">p</tspan> = 0  (molecules free — gas)</text>

  <!-- ===== the potential well ===== -->
  <path d="M 150 95 C 188 95 200 300 222 300 C 252 300 270 165 322 145 C 392 122 460 130 525 127"
        fill="none" stroke="#7c3aed" stroke-width="2.5"/>

  <!-- zone labels along the curve -->
  <text x="222" y="322" class="zone" text-anchor="middle" fill="#7c3aed">solid</text>
  <text x="312" y="178" class="zone" text-anchor="middle" fill="#7c3aed">liquid</text>
  <text x="470" y="146" class="zone" text-anchor="middle" fill="#7c3aed">gas</text>

  <!-- why a well exists at all: the two competing tendencies -->
  <text x="113" y="150" class="note" text-anchor="middle">repulsion</text>
  <text x="113" y="164" class="note" text-anchor="middle">(too close)</text>
  <text x="446" y="186" class="note" text-anchor="middle">attraction</text>
  <text x="446" y="200" class="note" text-anchor="middle">(pulls together)</text>

  <!-- ===== latent-heat depth bracket (amber) ===== -->
  <line x1="52" y1="120" x2="52" y2="300" stroke="#f59e0b" stroke-width="1.5"/>
  <path d="M 48 126 L 52 118 L 56 126 z" fill="#f59e0b"/>
  <path d="M 48 294 L 52 302 L 56 294 z" fill="#f59e0b"/>
  <text x="30" y="214" class="label" fill="#f59e0b" text-anchor="middle" transform="rotate(-90 30 214)">latent heat (the climb)</text>

  <!-- ===== the molecule, climbing the wall (cx/cy default = resting at the well bottom) ===== -->
  <circle cx="222" cy="300" r="10" fill="rgba(5,150,105,0.30)" stroke="#059669" stroke-width="2.5">
    <animate attributeName="cx"
             values="222;222;255;290;322;385;460;525;525;222;222"
             keyTimes="0;0.12;0.20;0.28;0.36;0.44;0.50;0.55;0.90;0.93;1"
             dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy"
             values="300;300;235;180;145;128;127;127;127;300;300"
             keyTimes="0;0.12;0.20;0.28;0.36;0.44;0.50;0.55;0.90;0.93;1"
             dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="1;1;1;0;0;1"
             keyTimes="0;0.04;0.86;0.90;0.96;1"
             dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== captions (fade in/out with the phase) ===== -->
  <text x="300" y="58" class="label" text-anchor="middle" fill="#888" opacity="0">
    Solid: trapped at the bottom, only jiggling in place.
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.13;0.17;1" dur="13s" repeatCount="indefinite"/>
  </text>
  <text x="300" y="58" class="label" text-anchor="middle" fill="#f59e0b" opacity="0">
    Melting + boiling: energy climbs the wall — raising PE, not speed.
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.21;0.52;0.56;1" dur="13s" repeatCount="indefinite"/>
  </text>
  <text x="300" y="58" class="label" text-anchor="middle" fill="#059669" opacity="0">
    Free molecule: out of the well, PE &#8776; 0. Temperature never rose.
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.57;0.60;0.84;0.88;1" dur="13s" repeatCount="indefinite"/>
  </text>
</svg>
