<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" width="100%">
  <defs>
    <marker id="green-in" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#059669"/></marker>
    <marker id="red-out" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
  </defs>

  <!-- ===== central system box ===== -->
  <rect x="238" y="112" width="164" height="96" rx="10" fill="rgba(8,145,178,0.12)" stroke="#888" stroke-width="2"/>
  <text x="320" y="150" font-family="sans-serif" font-size="13" font-weight="bold" fill="#888" text-anchor="middle" letter-spacing="1">THE SYSTEM</text>
  <text x="320" y="176" font-family="sans-serif" font-size="14" fill="#888" text-anchor="middle">internal energy</text>
  <text x="320" y="196" font-family="sans-serif" font-size="15" fill="#888" text-anchor="middle" font-style="italic">U</text>

  <!-- the law, below -->
  <text x="320" y="258" font-family="sans-serif" font-size="20" fill="#888" text-anchor="middle">&#916;U = Q + W</text>
  <text x="320" y="285" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">arrow in = positive   ·   arrow out = negative</text>

  <!-- ===== LEFT: heat Q ===== -->
  <!-- Q in (green) -->
  <line x1="70" y1="138" x2="232" y2="138" stroke="#059669" stroke-width="3" marker-end="url(#green-in)"/>
  <text x="150" y="128" font-family="sans-serif" font-size="12.5" fill="#888" text-anchor="middle">Q &gt; 0  (heat in)</text>
  <!-- Q out (red) -->
  <line x1="232" y1="182" x2="70" y2="182" stroke="#dc2626" stroke-width="3" marker-end="url(#red-out)"/>
  <text x="150" y="200" font-family="sans-serif" font-size="12.5" fill="#888" text-anchor="middle">Q &lt; 0  (heat out)</text>

  <!-- ===== RIGHT: work W ===== -->
  <!-- W in (green): work done ON the gas -->
  <line x1="570" y1="138" x2="408" y2="138" stroke="#059669" stroke-width="3" marker-end="url(#green-in)"/>
  <text x="490" y="128" font-family="sans-serif" font-size="12.5" fill="#888" text-anchor="middle">W &gt; 0  (work on gas)</text>
  <!-- W out (red): gas expands, does work -->
  <line x1="408" y1="182" x2="570" y2="182" stroke="#dc2626" stroke-width="3" marker-end="url(#red-out)"/>
  <text x="490" y="200" font-family="sans-serif" font-size="12.5" fill="#888" text-anchor="middle">W &lt; 0  (gas expands)</text>

  <!-- side captions -->
  <text x="70" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#888">HEAT  Q</text>
  <text x="570" y="60" font-family="sans-serif" font-size="13" font-weight="bold" fill="#888" text-anchor="end">WORK  W</text>
</svg>
