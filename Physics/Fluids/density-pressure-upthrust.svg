<svg width="100%" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <text x="450" y="26" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">Upthrust is a pressure difference: the bottom is deeper than the top</text>
  <rect x="80" y="60" width="380" height="290" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="210" y="140" width="120" height="120" fill="rgba(245,158,11,0.25)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="270" y="205" text-anchor="middle" font-size="12" fill="#888">block, volume V</text>
  <!-- top arrows (down, short) -->
  <g stroke="#7c3aed" stroke-width="2" fill="#7c3aed">
    <line x1="235" y1="100" x2="235" y2="132"/><polygon points="235,138 230,128 240,128"/>
    <line x1="270" y1="100" x2="270" y2="132"/><polygon points="270,138 265,128 275,128"/>
    <line x1="305" y1="100" x2="305" y2="132"/><polygon points="305,138 300,128 310,128"/>
  </g>
  <text x="340" y="108" font-size="11" fill="#7c3aed">p_top A = ρ g h₁ A, down</text>
  <!-- bottom arrows (up, long) -->
  <g stroke="#059669" stroke-width="2.5" fill="#059669">
    <line x1="235" y1="320" x2="235" y2="270"/><polygon points="235,264 229,275 241,275"/>
    <line x1="270" y1="320" x2="270" y2="270"/><polygon points="270,264 264,275 276,275"/>
    <line x1="305" y1="320" x2="305" y2="270"/><polygon points="305,264 299,275 311,275"/>
  </g>
  <text x="340" y="300" font-size="11" fill="#059669">p_bottom A = ρ g h₂ A, up</text>
  <!-- side arrows cancel -->
  <g stroke="#888" stroke-width="1.5" fill="#888">
    <line x1="170" y1="200" x2="200" y2="200"/><polygon points="206,200 196,195 196,205"/>
    <line x1="370" y1="200" x2="340" y2="200"/><polygon points="334,200 344,195 344,205"/>
  </g>
  <text x="120" y="190" font-size="10.5" fill="#888">sides: equal</text><text x="120" y="204" font-size="10.5" fill="#888">and opposite</text>
  <!-- depth markers -->
  <line x1="100" y1="60" x2="100" y2="140" stroke="#888" stroke-width="1"/><polygon points="100,146 95,136 105,136" fill="#888"/><text x="106" y="105" font-size="11" fill="#888">h₁</text>
  <line x1="130" y1="60" x2="130" y2="260" stroke="#888" stroke-width="1"/><polygon points="130,266 125,256 135,256" fill="#888"/><text x="136" y="250" font-size="11" fill="#888">h₂</text>
  <!-- right: the algebra -->
  <g font-size="12.5" fill="#888">
    <text x="510" y="110">net upward force</text>
    <text x="510" y="135">= p_bottom A − p_top A</text>
    <text x="510" y="160">= ρ g (h₂ − h₁) A</text>
    <text x="510" y="185">= ρ g × (height × area)</text>
    <text x="510" y="220" font-size="14" fill="#059669" font-weight="bold">= ρ g V = weight of the fluid displaced</text>
    <text x="510" y="255">depth h₁ cancelled: the upthrust is the same</text>
    <text x="510" y="272">at any depth, and the same for any shape</text>
    <text x="510" y="289">(cut it into thin vertical columns)</text>
    <text x="510" y="320" fill="#f59e0b">floats if ρ_object V g &lt; ρ_fluid V g, i.e. ρ_object &lt; ρ_fluid</text>
    <text x="510" y="340" fill="#f59e0b">then rises until the submerged part displaces its own weight</text>
  </g>
  <text x="450" y="372" text-anchor="middle" font-size="11" fill="#888">Archimedes' principle is not a new law: it is Δp = ρgΔh applied to the top and bottom of an object</text>
</svg>
