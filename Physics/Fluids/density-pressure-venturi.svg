<svg width="100%" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <text x="450" y="26" text-anchor="middle" font-size="15" fill="#888" font-weight="bold">Fluid in motion: what is kept along a streamline</text>
  <path d="M60 100 L300 100 Q420 100 450 130 L450 170 Q420 200 300 200 L60 200 Z" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M450 130 L600 130 Q700 130 720 110 L840 110 L840 190 L720 190 Q700 170 600 170 L450 170 Z" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1.5"/>
  <g stroke="#059669" stroke-width="2" fill="#059669">
    <line x1="120" y1="150" x2="170" y2="150"/><polygon points="176,150 166,145 166,155"/>
    <line x1="500" y1="150" x2="590" y2="150"/><polygon points="596,150 586,145 586,155"/>
    <line x1="750" y1="150" x2="805" y2="150"/><polygon points="811,150 801,145 801,155"/>
  </g>
  <text x="140" y="230" text-anchor="middle" font-size="11.5" fill="#888">wide, slow, high pressure</text>
  <text x="540" y="230" text-anchor="middle" font-size="11.5" fill="#888">narrow, fast, low pressure</text>
  <text x="770" y="230" text-anchor="middle" font-size="11.5" fill="#888">wider again, slower, pressure back up</text>
  <g font-size="11.5" fill="#888">
    <text x="60" y="262"><tspan font-weight="bold" fill="#2563eb">continuity</tspan> — the same volume passes every section each second: A₁v₁ = A₂v₂</text>
    <text x="60" y="284"><tspan font-weight="bold" fill="#059669">Bernoulli</tspan> — energy per unit volume is kept: p + ½ρv² + ρgh = constant, so faster means lower pressure</text>
  </g>
  <line x1="60" y1="85" x2="840" y2="85" stroke="#888" stroke-width="0.8" stroke-dasharray="3 3"/>
  <text x="450" y="76" text-anchor="middle" font-size="10.5" fill="#888">density-pressure-bernoulli.py: twenty stations, the sum constant to the last digit</text>
</svg>
