<svg width="100%" viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- the real source: a box holding an ideal e.m.f. in series with r -->
  <rect x="120" y="60" width="300" height="90" rx="8" fill="rgba(124,58,237,0.10)" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="270" y="50" text-anchor="middle" fill="#888" font-weight="bold">the real cell — what is inside the case</text>
  <!-- wire from X into box -->
  <g stroke="#888" stroke-width="2" fill="none">
    <line x1="60" y1="105" x2="190" y2="105"/>
    <!-- cell symbol: long thin + , short thick - -->
    <line x1="190" y1="80" x2="190" y2="130" stroke-width="2"/>
    <line x1="204" y1="92" x2="204" y2="118" stroke-width="5"/>
    <line x1="204" y1="105" x2="290" y2="105"/>
    <!-- r -->
    <rect x="290" y="93" width="70" height="24" fill="none"/>
    <line x1="360" y1="105" x2="480" y2="105"/>
    <!-- external loop -->
    <line x1="480" y1="105" x2="480" y2="220"/>
    <rect x="445" y="185" width="70" height="24" fill="none" transform="rotate(90 480 197)"/>
    <line x1="480" y1="220" x2="480" y2="250"/>
    <line x1="480" y1="250" x2="60" y2="250"/>
    <line x1="60" y1="250" x2="60" y2="105"/>
    <!-- ammeter on the bottom wire -->
    <circle cx="270" cy="250" r="16" fill="rgba(37,99,235,0.10)" stroke="#2563eb"/>
    <!-- voltmeter across terminals X Y -->
    <line x1="60" y1="105" x2="60" y2="175" stroke-dasharray="3 3"/>
    <line x1="480" y1="105" x2="480" y2="175" stroke-dasharray="3 3"/>
    <line x1="60" y1="175" x2="254" y2="175" stroke-dasharray="3 3"/>
    <line x1="286" y1="175" x2="480" y2="175" stroke-dasharray="3 3"/>
    <circle cx="270" cy="175" r="16" fill="rgba(5,150,105,0.10)" stroke="#059669"/>
  </g>
  <text x="270" y="255" text-anchor="middle" fill="#888">A</text>
  <text x="270" y="180" text-anchor="middle" fill="#888">V</text>
  <text x="197" y="72" text-anchor="middle" fill="#888" font-style="italic">E</text>
  <text x="325" y="88" text-anchor="middle" fill="#888">r</text>
  <text x="500" y="200" fill="#888">R</text>
  <text x="48" y="100" text-anchor="end" fill="#888" font-weight="bold">X</text>
  <text x="492" y="100" fill="#888" font-weight="bold">Y</text>
  <!-- annotations -->
  <text x="325" y="138" text-anchor="middle" fill="#dc2626" font-size="12">p.d. across r = I r  (the "lost volts")</text>
  <text x="270" y="200" text-anchor="middle" fill="#059669" font-size="12">voltmeter reads the terminal p.d.  V = E − I r</text>
  <text x="270" y="285" text-anchor="middle" fill="#888" font-size="12">loop rule, once round:  E = I R + I r   so   V = I R = E − I r</text>
  <text x="610" y="105" fill="#888" font-size="11">terminals X, Y are the only</text>
  <text x="610" y="120" fill="#888" font-size="11">points you can touch;</text>
  <text x="610" y="135" fill="#888" font-size="11">E and r are never seen apart</text>
</svg>
