<svg xmlns='http://www.w3.org/2000/svg' width='100%' viewBox='0 0 780 235' font-family='Helvetica, Arial, sans-serif'><text x='170' y='26' text-anchor='middle' font-size='14' fill='#888' font-weight='bold'>First law — at a junction, what goes in comes out</text><line x1='40' y1='110' x2='170' y2='110' stroke='#888' stroke-width='2' fill='none'/><line x1='170' y1='110' x2='300' y2='60' stroke='#888' stroke-width='2' fill='none'/><line x1='170' y1='110' x2='300' y2='110' stroke='#888' stroke-width='2' fill='none'/><line x1='170' y1='110' x2='300' y2='160' stroke='#888' stroke-width='2' fill='none'/><circle cx='170' cy='110' r='4' fill='#888'/><line x1='70' y1='110' x2='130' y2='110' stroke='#2563eb' stroke-width='2.2'/><polygon points='130,110 122.1,114.3 122.1,105.7' fill='#2563eb'/><text x='86.0' y='102.0' font-size='13' fill='#2563eb'>3.0 A</text><line x1='200' y1='98' x2='260' y2='75' stroke='#059669' stroke-width='2.2'/><polygon points='260,75 254.2,81.9 251.1,73.8' fill='#059669'/><text x='236.0' y='78.5' font-size='13' fill='#059669'>1.2 A</text><line x1='200' y1='110' x2='260' y2='110' stroke='#059669' stroke-width='2.2'/><polygon points='260,110 252.1,114.3 252.1,105.7' fill='#059669'/><text x='228.0' y='128.0' font-size='13' fill='#059669'>0.8 A</text><line x1='200' y1='122' x2='260' y2='145' stroke='#059669' stroke-width='2.2'/><polygon points='260,145 251.1,146.2 254.2,138.1' fill='#059669'/><text x='236.0' y='153.5' font-size='13' fill='#059669'>1.0 A</text><text x='170' y='200' text-anchor='middle' font-size='12' fill='#888' font-weight='normal'>Σ I in = Σ I out — charge cannot pile up at a point</text><text x='170' y='218' text-anchor='middle' font-size='11' fill='#888' font-weight='normal'>(no charge is stored in a wire; the junction holds nothing)</text><text x='570' y='26' text-anchor='middle' font-size='14' fill='#888' font-weight='bold'>Second law — round any closed loop, e.m.f. gained = p.d. lost</text><line x1='460' y1='60' x2='460' y2='170' stroke='#888' stroke-width='2' fill='none'/><line x1='460' y1='99' x2='460' y2='131' stroke='#888' stroke-width='2'/><line x1='468' y1='107' x2='468' y2='123' stroke='#888' stroke-width='4'/><text x='464' y='93' text-anchor='middle' font-size='13' fill='#888'>E = 6 V</text><line x1='460' y1='60' x2='520' y2='60' stroke='#888' stroke-width='2' fill='none'/><rect x='520' y='50.0' width='60' height='20' stroke='#888' stroke-width='2' fill='none'/><text x='550.0' y='44.0' text-anchor='middle' font-size='13' fill='#888'>R₁ = 2 Ω</text><line x1='580' y1='60' x2='680' y2='60' stroke='#888' stroke-width='2' fill='none'/><line x1='680' y1='60' x2='680' y2='80' stroke='#888' stroke-width='2' fill='none'/><rect x='670.0' y='80' width='20' height='60' stroke='#888' stroke-width='2' fill='none'/><text x='698.0' y='114.0' font-size='13' fill='#888'>R₂ = 4 Ω</text><line x1='680' y1='140' x2='680' y2='170' stroke='#888' stroke-width='2' fill='none'/><line x1='680' y1='170' x2='460' y2='170' stroke='#888' stroke-width='2' fill='none'/><line x1='600' y1='60' x2='650' y2='60' stroke='#2563eb' stroke-width='2.2'/><polygon points='650,60 642.1,64.3 642.1,55.7' fill='#2563eb'/><text x='615.0' y='52.0' font-size='13' fill='#2563eb'>I = 1 A</text><text x='550' y='92' text-anchor='middle' font-size='12' fill='#dc2626' font-weight='normal'>−2 V</text><text x='718' y='150' text-anchor='start' font-size='12' fill='#dc2626' font-weight='normal'>−4 V</text><text x='430' y='120' text-anchor='end' font-size='12' fill='#059669' font-weight='normal'>+6 V</text><text x='570' y='200' text-anchor='middle' font-size='12' fill='#888' font-weight='normal'>+6 − (1 × 2) − (1 × 4) = 0 — every coulomb that went round</text><text x='570' y='218' text-anchor='middle' font-size='11' fill='#888' font-weight='normal'>came back with the energy it left with</text></svg>