<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 376" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13px; }
    .note { font-size: 12px; }
    .result { font-size: 23px; }
    .big { font-size: 30px; }
  </style>

  <defs>
    <marker id="arrEnd" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrStart" viewBox="0 0 10 10" refX="1" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- ==================== panel 1 — the reference wire ==================== -->
  <text x="130" y="26" class="title" text-anchor="middle">one wire</text>

  <rect x="78" y="76" width="104" height="30" rx="3"
        fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="2"/>

  <line x1="66" y1="76" x2="66" y2="106" stroke="#888" stroke-width="1.2"
        marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <text x="52" y="96" class="math label" text-anchor="middle">A</text>

  <line x1="78" y1="126" x2="182" y2="126" stroke="#888" stroke-width="1.2"
        marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <text x="130" y="146" class="math label" text-anchor="middle">L</text>

  <text x="130" y="174" class="note" text-anchor="middle">the reference:</text>
  <text x="130" y="191" class="note" text-anchor="middle">one length, one cross-section</text>

  <text x="130" y="230" class="math result" text-anchor="middle">R</text>

  <!-- ==================== panel 2 — twice the length ===================== -->
  <text x="390" y="26" class="title" text-anchor="middle">twice as long</text>

  <rect x="286" y="76" width="208" height="30" rx="3"
        fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="2"/>
  <line x1="390" y1="76" x2="390" y2="106" stroke="#2563eb" stroke-width="1.4"
        stroke-dasharray="5,4" opacity="0.85"/>

  <line x1="286" y1="126" x2="494" y2="126" stroke="#888" stroke-width="1.2"
        marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <text x="390" y="146" class="math label" text-anchor="middle">2L</text>

  <text x="390" y="174" class="note" text-anchor="middle">two gauntlets in a row —</text>
  <text x="390" y="191" class="note" text-anchor="middle">every carrier runs both of them</text>

  <text x="390" y="230" class="math result" text-anchor="middle">2R</text>

  <!-- ==================== panel 3 — twice the area ======================= -->
  <text x="650" y="26" class="title" text-anchor="middle">twice as thick</text>

  <rect x="598" y="42" width="104" height="30" rx="3"
        fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="2"/>
  <rect x="598" y="76" width="104" height="30" rx="3"
        fill="rgba(37, 99, 235, 0.15)" stroke="#2563eb" stroke-width="2"/>

  <line x1="586" y1="42" x2="586" y2="106" stroke="#888" stroke-width="1.2"
        marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <text x="568" y="78" class="math label" text-anchor="middle">2A</text>

  <line x1="598" y1="126" x2="702" y2="126" stroke="#888" stroke-width="1.2"
        marker-start="url(#arrStart)" marker-end="url(#arrEnd)"/>
  <text x="650" y="146" class="math label" text-anchor="middle">L</text>

  <text x="650" y="174" class="note" text-anchor="middle">two lanes side by side —</text>
  <text x="650" y="191" class="note" text-anchor="middle">each carrier gets a second road</text>

  <text x="650" y="230" class="math result" text-anchor="middle">R / 2</text>

  <!-- ==================== the formula band =============================== -->
  <line x1="40" y1="258" x2="740" y2="258" stroke="#888" stroke-width="1"
        opacity="0.35"/>

  <text x="118" y="312" class="math big" text-anchor="middle">R</text>
  <text x="156" y="312" class="big" text-anchor="middle">=</text>
  <text x="198" y="312" class="math big" text-anchor="middle" fill="#7c3aed">&#961;</text>
  <text x="240" y="300" class="math big" text-anchor="middle" fill="#2563eb">L</text>
  <line x1="221" y1="308" x2="259" y2="308" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="336" class="math big" text-anchor="middle" fill="#2563eb">A</text>

  <rect x="312" y="284" width="11" height="11" fill="#7c3aed" opacity="0.85"/>
  <text x="332" y="294" class="label">the material&#8217;s price &#8212; resistivity, in &#937; m</text>

  <rect x="312" y="316" width="11" height="11" fill="#2563eb" opacity="0.85"/>
  <text x="332" y="326" class="label">how much of it you bought &#8212; length and width, in metres</text>

  <text x="390" y="366" class="note" text-anchor="middle">Resistance belongs to the object. Resistivity belongs to the stuff it is made of.</text>
</svg>
