<svg width="100%" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrTeal" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrAmber" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#888"/>
    </marker>
    <marker id="arrGrayRev" markerWidth="8" markerHeight="8" refX="0" refY="2.5" orient="auto">
      <path d="M5,0 L0,2.5 L5,5 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- top label -->
  <text x="70" y="40" font-size="15" fill="#888">n carriers per cubic metre, charge q each, drifting at speed v</text>

  <!-- wire body -->
  <line x1="60" y1="85" x2="700" y2="85" stroke="#888" stroke-width="1.5"/>
  <line x1="60" y1="175" x2="700" y2="175" stroke="#888" stroke-width="1.5"/>
  <ellipse cx="60" cy="130" rx="13" ry="45" fill="none" stroke="#888" stroke-width="1.5"/>
  <ellipse cx="700" cy="130" rx="13" ry="45" fill="none" stroke="#888" stroke-width="1.2" opacity="0.6"/>

  <!-- the slab: everyone within v dt of the gate -->
  <rect x="380" y="85" width="140" height="90" fill="rgba(37,99,235,0.13)"/>
  <ellipse cx="380" cy="130" rx="13" ry="45" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- the gate -->
  <ellipse cx="520" cy="130" rx="13" ry="45" fill="rgba(124,58,237,0.10)" stroke="#7c3aed" stroke-width="2"/>
  <text x="520" y="56" font-size="15" fill="#7c3aed" text-anchor="middle">the gate: cross-section, area A</text>
  <line x1="520" y1="62" x2="520" y2="80" stroke="#7c3aed" stroke-width="1.2"/>

  <!-- carriers outside the slab (teal) -->
  <g fill="#0891b2">
    <circle cx="95" cy="105" r="5"/><circle cx="130" cy="150" r="5"/>
    <circle cx="170" cy="120" r="5"/><circle cx="210" cy="160" r="5"/>
    <circle cx="250" cy="100" r="5"/><circle cx="290" cy="140" r="5"/>
    <circle cx="330" cy="163" r="5"/><circle cx="352" cy="112" r="5"/>
  </g>
  <g stroke="#0891b2" stroke-width="1.6">
    <line x1="103" y1="105" x2="121" y2="105" marker-end="url(#arrTeal)"/>
    <line x1="138" y1="150" x2="156" y2="150" marker-end="url(#arrTeal)"/>
    <line x1="178" y1="120" x2="196" y2="120" marker-end="url(#arrTeal)"/>
    <line x1="218" y1="160" x2="236" y2="160" marker-end="url(#arrTeal)"/>
    <line x1="258" y1="100" x2="276" y2="100" marker-end="url(#arrTeal)"/>
    <line x1="298" y1="140" x2="316" y2="140" marker-end="url(#arrTeal)"/>
    <line x1="338" y1="163" x2="356" y2="163" marker-end="url(#arrTeal)"/>
    <line x1="360" y1="112" x2="374" y2="112" marker-end="url(#arrTeal)"/>
  </g>

  <!-- carriers inside the slab (amber: these cross within dt) -->
  <g fill="#f59e0b">
    <circle cx="395" cy="130" r="5"/><circle cx="420" cy="100" r="5"/>
    <circle cx="445" cy="158" r="5"/><circle cx="470" cy="118" r="5"/>
    <circle cx="498" cy="145" r="5"/>
  </g>
  <g stroke="#f59e0b" stroke-width="1.6">
    <line x1="403" y1="130" x2="421" y2="130" marker-end="url(#arrAmber)"/>
    <line x1="428" y1="100" x2="446" y2="100" marker-end="url(#arrAmber)"/>
    <line x1="453" y1="158" x2="471" y2="158" marker-end="url(#arrAmber)"/>
    <line x1="478" y1="118" x2="496" y2="118" marker-end="url(#arrAmber)"/>
    <line x1="506" y1="145" x2="514" y2="145" marker-end="url(#arrAmber)"/>
  </g>

  <!-- carriers already through (faded) -->
  <g fill="#0891b2" opacity="0.35">
    <circle cx="565" cy="125" r="5"/><circle cx="620" cy="152" r="5"/><circle cx="663" cy="105" r="5"/>
  </g>
  <g stroke="#0891b2" stroke-width="1.6" opacity="0.35">
    <line x1="573" y1="125" x2="591" y2="125" marker-end="url(#arrTeal)"/>
    <line x1="628" y1="152" x2="646" y2="152" marker-end="url(#arrTeal)"/>
    <line x1="671" y1="105" x2="685" y2="105" marker-end="url(#arrTeal)"/>
  </g>
  <text x="614" y="70" font-size="13" fill="#888" text-anchor="middle" opacity="0.8">already through</text>

  <!-- v dt measure below the slab -->
  <line x1="380" y1="198" x2="520" y2="198" stroke="#888" stroke-width="1.3" marker-end="url(#arrGray)" marker-start="url(#arrGrayRev)"/>
  <line x1="380" y1="180" x2="380" y2="192" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="520" y1="180" x2="520" y2="192" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="450" y="218" font-size="15" fill="#2563eb" text-anchor="middle">v Δt — everyone in this slab crosses the gate within Δt</text>

  <!-- the count -->
  <text x="380" y="252" font-size="16" fill="#888" text-anchor="middle">count in the slab:  N = n × (A × v Δt) — so the charge through the gate per second is</text>
  <text x="380" y="281" font-size="19" fill="#888" text-anchor="middle">I = n A v q</text>
</svg>
