   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #888888" x="47.52" y="480.7872" transform="rotate(-0 47.52 480.7872)">The drawn X-ray/gamma boundary is conventional; their energies overlap and source-based names also occur.</text>
