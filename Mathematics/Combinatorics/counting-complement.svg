<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="100%">
  <!-- Title -->
  <text x="300" y="24" font-family="sans-serif" font-size="14" fill="#888" text-anchor="middle">Step 0: The Complement Method — count what you DON'T want</text>

  <!-- "All" box -->
  <rect x="30" y="50" width="160" height="90" rx="8" fill="rgba(66,133,244,0.08)" stroke="#4285F4" stroke-width="2"/>
  <text x="110" y="80" font-family="sans-serif" font-size="14" fill="#4285F4" text-anchor="middle" font-weight="bold">Total</text>
  <text x="110" y="100" font-family="sans-serif" font-size="22" fill="#4285F4" text-anchor="middle" font-weight="bold">70</text>
  <text x="110" y="118" font-family="sans-serif" font-size="11" fill="#4285F4" text-anchor="middle">⁸C₄ = 70 committees</text>

  <!-- Minus sign -->
  <text x="215" y="100" font-family="sans-serif" font-size="28" fill="#888" text-anchor="middle" font-weight="bold">−</text>

  <!-- "Unwanted" box -->
  <rect x="240" y="50" width="160" height="90" rx="8" fill="rgba(234,67,53,0.08)" stroke="#EA4335" stroke-width="2"/>
  <text x="320" y="80" font-family="sans-serif" font-size="14" fill="#EA4335" text-anchor="middle" font-weight="bold">Unwanted</text>
  <text x="320" y="100" font-family="sans-serif" font-size="22" fill="#EA4335" text-anchor="middle" font-weight="bold">15</text>
  <text x="320" y="118" font-family="sans-serif" font-size="11" fill="#EA4335" text-anchor="middle">both X &amp; Y included: ⁶C₂</text>

  <!-- Equals sign -->
  <text x="425" y="100" font-family="sans-serif" font-size="28" fill="#888" text-anchor="middle" font-weight="bold">=</text>

  <!-- "Wanted" box -->
  <rect x="450" y="50" width="130" height="90" rx="8" fill="rgba(52,168,83,0.08)" stroke="#34A853" stroke-width="2"/>
  <text x="515" y="80" font-family="sans-serif" font-size="14" fill="#34A853" text-anchor="middle" font-weight="bold">Valid</text>
  <text x="515" y="100" font-family="sans-serif" font-size="22" fill="#34A853" text-anchor="middle" font-weight="bold">55</text>
  <text x="515" y="118" font-family="sans-serif" font-size="11" fill="#34A853" text-anchor="middle">X &amp; Y not both on</text>

  <!-- Bottom annotation -->
  <text x="300" y="165" font-family="sans-serif" font-size="12" fill="#888" opacity="0.5" text-anchor="middle">Instead of listing all valid committees (hard), subtract the few invalid ones (easy).</text>
  <text x="300" y="180" font-family="sans-serif" font-size="11" fill="#9C27B0" text-anchor="middle">鬼谷子: define what it is NOT — what remains is the answer.</text>
</svg>