<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%">
  <!-- Title -->
  <text x="300" y="24" font-family="sans-serif" font-size="14" fill="#888" text-anchor="middle">Type 1: Items that must be together — treat as one block</text>

  <!-- Step 1: Original 6 people -->
  <text x="30" y="62" font-family="sans-serif" font-size="12" fill="#888">Before:</text>
  <rect x="90" y="45" width="40" height="30" rx="4" fill="rgba(156,39,176,0.2)" stroke="#9C27B0" stroke-width="2"/>
  <text x="110" y="65" font-family="sans-serif" font-size="13" fill="#9C27B0" text-anchor="middle" font-weight="bold">A</text>
  <rect x="135" y="45" width="40" height="30" rx="4" fill="rgba(156,39,176,0.2)" stroke="#9C27B0" stroke-width="2"/>
  <text x="155" y="65" font-family="sans-serif" font-size="13" fill="#9C27B0" text-anchor="middle" font-weight="bold">B</text>
  <rect x="190" y="45" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="210" y="65" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">C</text>
  <rect x="235" y="45" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="255" y="65" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">D</text>
  <rect x="280" y="45" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="300" y="65" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">E</text>
  <rect x="325" y="45" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="345" y="65" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">F</text>
  <text x="400" y="65" font-family="sans-serif" font-size="12" fill="#888">6 people, A &amp; B must be together</text>

  <!-- Arrow -->
  <line x1="300" y1="82" x2="300" y2="108" stroke="#888" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#888"/></marker></defs>
  <text x="310" y="100" font-family="sans-serif" font-size="11" fill="#9C27B0">glue A &amp; B</text>

  <!-- Step 2: Block + remaining -->
  <text x="30" y="132" font-family="sans-serif" font-size="12" fill="#888">After:</text>
  <!-- The block -->
  <rect x="90" y="112" width="85" height="34" rx="6" fill="rgba(156,39,176,0.12)" stroke="#9C27B0" stroke-width="2.5" stroke-dasharray="6,3"/>
  <rect x="95" y="116" width="35" height="26" rx="4" fill="rgba(156,39,176,0.2)" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="112" y="134" font-family="sans-serif" font-size="13" fill="#9C27B0" text-anchor="middle" font-weight="bold">A</text>
  <rect x="135" y="116" width="35" height="26" rx="4" fill="rgba(156,39,176,0.2)" stroke="#9C27B0" stroke-width="1.5"/>
  <text x="152" y="134" font-family="sans-serif" font-size="13" fill="#9C27B0" text-anchor="middle" font-weight="bold">B</text>

  <rect x="190" y="115" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="210" y="135" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">C</text>
  <rect x="235" y="115" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="255" y="135" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">D</text>
  <rect x="280" y="115" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="300" y="135" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">E</text>
  <rect x="325" y="115" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="345" y="135" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">F</text>

  <!-- Calculation -->
  <text x="300" y="172" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">5 "items" to arrange: 5! = 120</text>
  <text x="300" y="192" font-family="sans-serif" font-size="13" fill="#9C27B0" text-anchor="middle">× swap inside block: 2! = 2 → Total = 240</text>
</svg>