<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" width="100%">
  <!-- Title -->
  <text x="300" y="24" font-family="sans-serif" font-size="14" fill="#888" text-anchor="middle">Type 2: Items must NOT be together — gap method</text>

  <!-- Step 1: Arrange the others first -->
  <text x="30" y="62" font-family="sans-serif" font-size="12" fill="#888">Step 1:</text>
  <text x="30" y="76" font-family="sans-serif" font-size="11" fill="#888">Arrange others</text>
  <rect x="140" y="50" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="160" y="70" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">C</text>
  <rect x="210" y="50" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="230" y="70" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">D</text>
  <rect x="280" y="50" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="300" y="70" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">E</text>
  <rect x="350" y="50" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="370" y="70" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">F</text>
  <text x="430" y="70" font-family="sans-serif" font-size="12" fill="#888">4! = 24 ways</text>

  <!-- Arrow -->
  <line x1="270" y1="88" x2="270" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#arr2)"/>
  <defs><marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M 0 0 L 8 3 L 0 6 Z" fill="#888"/></marker></defs>

  <!-- Step 2: Show gaps -->
  <text x="30" y="135" font-family="sans-serif" font-size="12" fill="#888">Step 2:</text>
  <text x="30" y="149" font-family="sans-serif" font-size="11" fill="#888">Find the gaps</text>

  <!-- Gap 1 -->
  <text x="110" y="140" font-family="sans-serif" font-size="18" fill="#EA4335" text-anchor="middle" font-weight="bold">_</text>
  <text x="110" y="155" font-family="sans-serif" font-size="10" fill="#EA4335" text-anchor="middle">①</text>
  <!-- Person C -->
  <rect x="130" y="125" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="150" y="145" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">C</text>
  <!-- Gap 2 -->
  <text x="190" y="140" font-family="sans-serif" font-size="18" fill="#EA4335" text-anchor="middle" font-weight="bold">_</text>
  <text x="190" y="155" font-family="sans-serif" font-size="10" fill="#EA4335" text-anchor="middle">②</text>
  <!-- Person D -->
  <rect x="210" y="125" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="230" y="145" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">D</text>
  <!-- Gap 3 -->
  <text x="270" y="140" font-family="sans-serif" font-size="18" fill="#EA4335" text-anchor="middle" font-weight="bold">_</text>
  <text x="270" y="155" font-family="sans-serif" font-size="10" fill="#EA4335" text-anchor="middle">③</text>
  <!-- Person E -->
  <rect x="290" y="125" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="310" y="145" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">E</text>
  <!-- Gap 4 -->
  <text x="350" y="140" font-family="sans-serif" font-size="18" fill="#EA4335" text-anchor="middle" font-weight="bold">_</text>
  <text x="350" y="155" font-family="sans-serif" font-size="10" fill="#EA4335" text-anchor="middle">④</text>
  <!-- Person F -->
  <rect x="370" y="125" width="40" height="30" rx="4" fill="rgba(200,200,200,0.2)" stroke="#888" stroke-width="1.5"/>
  <text x="390" y="145" font-family="sans-serif" font-size="13" fill="#888" opacity="0.5" text-anchor="middle">F</text>
  <!-- Gap 5 -->
  <text x="430" y="140" font-family="sans-serif" font-size="18" fill="#EA4335" text-anchor="middle" font-weight="bold">_</text>
  <text x="430" y="155" font-family="sans-serif" font-size="10" fill="#EA4335" text-anchor="middle">⑤</text>

  <text x="490" y="140" font-family="sans-serif" font-size="12" fill="#EA4335">5 gaps</text>

  <!-- Step 3: Place A and B in gaps -->
  <text x="300" y="183" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">Choose 2 of 5 gaps for A &amp; B (order matters): ⁵P₂ = 20</text>
  <text x="300" y="203" font-family="sans-serif" font-size="13" fill="#9C27B0" text-anchor="middle" font-weight="bold">Total = 4! × ⁵P₂ = 24 × 20 = 480</text>
</svg>