<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 320" font-family="KaTeX_Main, 'Times New Roman', serif">
  <defs>
    <style>
      .axis { stroke: #999; stroke-width: 1.2; fill: none; }
      .curve { stroke: #2563eb; stroke-width: 3; fill: none; }
      .tangent { stroke: #dc2626; stroke-width: 2.5; fill: none; stroke-dasharray: 8,4; }
      .point { fill: #dc2626; }
      .label { font-size: 15px; fill: #333; text-anchor: middle; }
      .title { font-size: 16px; fill: #333; text-anchor: middle; font-weight: bold; }
      .zoom-box { stroke: #f59e0b; stroke-width: 2; fill: rgba(245, 158, 11, 0.08); stroke-dasharray: 5,3; }
      .arrow { fill: #666; stroke: none; }
      .arrow-text { font-size: 13px; fill: #666; text-anchor: middle; font-style: italic; }
      .panel-border { stroke: #e5e7eb; stroke-width: 1; fill: #fafafa; rx: 8; }
    </style>
  </defs>

  <!-- Panel 1: Full curve -->
  <rect x="15" y="15" width="260" height="290" class="panel-border"/>
  <text x="145" y="40" class="title">Original curve</text>

  <!-- Axes -->
  <line x1="50" y1="270" x2="250" y2="270" class="axis"/>
  <line x1="50" y1="270" x2="50" y2="55" class="axis"/>

  <!-- Curve: clearly curved -->
  <path d="M 55,260 C 75,218 100,155 125,138 C 150,121 170,115 195,88 C 210,72 225,55 245,30" class="curve"/>

  <!-- Tangent line at the point -->
  <line x1="75" y1="215" x2="190" y2="100" class="tangent"/>

  <!-- Point of tangency -->
  <circle cx="125" cy="138" r="5" class="point"/>

  <!-- Zoom box -->
  <rect x="90" y="108" width="70" height="60" class="zoom-box"/>

  <text x="145" y="295" class="label">Clearly curved</text>

  <!-- Arrow 1 -->
  <path d="M 290,155 L 315,155" stroke="#888" stroke-opacity="0.5" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#888" opacity="0.5"/>
    </marker>
  </defs>
  <text x="302" y="148" class="arrow-text">zoom</text>
  <text x="302" y="175" class="arrow-text">in</text>

  <!-- Panel 2: Medium zoom -->
  <rect x="325" y="15" width="260" height="290" class="panel-border"/>
  <text x="455" y="40" class="title">Zoomed in (5×)</text>

  <!-- Axes -->
  <line x1="360" y1="270" x2="560" y2="270" class="axis"/>
  <line x1="360" y1="270" x2="360" y2="55" class="axis"/>

  <!-- Curve: less curvature visible -->
  <path d="M 365,258 C 390,228 415,195 440,168 C 465,141 485,120 510,98 C 530,82 548,68 560,58" class="curve"/>

  <!-- Tangent line -->
  <line x1="370" y1="248" x2="555" y2="70" class="tangent"/>

  <!-- Point of tangency -->
  <circle cx="455" cy="155" r="5" class="point"/>

  <!-- Zoom box -->
  <rect x="420" y="125" width="70" height="60" class="zoom-box"/>

  <text x="455" y="295" class="label">Starting to look straight</text>

  <!-- Arrow 2 -->
  <path d="M 600,155 L 625,155" stroke="#888" stroke-opacity="0.5" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="612" y="148" class="arrow-text">zoom</text>
  <text x="612" y="175" class="arrow-text">more</text>

  <!-- Panel 3: Very zoomed in -->
  <rect x="635" y="15" width="250" height="290" class="panel-border"/>
  <text x="760" y="40" class="title">Zoomed in (25×)</text>

  <!-- Axes -->
  <line x1="670" y1="270" x2="860" y2="270" class="axis"/>
  <line x1="670" y1="270" x2="670" y2="55" class="axis"/>

  <!-- Curve: almost indistinguishable from tangent -->
  <path d="M 675,255 C 700,228 720,204 750,165 C 770,138 790,112 820,75 C 838,52 850,40 860,30" class="curve"/>

  <!-- Tangent line — nearly overlapping -->
  <line x1="680" y1="250" x2="855" y2="35" class="tangent"/>

  <!-- Point of tangency -->
  <circle cx="755" cy="160" r="5" class="point"/>

  <text x="760" y="295" class="label">Curve ≈ tangent line!</text>

  <!-- Legend -->
  <line x1="695" y1="65" x2="725" y2="65" class="curve"/>
  <text x="743" y="69" font-size="13" fill="#2563eb" text-anchor="start">curve</text>
  <line x1="695" y1="83" x2="725" y2="83" class="tangent"/>
  <text x="743" y="87" font-size="13" fill="#dc2626" text-anchor="start">tangent</text>
</svg>