<?xml version="1.0" encoding="UTF-8"?>
<!-- stack: SMIL -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13px; }
    .note { font-size: 12px; }
    .caption { font-size: 14px; }
    .big { font-size: 15px; font-weight: 600; }
  </style>

  <defs>
    <marker id="arrGrey2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrTangent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="360" y="22" text-anchor="middle" class="title">Why +C matters: a vertical shift doesn't change the gradient</text>

  <!-- AXES -->
  <line x1="60" y1="300" x2="680" y2="300" stroke="#888" stroke-width="1.5" marker-end="url(#arrGrey2)"/>
  <line x1="370" y1="360" x2="370" y2="60" stroke="#888" stroke-width="1.5" marker-end="url(#arrGrey2)"/>
  <text x="685" y="304" class="math label" dominant-baseline="middle">x</text>
  <text x="370" y="55" text-anchor="middle" class="math label">y</text>

  <!-- Tick marks and labels -->
  <g stroke="#888" stroke-width="1" opacity="0.5">
    <line x1="250" y1="297" x2="250" y2="303"/>
    <line x1="310" y1="297" x2="310" y2="303"/>
    <line x1="430" y1="297" x2="430" y2="303"/>
    <line x1="490" y1="297" x2="490" y2="303"/>
    <line x1="367" y1="240" x2="373" y2="240"/>
    <line x1="367" y1="180" x2="373" y2="180"/>
    <line x1="367" y1="120" x2="373" y2="120"/>
    <line x1="367" y1="360" x2="373" y2="360"/>
  </g>
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="250" y="316">−2</text>
    <text x="310" y="316">−1</text>
    <text x="370" y="316">0</text>
    <text x="430" y="316">1</text>
    <text x="490" y="316">2</text>
    <text x="360" y="244" text-anchor="end">1</text>
    <text x="360" y="184" text-anchor="end">2</text>
    <text x="360" y="124" text-anchor="end">3</text>
  </g>

  <!-- =============================================== -->
  <!-- Three parabolas: y = x², y = x² + 1, y = x² + 2 -->
  <!-- Scale: 60 px per unit horizontally, 60 px per unit vertically -->
  <!-- Origin at (370, 300). Vertices of the three parabolas: -->
  <!--   y = x²      → vertex (370, 300),  points (250, 300-4·60)=negative? → need to rescale -->
  <!-- Actually x² for x ∈ [−2, 2] gives y ∈ [0, 4]. y = 4 means svg y = 300 − 240 = 60. OK -->
  <!-- So scale: 60 px per unit in both axes, and y-ceiling is y=4 at svg y=60 -->

  <!-- For the DIFFERENCE animation, the three curves are just vertical shifts of the same shape.
       Sample points for y = x² at 21 xs (x=-2 to x=2, step 0.2):
       x=-2 → (250, 60);  x=-1.8 → (262, 105.6);  x=-1.6 → (274, 146.4);  x=-1.4 → (286, 182.4);
       x=-1.2 → (298, 213.6);  x=-1.0 → (310, 240);  x=-0.8 → (322, 261.6);  x=-0.6 → (334, 278.4);
       x=-0.4 → (346, 290.4);  x=-0.2 → (358, 297.6);  x=0 → (370, 300);  x=0.2 → (382, 297.6);
       x=0.4 → (394, 290.4);  x=0.6 → (406, 278.4);  x=0.8 → (418, 261.6);  x=1.0 → (430, 240);
       x=1.2 → (442, 213.6);  x=1.4 → (454, 182.4);  x=1.6 → (466, 146.4);  x=1.8 → (478, 105.6);
       x=2.0 → (490, 60)
       Shift by +1 unit (= 60 px up, i.e. svg y decreases by 60) for +C curve with C=1.
       Shift by +2 units (= 120 px up) for C=2. Those shifted-up curves may clip at top — keep in viewBox.
       y = x² + 1 at x=±2 has y=5, which is svg y = 300 − 300 = 0. Clips at top.
       Reduce y-range: restrict x ∈ [−1.6, 1.6] so y ∈ [0, 2.56].
       For C=2 curve, max y = 2.56 + 2 = 4.56 → svg y = 300 − 273.6 = 26.4. Still in view. OK
  -->

  <!-- CURVE 1: y = x² (blue), visible from 0 to 4 seconds -->
  <path id="curveC0"
        d="M 274,146.4 L 286,182.4 L 298,213.6 L 310,240 L 322,261.6 L 334,278.4 L 346,290.4 L 358,297.6 L 370,300 L 382,297.6 L 394,290.4 L 406,278.4 L 418,261.6 L 430,240 L 442,213.6 L 454,182.4 L 466,146.4"
        fill="none" stroke="#2563eb" stroke-width="2.5"
        stroke-dasharray="420" stroke-dashoffset="420">
    <animate attributeName="stroke-dashoffset"
             values="420;420;0;0;0"
             keyTimes="0;0.05;0.15;0.95;1"
             dur="10s" repeatCount="indefinite"/>
  </path>
  <text x="474" y="142" class="math label" fill="#2563eb" opacity="0">y = x²
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.16;0.2;0.95;1"
             dur="10s" repeatCount="indefinite"/>
  </text>

  <!-- TANGENT at x = 1 on curve 1 (slope = 2, line y = 2x − 1) -->
  <!-- At x=1, y=1 → svg (430, 240). Slope 2 means for each +1 in x, y rises by 2.
       For dx = 0.6 svg-x = 36: dy = 1.2 svg-y = 72 (up). So line from (430-36, 240+72) = (394, 312) to (430+36, 240-72) = (466, 168). -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.2;0.24;0.36;0.4;1"
             dur="10s" repeatCount="indefinite"/>
    <circle cx="430" cy="240" r="4" fill="#2563eb"/>
    <line x1="394" y1="312" x2="466" y2="168" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrTangent)"/>
    <text x="475" y="168" class="math label" fill="#f59e0b" font-weight="600">slope = 2</text>
  </g>

  <!-- CURVE 2: y = x² + 1 (violet), appears at t = 4s -->
  <path d="M 274,86.4 L 286,122.4 L 298,153.6 L 310,180 L 322,201.6 L 334,218.4 L 346,230.4 L 358,237.6 L 370,240 L 382,237.6 L 394,230.4 L 406,218.4 L 418,201.6 L 430,180 L 442,153.6 L 454,122.4 L 466,86.4"
        fill="none" stroke="#7c3aed" stroke-width="2.5"
        stroke-dasharray="420" stroke-dashoffset="420">
    <animate attributeName="stroke-dashoffset"
             values="420;420;0;0;0"
             keyTimes="0;0.4;0.5;0.95;1"
             dur="10s" repeatCount="indefinite"/>
  </path>
  <text x="474" y="82" class="math label" fill="#7c3aed" opacity="0">y = x² + 1
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.5;0.54;0.95;1"
             dur="10s" repeatCount="indefinite"/>
  </text>

  <!-- TANGENT at x = 1 on curve 2 (same slope = 2, at point (1, 2) = svg (430, 180)) -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.54;0.58;0.7;0.74;1"
             dur="10s" repeatCount="indefinite"/>
    <circle cx="430" cy="180" r="4" fill="#7c3aed"/>
    <line x1="394" y1="252" x2="466" y2="108" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrTangent)"/>
    <text x="475" y="108" class="math label" fill="#f59e0b" font-weight="600">slope = 2</text>
  </g>

  <!-- CURVE 3: y = x² + 2 (green), appears at t = 7s -->
  <path d="M 274,26.4 L 286,62.4 L 298,93.6 L 310,120 L 322,141.6 L 334,158.4 L 346,170.4 L 358,177.6 L 370,180 L 382,177.6 L 394,170.4 L 406,158.4 L 418,141.6 L 430,120 L 442,93.6 L 454,62.4 L 466,26.4"
        fill="none" stroke="#059669" stroke-width="2.5"
        stroke-dasharray="420" stroke-dashoffset="420">
    <animate attributeName="stroke-dashoffset"
             values="420;420;0;0;0"
             keyTimes="0;0.7;0.8;0.95;1"
             dur="10s" repeatCount="indefinite"/>
  </path>
  <!-- Tangent at x=1 on curve 3, at (1, 3) = svg (430, 120) -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.83;0.87;0.95;1"
             dur="10s" repeatCount="indefinite"/>
    <circle cx="430" cy="120" r="4" fill="#059669"/>
    <line x1="394" y1="192" x2="466" y2="48" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrTangent)"/>
    <text x="475" y="48" class="math label" fill="#f59e0b" font-weight="600">slope = 2</text>
  </g>

  <!-- Captions -->
  <text x="100" y="95" class="caption" opacity="0">
    <tspan x="100" dy="0">Three curves.</tspan>
    <tspan x="100" dy="18">Same shape, different heights.</tspan>
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.5;0.55;0.85;0.87;1"
             dur="10s" repeatCount="indefinite"/>
  </text>

  <text x="360" y="395" text-anchor="middle" class="caption big" fill="#059669" opacity="0">
    All three tangents at <tspan class="math">x = 1</tspan> have slope 2. Vertical shift never changes the gradient.
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.87;0.92;0.97;1"
             dur="10s" repeatCount="indefinite"/>
  </text>

  <text x="360" y="410" text-anchor="middle" class="note" opacity="0">
    Differentiation forgets +C — so integration must put it back.
    <animate attributeName="opacity"
             values="0;0;0.8;0.8;0"
             keyTimes="0;0.87;0.92;0.97;1"
             dur="10s" repeatCount="indefinite"/>
  </text>
</svg>
