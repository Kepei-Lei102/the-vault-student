<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .label { font-size: 13px; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .title { font-size: 16px; font-weight: 600; }
    .note { font-size: 11px; opacity: 0.6; }
  </style>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" class="title">f and f⁻¹ are reflections in the line y = x</text>

  <!-- Axes -->
  <line x1="60" y1="420" x2="490" y2="420" stroke="#888" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <line x1="80" y1="440" x2="80" y2="45" stroke="#888" stroke-width="1.5" marker-end="url(#axisArr)"/>
  <text x="495" y="435" class="math" font-size="16">x</text>
  <text x="72" y="42" class="math" font-size="16">y</text>

  <!-- Grid lines (theme-adaptive) -->
  <g stroke="#888" stroke-width="0.5" opacity="0.15">
    <line x1="80" y1="360" x2="490" y2="360"/>
    <line x1="80" y1="300" x2="490" y2="300"/>
    <line x1="80" y1="240" x2="490" y2="240"/>
    <line x1="80" y1="180" x2="490" y2="180"/>
    <line x1="80" y1="120" x2="490" y2="120"/>
    <line x1="80" y1="60" x2="490" y2="60"/>
    <line x1="140" y1="440" x2="140" y2="45"/>
    <line x1="200" y1="440" x2="200" y2="45"/>
    <line x1="260" y1="440" x2="260" y2="45"/>
    <line x1="320" y1="440" x2="320" y2="45"/>
    <line x1="380" y1="440" x2="380" y2="45"/>
    <line x1="440" y1="440" x2="440" y2="45"/>
  </g>

  <!-- Axis labels -->
  <text x="140" y="435" text-anchor="middle" class="note">1</text>
  <text x="200" y="435" text-anchor="middle" class="note">2</text>
  <text x="260" y="435" text-anchor="middle" class="note">3</text>
  <text x="320" y="435" text-anchor="middle" class="note">4</text>
  <text x="380" y="435" text-anchor="middle" class="note">5</text>
  <text x="440" y="435" text-anchor="middle" class="note">6</text>
  <text x="72" y="363" text-anchor="end" class="note">1</text>
  <text x="72" y="303" text-anchor="end" class="note">2</text>
  <text x="72" y="243" text-anchor="end" class="note">3</text>
  <text x="72" y="183" text-anchor="end" class="note">4</text>
  <text x="72" y="123" text-anchor="end" class="note">5</text>
  <text x="72" y="63" text-anchor="end" class="note">6</text>

  <!-- y = x line (dashed grey) -->
  <line x1="80" y1="420" x2="480" y2="20" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="462" y="55" class="math" font-size="14" fill="#9ca3af">y = x</text>

  <!-- f(x) = 2x + 1 (blue curve) -->
  <line x1="80" y1="360" x2="260" y2="60" stroke="#2563eb" stroke-width="2.5"/>
  <text x="265" y="50" class="math" font-size="15" fill="#2563eb">f(x) = 2x + 1</text>

  <!-- f⁻¹(x) = (x-1)/2 (green curve) -->
  <line x1="140" y1="420" x2="460" y2="180" stroke="#059669" stroke-width="2.5"/>
  <text x="310" y="405" class="math" font-size="14" fill="#059669">f⁻¹(x) = (x−1)/2</text>

  <!-- Highlighted point pair: (1,3) on f reflected to (3,1) on f⁻¹ -->
  <circle cx="140" cy="240" r="5" fill="#2563eb"/>
  <text x="118" y="232" class="label" fill="#2563eb">(1, 3)</text>
  <circle cx="260" cy="360" r="5" fill="#059669"/>
  <text x="268" y="378" class="label" fill="#059669">(3, 1)</text>

  <!-- Dashed line connecting the reflected pair -->
  <line x1="140" y1="240" x2="260" y2="360" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Midpoint on y=x -->
  <circle cx="200" cy="300" r="3" fill="#dc2626"/>
  <text x="212" y="295" class="note" fill="#dc2626" opacity="1">midpoint on y = x</text>

  <!-- Second point pair: (2,5) on f → (5,2) on f⁻¹ -->
  <circle cx="200" cy="120" r="5" fill="#2563eb"/>
  <text x="178" y="112" class="label" fill="#2563eb">(2, 5)</text>
  <circle cx="380" cy="300" r="5" fill="#059669"/>
  <text x="388" y="318" class="label" fill="#059669">(5, 2)</text>

  <line x1="200" y1="120" x2="380" y2="300" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="290" cy="210" r="3" fill="#dc2626"/>

  <!-- Legend removed — all three lines have inline labels -->

  <!-- Arrow marker -->
  <defs>
    <marker id="axisArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>
</svg>