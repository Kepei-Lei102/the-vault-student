<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .label { font-size: 14px; }
    .big-label { font-size: 16px; font-weight: 600; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .note { font-size: 12px; opacity: 0.6; }
    .emphasis { font-size: 13px; fill: #dc2626; font-weight: 600; }
  </style>

  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- === Top: fg(x) — correct order === -->
  <text x="400" y="22" text-anchor="middle" class="big-label">fg(x) = f(g(x)) — apply g first, then f</text>

  <!-- Input x -->
  <rect x="30" y="45" width="60" height="40" rx="8" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="71" text-anchor="middle" class="math" font-size="20" fill="#2563eb">x</text>

  <!-- Arrow to g -->
  <line x1="100" y1="65" x2="160" y2="65" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- g machine -->
  <rect x="170" y="42" width="160" height="46" rx="10" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="62" text-anchor="middle" class="big-label" fill="#7c3aed">g</text>
  <text x="250" y="80" text-anchor="middle" class="note" fill="#7c3aed" opacity="1">g(x) = 2x</text>
  <text x="250" y="35" text-anchor="middle" class="emphasis">① FIRST</text>

  <!-- Arrow with intermediate value -->
  <line x1="340" y1="65" x2="420" y2="65" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="380" y="55" text-anchor="middle" class="math" font-size="14" fill="#7c3aed">g(x)</text>

  <!-- f machine -->
  <rect x="430" y="42" width="160" height="46" rx="10" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="2"/>
  <text x="510" y="62" text-anchor="middle" class="big-label" fill="#059669">f</text>
  <text x="510" y="80" text-anchor="middle" class="note" fill="#059669" opacity="1">f(x) = x + 3</text>
  <text x="510" y="35" text-anchor="middle" class="emphasis">② SECOND</text>

  <!-- Output arrow -->
  <line x1="600" y1="65" x2="660" y2="65" stroke="#059669" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Output -->
  <rect x="670" y="45" width="100" height="40" rx="8" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="720" y="71" text-anchor="middle" class="math" font-size="18" fill="#059669">2x + 3</text>

  <!-- === Bottom: Concrete example with numbers === -->
  <line x1="30" y1="110" x2="770" y2="110" stroke="#888" stroke-width="1" stroke-dasharray="4,4" opacity="0.2"/>
  <text x="400" y="135" text-anchor="middle" class="big-label">Example: f(x) = x + 3, g(x) = 2x. Find fg(5).</text>

  <!-- Input 5 -->
  <rect x="30" y="155" width="60" height="40" rx="8" fill="rgba(37,99,235,0.15)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="181" text-anchor="middle" class="math" font-size="20" fill="#2563eb">5</text>

  <line x1="100" y1="175" x2="160" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- g applied -->
  <rect x="170" y="155" width="160" height="40" rx="10" fill="rgba(124,58,237,0.15)" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="180" text-anchor="middle" class="math" font-size="16" fill="#7c3aed">g(5) = 2(5) = 10</text>

  <line x1="340" y1="175" x2="420" y2="175" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="380" y="165" text-anchor="middle" class="math" font-size="16" fill="#7c3aed">10</text>

  <!-- f applied -->
  <rect x="430" y="155" width="160" height="40" rx="10" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="2"/>
  <text x="510" y="180" text-anchor="middle" class="math" font-size="16" fill="#059669">f(10) = 10 + 3</text>

  <line x1="600" y1="175" x2="660" y2="175" stroke="#059669" stroke-width="2" marker-end="url(#arrG)"/>

  <rect x="670" y="155" width="80" height="40" rx="8" fill="rgba(5,150,105,0.15)" stroke="#059669" stroke-width="1.5"/>
  <text x="710" y="181" text-anchor="middle" class="math" font-size="22" fill="#059669">13</text>

  <!-- Bottom comparison: gf(5) gives different answer -->
  <text x="400" y="225" text-anchor="middle" class="label">Compare: gf(5) = g(f(5)) = g(8) = 2(8) = <tspan font-weight="600" fill="#dc2626">16</tspan>  ≠  fg(5) = <tspan font-weight="600" fill="#059669">13</tspan></text>
  <text x="400" y="248" text-anchor="middle" class="emphasis">Order matters!</text>
</svg>