  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="bold">RHS construction — right angle, hypotenuse, side</text>
  <text x="300" y="48" text-anchor="middle" font-size="12">Given right angle at A, side a = AB, hypotenuse h = BC.</text>

