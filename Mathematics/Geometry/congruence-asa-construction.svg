  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="bold">ASA construction — angle, side, angle</text>
  <text x="300" y="48" text-anchor="middle" font-size="12">Given baseline AB, angle &#945; at A, angle &#946; at B.</text>

