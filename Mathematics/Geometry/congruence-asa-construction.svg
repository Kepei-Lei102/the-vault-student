             values="0;0;1;1;0;0"
             keyTimes="0;0.16999999999999998;0.18;0.95;0.99;1"
             dur="12s" repeatCount="indefinite"/>
    A
  </text>
  <circle cx="450" cy="300" r="5" fill="#2563eb">
