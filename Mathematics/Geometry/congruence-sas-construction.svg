  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="bold">SAS construction — side, included angle, side</text>
  <text x="300" y="48" text-anchor="middle" font-size="12">Given side a = VB, included angle &#952; at V, side b = VC.</text>

