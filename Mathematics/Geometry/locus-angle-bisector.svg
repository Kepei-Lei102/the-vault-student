  <text x="300" y="26" text-anchor="middle" font-size="16" font-weight="bold">Locus 4 — points equidistant from two lines</text>
  <text x="300" y="46" text-anchor="middle" font-size="12">Every point P with d(P, ℓ₁) = d(P, ℓ₂). Their integral: the angle bisector.</text>

