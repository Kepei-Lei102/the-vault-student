      <animateTransform attributeName="transform" type="rotate"
                        values="134.64;134.64;45.36;45.36;0"
                        keyTimes="0;0.36;0.57;0.95;1"
                        dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="324.12" y="202.24" font-size="11" fill="#dc2626">
