  </text>

  <line x1="269.12" y1="172.24" x2="353.19" y2="320"
        stroke="#059669" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="170.00" stroke-dashoffset="170.00">
    <animate attributeName="stroke-dashoffset"
             values="170.00;170.00;0;0;0;170.00"
             keyTimes="0;0.75;0.81;0.88;0.95;1"
             dur="12s" repeatCount="indefinite"/>
  </line>

  <line x1="80" y1="320" x2="353.19" y2="320"
        stroke="#059669" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="273.19" stroke-dashoffset="273.19">
    <animate attributeName="stroke-dashoffset"
             values="273.19;273.19;0;0;0;273.19"
             keyTimes="0;0.75;0.81;0.88;0.95;1"
             dur="12s" repeatCount="indefinite"/>
  </line>

  <text x="331.16" y="251.12" font-size="12" font-weight="bold" fill="#059669" font-style="italic" text-anchor="start">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
