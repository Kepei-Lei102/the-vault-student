  </text>

  <line x1="269.12" y1="172.24" x2="185.06" y2="320"
        stroke="#dc2626" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="170.00" stroke-dashoffset="170.00">
    <animate attributeName="stroke-dashoffset"
