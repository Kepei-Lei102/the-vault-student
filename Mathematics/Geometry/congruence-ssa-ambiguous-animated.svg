<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420">
  <defs>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #888888;
      }
    </style>
  </defs>

  <text x="300" y="28" text-anchor="middle" font-size="16" font-weight="bold">
    SSA is ambiguous — the arc hits the baseline twice
  </text>
  <text x="300" y="48" text-anchor="middle" font-size="12">
    Same angle &#945; at A, same side AC, same length a = CB — yet two different triangles.
  </text>

  <line x1="80" y1="320" x2="383.19" y2="320"
        stroke="#888" stroke-width="1.5" stroke-dasharray="6 4"
        stroke-dashoffset="303.19" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset"
             values="303.19;303.19;0;0;303.19"
             keyTimes="0;0.05;0.15;0.95;1"
             dur="12s" repeatCount="indefinite"/>
  </line>
  <circle cx="80" cy="320" r="5" fill="#2563eb">
    <animate attributeName="opacity" values="0;0;1;1;0"
             keyTimes="0;0.14;0.18;0.95;1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="66" y="342" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">
    <animate attributeName="opacity" values="0;0;1;1;0"
             keyTimes="0;0.14;0.18;0.95;1" dur="12s" repeatCount="indefinite"/>
    A
  </text>

  <path d="M 122 320 A 42 42 0 0 0 113.10 294.14"
        stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round"
