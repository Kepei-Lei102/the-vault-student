             keyTimes="0;0.16;0.23;0.95;1"
             dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="130" y="302" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="start">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.22;0.26;0.90;0.93;1" dur="12s" repeatCount="indefinite"/>
    &#945;
  </text>

  <line x1="80" y1="320" x2="284.88" y2="159.93"
        stroke="#888" stroke-width="1.2" stroke-dasharray="5 3"
        stroke-dashoffset="260.00" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset"
