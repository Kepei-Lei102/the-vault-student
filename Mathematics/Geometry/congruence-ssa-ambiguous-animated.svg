             dur="12s" repeatCount="indefinite"/>
  </line>

  <text x="197.09" y="251.12" font-size="12" font-weight="bold" fill="#dc2626" font-style="italic" text-anchor="end">
    <animate attributeName="opacity" values="0;0;1;1;0;0"
             keyTimes="0;0.65;0.69;0.88;0.91;1" dur="12s" repeatCount="indefinite"/>
