<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 720 400">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 14px; }
    .small { font-size: 12px; }
    .note { font-size: 12px; opacity: 0.7; }
    .eq { font-size: 14px; font-family: 'Times New Roman', serif; }
  </style>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" class="title">Proof 3 — Similar Triangles (Euclid's Approach)</text>

  <!-- === MAIN TRIANGLE === -->
  <!-- 3-4-5 × 50: a=BC=150, b=AC=200, c=AB=250 -->
  <!-- A=(0,200), B=(250,200), C=(160,80). Right angle at C (verified: CA·CB=0). -->
  <!-- Altitude from C to AB: H=(160,200). d=AH=160, e=HB=90, h=CH=120. -->
  <g transform="translate(30, 50)">
    <!-- Shaded sub-triangles (drawn first, behind main outline) -->
    <!-- Left sub-triangle △AHC (blue tint) -->
    <polygon points="0,200 160,200 160,80" fill="rgba(37,99,235,0.08)" stroke="none"/>
    <!-- Right sub-triangle △HCB (purple tint) -->
    <polygon points="160,200 250,200 160,80" fill="rgba(124,58,237,0.08)" stroke="none"/>

    <!-- Main triangle outline -->
    <polygon points="0,200 250,200 160,80" fill="none" stroke="#888" stroke-width="2"/>

    <!-- Altitude from C to AB -->
    <line x1="160" y1="80" x2="160" y2="200" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8,4"/>

    <!-- Right angle marker at C (rotated square along CA and CB directions) -->
    <!-- CA direction: (-0.8, 0.6), CB direction: (0.6, 0.8), size=10 -->
    <polygon points="152,86 158.6,94.8 166.6,88.8 160,80" fill="none" stroke="#888" stroke-width="1"/>

    <!-- Right angle marker at H (altitude meets base) -->
    <rect x="160" y="188" width="12" height="12" fill="none" stroke="#f59e0b" stroke-width="1"/>

    <!-- Vertex labels -->
    <text x="-10" y="208" text-anchor="end" class="label math">A</text>
    <text x="260" y="208" text-anchor="start" class="label math">B</text>
    <text x="160" y="70" text-anchor="middle" class="label math">C</text>
    <text x="160" y="224" text-anchor="middle" class="label math" fill="#f59e0b">H</text>

    <!-- Side labels -->
    <!-- b = AC (left side): midpoint of A(0,200)→C(160,80) = (80, 140) -->
    <text x="68" y="134" text-anchor="end" class="label math">b</text>
    <!-- a = BC (right side): midpoint of C(160,80)→B(250,200) = (205, 140) -->
    <text x="216" y="134" text-anchor="start" class="label math">a</text>
    <!-- c = AB (hypotenuse, bottom): midpoint = (125, 200) -->
    <text x="125" y="218" text-anchor="middle" class="label math">c</text>

    <!-- d = AH: midpoint of (0,200)→(160,200) = x=80 -->
    <text x="80" y="198" text-anchor="middle" class="small math" fill="#2563eb">d</text>
    <!-- e = HB: midpoint of (160,200)→(250,200) = x=205 -->
    <text x="205" y="198" text-anchor="middle" class="small math" fill="#7c3aed">e</text>
    <!-- h = CH (altitude): beside the dashed line -->
    <text x="148" y="144" text-anchor="end" class="label math" fill="#f59e0b">h</text>
  </g>

  <!-- === THREE SIMILAR TRIANGLES shown separately === -->
  <g transform="translate(370, 55)">
    <text x="140" y="0" text-anchor="middle" class="label">All three triangles are similar (AA):</text>

    <!-- △ABC (original, scaled down ×0.4) -->
    <!-- Scaled: A'=(0,80), B'=(100,80), C'=(64,32) -->
    <g transform="translate(20, 20)">
      <polygon points="0,80 100,80 64,32" fill="none" stroke="#888" stroke-width="1.5"/>
      <!-- Right angle marker at C' (small) -->
      <polygon points="59.2,35.6 62.4,40.4 67.2,37.2 64,32" fill="none" stroke="#888" stroke-width="0.8"/>
      <text x="50" y="96" text-anchor="middle" class="small math">c</text>
      <text x="25" y="54" text-anchor="end" class="small math">b</text>
      <text x="88" y="52" text-anchor="start" class="small math">a</text>
      <text x="50" y="112" text-anchor="middle" class="note">△ABC (original)</text>
    </g>

    <!-- △AHC (left sub-triangle, blue) -->
    <!-- Right angle at H. Legs: AH=d (horizontal), CH=h (vertical). Hyp=b. -->
    <!-- Scaled to fit: d=80, h=60 (keeping aspect 160:120 = 4:3) -->
    <g transform="translate(0, 155)">
      <polygon points="0,60 80,60 80,0" fill="rgba(37,99,235,0.1)" stroke="#2563eb" stroke-width="1.5"/>
      <!-- Right angle at (80,60) -->
      <rect x="70" y="50" width="10" height="10" fill="none" stroke="#2563eb" stroke-width="0.8"/>
      <text x="40" y="76" text-anchor="middle" class="small math" fill="#2563eb">d</text>
      <text x="-6" y="32" text-anchor="end" class="small math">b</text>
      <text x="88" y="32" text-anchor="start" class="small math" fill="#f59e0b">h</text>
      <text x="40" y="95" text-anchor="middle" class="note">△AHC</text>
    </g>

    <!-- △CHB (right sub-triangle, purple) -->
    <!-- Right angle at H. Legs: CH=h (vertical), HB=e (horizontal). Hyp=a. -->
    <!-- Scaled to fit: e=54, h=72 (keeping aspect 90:120 = 3:4) -->
    <g transform="translate(140, 155)">
      <polygon points="0,0 0,72 54,72" fill="rgba(124,58,237,0.1)" stroke="#7c3aed" stroke-width="1.5"/>
      <!-- Right angle at (0,72) -->
      <rect x="0" y="62" width="10" height="10" fill="none" stroke="#7c3aed" stroke-width="0.8"/>
      <text x="27" y="88" text-anchor="middle" class="small math" fill="#7c3aed">e</text>
      <text x="-8" y="38" text-anchor="end" class="small math" fill="#f59e0b">h</text>
      <text x="36" y="32" text-anchor="start" class="small math">a</text>
      <text x="27" y="107" text-anchor="middle" class="note">△CHB</text>
    </g>
  </g>

  <!-- === Bottom: similarity ratios and conclusion === -->
  <g transform="translate(360, 330)">
    <text x="0" y="0" text-anchor="middle" class="eq">From similarity:  b/c = d/b  →  b² = cd       a/c = e/a  →  a² = ce</text>
    <text x="0" y="26" text-anchor="middle" class="eq">Adding:  a² + b² = ce + cd = c(e + d) = c · c = c²  □</text>
  </g>

  <!-- Annotation -->
  <g transform="translate(360, 380)">
    <text x="0" y="0" text-anchor="middle" class="note">(since d + e = c, the two projections reconstruct the hypotenuse)</text>
  </g>
</svg>