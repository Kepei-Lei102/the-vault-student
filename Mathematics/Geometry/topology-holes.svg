<svg width="100%" viewBox="0 0 960 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" font-size="13">
<text x="480" y="24" text-anchor="middle" fill="#888" font-weight="bold" font-size="15">Sorted the topologist's way: by how many holes, and nothing else</text>
<rect x="40" y="50" width="210" height="160" rx="8" fill="rgba(0,0,0,0)" stroke="#2563eb" stroke-width="1.5"/><text x="145" y="76" text-anchor="middle" fill="#2563eb" font-weight="bold">0 holes</text>
<text x="145" y="100" text-anchor="middle" fill="#888" font-size="12">a plate</text>
<text x="145" y="122" text-anchor="middle" fill="#888" font-size="12">a ball</text>
<text x="145" y="144" text-anchor="middle" fill="#888" font-size="12">a spoon</text>
<text x="145" y="166" text-anchor="middle" fill="#888" font-size="12">a phone</text>
<text x="145" y="188" text-anchor="middle" fill="#888" font-size="12">C  I  L  S  Z</text>
<rect x="270" y="50" width="210" height="160" rx="8" fill="rgba(0,0,0,0)" stroke="#f59e0b" stroke-width="1.5"/><text x="375" y="76" text-anchor="middle" fill="#f59e0b" font-weight="bold">1 hole</text>
<text x="375" y="100" text-anchor="middle" fill="#888" font-size="12">a ring</text>
<text x="375" y="122" text-anchor="middle" fill="#888" font-size="12">a mug</text>
<text x="375" y="144" text-anchor="middle" fill="#888" font-size="12">a doughnut</text>
<text x="375" y="166" text-anchor="middle" fill="#888" font-size="12">a straw</text>
<text x="375" y="188" text-anchor="middle" fill="#888" font-size="12">A  D  O  P  Q  R</text>
<rect x="500" y="50" width="210" height="160" rx="8" fill="rgba(0,0,0,0)" stroke="#7c3aed" stroke-width="1.5"/><text x="605" y="76" text-anchor="middle" fill="#7c3aed" font-weight="bold">2 holes</text>
<text x="605" y="100" text-anchor="middle" fill="#888" font-size="12">a pair of glasses</text>
<text x="605" y="122" text-anchor="middle" fill="#888" font-size="12">a B-shaped pretzel</text>
<text x="605" y="144" text-anchor="middle" fill="#888" font-size="12">a mask with eye holes</text>
<text x="605" y="166" text-anchor="middle" fill="#888" font-size="12">B</text>
<rect x="730" y="50" width="210" height="160" rx="8" fill="rgba(0,0,0,0)" stroke="#059669" stroke-width="1.5"/><text x="835" y="76" text-anchor="middle" fill="#059669" font-weight="bold">many</text>
<text x="835" y="100" text-anchor="middle" fill="#888" font-size="12">a sieve</text>
<text x="835" y="122" text-anchor="middle" fill="#888" font-size="12">a chain-link fence</text>
<text x="835" y="144" text-anchor="middle" fill="#888" font-size="12">a sponge</text>
<text x="480" y="232" text-anchor="middle" fill="#888" font-size="11">the mug and the doughnut sit in the same box; the letters are sorted by their holes, not their sounds — this is the joke every topologist has heard, and it is a theorem</text>
</svg>