<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13px; }
    .note { font-size: 11px; opacity: 0.6; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; font-size: 13px; }
    .highlight { fill: #2563eb; }
    .bound { fill: #059669; font-weight: 600; }
  </style>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" class="title">Error Interval — Rounding to the Nearest Integer</text>

  <!-- === Row 1: x = 7, nearest integer === -->
  <text x="40" y="58" class="label" font-weight="600">x = 7</text>
  <text x="40" y="73" class="note">(nearest integer)</text>

  <!-- Number line -->
  <line x1="100" y1="65" x2="540" y2="65" stroke="#888" stroke-width="1.5"/>
  <!-- Arrow tips -->
  <polygon points="97,65 103,62 103,68" fill="#888"/>
  <polygon points="543,65 537,62 537,68" fill="#888"/>

  <!-- Tick marks and labels -->
  <line x1="145" y1="60" x2="145" y2="70" stroke="#888" stroke-width="1"/>
  <text x="145" y="85" text-anchor="middle" class="label">5</text>

  <line x1="233" y1="60" x2="233" y2="70" stroke="#888" stroke-width="1"/>
  <text x="233" y="85" text-anchor="middle" class="label">6</text>

  <line x1="321" y1="60" x2="321" y2="70" stroke="#888" stroke-width="1"/>
  <text x="321" y="85" text-anchor="middle" class="label highlight" font-weight="600">7</text>

  <line x1="409" y1="60" x2="409" y2="70" stroke="#888" stroke-width="1"/>
  <text x="409" y="85" text-anchor="middle" class="label">8</text>

  <line x1="497" y1="60" x2="497" y2="70" stroke="#888" stroke-width="1"/>
  <text x="497" y="85" text-anchor="middle" class="label">9</text>

  <!-- Half marks (6.5 and 7.5) -->
  <line x1="277" y1="58" x2="277" y2="72" stroke="#059669" stroke-width="2"/>
  <line x1="365" y1="58" x2="365" y2="72" stroke="#059669" stroke-width="2"/>

  <!-- Shaded interval -->
  <rect x="277" y="56" width="88" height="18" rx="2" fill="rgba(5, 150, 105, 0.15)"/>

  <!-- LB and UB labels -->
  <text x="277" y="50" text-anchor="middle" class="bound" font-size="12">LB = 6.5</text>
  <text x="365" y="50" text-anchor="middle" class="bound" font-size="12">UB = 7.5</text>

  <!-- Filled circle at LB (included), open circle at UB (excluded) -->
  <circle cx="277" cy="65" r="4" fill="#059669"/>
  <circle cx="365" cy="65" r="4" fill="none" stroke="#059669" stroke-width="2"/>

  <!-- Annotations -->
  <text x="277" y="100" text-anchor="middle" class="note">● included (≤)</text>
  <text x="365" y="100" text-anchor="middle" class="note">○ excluded (&lt;)</text>

  <!-- === Row 2: Combining bounds === -->
  <text x="300" y="135" text-anchor="middle" class="title">Bounds in Calculations — Which Bound to Use?</text>

  <!-- Operation boxes -->
  <!-- Addition -->
  <rect x="30" y="150" width="120" height="55" rx="8" fill="rgba(37, 99, 235, 0.08)" stroke="#2563eb" stroke-width="1" stroke-opacity="0.3"/>
  <text x="90" y="170" text-anchor="middle" class="label highlight" font-weight="600">a + b</text>
  <text x="90" y="188" text-anchor="middle" class="note" font-size="10">Max: UB + UB</text>
  <text x="90" y="200" text-anchor="middle" class="note" font-size="10">Min: LB + LB</text>

  <!-- Subtraction -->
  <rect x="165" y="150" width="120" height="55" rx="8" fill="rgba(220, 38, 38, 0.08)" stroke="#dc2626" stroke-width="1" stroke-opacity="0.3"/>
  <text x="225" y="170" text-anchor="middle" class="label" style="fill: #dc2626;" font-weight="600">a − b</text>
  <text x="225" y="188" text-anchor="middle" class="note" font-size="10">Max: UB − LB</text>
  <text x="225" y="200" text-anchor="middle" class="note" font-size="10">Min: LB − UB</text>

  <!-- Multiplication -->
  <rect x="300" y="150" width="120" height="55" rx="8" fill="rgba(37, 99, 235, 0.08)" stroke="#2563eb" stroke-width="1" stroke-opacity="0.3"/>
  <text x="360" y="170" text-anchor="middle" class="label highlight" font-weight="600">a × b</text>
  <text x="360" y="188" text-anchor="middle" class="note" font-size="10">Max: UB × UB</text>
  <text x="360" y="200" text-anchor="middle" class="note" font-size="10">Min: LB × LB</text>

  <!-- Division -->
  <rect x="435" y="150" width="120" height="55" rx="8" fill="rgba(220, 38, 38, 0.08)" stroke="#dc2626" stroke-width="1" stroke-opacity="0.3"/>
  <text x="495" y="170" text-anchor="middle" class="label" style="fill: #dc2626;" font-weight="600">a ÷ b</text>
  <text x="495" y="188" text-anchor="middle" class="note" font-size="10">Max: UB ÷ LB</text>
  <text x="495" y="200" text-anchor="middle" class="note" font-size="10">Min: LB ÷ UB</text>

  <!-- Key insight annotation -->
  <rect x="100" y="220" width="400" height="40" rx="8" fill="rgba(128, 128, 128, 0.06)" stroke="#888" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="300" y="238" text-anchor="middle" font-size="11" fill="#888">Same direction: + and × use matching bounds (both UB or both LB)</text>
  <text x="300" y="253" text-anchor="middle" font-size="11" fill="#dc2626" opacity="0.8">Opposite direction: − and ÷ use opposite bounds (UB with LB)</text>

  <!-- Bottom note -->
  <text x="300" y="275" text-anchor="middle" font-size="10" fill="#888" opacity="0.4">All rules assume a, b > 0 (standard for IGCSE measurements)</text>
</svg>
