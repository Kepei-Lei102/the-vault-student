<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 360"><style>text{font-family:Arial,sans-serif;fill:#888} .t{font-size:22px;font-weight:600} .b{font-size:18px} .s{font-size:16px}</style><text x="400" y="30" text-anchor="middle" class="t">A finite list cannot trap every prime</text><rect x="30" y="55" width="740" height="62" rx="12" fill="#2563eb" fill-opacity=".12" stroke="#2563eb" stroke-width="2"/><text x="400" y="94" text-anchor="middle" class="b">Proposed list: 2, 3, 5, 7, 11, 13</text><line x1="400" y1="117" x2="400" y2="144" stroke="#888" stroke-width="2"/><rect x="30" y="145" width="740" height="62" rx="12" fill="#7c3aed" fill-opacity=".12" stroke="#7c3aed" stroke-width="2"/><text x="400" y="184" text-anchor="middle" class="b">Product + 1 = 30031. Every listed prime leaves remainder 1.</text><line x1="400" y1="207" x2="210" y2="235" stroke="#888" stroke-width="2"/><line x1="400" y1="207" x2="590" y2="235" stroke="#888" stroke-width="2"/><rect x="40" y="236" width="340" height="70" rx="12" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-width="2"/><text x="210" y="265" text-anchor="middle" class="b">59 is a prime divisor</text><text x="210" y="290" text-anchor="middle" class="s">and was not on the list.</text><rect x="420" y="236" width="340" height="70" rx="12" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-width="2"/><text x="590" y="265" text-anchor="middle" class="b">509 is another prime divisor</text><text x="590" y="290" text-anchor="middle" class="s">and was not on the list.</text><text x="400" y="340" text-anchor="middle" class="s">30031 is composite. The proof only needs a NEW prime factor.</text></svg>
