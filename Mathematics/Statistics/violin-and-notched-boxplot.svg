<svg width="100%" viewBox="0 0 575 310" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <text x="287.5" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#888">Beyond Syllabus — Box Plot vs Notched Box Plot vs Violin Plot</text>
  <text x="287.5" y="32" text-anchor="middle" font-size="9" fill="#888" opacity="0.5">Same bimodal data — the violin reveals what the box hides</text>

