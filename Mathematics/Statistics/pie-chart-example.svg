<svg width="100%" viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <!-- Title -->
  <text x="250" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#888">Favourite Sport — Pie Chart</text>

  <!-- Pie centre at (200, 190), radius 130 -->
  <!-- Sectors drawn as paths -->
  <!-- Football: 120° (from 0° to 120°) -->
  <!-- 0° = right (3 o'clock), going clockwise -->
  <!-- Start at top: rotate -90° conceptually, or start from (200, 60) -->

  <!-- Football: 120° starting from 12 o'clock (top) -->
  <path d="M200,190 L200,60 A130,130 0 0,1 312.58,255 Z"
        fill="#2196F3" fill-opacity="0.3" stroke="#2196F3" stroke-width="2"/>

  <!-- Tennis: 90° from 120° to 210° (30° to 120° from 3-o'clock in SVG) -->
  <path d="M200,190 L312.58,255 A130,130 0 0,1 135,302.58 Z"
        fill="#4CAF50" fill-opacity="0.3" stroke="#4CAF50" stroke-width="2"/>

  <!-- Swimming: 60° from 210° to 270° (120° to 180° from 3-o'clock in SVG) -->
  <path d="M200,190 L135,302.58 A130,130 0 0,1 70,190 Z"
        fill="#FF9800" fill-opacity="0.3" stroke="#FF9800" stroke-width="2"/>

  <!-- Basketball: 90° from 270° to 360° -->
  <path d="M200,190 L70,190 A130,130 0 0,1 200,60 Z"
        fill="#9C27B0" fill-opacity="0.3" stroke="#9C27B0" stroke-width="2"/>

  <!-- Labels with lines -->
  <!-- Football label -->
  <text x="290" y="130" font-size="12" fill="#888" font-weight="bold">Football</text>
  <text x="290" y="145" font-size="11" fill="#888">20 students (120°)</text>

  <!-- Tennis label (bottom right) -->
  <text x="260" y="320" font-size="12" fill="#888" font-weight="bold">Tennis</text>
  <text x="260" y="335" font-size="11" fill="#888">15 students (90°)</text>

  <!-- Swimming label (bottom left) -->
  <text x="20" y="280" font-size="12" fill="#888" font-weight="bold">Swimming</text>
  <text x="20" y="295" font-size="11" fill="#888">10 students (60°)</text>

  <!-- Basketball label (top left) -->
  <text x="30" y="130" font-size="12" fill="#888" font-weight="bold">Basketball</text>
  <text x="30" y="145" font-size="11" fill="#888">15 students (90°)</text>

  <!-- Angle annotations -->
  <text x="250" y="350" text-anchor="middle" font-size="10" fill="#888" opacity="0.6">Angles proportional to frequency — must sum to 360°</text>

  <!-- Legend showing formula -->
  <text x="420" y="195" text-anchor="middle" font-size="10" fill="#888" opacity="0.7">angle = f/n × 360°</text>
</svg>
