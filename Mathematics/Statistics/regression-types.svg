  <!-- === Panel 3: Exponential === -->
  <text x="625" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#9C27B0">Exponential</text>
  <text x="625" y="54" text-anchor="middle" font-size="9" fill="#888" opacity="0.6">y = ae^(bx)</text>

