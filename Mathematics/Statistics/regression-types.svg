<svg width="100%" viewBox="0 0 750 240" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <text x="375" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#888">Types of Regression</text>

  <!-- === Panel 1: Linear === -->
  <text x="120" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#2196F3">Linear</text>
  <text x="120" y="54" text-anchor="middle" font-size="9" fill="#888" opacity="0.6">y = a + bx</text>

  <!-- Axes -->
  <line x1="30" y1="210" x2="200" y2="210" stroke="#888" stroke-width="1"/>
  <line x1="30" y1="210" x2="30" y2="60" stroke="#888" stroke-width="1"/>

  <!-- Points -->
  <circle cx="42" cy="199" r="3.5" fill="#2196F3" fill-opacity="0.5" stroke="#2196F3" stroke-width="0.8"/>
  <circle cx="54" cy="189" r="3.5" fill="#2196F3" fill-opacity="0.5" stroke="#2196F3" stroke-width="0.8"/>
