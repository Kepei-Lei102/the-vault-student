  <circle cx="150" cy="106" r="3.5" fill="#2196F3" fill-opacity="0.5" stroke="#2196F3" stroke-width="0.8"/>
  <circle cx="162" cy="94" r="3.5" fill="#2196F3" fill-opacity="0.5" stroke="#2196F3" stroke-width="0.8"/>
  <circle cx="174" cy="82" r="3.5" fill="#2196F3" fill-opacity="0.5" stroke="#2196F3" stroke-width="0.8"/>
  <circle cx="186" cy="75" r="3.5" fill="#2196F3" fill-opacity="0.5" stroke="#2196F3" stroke-width="0.8"/>

  <!-- Linear fit line -->
