  <!-- === Panel 2: Quadratic === -->
  <text x="375" y="42" text-anchor="middle" font-size="12" font-weight="bold" fill="#FF9800">Quadratic</text>
  <text x="375" y="54" text-anchor="middle" font-size="9" fill="#888" opacity="0.6">y = a + bx + cx²</text>

  <!-- Axes -->
  <line x1="280" y1="210" x2="460" y2="210" stroke="#888" stroke-width="1"/>
  <line x1="280" y1="210" x2="280" y2="60" stroke="#888" stroke-width="1"/>

  <!-- Points (U-shaped data) -->
  <circle cx="295" cy="88" r="3.5" fill="#FF9800" fill-opacity="0.5" stroke="#FF9800" stroke-width="0.8"/>
  <circle cx="308" cy="108" r="3.5" fill="#FF9800" fill-opacity="0.5" stroke="#FF9800" stroke-width="0.8"/>
