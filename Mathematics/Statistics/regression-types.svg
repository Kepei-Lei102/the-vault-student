  <circle cx="614" cy="175" r="3.5" fill="#9C27B0" fill-opacity="0.5" stroke="#9C27B0" stroke-width="0.8"/>
  <circle cx="626" cy="168" r="3.5" fill="#9C27B0" fill-opacity="0.5" stroke="#9C27B0" stroke-width="0.8"/>
  <circle cx="638" cy="157" r="3.5" fill="#9C27B0" fill-opacity="0.5" stroke="#9C27B0" stroke-width="0.8"/>
  <circle cx="650" cy="142" r="3.5" fill="#9C27B0" fill-opacity="0.5" stroke="#9C27B0" stroke-width="0.8"/>
  <circle cx="662" cy="128" r="3.5" fill="#9C27B0" fill-opacity="0.5" stroke="#9C27B0" stroke-width="0.8"/>
  <circle cx="674" cy="108" r="3.5" fill="#9C27B0" fill-opacity="0.5" stroke="#9C27B0" stroke-width="0.8"/>
  <circle cx="698" cy="72" r="3.5" fill="#9C27B0" fill-opacity="0.5" stroke="#9C27B0" stroke-width="0.8"/>

  <!-- Exponential fit curve (polyline from log-linear regression) -->
  <path d="M 535.0,198.8 L 538.3,198.2 L 541.6,197.6 L 544.9,197.0 L 548.2,196.3 L 551.5,195.6 L 554.8,194.8 L 558.1,194.0 L 561.4,193.2 L 564.7,192.4 L 568.0,191.4 L 571.3,190.5 L 574.6,189.5 L 577.9,188.4 L 581.2,187.3 L 584.5,186.1 L 587.8,184.9 L 591.1,183.6 L 594.4,182.2 L 597.7,180.7 L 601.0,179.2 L 604.3,177.6 L 607.6,176.0 L 610.9,174.2 L 614.2,172.3 L 617.5,170.4 L 620.8,168.3 L 624.1,166.2 L 627.4,163.9 L 630.7,161.5 L 634.0,159.0 L 637.3,156.3 L 640.6,153.6 L 643.9,150.6 L 647.2,147.6 L 650.5,144.3 L 653.8,140.9 L 657.1,137.3 L 660.4,133.6 L 663.7,129.6 L 667.0,125.4 L 670.3,121.0 L 673.6,116.4 L 676.9,111.6 L 680.2,106.5 L 683.5,101.1 L 686.8,95.5 L 690.1,89.5 L 693.4,83.3 L 696.7,76.7 L 700.0,69.8" fill="none" stroke="#9C27B0" stroke-width="2" opacity="0.8"/>

  <!-- Annotation -->
  <text x="375" y="232" text-anchor="middle" font-size="9" fill="#888" opacity="0.5">Choosing the right model depends on the shape of the data — not every relationship is a straight line</text>
</svg>
