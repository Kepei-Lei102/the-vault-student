<svg width="100%" viewBox="0 0 530 350" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <text x="280" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#888">Histogram — Time to Complete a Puzzle (unequal class widths)</text>

  <!-- Axes -->
  <line x1="70" y1="280" x2="495" y2="280" stroke="#888" stroke-width="1.2"/>
  <line x1="70" y1="280" x2="70" y2="25" stroke="#888" stroke-width="1.2"/>

  <!-- Axis labels -->
  <text x="280" y="325" text-anchor="middle" font-size="11" fill="#888">Time (minutes)</text>
  <text x="22" y="153" text-anchor="middle" font-size="11" fill="#888" transform="rotate(-90, 22, 153)">Frequency density</text>

  <!-- X-axis ticks -->
  <line x1="70" y1="280" x2="70" y2="286" stroke="#888" stroke-width="1"/>
  <text x="70" y="298" text-anchor="middle" font-size="9" fill="#888">0</text>
  <line x1="105" y1="280" x2="105" y2="286" stroke="#888" stroke-width="1"/>
  <text x="105" y="298" text-anchor="middle" font-size="9" fill="#888">5</text>
  <line x1="140" y1="280" x2="140" y2="286" stroke="#888" stroke-width="1"/>
  <text x="140" y="298" text-anchor="middle" font-size="9" fill="#888">10</text>
  <line x1="210" y1="280" x2="210" y2="286" stroke="#888" stroke-width="1"/>
  <text x="210" y="298" text-anchor="middle" font-size="9" fill="#888">20</text>
  <line x1="280" y1="280" x2="280" y2="286" stroke="#888" stroke-width="1"/>
  <text x="280" y="298" text-anchor="middle" font-size="9" fill="#888">30</text>
  <line x1="350" y1="280" x2="350" y2="286" stroke="#888" stroke-width="1"/>
  <text x="350" y="298" text-anchor="middle" font-size="9" fill="#888">40</text>
  <line x1="420" y1="280" x2="420" y2="286" stroke="#888" stroke-width="1"/>
  <text x="420" y="298" text-anchor="middle" font-size="9" fill="#888">50</text>
  <line x1="490" y1="280" x2="490" y2="286" stroke="#888" stroke-width="1"/>
  <text x="490" y="298" text-anchor="middle" font-size="9" fill="#888">60</text>

  <!-- Y-axis ticks -->
  <line x1="65" y1="280" x2="70" y2="280" stroke="#888" stroke-width="1"/>
  <text x="60" y="284" text-anchor="end" font-size="9" fill="#888">0</text>
  <line x1="65" y1="244.3" x2="70" y2="244.3" stroke="#888" stroke-width="1"/>
  <text x="60" y="248" text-anchor="end" font-size="9" fill="#888">0.5</text>
  <line x1="65" y1="208.6" x2="70" y2="208.6" stroke="#888" stroke-width="1"/>
  <text x="60" y="212" text-anchor="end" font-size="9" fill="#888">1.0</text>
  <line x1="65" y1="172.9" x2="70" y2="172.9" stroke="#888" stroke-width="1"/>
  <text x="60" y="176" text-anchor="end" font-size="9" fill="#888">1.5</text>
  <line x1="65" y1="137.1" x2="70" y2="137.1" stroke="#888" stroke-width="1"/>
  <text x="60" y="141" text-anchor="end" font-size="9" fill="#888">2.0</text>
  <line x1="65" y1="101.4" x2="70" y2="101.4" stroke="#888" stroke-width="1"/>
  <text x="60" y="105" text-anchor="end" font-size="9" fill="#888">2.5</text>
  <line x1="65" y1="65.7" x2="70" y2="65.7" stroke="#888" stroke-width="1"/>
  <text x="60" y="69" text-anchor="end" font-size="9" fill="#888">3.0</text>
  <line x1="65" y1="30" x2="70" y2="30" stroke="#888" stroke-width="1"/>
  <text x="60" y="34" text-anchor="end" font-size="9" fill="#888">3.5</text>

  <!-- Light gridlines -->
  <g stroke="#888" stroke-width="0.3" opacity="0.15">
    <line x1="70" y1="244.3" x2="490" y2="244.3"/>
    <line x1="70" y1="208.6" x2="490" y2="208.6"/>
    <line x1="70" y1="172.9" x2="490" y2="172.9"/>
    <line x1="70" y1="137.1" x2="490" y2="137.1"/>
    <line x1="70" y1="101.4" x2="490" y2="101.4"/>
    <line x1="70" y1="65.7" x2="490" y2="65.7"/>
    <line x1="70" y1="30" x2="490" y2="30"/>
  </g>

  <!-- Bars (no gaps — continuous data) -->
  <!-- [0, 5): fd = 1.6, f = 8 -->
  <rect x="70" y="165.7" width="35" height="114.3" fill="#2196F3" fill-opacity="0.4" stroke="#2196F3" stroke-width="1.5"/>
  <text x="87.5" y="159" text-anchor="middle" font-size="8" fill="#888">f = 8</text>

  <!-- [5, 10): fd = 3.0, f = 15 -->
  <rect x="105" y="65.7" width="35" height="214.3" fill="#2196F3" fill-opacity="0.4" stroke="#2196F3" stroke-width="1.5"/>
  <text x="122.5" y="59" text-anchor="middle" font-size="8" fill="#888">f = 15</text>

  <!-- [10, 20): fd = 1.8, f = 18 -->
  <rect x="140" y="151.4" width="70" height="128.6" fill="#2196F3" fill-opacity="0.4" stroke="#2196F3" stroke-width="1.5"/>
  <text x="175" y="145" text-anchor="middle" font-size="8" fill="#888">f = 18</text>

  <!-- [20, 40): fd = 0.3, f = 6 -->
  <rect x="210" y="258.6" width="140" height="21.4" fill="#2196F3" fill-opacity="0.4" stroke="#2196F3" stroke-width="1.5"/>
  <text x="280" y="254" text-anchor="middle" font-size="8" fill="#888">f = 6</text>

  <!-- [40, 60): fd = 0.15, f = 3 -->
  <rect x="350" y="269.3" width="140" height="10.7" fill="#2196F3" fill-opacity="0.4" stroke="#2196F3" stroke-width="1.5"/>
  <text x="420" y="265" text-anchor="middle" font-size="8" fill="#888">f = 3</text>

  <!-- Annotation: area = frequency -->
  <text x="280" y="340" text-anchor="middle" font-size="9" fill="#888" opacity="0.5">Area of each bar = frequency. Note how wider classes have shorter bars (lower density).</text>
</svg>
