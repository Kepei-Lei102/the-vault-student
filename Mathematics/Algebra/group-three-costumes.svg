<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" width="100%">
  <!-- panel titles -->
  <g font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle" font-weight="bold">
    <text x="130" y="30">4th roots of unity</text>
    <text x="380" y="30">rotations of a square</text>
    <text x="620" y="30">clock: +1 mod 4</text>
  </g>

  <!-- ===== Panel A: 4th roots of unity on the unit circle ===== -->
  <circle cx="130" cy="140" r="70" fill="none" stroke="#0891b2" stroke-width="1.6" opacity="0.7"/>
  <g stroke="#888" stroke-width="1" opacity="0.25">
    <line x1="45" y1="140" x2="215" y2="140"/>
    <line x1="130" y1="55" x2="130" y2="225"/>
  </g>
  <g fill="#059669"><circle cx="200" cy="140" r="5"/><circle cx="130" cy="70" r="5"/><circle cx="60" cy="140" r="5"/><circle cx="130" cy="210" r="5"/></g>
  <g font-family="sans-serif" font-size="13" fill="#888">
    <text x="208" y="145">1</text>
    <text x="138" y="66">i</text>
    <text x="40"  y="145">&#8722;1</text>
    <text x="138" y="216">&#8722;i</text>
  </g>
  <!-- multiply-by-i arrow (1 -> i, 90 deg CCW) -->
  <path d="M 188 105 A 62 62 0 0 0 165 82" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
  <polygon points="165,82 176,84 170,94" fill="#f59e0b"/>
  <text x="196" y="92" font-family="sans-serif" font-size="12" fill="#f59e0b">&#215;i</text>

  <!-- ===== Panel B: rotations of a square ===== -->
  <rect x="330" y="90" width="100" height="100" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-width="2"/>
  <g fill="#059669"><circle cx="330" cy="90" r="4.5"/><circle cx="430" cy="90" r="4.5"/><circle cx="430" cy="190" r="4.5"/><circle cx="330" cy="190" r="4.5"/></g>
  <circle cx="380" cy="140" r="3" fill="#888"/>
  <path d="M 418 108 A 46 46 0 0 1 412 172" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
  <polygon points="412,172 420,164 421,176" fill="#f59e0b"/>
  <text x="398" y="150" font-family="sans-serif" font-size="12" fill="#f59e0b">90&#176;</text>

  <!-- ===== Panel C: clock mod 4 ===== -->
  <circle cx="620" cy="140" r="62" fill="none" stroke="#0891b2" stroke-width="1.6" opacity="0.7"/>
  <g fill="#059669"><circle cx="620" cy="78" r="5"/><circle cx="682" cy="140" r="5"/><circle cx="620" cy="202" r="5"/><circle cx="558" cy="140" r="5"/></g>
  <g font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">
    <text x="620" y="70">0</text>
    <text x="696" y="145">1</text>
    <text x="620" y="220">2</text>
    <text x="544" y="145">3</text>
  </g>
  <!-- +1 arrow (0 -> 1, clockwise) -->
  <path d="M 640 84 A 60 60 0 0 1 676 118" fill="none" stroke="#f59e0b" stroke-width="2.2"/>
  <polygon points="676,118 666,116 674,108" fill="#f59e0b"/>
  <text x="666" y="98" font-family="sans-serif" font-size="12" fill="#f59e0b">+1</text>

  <!-- ===== unifying caption ===== -->
  <text x="380" y="278" font-family="sans-serif" font-size="15" fill="#888" text-anchor="middle">one group &#8212; the cyclic C&#8324; (one generator, g&#8308; = e) &#8212; in three costumes</text>
</svg>
