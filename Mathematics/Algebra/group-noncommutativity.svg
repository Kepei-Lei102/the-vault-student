<svg viewBox="0 0 620 320" xmlns="http://www.w3.org/2000/svg" width="100%">
  <title>Non-commutativity: doing rotation r then reflection s lands the triangle differently from s then r, so rs is not equal to sr.</title>

  <text x="310" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">Order matters:&#8195;r then s&#8195;vs&#8195;s then r</text>

  <!-- top-of-column captions -->
  <text x="170" y="52" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle" font-weight="bold">r first, then s</text>
  <text x="450" y="52" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle" font-weight="bold">s first, then r</text>

  <!-- faint fixed triangle outlines -->
  <polygon points="170,95 110,195 230,195" fill="none" stroke="#888" stroke-width="1.3" opacity="0.22"/>
  <polygon points="450,95 390,195 510,195" fill="none" stroke="#888" stroke-width="1.3" opacity="0.22"/>
  <circle cx="170" cy="162" r="2" fill="#888"/>
  <circle cx="450" cy="162" r="2" fill="#888"/>

  <!-- divider -->
  <text x="310" y="150" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle" opacity="0.7">vs</text>

  <!-- ===================== LEFT: r then s ===================== -->
  <!-- disc 1 (blue): T -> L -> R -->
  <g transform="translate(170,95)">
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.15;0.30;0.50;0.65;0.92;1"
      values="170,95; 170,95; 110,195; 110,195; 230,195; 230,195; 170,95"/>
    <circle r="16" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">1</text>
  </g>
  <!-- disc 2 (green): L -> R -> L -->
  <g transform="translate(110,195)">
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.15;0.30;0.50;0.65;0.92;1"
      values="110,195; 110,195; 230,195; 230,195; 110,195; 110,195; 110,195"/>
    <circle r="16" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">2</text>
  </g>
  <!-- disc 3 (amber): R -> T -> T -->
  <g transform="translate(230,195)">
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.15;0.30;0.50;0.65;0.92;1"
      values="230,195; 230,195; 170,95; 170,95; 170,95; 170,95; 230,195"/>
    <circle r="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">3</text>
  </g>

  <!-- left step labels -->
  <g font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">
    <text x="170" y="232">start
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.15;0.18;1" values="1;1;0;0"/>
    </text>
    <text x="170" y="232" opacity="0">after r
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.28;0.31;0.50;0.53;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="170" y="232" opacity="0">after s (done)
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.63;0.66;0.92;0.95;1" values="0;0;1;1;0;0"/>
    </text>
  </g>

  <!-- ===================== RIGHT: s then r ===================== -->
  <!-- disc 1 (blue): T -> T -> L -->
  <g transform="translate(450,95)">
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.15;0.30;0.50;0.65;0.92;1"
      values="450,95; 450,95; 450,95; 450,95; 390,195; 390,195; 450,95"/>
    <circle r="16" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">1</text>
  </g>
  <!-- disc 2 (green): L -> R -> T -->
  <g transform="translate(390,195)">
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.15;0.30;0.50;0.65;0.92;1"
      values="390,195; 390,195; 510,195; 510,195; 450,95; 450,95; 390,195"/>
    <circle r="16" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">2</text>
  </g>
  <!-- disc 3 (amber): R -> L -> R -->
  <g transform="translate(510,195)">
    <animateTransform attributeName="transform" type="translate" dur="9s" repeatCount="indefinite" calcMode="linear"
      keyTimes="0;0.15;0.30;0.50;0.65;0.92;1"
      values="510,195; 510,195; 390,195; 390,195; 510,195; 510,195; 510,195"/>
    <circle r="16" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">3</text>
  </g>

  <!-- right step labels -->
  <g font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">
    <text x="450" y="232">start
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.15;0.18;1" values="1;1;0;0"/>
    </text>
    <text x="450" y="232" opacity="0">after s
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.28;0.31;0.50;0.53;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="450" y="232" opacity="0">after r (done)
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite" keyTimes="0;0.63;0.66;0.92;0.95;1" values="0;0;1;1;0;0"/>
    </text>
  </g>

  <!-- conclusion -->
  <text x="310" y="278" font-family="sans-serif" font-size="12.5" fill="#888" text-anchor="middle">Same two moves, opposite order &#8212; the corners land differently.</text>
  <text x="310" y="300" font-family="sans-serif" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">so&#8195;r s &#8800; s r</text>
</svg>
