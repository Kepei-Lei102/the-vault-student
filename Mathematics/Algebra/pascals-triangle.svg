<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .num { font-size: 15px; font-weight: 600; }
    .label { font-size: 11px; opacity: 0.6; }
    .title { font-size: 15px; font-weight: 600; }
    .highlight { fill: #2563eb; }
  </style>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" class="title">Pascal's Triangle 杨辉三角 — Binomial Coefficients</text>

  <!-- Row n=0 -->
  <text x="280" y="55" text-anchor="middle" class="num">1</text>
  <text x="42" y="55" text-anchor="end" class="label">n = 0</text>

  <!-- Row n=1 -->
  <text x="256" y="85" text-anchor="middle" class="num">1</text>
  <text x="304" y="85" text-anchor="middle" class="num">1</text>
  <text x="42" y="85" text-anchor="end" class="label">n = 1</text>

  <!-- Row n=2 -->
  <text x="232" y="115" text-anchor="middle" class="num">1</text>
  <text x="280" y="115" text-anchor="middle" class="num highlight">2</text>
  <text x="328" y="115" text-anchor="middle" class="num">1</text>
  <text x="42" y="115" text-anchor="end" class="label">n = 2</text>

  <!-- Row n=3 -->
  <text x="208" y="145" text-anchor="middle" class="num">1</text>
  <text x="256" y="145" text-anchor="middle" class="num highlight">3</text>
  <text x="304" y="145" text-anchor="middle" class="num highlight">3</text>
  <text x="352" y="145" text-anchor="middle" class="num">1</text>
  <text x="42" y="145" text-anchor="end" class="label">n = 3</text>

  <!-- Row n=4: highlighted row -->
  <rect x="170" y="155" width="220" height="25" rx="10" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1" stroke-opacity="0.3"/>
  <text x="184" y="175" text-anchor="middle" class="num">1</text>
  <text x="232" y="175" text-anchor="middle" class="num highlight">4</text>
  <text x="280" y="175" text-anchor="middle" class="num highlight">6</text>
  <text x="328" y="175" text-anchor="middle" class="num highlight">4</text>
  <text x="376" y="175" text-anchor="middle" class="num">1</text>
  <text x="42" y="175" text-anchor="end" class="label">n = 4</text>

  <!-- Row n=5 -->
  <text x="160" y="205" text-anchor="middle" class="num">1</text>
  <text x="208" y="205" text-anchor="middle" class="num">5</text>
  <text x="256" y="205" text-anchor="middle" class="num">10</text>
  <text x="304" y="205" text-anchor="middle" class="num">10</text>
  <text x="352" y="205" text-anchor="middle" class="num">5</text>
  <text x="400" y="205" text-anchor="middle" class="num">1</text>
  <text x="42" y="205" text-anchor="end" class="label">n = 5</text>

  <!-- Row n=6 -->
  <text x="136" y="235" text-anchor="middle" class="num">1</text>
  <text x="184" y="235" text-anchor="middle" class="num">6</text>
  <text x="232" y="235" text-anchor="middle" class="num">15</text>
  <text x="280" y="235" text-anchor="middle" class="num">20</text>
  <text x="328" y="235" text-anchor="middle" class="num">15</text>
  <text x="376" y="235" text-anchor="middle" class="num">6</text>
  <text x="424" y="235" text-anchor="middle" class="num">1</text>
  <text x="42" y="235" text-anchor="end" class="label">n = 6</text>

  <!-- Addition arrows for Pascal's rule (showing 3+3=6 and 1+3=4) -->
  <path d="M 258,150 Q 262,158 266,155" fill="none" stroke="#059669" stroke-width="1.2" opacity="0.5"/>
  <path d="M 302,150 Q 298,158 294,155" fill="none" stroke="#059669" stroke-width="1.2" opacity="0.5"/>
  <text x="280" y="152" text-anchor="middle" font-size="8" fill="#059669" opacity="0.6">+</text>

  <!-- Annotation: Pascal's rule -->
  <line x1="400" y1="135" x2="360" y2="145" stroke="#059669" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="408" y="132" font-size="10" fill="#059669" opacity="0.7">each = sum of two above</text>

  <!-- Row n=4 annotation -->
  <text x="440" y="175" font-size="11" fill="#2563eb" opacity="0.8">(a + b)⁴ coefficients</text>

  <!-- Bottom annotation: expansion of n=4 -->
  <rect x="55" y="260" width="450" height="50" rx="8" fill="rgba(128,128,128,0.06)" stroke="#888" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#888">(a + b)⁴ = 1·a⁴ + 4·a³b + 6·a²b² + 4·ab³ + 1·b⁴</text>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#888" opacity="0.5">Powers of a decrease: 4 → 3 → 2 → 1 → 0   |   Powers of b increase: 0 → 1 → 2 → 3 → 4</text>

  <!-- Sum annotation -->
  <text x="280" y="330" text-anchor="middle" font-size="10" fill="#888" opacity="0.4">Row sum = 2ⁿ (e.g. row 4: 1 + 4 + 6 + 4 + 1 = 16 = 2⁴)</text>
</svg>