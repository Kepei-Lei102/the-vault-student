<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" width="100%">
  <title>Even vs odd permutations: a transposition is one swap (odd); a 3-cycle is two swaps (even). The even ones form the alternating group.</title>

  <!-- header -->
  <text x="310" y="26" font-family="sans-serif" font-size="14" font-weight="bold" fill="#888" text-anchor="middle">Even or odd? &#8195;Count the swaps that build it.</text>

  <!-- ===================== ROW 1 : ODD (one transposition) ===================== -->
  <text x="24" y="108" font-family="sans-serif" font-size="12.5" fill="#888">one swap</text>
  <text x="24" y="124" font-family="sans-serif" font-size="12.5" fill="#888">(1&#8202;2)</text>

  <!-- token 1 (blue) -->
  <g transform="translate(250,105)">
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" calcMode="linear"
       keyTimes="0;0.2;0.4;0.85;1" values="250,105; 250,105; 315,105; 315,105; 250,105"/>
    <circle r="18" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#888" text-anchor="middle">1</text>
  </g>
  <!-- token 2 (green) -->
  <g transform="translate(315,105)">
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" calcMode="linear"
       keyTimes="0;0.2;0.4;0.85;1" values="315,105; 315,105; 250,105; 250,105; 315,105"/>
    <circle r="18" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#888" text-anchor="middle">2</text>
  </g>
  <!-- token 3 (amber) static -->
  <g transform="translate(380,105)">
    <circle r="18" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#888" text-anchor="middle">3</text>
  </g>

  <text x="440" y="101" font-family="sans-serif" font-size="15" font-weight="bold" fill="#dc2626">ODD</text>
  <text x="440" y="119" font-family="sans-serif" font-size="12" fill="#888">1 swap</text>

  <!-- ===================== ROW 2 : EVEN (a 3-cycle = two swaps) ===================== -->
  <text x="24" y="213" font-family="sans-serif" font-size="12.5" fill="#888">two swaps</text>
  <text x="24" y="229" font-family="sans-serif" font-size="12.5" fill="#888">(1&#8202;2&#8202;3)</text>

  <!-- token 1 (blue): P1 -> P2 -> P3 -->
  <g transform="translate(250,210)">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="linear"
       keyTimes="0;0.13;0.28;0.46;0.60;0.88;1" values="250,210; 250,210; 315,210; 315,210; 380,210; 380,210; 250,210"/>
    <circle r="18" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#888" text-anchor="middle">1</text>
  </g>
  <!-- token 2 (green): P2 -> P1 -> stays -->
  <g transform="translate(315,210)">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="linear"
       keyTimes="0;0.13;0.28;0.46;0.60;0.88;1" values="315,210; 315,210; 250,210; 250,210; 250,210; 250,210; 315,210"/>
    <circle r="18" fill="#059669" fill-opacity="0.2" stroke="#059669" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#888" text-anchor="middle">2</text>
  </g>
  <!-- token 3 (amber): P3 -> stays -> P2 -->
  <g transform="translate(380,210)">
    <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" calcMode="linear"
       keyTimes="0;0.13;0.28;0.46;0.60;0.88;1" values="380,210; 380,210; 380,210; 380,210; 315,210; 315,210; 380,210"/>
    <circle r="18" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
    <text y="5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#888" text-anchor="middle">3</text>
  </g>

  <text x="440" y="206" font-family="sans-serif" font-size="15" font-weight="bold" fill="#059669">EVEN</text>
  <text x="440" y="224" font-family="sans-serif" font-size="12" fill="#888">2 swaps</text>

  <!-- footer -->
  <text x="310" y="278" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">the even ones form the alternating group &#8212; A&#8323; is the triangle's 3 rotations; the 3 reflections are the odd half</text>
</svg>
