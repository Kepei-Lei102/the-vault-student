<?xml version="1.0" encoding="UTF-8"?>
<!-- stack: SMIL -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .math { font-family: 'Times New Roman', serif; font-style: italic; }
    .title { font-size: 15px; font-weight: 600; }
    .label { font-size: 13px; }
    .note { font-size: 12px; }
    .caption { font-size: 14px; }
    .big { font-size: 15px; font-weight: 600; }
  </style>

  <defs>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- TITLE -->
  <text x="320" y="22" text-anchor="middle" class="title">Why inside is backwards: <tspan class="math">y = f(x − 2)</tspan> shifts RIGHT by 2</text>

  <!-- AXES (always visible) -->
  <line x1="170" y1="320" x2="530" y2="320" stroke="#888" stroke-width="1.5" marker-end="url(#arrGrey)"/>
  <line x1="200" y1="345" x2="200" y2="135" stroke="#888" stroke-width="1.5" marker-end="url(#arrGrey)"/>
  <text x="535" y="324" class="math label" dominant-baseline="middle">x</text>
  <text x="200" y="128" class="math label" text-anchor="middle">y</text>

  <!-- Tick labels -->
  <g font-size="11" fill="#888" text-anchor="middle">
    <text x="200" y="338">0</text>
    <text x="250" y="338">1</text>
    <text x="300" y="338">2</text>
    <text x="350" y="338">3</text>
    <text x="400" y="338">4</text>
    <text x="450" y="338">5</text>
    <text x="500" y="338">6</text>
    <text x="192" y="244" text-anchor="end">1</text>
    <text x="192" y="164" text-anchor="end">2</text>
  </g>

  <!-- Tick marks -->
  <g stroke="#888" stroke-width="1" opacity="0.5">
    <line x1="250" y1="317" x2="250" y2="323"/>
    <line x1="300" y1="317" x2="300" y2="323"/>
    <line x1="350" y1="317" x2="350" y2="323"/>
    <line x1="400" y1="317" x2="400" y2="323"/>
    <line x1="450" y1="317" x2="450" y2="323"/>
    <line x1="500" y1="317" x2="500" y2="323"/>
    <line x1="197" y1="240" x2="203" y2="240"/>
    <line x1="197" y1="160" x2="203" y2="160"/>
  </g>

  <!-- PARENT CURVE y = √x (blue) — 17 points for smoothness -->
  <path d="M 200,320 L 212.5,280 L 225,263.4 L 237.5,250.7 L 250,240 L 262.5,230.6 L 275,222.0 L 287.5,214.2 L 300,206.9 L 312.5,200.0 L 325,193.5 L 337.5,187.4 L 350,181.4 L 362.5,175.8 L 375,170.3 L 387.5,165.1 L 400,160"
        fill="none" stroke="#2563eb" stroke-width="2.5"
        stroke-dasharray="275" stroke-dashoffset="275">
    <animate attributeName="stroke-dashoffset"
             values="275;275;0;0;275"
             keyTimes="0;0.042;0.208;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="408" y="158" class="math label" fill="#2563eb" opacity="0">y = f(x)
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.21;0.25;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- Dashed horizontal reference line at y = 1 -->
  <line x1="200" y1="240" x2="500" y2="240"
        stroke="#888" stroke-width="1" stroke-dasharray="5,4" opacity="0">
    <animate attributeName="opacity"
             values="0;0;0.35;0.35;0"
             keyTimes="0;0.667;0.7;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </line>

  <!-- Blue dot at (1, 1) -->
  <circle cx="250" cy="240" r="5" fill="#2563eb" opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.25;0.292;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- Label BELOW the dot so it doesn't collide with the curve -->
  <text x="250" y="260" text-anchor="middle" class="math label" fill="#2563eb" opacity="0">(1, 1)
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.28;0.32;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- Caption 1 -->
  <text x="320" y="378" text-anchor="middle" class="caption" fill="#2563eb" opacity="0">
    Pick any point on the parent — say x₀ = 1, so y₀ = f(1) = 1.
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.292;0.33;0.5;0.52;1"
             dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- Caption 2 -->
  <text x="320" y="378" text-anchor="middle" class="caption" fill="#059669" opacity="0">
    Now consider y = f(x − 2). When does THIS curve also equal 1?
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.52;0.54;0.6;0.62;1"
             dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- Algebra caption -->
  <text x="320" y="378" text-anchor="middle" class="caption" opacity="0">
    Need <tspan class="math" fill="#059669">x − 2 = 1</tspan>, so <tspan class="math" fill="#059669" font-weight="600">x = 1 + 2 = 3</tspan>.
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.62;0.64;0.72;0.74;1"
             dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- +2 arrow from blue to green dot at y = 1 -->
  <g opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.72;0.75;0.958;1"
             dur="12s" repeatCount="indefinite"/>
    <line x1="254" y1="240" x2="346" y2="240" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
    <text x="300" y="232" text-anchor="middle" class="math label" fill="#059669" font-weight="600">+2</text>
  </g>

  <!-- Green dot at (3, 1) -->
  <circle cx="350" cy="240" r="5" fill="#059669" opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.74;0.77;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </circle>
  <!-- Label BELOW the dot -->
  <text x="350" y="260" text-anchor="middle" class="math label" fill="#059669" opacity="0">(3, 1)
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.77;0.8;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- SHIFTED CURVE y = √(x-2) (green) — 17 points -->
  <path d="M 300,320 L 312.5,280 L 325,263.4 L 337.5,250.7 L 350,240 L 362.5,230.6 L 375,222.0 L 387.5,214.2 L 400,206.9 L 412.5,200.0 L 425,193.5 L 437.5,187.4 L 450,181.4 L 462.5,175.8 L 475,170.3 L 487.5,165.1 L 500,160"
        fill="none" stroke="#059669" stroke-width="2.5"
        stroke-dasharray="275" stroke-dashoffset="275">
    <animate attributeName="stroke-dashoffset"
             values="275;275;0;0;275"
             keyTimes="0;0.8;0.875;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </path>
  <text x="508" y="158" class="math label" fill="#059669" opacity="0">y = f(x − 2)
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.87;0.89;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </text>

  <!-- Punchline -->
  <text x="320" y="402" text-anchor="middle" class="caption big" fill="#059669" opacity="0">
    Every point shifts RIGHT by 2 — opposite of the minus sign.
    <animate attributeName="opacity"
             values="0;0;1;1;0"
             keyTimes="0;0.875;0.9;0.958;1"
             dur="12s" repeatCount="indefinite"/>
  </text>
</svg>
