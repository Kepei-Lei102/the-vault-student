<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="100%">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #888; }
    .hd   { font-size: 13.5px; font-weight: 600; }
    .val  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
    .dim  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; opacity: 0.34; }
    .live { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; fill: #059669; font-weight: 600; }
    .idx  { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; opacity: 0.6; }
    .note { font-size: 12.5px; }
  </style>

  <!-- ================= left panel : the stack ================= -->
  <text x="52" y="28" class="hd">Write it out. Each row hands its second term to the row below.</text>
  <text x="52" y="52" class="val">u(r) = 1/r &#8722; 1/(r+1)</text>

  <!-- cancel connectors: short straight links living in the gaps between rows -->
  <line x1="272" y1="96" x2="176" y2="116" stroke="#888" stroke-width="1.1" opacity="0.5"/>
  <line x1="272" y1="134" x2="176" y2="154" stroke="#888" stroke-width="1.1" opacity="0.5"/>
  <line x1="272" y1="172" x2="176" y2="192" stroke="#888" stroke-width="1.1" opacity="0.5"/>
  <line x1="272" y1="210" x2="176" y2="230" stroke="#888" stroke-width="1.1" opacity="0.5"/>

  <!-- survivors, boxed -->
  <rect x="118" y="74" width="72" height="24" rx="4" fill="rgba(5,150,105,0.13)" stroke="#059669" stroke-width="1.5"/>
  <rect x="252" y="302" width="94" height="24" rx="4" fill="rgba(5,150,105,0.13)" stroke="#059669" stroke-width="1.5"/>

  <text x="60"  y="92"  class="idx">r = 1</text>
  <text x="154" y="92"  class="live" text-anchor="middle">+ 1/1</text>
  <text x="262" y="92"  class="dim">&#8722; 1/2</text>

  <text x="60"  y="130" class="idx">r = 2</text>
  <text x="154" y="130" class="dim" text-anchor="middle">+ 1/2</text>
  <text x="262" y="130" class="dim">&#8722; 1/3</text>

  <text x="60"  y="168" class="idx">r = 3</text>
  <text x="154" y="168" class="dim" text-anchor="middle">+ 1/3</text>
  <text x="262" y="168" class="dim">&#8722; 1/4</text>

  <text x="60"  y="206" class="idx">r = 4</text>
  <text x="154" y="206" class="dim" text-anchor="middle">+ 1/4</text>
  <text x="262" y="206" class="dim">&#8722; 1/5</text>

  <text x="154" y="244" class="dim" text-anchor="middle">+ 1/5</text>

  <circle cx="154" cy="262" r="1.6" fill="#888" opacity="0.5"/>
  <circle cx="154" cy="272" r="1.6" fill="#888" opacity="0.5"/>
  <circle cx="154" cy="282" r="1.6" fill="#888" opacity="0.5"/>
  <circle cx="278" cy="262" r="1.6" fill="#888" opacity="0.5"/>
  <circle cx="278" cy="272" r="1.6" fill="#888" opacity="0.5"/>
  <circle cx="278" cy="282" r="1.6" fill="#888" opacity="0.5"/>

  <text x="60"  y="320" class="idx">r = n</text>
  <text x="154" y="320" class="dim" text-anchor="middle">+ 1/n</text>
  <text x="262" y="320" class="live">&#8722; 1/(n+1)</text>

  <line x1="52" y1="350" x2="410" y2="350" stroke="#888" stroke-width="1" opacity="0.35"/>
  <text x="52" y="376" class="note">Every faded term cancelled in a pair. Only the two</text>
  <text x="52" y="394" class="note">green ones were never handed on:</text>
  <text x="52" y="424" class="val" fill="#059669">S(n) = 1 &#8722; 1/(n+1)</text>
  <text x="52" y="452" class="note">A sum of n terms cost two evaluations.</text>

  <line x1="452" y1="20" x2="452" y2="452" stroke="#888" stroke-width="1" opacity="0.25"/>

  <!-- ================= right panel : the reach rule ================= -->
  <text x="490" y="28" class="hd">How many survive? Count the gap.</text>
  <text x="490" y="52" class="note">The gap between the two labels is how far a term must travel to find</text>
  <text x="490" y="70" class="note">its partner, and therefore how many are stranded at each end.</text>

  <rect x="490" y="92" width="396" height="56" rx="5" fill="rgba(37,99,235,0.10)" stroke="#2563eb" stroke-width="1.3"/>
  <text x="504" y="114" class="val">f(r) &#8722; f(r+1)</text>
  <text x="504" y="136" class="note" fill="#2563eb">gap 1: one stranded at the top, one at the bottom</text>

  <rect x="490" y="162" width="396" height="56" rx="5" fill="rgba(124,58,237,0.10)" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="504" y="184" class="val">f(r) &#8722; f(r+2)</text>
  <text x="504" y="206" class="note" fill="#7c3aed">gap 2: two stranded at the top, two at the bottom</text>

  <rect x="490" y="232" width="396" height="56" rx="5" fill="rgba(8,145,178,0.10)" stroke="#0891b2" stroke-width="1.3"/>
  <text x="504" y="254" class="val">f(r) &#8722; f(r+k)</text>
  <text x="504" y="276" class="note" fill="#0891b2">gap k: k stranded at the top, k at the bottom</text>

  <text x="490" y="316" class="note">So there is nothing here to memorise:</text>
  <text x="490" y="344" class="val">S(n) = f(1)+...+f(k) &#8722; f(n+1)&#8722;...&#8722;f(n+k)</text>

  <line x1="490" y1="370" x2="886" y2="370" stroke="#888" stroke-width="1" opacity="0.3"/>
  <text x="490" y="396" class="note">And it is why the mark scheme wants terms written out. With a</text>
  <text x="490" y="414" class="note">gap of 2, a student who writes three rows has not yet watched a</text>
  <text x="490" y="432" class="note">single cancellation happen, and ends up guessing the ends.</text>
</svg>
